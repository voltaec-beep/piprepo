/* =========================================================
   Router
   ========================================================= */
var VIEWS={gate:viewGate,catalog:viewCatalog,title:viewTitle,quiz:viewQuiz,results:viewResults,
  records:viewRecords,profile:viewProfile,titles:viewTitles,settings:viewSettings};

function go(v,arg){
  S.view=v;S.arg=(arg===undefined?null:arg);
  if(!navBack)pushView();
  if(['catalog','records','profile'].indexOf(v)>=0&&S.settings.lastView!==v){
    S.settings.lastView=v;save();
  }
  render();
  window.scrollTo({top:0,behavior:'auto'});
}
function render(){
  if(!me()&&S.view!=='gate')S.view='gate';
  if(S.view==='quiz'&&!S.run)S.view='catalog';
  if((S.view==='titles'||S.view==='settings')&&!S.admin)S.view='catalog';

  $('#view').innerHTML=(VIEWS[S.view]||viewCatalog)();

  var onGate=(S.view==='gate');
  $('#chrome').classList.toggle('hide',onGate);
  $('#footbar').classList.toggle('hide',onGate);
  var active={title:'catalog',quiz:'catalog',results:'catalog'}[S.view]||S.view;
  $$('#nav button').forEach(function(b){
    if(b.dataset.go===active)b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });
  $$('#nav .admin-only').forEach(function(b){b.classList.toggle('hide',!S.admin);});

  var th=$('#themebtn');
  var dark=(resolvedTheme()==='dark');
  th.innerHTML=ico(dark?'sun':'moon');
  th.setAttribute('aria-label',dark?'Switch to the daylight palette':'Switch to the evening palette');
  th.title=th.getAttribute('aria-label');

  var key=$('#keybtn');
  key.classList.toggle('on',S.admin);
  key.innerHTML=ico(S.admin?'unlock':'key');
  key.setAttribute('aria-label',S.admin?'Instructor mode is on — lock it':'Instructor sign in');
  key.title=key.getAttribute('aria-label');

  var p=me();
  $('#chip').innerHTML=p?(avatarHTML(p,28)+'<span class="nm">'+esc(p.name)+'</span>'):'';
  $('#chip').classList.toggle('hide',!p);

  $('#foot-left').textContent=S.modules.length+(S.modules.length===1?' title':' titles')+
    ', '+pts(S.modules.reduce(function(s,m){return s+m.ar.points;},0))+' points available';
  $('#foot-right').textContent=p?(p.name+' has earned '+pts(earnedTotal())):'';

  if(S.view==='quiz'&&S.run)wakeOn();else wakeOff();
  if(S.view==='settings')fillStatus();
  if(S.view==='results')animateResults();
  var q=$('#q');
  if(q&&S.filter.q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click',function(e){
  touchIdle();
  if(e.target.closest('[data-close]')){closeModal();return;}
  var nav=e.target.closest('[data-go]');
  if(nav){go(nav.dataset.go);return;}
  var b=e.target.closest('[data-act]');
  if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;

  /* --- reader --- */
  if(act==='signin'){enterImmersive();closeAllModals();signIn(id);}
  else if(act==='new-profile'){profileModal(null);}
  else if(act==='edit-profile'){profileModal(me());}
  else if(act==='change-avatar'){
    avatarPicker(function(uri){me().avatar=uri;save();toast('Picture updated.','good');render();});
  }
  else if(act==='drop-avatar'){me().avatar='';save();render();}
  else if(act==='signout'){S.active=null;S.admin=false;save();go('gate');}
  else if(act==='open'){go('title',id);}
  else if(act==='begin'){requestStart(id);}
  else if(act==='answer'){answer(Number(b.dataset.i),b);}
  else if(act==='abandon'){
    confirmModal('Leave this test?','Nothing is recorded and the questions are reshuffled next time.',
      'Leave',function(){S.run=null;go('catalog');},true);
  }
  else if(act==='print'){window.print();}
  else if(act==='apply-update'){applyUpdate();}
  else if(act==='recheck'){fillStatus();toast('Rechecked.');}
  else if(act==='copy-status'){
    var txt=LAST_STATUS?statusText(LAST_STATUS):'Not checked yet.';
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('Report copied.','good');},
        function(){showStatusText(txt);});
    }else showStatusText(txt);
  }
  else if(act==='install'){installPip();}
  else if(act==='ios-install'){iosInstallSheet();}
  else if(act==='hide-install-hint'){S.settings.hideInstallHint=true;save();closeModal();render();}
  else if(act==='immersive-toggle'){
    S.settings.immersive=!S.settings.immersive;save();
    if(!S.settings.immersive)exitImmersive();
    render();
  }
  else if(act==='theme-toggle'){setTheme(resolvedTheme()==='dark'?'light':'dark');}
  else if(act==='theme-set'){setTheme(b.dataset.t);}
  else if(act==='export-csv'){exportCSV();}

  /* --- instructor mode --- */
  else if(act==='unlock'){requireAdmin('Unlock instructor mode.',function(){toast('Instructor mode unlocked.','good');render();});}
  else if(act==='lock'){lockAdmin();}

  /* --- gated --- */
  else if(act==='pick-files'){requireAdmin('Adding titles needs the instructor key.',function(){$('#file-any').click();});}
  else if(act==='pick-folder'){requireAdmin('Adding titles needs the instructor key.',function(){$('#file-dir').click();});}
  else if(act==='template'){requireAdmin('Instructor key needed.',function(){
    download('module-template.json',JSON.stringify(TEMPLATE,null,2));});}
  else if(act==='sync'){
    requireAdmin('Reading the module folder needs the instructor key.',function(){
      var u=$('#folder-url');
      if(u){S.settings.folder=u.value.trim();save();}
      syncFolder(S.settings.folder);
    });
  }
  else if(act==='paste-add'){
    requireAdmin('Adding titles needs the instructor key.',function(){
      var ta=$('#paste'),err=$('#paste-err');
      var txt=ta?ta.value.trim():'';
      if(!txt){err.textContent='Paste a module first.';return;}
      var data;
      try{data=JSON.parse(txt);}catch(x){err.textContent='That is not valid JSON — '+x.message;return;}
      var t=newTally();
      ingest(data,'pasted text',t);
      if(t.failed.length){err.textContent=t.failed[0].errs.join(' ');return;}
      err.textContent='';reportTally(t);
    });
  }
  else if(act==='export-mod'){requireAdmin('Saving a module needs the instructor key.',function(){
    var m=byId(id);if(m)exportModule(m);});}
  else if(act==='export-all'){requireAdmin('A backup holds the answer keys, so it needs the instructor key.',exportAll);}
  else if(act==='del-mod'){
    requireAdmin('Removing a title needs the instructor key.',function(){
      var m=byId(id);if(!m)return;
      confirmModal('Remove "'+m.title+'"?','The title and its questions come off the shelf. Past results stay in the records.',
        'Remove',function(){
          S.modules=S.modules.filter(function(x){return x.id!==id;});
          save();toast('"'+m.title+'" removed.');render();
        },true);
    });
  }
  else if(act==='clear-records'){
    requireAdmin('Clearing records needs the instructor key.',function(){
      var p=me();
      confirmModal('Clear '+p.name+'\u2019s records?','Every test result and all earned points for this reader are erased.',
        'Clear records',function(){p.records=[];S.last=null;save();toast('Records cleared.');render();},true);
    });
  }
  else if(act==='del-profile'){
    requireAdmin('Deleting a reader needs the instructor key.',function(){
      var p=profile(id);if(!p||S.profiles.length<2)return;
      confirmModal('Delete '+p.name+'?','Their picture, points and every result go with them.',
        'Delete reader',function(){
          S.profiles=S.profiles.filter(function(x){return x.id!==id;});
          if(S.active===id)S.active=S.profiles[0].id;
          save();toast(p.name+' deleted.');go('settings');
        },true);
    });
  }
  else if(act==='save-settings'){
    S.settings.folder=$('#set-folder').value.trim();
    S.settings.assets=$('#set-assets').value.trim();
    S.settings.autoSync=$('#set-autosync').checked;
    FOLDER_AVATARS=null;
    save();toast('Settings saved.','good');
  }
  else if(act==='change-pw'){
    var oldv=$('#pw-old').value,newv=$('#pw-new').value,pe=$('#pw-err');
    if(newv.length<4){pe.textContent='Choose a password of at least four characters.';return;}
    checkPW(oldv).then(function(ok){
      if(!ok){pe.textContent='That is not the current password.';return;}
      hash(newv).then(function(h){
        S.settings.pw=h;save();pe.textContent='';
        $('#pw-old').value='';$('#pw-new').value='';
        toast('Password changed.','good');
      });
    });
  }
});

document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.filter.q=e.target.value;render();}
});
document.addEventListener('change',function(e){
  if(e.target.id==='sort'){S.filter.sort=e.target.value;render();}
});
document.addEventListener('keydown',function(e){
  touchIdle();
  if(e.key==='Escape'&&S.modals.length){closeModal();return;}
  if(S.view==='quiz'&&S.run&&!S.modals.length&&!S.run.busy){
    var n=S.run.items[S.run.idx].options.length;
    var d=parseInt(e.key,10);
    if(d>=1&&d<=n){e.preventDefault();answer(d-1,$$('.opt')[d-1]);return;}
    var li='abcdefgh'.indexOf(String(e.key).toLowerCase());
    if(li>=0&&li<n){e.preventDefault();answer(li,$$('.opt')[li]);}
  }
});
document.addEventListener('pointerdown',touchIdle);

$('#file-any').addEventListener('change',function(e){addFiles(e.target.files,false);e.target.value='';});
$('#file-dir').addEventListener('change',function(e){addFiles(e.target.files,true);e.target.value='';});
$('#chip').addEventListener('click',function(){go('profile');});
$('#themebtn').addEventListener('click',function(){setTheme(resolvedTheme()==='dark'?'light':'dark');});
$('#keybtn').addEventListener('click',function(){
  if(S.admin)lockAdmin();
  else requireAdmin('Unlock instructor mode.',function(){toast('Instructor mode unlocked.','good');render();});
});


/* =========================================================
   Platform: the things that make Pip behave like an app
   rather than a page — installing, working offline, holding
   the screen awake, and answering the back button.
   ========================================================= */

var deferredInstall=null;
var swReg=null, pendingWorker=null;
var navBack=false;

function isStandalone(){
  if(window.navigator.standalone===true)return true;          /* iOS home screen */
  try{
    return window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
        || window.matchMedia('(display-mode: minimal-ui)').matches;
  }catch(e){return false;}
}
function isIOS(){
  var ua=navigator.userAgent||'';
  return /iPad|iPhone|iPod/.test(ua)
      || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
function canInstallHint(){
  /* iOS never fires beforeinstallprompt, so it needs telling by hand. */
  return isIOS()&&!isStandalone()&&!S.settings.hideInstallHint;
}

/* ---------- service worker ---------- */
function registerSW(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol==='file:')return;   /* no offline copy from a local file */
  var hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    swReg=reg;
    reg.addEventListener('updatefound',function(){
      var w=reg.installing;
      if(!w)return;
      w.addEventListener('statechange',function(){
        if(w.state==='installed'&&navigator.serviceWorker.controller){
          pendingWorker=w;
          offerUpdate();
        }
      });
    });
  }).catch(function(){});

  var reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    /* On a first visit the worker claims the page and this fires straight
       away — reloading then would bounce the reader for no reason. */
    if(!hadController||reloading)return;
    reloading=true;
    location.reload();
  });
}
function offerUpdate(){
  /* Never interrupt a test in progress — the reload would lose it. */
  if(S.run){setTimeout(offerUpdate,60000);return;}
  var d=document.createElement('div');
  d.className='toast good';
  d.innerHTML='<div class="row" style="gap:12px;justify-content:space-between">'+
    '<span>A new version of Pip is ready.</span>'+
    '<button class="btn btn-sm" data-act="apply-update">Reload</button></div>';
  $('#toasts').appendChild(d);
}
function applyUpdate(){
  if(pendingWorker)pendingWorker.postMessage('SKIP_WAITING');
  else location.reload();
}

/* ---------- installing ---------- */
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredInstall=e;
  render();
});
window.addEventListener('appinstalled',function(){
  deferredInstall=null;
  toast('Pip is on your home screen.','good');
  render();
});
function installPip(){
  if(!deferredInstall)return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(function(){deferredInstall=null;render();});
}
function iosInstallSheet(){
  openModal(
    '<h3>Add Pip to your home screen</h3>'+
    '<p class="lede">It opens with its own icon and no browser bars, and works with no connection.</p>'+
    '<ol style="margin:18px 0 0;padding-left:20px;line-height:1.9;font-size:.92rem">'+
      '<li>Tap the share button at the bottom of Safari.</li>'+
      '<li>Scroll down and choose <strong>Add to Home Screen</strong>.</li>'+
      '<li>Tap <strong>Add</strong>.</li>'+
    '</ol>'+
    '<p class="tiny muted" style="margin-top:16px">Open Pip from that icon from now on. '+
    'Readers and points are kept separately for the icon and for Safari, so pick one and stay with it.</p>'+
    '<div class="foot"><button class="btn" data-act="hide-install-hint">Don\u2019t show this again</button>'+
    '<button class="btn btn-primary" data-close data-focus>Got it</button></div>'
  );
}

/* ---------- immersive mode ---------- */
function fullscreenAvailable(){
  var el=document.documentElement;
  return !!(el.requestFullscreen||el.webkitRequestFullscreen);
}
function enterImmersive(){
  /* Must be called inside a user gesture. Installed apps already have no
     browser chrome, so there is nothing to hide. */
  if(!S.settings.immersive)return;
  if(isStandalone())return;
  if(!fullscreenAvailable())return;
  var el=document.documentElement;
  var fn=el.requestFullscreen||el.webkitRequestFullscreen;
  try{
    var p=fn.call(el,{navigationUI:'hide'});
    if(p&&p.catch)p.catch(function(){});
  }catch(e){}
}
function exitImmersive(){
  try{
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();
  }catch(e){}
}

/* ---------- keep the screen awake during a test ---------- */
var wakeLock=null;
function wakeOn(){
  if(!('wakeLock' in navigator)||wakeLock)return;
  navigator.wakeLock.request('screen').then(function(l){
    wakeLock=l;
    l.addEventListener('release',function(){wakeLock=null;});
  }).catch(function(){});
}
function wakeOff(){
  if(!wakeLock)return;
  try{wakeLock.release();}catch(e){}
  wakeLock=null;
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&S.view==='quiz'&&S.run)wakeOn();
});

/* ---------- back button ---------- */
function pushView(){
  try{history.pushState({pip:1,v:S.view,arg:S.arg},'');}catch(e){}
}
window.addEventListener('popstate',function(e){
  if(S.modals.length){closeModal();pushView();return;}
  if(S.run){
    pushView();
    confirmModal('Leave this test?','Nothing is recorded and the questions are reshuffled next time.',
      'Leave',function(){S.run=null;go('catalog');},true);
    return;
  }
  var st=(e.state&&e.state.pip)?e.state:null;
  navBack=true;
  if(st)go(st.v==='quiz'?'catalog':st.v,st.arg);
  else go(me()?'catalog':'gate');
  navBack=false;
});

/* ---------- don't lose a test to a stray reload ---------- */
window.addEventListener('beforeunload',function(e){
  if(!S.run)return;
  e.preventDefault();
  e.returnValue='';
});

function askPersistence(){
  if(!navigator.storage||!navigator.storage.persist)return;
  navigator.storage.persisted().then(function(already){
    if(!already)navigator.storage.persist().catch(function(){});
  }).catch(function(){});
}

function diagnose(){
  var out={
    address:location.href,
    secure:(window.isSecureContext?'yes':'NO — install needs https'),
    displayMode:(isStandalone()?'installed (standalone)':'browser tab'),
    manifestLink:(document.querySelector('link[rel=manifest]')?'present':'MISSING'),
    manifest:'checking…',
    serviceWorker:('serviceWorker' in navigator)?'checking…':'NOT SUPPORTED by this browser',
    controlling:('serviceWorker' in navigator)?'checking…':'n/a',
    installPrompt:(deferredInstall?'offered':(isStandalone()?'already installed':'not offered yet')),
    storage:'checking…'
  };
  var jobs=[];

  out.startUrl='checking…';
  out.icons='checking…';

  jobs.push(fetch('./manifest.json',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(m){
    out.manifest='ok — '+m.name+' | display '+m.display+' | scope '+m.scope;

    /* Does start_url actually serve something? A 404 here is invisible
       in the manifest itself but fails the install check. */
    var su=new URL(m.start_url||'./',location.href).href;
    var startJob=fetch(su,{cache:'no-store'}).then(function(r){
      out.startUrl=(r.ok?'ok ':'FAILED ')+r.status+' — '+su;
    }).catch(function(err){out.startUrl='FAILED — '+err.message;});

    /* The declared size is a claim. Load each icon and measure it:
       a missing file or a mismatched dimension blocks installation. */
    var list=m.icons||[];
    var iconJobs=list.map(function(ic){
      var href=new URL(ic.src,su).href;
      return fetch(href,{cache:'no-store'}).then(function(r){
        if(!r.ok)throw new Error('HTTP '+r.status);
        return new Promise(function(res){
          var img=new Image();
          img.onload=function(){res(img.naturalWidth+'x'+img.naturalHeight);};
          img.onerror=function(){res('UNREADABLE');};
          img.src=href;
        });
      }).then(function(real){
        var claimed=ic.sizes||'?';
        var bad=(real==='UNREADABLE')||(claimed.split(' ').indexOf(real)<0);
        return (bad?'MISMATCH ':'ok ')+ic.src+' — declared '+claimed+
               ', actual '+real+' ['+(ic.purpose||'any')+']';
      }).catch(function(err){
        return 'MISSING '+ic.src+' — '+err.message;
      });
    });

    return Promise.all([startJob].concat(iconJobs)).then(function(r){
      var lines=r.slice(1);
      var anyGood=lines.some(function(l){
        return l.indexOf('ok ')===0&&l.indexOf('192x192')>0;
      });
      out.icons=lines.join('\n')+(anyGood?'':'\n← no usable 192x192 icon, so Chrome will not install');
    });
  }).catch(function(err){
    out.manifest='FAILED — '+err.message;
    out.startUrl='not checked';out.icons='not checked';
  }));

  if('serviceWorker' in navigator){
    jobs.push(navigator.serviceWorker.getRegistration().then(function(reg){
      if(!reg){out.serviceWorker='NOT REGISTERED';out.controlling='no';return;}
      out.serviceWorker='registered at scope '+reg.scope;
      out.controlling=navigator.serviceWorker.controller?'yes':'no — reload once';
    }).catch(function(err){out.serviceWorker='error — '+err.message;}));
  }

  if(navigator.storage&&navigator.storage.estimate){
    jobs.push(Promise.all([
      navigator.storage.estimate(),
      navigator.storage.persisted?navigator.storage.persisted():Promise.resolve(null)
    ]).then(function(r){
      var used=Math.round((r[0].usage||0)/1024);
      out.storage=used+' KB used'+(r[1]===null?'':(r[1]?', protected from eviction':', NOT protected — data can be cleared'));
    }).catch(function(){out.storage='unknown';}));
  }else{
    out.storage='unknown';
  }

  return Promise.all(jobs).then(function(){return out;});
}

function statusText(o){
  return Object.keys(o).map(function(k){
    return k.replace(/([A-Z])/g,' $1').toLowerCase()+': '+o[k];
  }).join('\n');
}

function fillStatus(){
  var box=$('#appstatus');
  if(!box)return;
  diagnose().then(function(o){
    if(!$('#appstatus'))return;
    var bad=/MISSING|MISMATCH|UNREADABLE|FAILED|NOT |NO —|no —|will not install/;
    $('#appstatus').innerHTML=Object.keys(o).map(function(k){
      var label=k.replace(/([A-Z])/g,' $1').toLowerCase();
      var v=String(o[k]);
      return '<tr><td class="tiny muted" style="white-space:nowrap">'+esc(label)+'</td>'+
        '<td class="tiny"'+(bad.test(v)?' style="color:var(--fail)"':'')+'>'+esc(v)+'</td></tr>';
    }).join('');
    LAST_STATUS=o;
  });
}
var LAST_STATUS=null;

function initPlatform(){
  registerSW();
  askPersistence();
  pushView();
  if(isStandalone())document.documentElement.classList.add('standalone');
}

/* =========================================================
   Boot
   ========================================================= */
var TEMPLATE={
  schema:SCHEMA,id:'my-book-slug',title:'Book Title Goes Here',author:'Author Name',
  series:'',volume:null,
  summary:'One or two sentences shown on the title card before the reader begins.',
  ar:{level:5.0,points:8.0,wordCount:null,interest:'MG'},
  quiz:{passing:70,ask:0,shuffleQuestions:true,shuffleOptions:true,award:'proportional',reviewMisses:true,lockRetakes:true},
  verdicts:{high:'',pass:'',fail:''},
  questions:[
    {q:'Question text.',options:['Correct answer','Distractor','Distractor','Distractor'],answer:0,why:'Shown after a missed question.',tag:'plot'},
    {q:'A second question.',options:['Wrong','Right','Wrong','Wrong'],answer:1,why:'',tag:'character'}
  ]
};

function boot(){
  load();
  applyTheme();
  var ready=S.settings.pw?Promise.resolve():hash(DEFAULT_PW).then(function(h){S.settings.pw=h;});
  ready.then(function(){
    if(!S.settings.seeded){
      var seed=[];
      try{seed=JSON.parse(document.getElementById('seed-modules').textContent)||[];}catch(e){seed=[];}
      var t=newTally();
      seed.forEach(function(s){if(!byId(slug(s.id||s.title)))ingest(s,'built-in',t);});
      S.settings.seeded=true;
    }
    save();
    if(!storageOK)toast('This browser is blocking local storage, so readers and results will not be kept.','bad',9000);
    initPlatform();
    var resume=S.settings.lastView;
    go(me()?((['catalog','records','profile'].indexOf(resume)>=0)?resume:'catalog'):'gate');
    if(S.settings.autoSync)syncFolder(S.settings.folder,true);
  });
}
boot();

})();
