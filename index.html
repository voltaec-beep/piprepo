/* ---------- cropper ---------- */
var SWATCH=['transparent','#FEFBF4','#1C2340','#F4B53F','#4FC07E','#F0705C','#4E82A8','#7E9A7A'];

function cropper(srcURI,onDone){
  var st={img:null,z:1,ox:0,oy:0,shape:'circle',bg:'transparent',fit:1,stage:300};

  var html=
    '<h3>Fit the picture</h3>'+
    '<p class="lede">Drag to move, scroll or use the slider to resize. Zoom out and add a colour behind it if the picture has a background you want to keep clear of the edge.</p>'+
    '<div class="cropwrap" style="margin-top:18px">'+
      '<div class="cropstage" id="stage"><canvas id="cv"></canvas></div>'+
      '<div class="croprow">'+
        '<span class="tiny muted">Size</span>'+
        '<input type="range" id="zoom" min="30" max="400" value="100" aria-label="Resize picture">'+
        '<div class="shapes" role="group" aria-label="Shape">'+
          '<button class="circle" data-shape="circle" aria-pressed="true" title="Circle"><i></i></button>'+
          '<button class="squircle" data-shape="squircle" aria-pressed="false" title="Rounded"><i></i></button>'+
          '<button class="square" data-shape="square" aria-pressed="false" title="Square"><i></i></button>'+
        '</div>'+
      '</div>'+
      '<div class="swatches" role="group" aria-label="Colour behind the picture">'+
        SWATCH.map(function(c,i){
          return '<button data-bg="'+c+'" aria-pressed="'+(i===0)+'" title="'+(c==='transparent'?'No colour':c)+'" '+
            'style="background:'+(c==='transparent'
              ?'repeating-conic-gradient(var(--check-a) 0 25%,var(--check-b) 0 50%) 0 0/8px 8px':c)+'"></button>';
        }).join('')+
      '</div>'+
      '<div class="row" style="justify-content:center">'+
        '<button class="btn btn-sm btn-ghost" id="fill">Fill the frame</button>'+
        '<button class="btn btn-sm btn-ghost" id="fit">Fit it all in</button>'+
      '</div>'+
    '</div>'+
    '<div class="foot"><button class="btn" data-close>Cancel</button>'+
    '<button class="btn btn-primary" id="use" disabled>Use this picture</button></div>';

  openModal(html,function(scrim){
    var stage=scrim.querySelector('#stage');
    var cv=scrim.querySelector('#cv');
    var ctx=cv.getContext('2d');
    var zoom=scrim.querySelector('#zoom');
    var useBtn=scrim.querySelector('#use');

    function sizeCanvas(){
      var r=stage.getBoundingClientRect();
      st.stage=Math.max(180,Math.round(r.width||300));
      var dpr=Math.min(3,window.devicePixelRatio||1);
      cv.width=Math.round(st.stage*dpr);
      cv.height=Math.round(st.stage*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }

    function shapePath(c,size,shape){
      c.beginPath();
      if(shape==='circle'){c.arc(size/2,size/2,size/2,0,Math.PI*2);}
      else if(shape==='squircle'){
        var r=size*0.24,s=size;
        c.moveTo(r,0);c.lineTo(s-r,0);c.quadraticCurveTo(s,0,s,r);
        c.lineTo(s,s-r);c.quadraticCurveTo(s,s,s-r,s);
        c.lineTo(r,s);c.quadraticCurveTo(0,s,0,s-r);
        c.lineTo(0,r);c.quadraticCurveTo(0,0,r,0);
      }else{c.rect(0,0,size,size);}
      c.closePath();
    }

    function paint(c,size,withMaskDim){
      var img=st.img;
      c.clearRect(0,0,size,size);
      if(st.bg!=='transparent'){
        c.save();shapePath(c,size,st.shape);c.clip();
        c.fillStyle=st.bg;c.fillRect(0,0,size,size);c.restore();
      }
      if(img){
        var k=size/st.stage;
        var sc=st.fit*st.z*k;
        var w=img.naturalWidth*sc,h=img.naturalHeight*sc;
        var x=size/2-w/2+st.ox*k, y=size/2-h/2+st.oy*k;
        c.save();shapePath(c,size,st.shape);c.clip();
        c.drawImage(img,x,y,w,h);
        c.restore();
      }
      if(withMaskDim){
        c.save();
        c.fillStyle='rgba(10,14,28,.60)';
        c.beginPath();c.rect(0,0,size,size);
        shapePath(c,size,st.shape);
        c.fill('evenodd');
        c.restore();
        c.save();
        shapePath(c,size,st.shape);
        c.strokeStyle='rgba(255,213,131,.9)';c.lineWidth=1.5;c.stroke();
        c.restore();
      }
    }
    function draw(){paint(ctx,st.stage,true);}

    function computeFit(mode){
      var img=st.img;if(!img)return;
      var cover=Math.max(st.stage/img.naturalWidth,st.stage/img.naturalHeight);
      var contain=Math.min(st.stage/img.naturalWidth,st.stage/img.naturalHeight);
      st.fit=cover;
      st.z=(mode==='contain')?(contain/cover):1;
      st.ox=0;st.oy=0;
      zoom.value=Math.round(st.z*100);
      draw();
    }

    var img=new Image();
    img.onload=function(){
      st.img=img;sizeCanvas();computeFit('cover');useBtn.disabled=false;
    };
    img.onerror=function(){
      toast('That picture could not be opened.','bad');closeModal();
    };
    img.src=srcURI;
    sizeCanvas();draw();

    /* drag to pan */
    var drag=null;
    stage.addEventListener('pointerdown',function(e){
      if(!st.img)return;
      drag={x:e.clientX,y:e.clientY,ox:st.ox,oy:st.oy};
      stage.classList.add('grabbing');
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove',function(e){
      if(!drag)return;
      st.ox=drag.ox+(e.clientX-drag.x);
      st.oy=drag.oy+(e.clientY-drag.y);
      draw();
    });
    function endDrag(){drag=null;stage.classList.remove('grabbing');}
    stage.addEventListener('pointerup',endDrag);
    stage.addEventListener('pointercancel',endDrag);
    stage.addEventListener('wheel',function(e){
      if(!st.img)return;
      e.preventDefault();
      var next=Math.min(400,Math.max(30,Number(zoom.value)+(e.deltaY<0?8:-8)));
      zoom.value=next;st.z=next/100;draw();
    },{passive:false});

    zoom.addEventListener('input',function(){st.z=Number(zoom.value)/100;draw();});
    scrim.querySelector('#fill').addEventListener('click',function(){computeFit('cover');});
    scrim.querySelector('#fit').addEventListener('click',function(){computeFit('contain');});

    scrim.addEventListener('click',function(e){
      var sh=e.target.closest('[data-shape]');
      if(sh){
        st.shape=sh.dataset.shape;
        $$('[data-shape]',scrim).forEach(function(b){b.setAttribute('aria-pressed',String(b===sh));});
        draw();return;
      }
      var bg=e.target.closest('[data-bg]');
      if(bg){
        st.bg=bg.dataset.bg;
        $$('[data-bg]',scrim).forEach(function(b){b.setAttribute('aria-pressed',String(b===bg));});
        draw();return;
      }
    });

    useBtn.addEventListener('click',function(){
      if(!st.img)return;
      var off=document.createElement('canvas');
      off.width=OUT;off.height=OUT;
      var oc=off.getContext('2d');
      paint(oc,OUT,false);
      var data;
      try{data=off.toDataURL('image/png');}
      catch(err){toast('The browser would not let that picture be saved. Try picking it with "Use my own picture".','bad',8000);return;}
      closeModal();
      onDone(data);
    });

    function onResize(){
      if(!scrim.parentNode){window.removeEventListener('resize',onResize);return;}
      sizeCanvas();draw();
    }
    window.addEventListener('resize',onResize);
  },{dismissable:false});
}

/* =========================================================
   Content modules
   ========================================================= */
/* One shared question validator, used for the book test and every chapter. */
function readQuestions(list,errs,where){
  var out=[];
  for(var i=0;i<list.length;i++){
    var q=list[i]||{};
    var text=String(q.q||q.question||'').trim();
    var opts=Array.isArray(q.options)?q.options.map(function(o){return String(o);}):[];
    var a=Number(q.answer);
    if(!text){errs.push(where+' question '+(i+1)+': no question text.');continue;}
    if(opts.length<2){errs.push(where+' question '+(i+1)+': needs at least two options.');continue;}
    if(a!==Math.floor(a)||a<0||a>=opts.length){
      errs.push(where+' question '+(i+1)+': "answer" must be a whole number from 0 to '+(opts.length-1)+'.');continue;}
    out.push({q:text,options:opts,answer:a,why:String(q.why||q.explanation||''),tag:String(q.tag||'')});
  }
  return out;
}

function validate(raw){
  var errs=[];
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return{ok:false,errs:['Not a module object.']};
  var title=String(raw.title||'').trim();
  if(!title)errs.push('No "title".');
  var qs=Array.isArray(raw.questions)?raw.questions:[];
  var rawChapters=Array.isArray(raw.chapters)?raw.chapters:[];
  if(!qs.length&&!rawChapters.length)
    errs.push('No "questions" and no "chapters" — a title needs at least one of them.');
  var questions=readQuestions(qs,errs,'Book');
  var ar=raw.ar||{},qz=raw.quiz||{},vd=raw.verdicts||{};
  var defPassing=Math.min(100,Math.max(0,num(qz.passing,70)));
  var defAward=['proportional','full','none'].indexOf(qz.award)>=0?qz.award:'proportional';
  var chapters=[],seen={};
  rawChapters.forEach(function(ch,ci){
    ch=ch||{};
    var ctitle=String(ch.title||('Chapter '+(ci+1))).trim();
    var cq=readQuestions(Array.isArray(ch.questions)?ch.questions:[],errs,'"'+ctitle+'"');
    if(!cq.length){errs.push('"'+ctitle+'" has no usable questions.');return;}
    var cid=slug(ch.id||ctitle)||('ch'+(ci+1));
    while(seen[cid])cid=cid+'-b';
    seen[cid]=1;
    chapters.push({
      id:cid,title:ctitle,
      number:(ch.number==null?ci+1:num(ch.number,ci+1)),
      summary:String(ch.summary||'').trim(),
      points:Math.max(0,num(ch.points,0)),
      passing:Math.min(100,Math.max(0,num(ch.passing,defPassing))),
      ask:Math.max(0,Math.floor(num(ch.ask,0))),
      award:['proportional','full','none'].indexOf(ch.award)>=0?ch.award:defAward,
      questions:cq
    });
    if(chapters[chapters.length-1].ask>cq.length)chapters[chapters.length-1].ask=0;
  });
  var m={
    schema:SCHEMA,id:slug(raw.id||title),title:title,
    author:String(raw.author||'').trim(),
    series:String(raw.series||'').trim(),
    volume:(raw.volume==null||raw.volume==='')?null:num(raw.volume,null),
    summary:String(raw.summary||'').trim(),
    ar:{
      level:(ar.level==null||ar.level==='')?null:num(ar.level,null),
      points:Math.max(0,num(ar.points,0)),
      wordCount:(ar.wordCount==null||ar.wordCount==='')?null:num(ar.wordCount,null),
      interest:String(ar.interest||'')
    },
    quiz:{
      passing:Math.min(100,Math.max(0,num(qz.passing,70))),
      ask:Math.max(0,Math.floor(num(qz.ask,0))),
      shuffleQuestions:qz.shuffleQuestions!==false,
      shuffleOptions:qz.shuffleOptions!==false,
      award:['proportional','full','none'].indexOf(qz.award)>=0?qz.award:'proportional',
      reviewMisses:qz.reviewMisses!==false,
      lockRetakes:qz.lockRetakes!==false,
      chaptersInOrder:qz.chaptersInOrder===true,
      revealOnFail:qz.revealOnFail===true
    },
    verdicts:{high:String(vd.high||''),pass:String(vd.pass||''),fail:String(vd.fail||'')},
    questions:questions,chapters:chapters,added:raw.added||nowISO()
  };
  if(m.quiz.ask>m.questions.length)m.quiz.ask=0;
  return{ok:true,module:m};
}
function byId(id){for(var i=0;i<S.modules.length;i++)if(S.modules[i].id===id)return S.modules[i];return null;}
function put(m){
  for(var i=0;i<S.modules.length;i++){
    if(S.modules[i].id===m.id){m.added=S.modules[i].added||m.added;S.modules[i]=m;return 'updated';}
  }
  S.modules.push(m);return 'added';
}
function newTally(){return{added:0,updated:0,failed:[]};}
function ingest(data,label,t){
  var list=Array.isArray(data)?data:(data&&Array.isArray(data.modules)?data.modules:[data]);
  for(var i=0;i<list.length;i++){
    var v=validate(list[i]);
    if(!v.ok){t.failed.push({name:label,errs:v.errs});continue;}
    t[put(v.module)]++;
  }
}
function reportTally(t){
  save();
  var bits=[];
  if(t.added)bits.push(t.added+(t.added===1?' title added':' titles added'));
  if(t.updated)bits.push(t.updated+(t.updated===1?' title updated':' titles updated'));
  if(!bits.length&&!t.failed.length)bits.push('Nothing to add');
  var msg=bits.join(', ')+'.';
  if(t.failed.length){
    toast(msg+' '+t.failed.length+(t.failed.length===1?' file was skipped.':' files were skipped.'),'bad',7000);
    toast(t.failed[0].name+': '+t.failed[0].errs[0],'bad',9000);
  }else toast(msg,'good');
  render();
}
function readFile(f){
  return new Promise(function(res){
    var r=new FileReader();
    r.onload=function(){res({name:f.name,text:String(r.result)});};
    r.onerror=function(){res({name:f.name,text:null});};
    r.readAsText(f);
  });
}
function isModuleFile(path){
  var n=String(path).toLowerCase();
  if(n.slice(-5)!=='.json')return false;
  var base=n.split('/').pop();
  return base!=='manifest.json'&&base.charAt(0)!=='_'&&base.charAt(0)!=='.';
}
function addFiles(files,quiet){
  var list=[];
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(isModuleFile(f.webkitRelativePath||f.name))list.push(f);
  }
  if(!list.length){toast('No module files found there. A module is a .json file.','bad');return;}
  Promise.all(list.map(readFile)).then(function(rows){
    var t=newTally();
    rows.forEach(function(r){
      if(r.text==null){t.failed.push({name:r.name,errs:['Could not be read.']});return;}
      var data;
      try{data=JSON.parse(r.text);}catch(e){t.failed.push({name:r.name,errs:['Not valid JSON — '+e.message]});return;}
      if(data&&/^pip-backup\//.test(String(data.schema||''))){restoreBackup(data);return;}
      ingest(data,r.name,t);
    });
    reportTally(t);
  });
}
function syncFolder(url,silent){
  url=String(url||'').trim();
  if(!url){toast('Set a module folder in Settings first.','bad');return Promise.resolve();}
  if(typeof fetch==='undefined'){
    if(!silent)toast('This browser cannot read a folder over the network. Use "Add from folder" instead.','bad',7000);
    return Promise.resolve();
  }
  if(location.protocol==='file:'){
    if(!silent)toast('Browsers block folder reads when the page is opened straight from a file. Use "Add from folder", or put Pip on a web server.','bad',9000);
    return Promise.resolve();
  }
  var base=url.replace(/[^\/]*$/,'');
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('the manifest returned '+r.status);return r.json();
  }).then(function(man){
    var files=Array.isArray(man.modules)?man.modules:[];
    if(!files.length)throw new Error('the manifest lists no modules');
    return Promise.all(files.map(function(f){
      var u=/^https?:/i.test(f)?f:base+f;
      return fetch(u,{cache:'no-store'}).then(function(r){
        if(!r.ok)throw new Error(r.status);return r.json();
      }).then(function(j){return{name:f,data:j};},function(e){return{name:f,err:String(e.message||e)};});
    }));
  }).then(function(rows){
    var t=newTally();
    rows.forEach(function(r){
      if(r.err){t.failed.push({name:r.name,errs:['Could not be loaded ('+r.err+').']});return;}
      ingest(r.data,r.name,t);
    });
    if(silent&&!t.added&&!t.updated&&!t.failed.length)return;
    reportTally(t);
  }).catch(function(e){
    if(!silent)toast('Folder sync failed — '+(e.message||e)+'.','bad',8000);
  });
}

/* ---------- export ---------- */
function download(filename,text,type){
  var blob=new Blob([text],{type:type||'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},600);
}
function exportModule(m){
  var c=JSON.parse(JSON.stringify(m));delete c.added;
  download(m.id+'.json',JSON.stringify(c,null,2));
}
function exportAll(){
  download('pip-backup-'+new Date().toISOString().slice(0,10)+'.json',
    JSON.stringify({schema:'pip-backup/1',exported:nowISO(),
      profiles:S.profiles,modules:S.modules,store:S.store,
      activities:S.activities,streaks:S.streaks,events:S.events,settings:S.settings},null,2));
}
function restoreBackup(d){
  var counts=countsOf(d);
  var hasReaders=Array.isArray(d.profiles);
  var hasContent=Array.isArray(d.modules)||Array.isArray(d.store)||Array.isArray(d.activities);
  if(!hasReaders&&!hasContent){toast('That file holds nothing PipHub can restore.','bad');return;}

  /* A file with no readers in it should never wipe the readers you have. */
  if(!hasReaders){
    confirmModal('Add this to what you have?',
      'This file holds '+describeCounts(counts)+' and no reader data, so your readers are '+
      'left alone. Titles, store items and activities with matching names are updated.',
      'Add it',function(){
        guard('before adding a backup file',function(){
          applyPayload(d,'merge');save();
          toast('Added — '+describeCounts(countsOf(statePayload('all')))+' now.','good');
          loadSnaps().then(function(){go(me()?'settings':'gate');});
        });
      });
    return;
  }
  confirmModal('Restore this backup?',
    'It holds '+describeCounts(counts)+'. Everything in this browser is replaced. '+
    'A restore point is taken first, so this can be undone.','Restore',function(){
      guard('before restoring a backup file',function(){
        applyPayload(d,'replace');save();
        toast('Backup restored.','good');
        loadSnaps().then(function(){go(me()?'settings':'gate');});
      });
    },true);
}

function exportCSV(){
  var head=['Date','Reader','Title','Author','Score %','Correct','Total','Points earned','Points possible','Result'];
  var rows=[];
  S.profiles.forEach(function(p){
    p.records.forEach(function(r){
      rows.push([dateShort(r.date),p.name,r.title,r.author||'',r.pct,r.correct,r.total,
        pts(r.points),pts(r.possible),r.passed?'Pass':'No pass',r.date]);
    });
  });
  rows.sort(function(a,b){return a[10]<b[10]?1:-1;});
  rows.forEach(function(r){r.pop();});
  var csv=[head].concat(rows).map(function(row){
    return row.map(function(c){
      var s=String(c==null?'':c);
      return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
    }).join(',');
  }).join('\r\n');
  download('pip-records-'+new Date().toISOString().slice(0,10)+'.csv',csv,'text/csv');
}

/* =========================================================
   Quiz runtime
   ========================================================= */
function chapterById(m,id){
  var list=(m&&m.chapters)||[];
  for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];
  return null;
}
/* Everything a run needs, whether it is the book test or one chapter. */
function paperOf(m,chId){
  var ch=chId?chapterById(m,chId):null;
  if(ch){
    return{id:ch.id,title:ch.title,questions:ch.questions,points:ch.points,
      passing:ch.passing,ask:ch.ask,award:ch.award,label:ch.title};
  }
  return{id:null,title:m.title,questions:m.questions,points:m.ar.points,
    passing:m.quiz.passing,ask:m.quiz.ask,award:m.quiz.award,label:'The whole book'};
}
function titlePoints(m){
  return Math.round(((m.ar.points||0)+((m.chapters||[]).reduce(function(s,ch){return s+ch.points;},0)))*10)/10;
}
function hasBookTest(m){return (m.questions||[]).length>0;}

function startRun(m,chId){
  var paper=paperOf(m,chId);
  var items=paper.questions.map(function(q,i){
    return{src:i,q:q.q,why:q.why,tag:q.tag,chosen:null,
      options:q.options.map(function(t,j){return{t:t,correct:j===q.answer};})};
  });
  if(m.quiz.shuffleQuestions)shuffle(items);
  if(paper.ask>0)items=items.slice(0,paper.ask);
  if(m.quiz.shuffleOptions)items.forEach(function(it){shuffle(it.options);});
  S.run={moduleId:m.id,chapterId:paper.id,paper:paper,
    items:items,idx:0,started:Date.now(),busy:false};
  go('quiz');
}
function answer(i,node){
  var run=S.run;if(!run||run.busy)return;
  var it=run.items[run.idx];
  if(i<0||i>=it.options.length)return;
  it.chosen=i;
  run.busy=true;
  if(node)node.classList.add('picked');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTimeout(function(){
    run.busy=false;run.idx++;
    /* Drop focus from the button that was tapped, so nothing on the next
       question inherits a highlight. */
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    if(run.idx>=run.items.length)finish();else render();
  },reduce?0:170);
}
function finish(){
  var run=S.run,m=byId(run.moduleId),p=me();
  var correct=0,missed=[];
  run.items.forEach(function(it){
    var c=it.options[it.chosen];
    if(c&&c.correct)correct++;else missed.push(it);
  });
  var paper=run.paper||paperOf(m,run.chapterId);
  var total=run.items.length;
  var pct=total?Math.round(correct/total*100):0;
  var passed=pct>=paper.passing;
  var earned=0;
  if(passed){
    if(paper.award==='proportional')earned=Math.round(paper.points*pct/100*10)/10;
    else if(paper.award==='full')earned=paper.points;
  }
  var boosted=withBoost(earned,p);
  earned=boosted.points;
  var rec={id:uid(),moduleId:m.id,title:m.title,author:m.author,date:nowISO(),
    boost:boosted.boost,
    chapterId:paper.id||null,chapterTitle:paper.id?paper.title:'',
    pct:pct,correct:correct,total:total,points:earned,possible:paper.points,
    passed:passed,award:paper.award,ms:Date.now()-run.started};
  if(p)p.records.push(rec);
  S.last={rec:rec,missed:missed};
  S.run=null;save();
  if(rec.passed&&completedTitle(m,p,rec))momentBookFinished(m);
  settleStreaks();
  checkWishReached();
  snapshot('after '+(p?p.name:'a')+'\u2019s test',{force:true});
  go('results');
}
function verdictFor(m,rec){
  if(!rec.passed)return m.verdicts.fail||('Below the '+m.quiz.passing+'% passing mark, so no points this time.');
  if(rec.pct>=90)return m.verdicts.high||'A strong result. This one you know well.';
  return m.verdicts.pass||'Passed.';
}
function attemptsFor(id,chId){
  return recs().filter(function(r){
    if(r.moduleId!==id)return false;
    if(chId===undefined)return true;
    return (r.chapterId||null)===(chId||null);
  }).sort(function(a,b){return a.date<b.date?1:-1;});
}
function papersDone(m){
  var total=(m.chapters||[]).length+(hasBookTest(m)?1:0);
  var done=0;
  (m.chapters||[]).forEach(function(ch){
    if(attemptsFor(m.id,ch.id).some(function(r){return r.passed;}))done++;
  });
  if(hasBookTest(m)&&attemptsFor(m.id,null).some(function(r){return r.passed;}))done++;
  return{done:done,total:total};
}
function statusFor(id){
  var a=attemptsFor(id);
  if(!a.length)return 'new';
  var m=byId(id);
  if(m){
    var p=papersDone(m);
    if(p.total&&p.done===p.total)return 'passed';
    if(p.done)return 'part';
  }
  return a.some(function(r){return r.passed;})?'passed':'failed';
}
/* Chapters unlock in order when the module asks for it. */
function chapterLocked(m,ch){
  if(!m.quiz.chaptersInOrder)return false;
  var list=m.chapters||[];
  for(var i=0;i<list.length;i++){
    if(list[i].id===ch.id)return false;
    if(!attemptsFor(m.id,list[i].id).some(function(r){return r.passed;}))return true;
  }
  return false;
}
/* Keyed per paper: a chapter and the book test each pay once. */
function bestByTitle(list){
  var best={};
  (list||recs()).forEach(function(r){
    var k=r.moduleId+'|'+(r.chapterId||'');
    if(!best[k]||r.points>best[k].points)best[k]=r;
  });
  return best;
}
function earnedTotal(list){
  var b=bestByTitle(list),s=0;
  Object.keys(b).forEach(function(k){s+=b[k].points;});
  return s;
}
function requestStart(id,chId){
  var m=byId(id);if(!m)return;
  if(!me()){go('gate');return;}
  var paper=paperOf(m,chId||null);
  if(chId){
    var ch=chapterById(m,chId);
    if(ch&&chapterLocked(m,ch)){toast('Pass the earlier chapters first.','bad');return;}
  }
  if(attemptsFor(id,chId||null).length>0&&m.quiz.lockRetakes){
    requireAdmin('A retake of "'+paper.title+'" needs the instructor key.',function(){startRun(m,chId||null);});
  }else startRun(m,chId||null);
}

/* =========================================================
   Views
   ========================================================= */
function bookLine(m){
  var b=[];
  if(m.author)b.push(esc(m.author));
  if(m.series)b.push(esc(m.series)+(m.volume?', book '+m.volume:''));
  return b.join('&nbsp; · &nbsp;');
}

/* ---------- sign in ---------- */
function viewGate(){
  var h='<div class="gate">'+
    '<div class="lockup">'+
      '<div class="badge" aria-hidden="true"></div>'+
      '<div class="name">PipHub</div>'+
      '<div class="tag"><span>Read</span><i></i><span>Do</span><i></i>'+
        '<span>Earn <b>points</b></span><i></i><span>Spend them</span></div>'+
    '</div>'+
    '<div class="lead">Who&rsquo;s here?</div>'+
    '<p class="say">Pick your name to open your shelf, your activities and whatever you have saved up.</p>'+
    '<div class="people">';
  S.profiles.forEach(function(p){
    var bal=balance(p);
    var waiting=(p.activities||[]).filter(function(r){return !r.approved;}).length;
    h+='<button class="person" data-act="signin" data-id="'+p.id+'">'+
      avatarHTML(p,64)+
      '<span class="nm">'+esc(p.name)+'</span>'+
      '<span class="sub">'+pts(bal)+' points'+
        (waiting?' &nbsp;·&nbsp; '+waiting+' pending':'')+
        (p.pin?' &nbsp;·&nbsp; locked':'')+'</span></button>';
  });
  h+='<button class="person add" data-act="new-profile">'+
      '<span class="plus">+</span><span class="nm">New here</span>'+
      '<span class="sub">Set yourself up</span></button>'+
    '</div>'+
    '<div class="row" style="justify-content:center;margin-top:32px">'+
      (S.admin
        ? '<button class="btn btn-sm" data-act="pick-files">'+ico('file')+'Restore from a backup</button>'+
          '<button class="btn btn-sm btn-ghost" data-act="lock">Lock instructor mode</button>'
        : '<button class="btn btn-sm btn-ghost" data-act="unlock">'+ico('key')+'Instructor</button>')+
      '<button class="btn btn-sm btn-ghost" data-act="theme-toggle">'+
        ico(resolvedTheme()==='dark'?'sun':'moon')+
        (resolvedTheme()==='dark'?'Daylight':'Evening')+'</button>'+
      (deferredInstall?'<button class="btn btn-sm btn-primary" data-act="install">'+ico('down')+'Install PipHub</button>':'')+
      (canInstallHint()?'<button class="btn btn-sm" data-act="ios-install">'+ico('down')+'Add to home screen</button>':'')+
    '</div></div>';
  return h;
}

/* ---------- catalogue ---------- */
function viewCatalog(){
  var q=S.filter.q.toLowerCase();
  var list=S.modules.filter(function(m){
    return !q||(m.title+' '+m.author+' '+m.series).toLowerCase().indexOf(q)>=0;
  });
  list.sort(function(a,b){
    if(S.filter.sort==='points')return b.ar.points-a.ar.points;
    if(S.filter.sort==='level')return (a.ar.level||0)-(b.ar.level||0);
    if(S.filter.sort==='added')return a.added<b.added?1:-1;
    return a.title.localeCompare(b.title);
  });

  var p=me();
  var h='<div class="pagehead"><div><h2>Reading catalogue</h2>'+
    '<div class="sub">'+S.modules.length+(S.modules.length===1?' title on the shelf':' titles on the shelf')+
    ', worth '+pts(S.modules.reduce(function(s,m){return s+titlePoints(m);},0))+' points</div></div>'+
    '<div class="row"><div class="stat" style="min-width:120px"><div class="k">'+esc(p?p.name:'')+'&rsquo;s points</div>'+
    '<div class="v" style="color:var(--gold-hi)">'+pts(balance(p))+'</div></div></div></div>';

  if(S.admin)h+=adminBar();
  h+=wishLine();
  h+=streakStrip('quiz');

  if(!S.modules.length){
    return h+'<div class="empty">'+emptyPip('sleep')+'<h3>Nothing on the shelf yet</h3>'+
      '<p class="muted">Titles arrive as content modules — one small file per book. An instructor adds them.</p>'+
      '<div class="row stack" style="justify-content:center">'+
      (S.admin?'<button class="btn btn-primary" data-act="pick-folder">'+ico('folder')+'Add from folder</button>'+
               '<button class="btn" data-go="titles">Other ways to add</button>'
              :'<button class="btn" data-act="unlock">'+ico('key')+'Instructor sign in</button>')+
      '</div></div>';
  }

  h+='<div class="toolbar">'+
    '<input class="inp" id="q" type="search" placeholder="Search titles and authors" value="'+esc(S.filter.q)+'">'+
    '<select class="inp" id="sort">'+
      ['title|By title','level|By reading level','points|By points','added|Recently added'].map(function(o){
        var x=o.split('|');
        return '<option value="'+x[0]+'"'+(S.filter.sort===x[0]?' selected':'')+'>'+x[1]+'</option>';
      }).join('')+
    '</select></div>';

  if(!list.length){
    return h+'<div class="empty"><h3>Nothing matches that</h3><p class="muted">Try part of a title or an author&rsquo;s name.</p></div>';
  }

  h+='<div class="grid">';
  list.forEach(function(m){
    var st=statusFor(m.id),best=attemptsFor(m.id)[0];
    var tags='';
    var chapters=(m.chapters||[]).length;
    var pg=papersDone(m);
    tags+='<span class="tag mode">'+
      (chapters&&hasBookTest(m)?'Chapters + book'
        :chapters?'Chapter quizzes'
        :'Full book quiz')+'</span>';
    if(m.ar.level!=null)tags+='<span class="tag">Level '+m.ar.level+'</span>';
    if(chapters)
      tags+='<span class="tag'+(pg.done&&pg.done===pg.total?' pass':'')+'">'+
        pg.done+'/'+pg.total+' passed</span>';
    else tags+='<span class="tag">'+(m.quiz.ask||m.questions.length)+' questions</span>';
    if(best)tags+='<span class="tag '+(best.passed?'pass':'fail')+'">'+
      (best.passed?'Passed at '+best.pct+'%':'Best '+best.pct+'%')+'</span>';
    h+='<button class="bookcard" data-act="open" data-id="'+esc(m.id)+'" data-st="'+st+'">'+
      '<span class="spine"></span><span class="in">'+
      '<span class="main"><span class="ttl">'+esc(m.title)+'</span>'+
      '<span class="by">'+(m.author?esc(m.author):'Author not recorded')+'</span>'+
      '<span class="rule"></span>'+
      '<span class="meta">'+tags+'</span></span>'+
      '<span class="medal"><span class="disc"><span>'+pts(titlePoints(m))+'</span></span>'+
      '<span class="cap">points</span></span>'+
      '</span>'+
      (st==='passed'?'<span class="seal"><i></i></span>':'')+
      '</button>';
  });
  return h+'</div>';
}
function adminBar(){
  return '<div class="keyline">'+ico('unlock')+
    '<span>Instructor mode is on. Titles, settings and retakes are unlocked.</span>'+
    '<button class="btn btn-sm btn-ghost" data-act="lock" style="margin-left:auto">Lock now</button></div>';
}

/* ---------- one title ---------- */
function paperRow(m,paper,locked){
  var tries=attemptsFor(m.id,paper.id);
  var best=tries.filter(function(r){return r.passed;})
    .sort(function(a,b){return b.pct-a.pct;})[0];
  var state=best?'passed':(tries.length?'failed':'new');
  var needKey=tries.length>0&&m.quiz.lockRetakes&&!S.admin;
  return '<div class="paper-row" data-st="'+state+'">'+
    '<span class="mark-'+state+'" aria-hidden="true">'+
      (state==='passed'?'&#10003;':(state==='failed'?'&#8635;':''))+'</span>'+
    '<span class="pr-main"><span class="pr-title">'+esc(paper.label)+'</span>'+
    '<span class="pr-meta">'+(paper.ask||paper.questions.length)+' questions'+
      (paper.points?' &nbsp;·&nbsp; worth '+pts(paper.points):'')+
      (best?' &nbsp;·&nbsp; passed at '+best.pct+'%':
        (tries.length?' &nbsp;·&nbsp; best '+tries.sort(function(a,b){return b.pct-a.pct;})[0].pct+'%':''))+
    '</span></span>'+
    (locked
      ? '<span class="pill cold">Locked</span>'
      : '<button class="btn btn-sm'+(state==='passed'?'':' btn-primary')+
        '" data-act="begin" data-id="'+esc(m.id)+'"'+
        (paper.id?' data-ch="'+esc(paper.id)+'"':'')+'>'+
        (tries.length?'Retake':'Start')+'</button>')+
    (needKey&&!locked?'<span class="pr-key" title="A retake needs the instructor key">'+ico('key')+'</span>':'')+
    '</div>';
}

function viewTitle(){
  var m=byId(S.arg);
  if(!m)return '<div class="empty"><h3>That title is no longer on the shelf</h3>'+
    '<div class="stack"><button class="btn" data-go="catalog">Back to the catalogue</button></div></div>';
  var chapters=m.chapters||[];
  var prog=papersDone(m);
  var facts=[];
  if(m.ar.level!=null)facts.push(['Reading level',m.ar.level]);
  facts.push(['Points',pts(titlePoints(m))]);
  if(chapters.length)facts.push(['Chapters',chapters.length]);
  facts.push(['Passing mark',m.quiz.passing+'%']);
  if(m.ar.interest)facts.push(['Interest',m.ar.interest]);
  if(m.ar.wordCount)facts.push(['Words',Number(m.ar.wordCount).toLocaleString()]);

  var h='<button class="btn btn-sm btn-ghost" data-go="catalog">Back to the catalogue</button>'+
    '<div class="paper stack">'+
    '<h2 style="font-size:clamp(1.7rem,4.4vw,2.5rem)">'+esc(m.title)+'</h2>'+
    '<p class="muted" style="margin-top:6px">'+bookLine(m)+'</p>'+
    (m.summary?'<p style="margin-top:16px;max-width:62ch">'+esc(m.summary)+'</p>':'')+
    '<div class="row" style="gap:28px;margin-top:20px">'+facts.map(function(f){
      return '<div><div class="tiny" style="color:var(--paper-text-2)">'+esc(f[0])+'</div>'+
        '<div style="font-family:var(--serif);font-size:1.3rem" class="tnum">'+esc(f[1])+'</div></div>';
    }).join('')+'</div>';

  if(chapters.length){
    var pctDone=prog.total?Math.round(prog.done/prog.total*100):0;
    h+='<div class="progline"><div class="bar"><span style="width:'+pctDone+'%"></span></div>'+
       '<div class="tiny" style="color:var(--paper-text-2)">'+prog.done+' of '+prog.total+' passed</div></div>';
  }
  h+='<hr>';

  if(chapters.length){
    h+='<h3 style="font-size:1.06rem;margin-bottom:10px">Chapters</h3><div class="papers">';
    chapters.forEach(function(ch){
      h+=paperRow(m,paperOf(m,ch.id),chapterLocked(m,ch));
    });
    h+='</div>';
    if(hasBookTest(m)){
      h+='<h3 style="font-size:1.06rem;margin:20px 0 10px">The whole book</h3><div class="papers">'+
         paperRow(m,paperOf(m,null),false)+'</div>';
    }
    if(m.quiz.chaptersInOrder)
      h+='<p class="tiny" style="color:var(--paper-text-2);margin-top:12px">Chapters open one at a time — pass one to reach the next.</p>';
  }else{
    h+='<div class="row"><button class="btn btn-primary" data-act="begin" data-id="'+esc(m.id)+'">'+
      (attemptsFor(m.id,null).length?'Start a retake':'Start the test')+'</button>'+
      '<span class="tiny" style="color:var(--paper-text-2)">'+
      (attemptsFor(m.id,null).length&&m.quiz.lockRetakes&&!S.admin
        ? 'A retake needs the instructor key.'
        : m.quiz.award==='none'?'No points are attached to this title.'
        : m.quiz.award==='full'?'Any passing score earns the full '+pts(m.ar.points)+' points.'
        : 'Points are awarded in proportion to the score.')+'</span></div>';
  }

  var tries=attemptsFor(m.id);
  if(tries.length){
    h+='<hr><h3 style="font-size:1.06rem">Your attempts</h3><div class="review" style="margin-top:6px">';
    tries.slice(0,12).forEach(function(r){
      h+='<div class="item"><div class="a" style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">'+
        '<span style="font-family:var(--serif);font-size:1.1rem">'+r.pct+'%</span>'+
        '<span>'+esc(r.chapterTitle||'The whole book')+'</span>'+
        '<span class="'+(r.passed?'good':'')+'" style="'+(r.passed?'':'color:var(--paper-text-2)')+'">'+
          (r.passed?pts(r.points)+' points':'no points')+'</span>'+
        '<span style="color:var(--paper-text-2)">'+dateShort(r.date)+'</span></div></div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}

/* ---------- quiz: shown in its own layer, not inline ---------- */
function quizInner(){
  var run=S.run,m=byId(run.moduleId),it=run.items[run.idx];
  var pipsHTML='';
  for(var i=0;i<run.items.length;i++){
    pipsHTML+='<i class="'+(i<run.idx?'done':(i===run.idx?'now':''))+'"></i>';
  }
  var opts=it.options.map(function(o,i){
    return '<button class="opt" data-act="answer" data-i="'+i+'">'+
      '<span class="key">'+'abcdefgh'.charAt(i)+'</span><span>'+esc(o.t)+'</span></button>';
  }).join('');
  return '<div class="quizbar">'+

/* ---------- results ---------- */
function viewResults(){
  if(!S.last)return viewCatalog();
  var rec=S.last.rec,m=byId(rec.moduleId),missed=S.last.missed||[];
  var none=rec.award==='none';
  var big=none?rec.pct:pts(rec.points);
  var unit=none?'per cent':'of '+pts(rec.possible)+' points';

  var h='<div class="paper"><div class="reveal">'+
    '<div class="pipreact">'+pipSVG(pipLook(me()),pipMood(rec),110)+'</div>'+
    '<div class="ring'+(rec.points>0||none?'':' zero')+'" id="ring">'+
      '<svg viewBox="0 0 186 186"><circle class="track" cx="93" cy="93" r="80"></circle>'+
      '<circle class="bar" cx="93" cy="93" r="80" stroke-dasharray="502.65" stroke-dashoffset="502.65"></circle></svg>'+
      '<div class="mid"><div class="n tnum" id="bignum">'+big+'</div><div class="u">'+unit+'</div></div>'+
    '</div>'+
    '<div><div class="verdict">'+esc(verdictFor(m,rec))+'</div>'+
    (rec.chapterTitle?'<div class="tiny" style="color:var(--paper-text-2);margin-bottom:4px">'+esc(rec.chapterTitle)+'</div>':'')+
    (rec.boost?'<div class="tiny" style="color:var(--gold-ink);margin-bottom:2px">'+
      'Pip added '+rec.boost+'%</div>':'')+
    '<div class="scoreline">'+rec.pct+'% &nbsp;·&nbsp; '+rec.correct+' of '+rec.total+' correct'+
    (none?'':' &nbsp;·&nbsp; '+(rec.passed?pts(rec.points)+' points added':'no points'))+'</div></div>'+
    '</div>';

  /* Giving the answers away after a failed attempt undercuts the advice to
     go and read it again, and hands over the key for the retake. Below the
     pass mark the reader gets the questions back, not the answers. */
  var reveal=rec.passed||(m&&m.quiz.revealOnFail);
  if(m&&m.quiz.reviewMisses&&missed.length){
    h+='<hr><h3 style="font-size:1.06rem;margin-bottom:6px">'+
      (reveal?'What to look at again':'Go back to these')+'</h3>';
    if(!reveal){
      h+='<p class="tiny" style="color:var(--paper-text-2);margin-bottom:4px">'+
        'The answers stay hidden while the test can be taken again. '+
        'These are the parts of the book to read once more.</p>';
    }
    h+='<div class="review">';
    missed.forEach(function(it){
      if(reveal){
        var right='',mine='';
        it.options.forEach(function(o,i){if(o.correct)right=o.t;if(i===it.chosen)mine=o.t;});
        h+='<div class="item"><div class="q">'+esc(it.q)+'</div><div class="a">'+
          (mine?'<span class="bad">'+esc(mine)+'</span>':'')+
          '<span class="good">'+esc(right)+'</span></div>'+
          (it.why?'<div class="why">'+esc(it.why)+'</div>':'')+'</div>';
      }else{
        h+='<div class="item"><div class="q">'+esc(it.q)+'</div>'+
          (it.tag?'<div class="why">about the '+esc(it.tag)+'</div>':'')+'</div>';
      }
    });
    h+='</div>';
  }else if(m&&m.quiz.reviewMisses){
    h+='<hr><p class="muted">Every question correct. Nothing to review.</p>';
  }

  return h+'</div><div class="row stack noprint">'+
    '<button class="btn btn-primary" data-go="catalog">Back to the catalogue</button>'+
    '<button class="btn" data-act="begin" data-id="'+esc(rec.moduleId)+'">Retake</button>'+
    '<button class="btn btn-ghost" data-act="print">'+ico('print')+'Print</button>'+
    '<button class="btn btn-ghost" data-go="records">All records</button></div>';
}
function animateResults(){
  var ring=$('#ring');if(!ring||!S.last)return;
  var bar=ring.querySelector('.bar'),rec=S.last.rec;
  var C=502.65;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      bar.style.strokeDashoffset=String(C-C*Math.max(0,Math.min(100,rec.pct))/100);
    });
  });
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var el=$('#bignum');if(!el)return;
  var none=rec.award==='none';
  var target=none?rec.pct:rec.points;
  if(!target)return;
  var t0=null,dur=900;
  function step(ts){
    if(t0==null)t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    var eased=1-Math.pow(1-k,3);
    el.textContent=none?Math.round(target*eased):pts(target*eased);
    if(k<1)requestAnimationFrame(step);
  }
  el.textContent=none?'0':'0.0';
  requestAnimationFrame(step);
}

function profileModal(existing){
  var draft={name:existing?existing.name:'',avatar:existing?existing.avatar:'',pin:existing?existing.pin:null,clearPin:false};
  function body(){
    return '<h3>'+(existing?'Edit reader':'New reader')+'</h3>'+
      '<p class="lede">'+(existing?'Change the name, the picture or the PIN.':'A name and a picture. Both can change later.')+'</p>'+
      '<div class="row" style="gap:18px;margin-top:20px;align-items:flex-start">'+
        '<div style="display:grid;gap:9px;justify-items:center">'+
          (draft.avatar?'<img class="av av-92" src="'+draft.avatar+'" alt="">'
            :'<div class="av av-92 av-ph" style="font-size:2rem">'+esc(initials(draft.name)||'?')+'</div>')+
          '<button class="btn btn-sm" id="pic">'+ico('camera')+(draft.avatar?'Change':'Add picture')+'</button>'+
        '</div>'+
        '<div style="flex:1;min-width:190px">'+
          '<label class="field"><span>Name</span><input class="inp" id="pname" data-focus maxlength="32" value="'+esc(draft.name)+'"></label>'+
          '<label class="field"><span>PIN — optional, four digits</span>'+
          '<input class="inp" id="ppin" inputmode="numeric" maxlength="8" placeholder="'+
            (draft.pin?'Set — type to replace':'No PIN')+'"></label>'+
          (draft.pin?'<label class="check"><input type="checkbox" id="pclear"><span>Remove the PIN</span></label>':'')+
        '</div>'+
      '</div>'+
      '<div class="err" id="perr"></div>'+
      '<div class="foot"><button class="btn" data-close>Cancel</button>'+
      '<button class="btn btn-primary" id="psave">'+(existing?'Save':'Create reader')+'</button></div>';
  }
  function mount(scrim){
    scrim.querySelector('#pic').addEventListener('click',function(){
      draft.name=scrim.querySelector('#pname').value;
      closeModal();
      avatarPicker(function(uri){draft.avatar=uri;openModal(body(),mount,{dismissable:false});});
    });
    scrim.querySelector('#psave').addEventListener('click',function(){
      var nm=scrim.querySelector('#pname').value.trim().slice(0,32);
      var pin=scrim.querySelector('#ppin').value.trim();
      var clear=scrim.querySelector('#pclear')&&scrim.querySelector('#pclear').checked;
      if(!nm){scrim.querySelector('#perr').textContent='A name is needed.';return;}
      if(pin&&!/^\d{4,8}$/.test(pin)){scrim.querySelector('#perr').textContent='A PIN must be four to eight digits.';return;}
      function commit(pinHash){
        var p=existing||newProfile(nm);
        p.name=nm;p.avatar=draft.avatar;
        if(clear)p.pin=null;else if(pinHash!==undefined)p.pin=pinHash;
        if(!existing){S.profiles.push(p);S.active=p.id;}
        save();closeModal();
        toast(existing?'Profile saved.':'Welcome, '+nm+'.','good');
        go(existing?'profile':'catalog');
      }
      if(pin&&!clear)hash(pin).then(commit);else commit(undefined);
    });
  }
  openModal(body(),mount,{dismissable:false});
}
function signIn(id){
  var p=profile(id);if(!p)return;
  if(!p.pin){S.active=id;S.admin=false;save();settleStreaks();checkWishReached();go('catalog');return;}
  openModal(
    '<h3>'+esc(p.name)+'</h3><p class="lede">Type your PIN to open your shelf.</p>'+
    '<label class="field" style="margin-top:16px"><span>PIN</span>'+
    '<input class="inp" id="pinin" data-focus type="password" inputmode="numeric" maxlength="8" '+
    'style="text-align:center;letter-spacing:.4em"></label><div class="err" id="pinerr"></div>'+
    '<div class="foot"><button class="btn" data-close>Cancel</button>'+
    '<button class="btn btn-primary" id="pingo">Open</button></div>',
    function(scrim){
      function attempt(){
        hash(scrim.querySelector('#pinin').value).then(function(h){
          if(h!==p.pin){
            scrim.querySelector('#pinerr').textContent='That PIN is not right.';
            scrim.querySelector('#pinin').value='';scrim.querySelector('#pinin').focus();
            return;
          }
          closeModal();S.active=id;S.admin=false;save();
          settleStreaks();checkWishReached();go('catalog');
        });
      }
      scrim.querySelector('#pingo').addEventListener('click',attempt);
      scrim.querySelector('#pinin').addEventListener('keydown',function(e){
        if(e.key==='Enter'){e.preventDefault();attempt();}
      });
    }
  );
}

/* Instructor can hand out or take back points directly — a reward that
   does not fit an activity, or a correction. */
function pointsEditor(p){
  function body(){
    var log=adjustmentsOf(p).slice().sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,6);
    return '<h3>Adjust '+esc(p.name)+'&rsquo;s points</h3>'+
      '<p class="lede">Balance is '+pts(balance(p))+'. A positive number gives points, a negative one takes them back.</p>'+
      '<div class="row" style="gap:6px;margin-top:16px">'+
        [-10,-5,-1,1,5,10].map(function(n){
          return '<button class="btn btn-sm" type="button" data-bump="'+n+'">'+(n>0?'+':'')+n+'</button>';
        }).join('')+
      '</div>'+
      '<label class="field stack"><span>Points</span>'+
      '<input class="inp" id="a-pts" data-focus type="number" step="0.5" value="0"></label>'+
      '<label class="field"><span>Reason — the reader sees this</span>'+
      '<input class="inp" id="a-why" maxlength="60" placeholder="Helped tidy the classroom"></label>'+
      '<div class="err" id="a-err"></div>'+
      (log.length?'<div class="divider"></div><div class="tiny muted" style="margin-bottom:6px">Recent adjustments</div>'+
        log.map(function(a){
          return '<div class="receipt" style="padding:8px 0">'+
            '<span style="font-family:var(--serif);font-size:1.05rem;color:'+
              (a.points>=0?'var(--gold-hi)':'var(--fail)')+';min-width:52px">'+
              (a.points>0?'+':'')+pts(a.points)+'</span>'+
            '<div style="flex:1;min-width:0"><div class="tiny">'+esc(a.note||'No reason given')+'</div>'+
            '<div class="tiny muted">'+dateShort(a.date)+'</div></div>'+
            '<button class="btn btn-sm btn-ghost" type="button" data-undo="'+esc(a.id)+'">Undo</button>'+
            '</div>';
        }).join(''):'')+
      '<div class="foot"><button class="btn" data-close>Cancel</button>'+
      '<button class="btn btn-primary" id="a-save">Apply</button></div>';
  }
  function mount(scrim){
    scrim.addEventListener('click',function(e){
      var b=e.target.closest('[data-bump]');
      if(b){
        var box=scrim.querySelector('#a-pts');
        box.value=(Math.round((num(box.value,0)+num(b.dataset.bump,0))*10)/10);
        return;
      }
      var u=e.target.closest('[data-undo]');
      if(u){
        p.adjustments=adjustmentsOf(p).filter(function(a){return a.id!==u.dataset.undo;});
        save();redrawModal(body(),mount);render();
        return;
      }
    });
    scrim.querySelector('#a-save').addEventListener('click',function(){
      var n=num(scrim.querySelector('#a-pts').value,0);
      var why=scrim.querySelector('#a-why').value.trim();
      if(!n){scrim.querySelector('#a-err').textContent='Enter a number of points, up or down.';return;}
      if(balance(p)+n<0){
        scrim.querySelector('#a-err').textContent='That would put '+p.name+' below zero. They have '+pts(balance(p))+'.';
        return;
      }
      p.adjustments=adjustmentsOf(p).concat([{id:uid(),points:Math.round(n*10)/10,
        note:why,date:nowISO()}]);
      save();closeModal();
      toast((n>0?'Gave ':'Took back ')+pts(Math.abs(n))+' points. '+p.name+' now has '+pts(balance(p))+'.','good');
      render();
    });
  }
  openModal(body(),mount,{dismissable:false});
}

/* =========================================================
   Router
   ========================================================= */
var VIEWS={gate:viewGate,catalog:viewCatalog,title:viewTitle,results:viewResults,
  records:viewRecords,profile:viewProfile,titles:viewTitles,settings:viewSettings,
  store:viewStore,redemptions:viewRedemptions,
  activities:viewActivities,approvals:viewApprovals,
  events:viewEvents,reviews:viewReviews,room:viewRoom};

function go(v,arg){
  if(v!==S.view)resetGreetings();
  S.view=v;S.arg=(arg===undefined?null:arg);
  if(!navBack)pushView();
  render();
  window.scrollTo({top:0,behavior:'auto'});
}
function render(){
  if(!me()&&S.view!=='gate')S.view='gate';
  if(S.view==='quiz'&&!S.run)S.view='catalog';
  if(['titles','settings','redemptions','approvals','reviews'].indexOf(S.view)>=0&&!S.admin)S.view='catalog';
  if(S.view==='events'&&!eventsOn()&&!S.admin)S.view='catalog';

  var inQuiz=(S.view==='quiz'&&S.run);
  $('#view').innerHTML=inQuiz?viewCatalog():((VIEWS[S.view]||viewCatalog)());
  mountQuizLayer(inQuiz);

  var onGate=(S.view==='gate');
  $('#chrome').classList.toggle('hide',onGate);
  $('#footbar').classList.toggle('hide',onGate);
  var active={title:'catalog',quiz:'catalog',results:'catalog',
    redemptions:'store',approvals:'activities',reviews:'events',
    profile:'',records:'',room:''}[S.view];
  if(active===undefined)active=S.view;
  $$('#nav button').forEach(function(b){
    if(b.dataset.go===active)b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });
  $$('#nav .admin-only').forEach(function(b){b.classList.toggle('hide',!S.admin);});
  var evb=$('#nav [data-go="events"]');
  if(evb)evb.classList.toggle('hide',!eventsOn()&&!S.admin);

  var th=$('#themebtn');
  var dark=(resolvedTheme()==='dark');
  th.innerHTML=ico(dark?'sun':'moon');
  th.setAttribute('aria-label',dark?'Switch to the daylight palette':'Switch to the evening palette');
  th.title=th.getAttribute('aria-label');

  var key=$('#keybtn');
  key.classList.toggle('on',S.admin);
  key.innerHTML=ico(S.admin?'unlock':'key');
  key.setAttribute('aria-label',S.admin?'Instructor mode is on — lock it':'Instructor sign in');
  key.title=key.getAttribute('aria-label');

  var p=me();
  $('#chip').innerHTML=p?(avatarHTML(p,28)+'<span class="nm">'+esc(p.name)+'</span>'):'';
  $('#chip').classList.toggle('hide',!p);
  $('#chip').classList.toggle('on',
    S.view==='profile'||S.view==='records'||S.view==='room');

  $('#foot-left').textContent=S.modules.length+(S.modules.length===1?' title':' titles')+
    ', '+pts(S.modules.reduce(function(s,m){return s+titlePoints(m);},0))+' points available';
  $('#foot-right').textContent=p?(p.name+' has earned '+pts(earnedTotal())):'';

  if(S.view==='quiz'&&S.run)wakeOn();else wakeOff();
  if(S.view==='room')pipGreet('room',$('.room .pipstand'));
  if(S.view==='settings'){fillStatus();fillSnapSize();}
  if(S.view==='results')animateResults();
  var q=$('#q');
  if(q&&S.filter.q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click',function(e){
  touchIdle();
  if(e.target.closest('[data-close]')){closeModal();return;}
  var nav=e.target.closest('[data-go]');
  if(nav){go(nav.dataset.go);return;}
  var b=e.target.closest('[data-act]');
  if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;

  /* --- reader --- */
  if(act==='signin'){enterImmersive();closeAllModals();signIn(id);}
  else if(act==='new-profile'){profileModal(null);}
  else if(act==='edit-profile'){profileModal(me());}
  else if(act==='change-avatar'){
    avatarPicker(function(uri){
      var ap=me();ap.avatar=uri;ap.face='picture';save();
      toast('Picture updated.','good');render();
    });
  }
  else if(act==='face-pip'){me().face='pip';save();render();}
  else if(act==='face-picture'){
    var mp=me();
    if(!mp.avatar)avatarPicker(function(uri){mp.avatar=uri;mp.face='picture';save();render();});
    else{mp.face='picture';save();render();}
  }
  else if(act==='drop-avatar'){
    var dp=me();
    confirmModal('Delete the picture?','Your Pip takes its place. The picture itself is gone.',
      'Delete',function(){dp.avatar='';dp.face='pip';save();render();},true);
  }
  else if(act==='signout'){S.active=null;S.admin=false;save();go('gate');}
  else if(act==='open'){go('title',id);}
  else if(act==='begin'){requestStart(id,b.dataset.ch||null);}
  else if(act==='answer'){answer(Number(b.dataset.i),b);}
  else if(act==='abandon'){
    confirmModal('Leave this test?','Nothing is recorded and the questions are reshuffled next time.',
      'Leave',function(){S.run=null;go('catalog');},true);
  }
  else if(act==='print'){window.print();}
  else if(act==='apply-update'){applyUpdate();}
  else if(act==='recheck'){fillStatus();toast('Rechecked.');}
  else if(act==='copy-status'){
    var txt=LAST_STATUS?statusText(LAST_STATUS):'Not checked yet.';
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('Report copied.','good');},
        function(){showStatusText(txt);});
    }else showStatusText(txt);
  }
  else if(act==='install'){installPip();}
  else if(act==='ios-install'){iosInstallSheet();}
  else if(act==='hide-install-hint'){S.settings.hideInstallHint=true;save();closeModal();render();}
  else if(act==='immersive-toggle'){
    S.settings.immersive=!S.settings.immersive;save();
    if(!S.settings.immersive)exitImmersive();
    render();
  }
  else if(act==='theme-toggle'){setTheme(resolvedTheme()==='dark'?'light':'dark');}
  else if(act==='theme-set'){setTheme(b.dataset.t);}
  else if(act==='export-csv'){exportCSV();}
  else if(act==='buy'){buyItem(id);}
  else if(act==='pip-poke'){pokePip(b,b.dataset.where||'');}
  else if(act==='room-wall'){
    var rp=me();
    if(rp){rp.room=rp.room||{};rp.room.wall=b.dataset.w;save();render();}
  }
  else if(act==='ev-do'){var ev=eventById(id);if(ev)entryModal(ev);}
  else if(act==='ev-new'){requireAdmin('Adding an event needs the instructor key.',function(){eventEditor(null);});}
  else if(act==='ev-edit'){requireAdmin('Editing an event needs the instructor key.',function(){
    var e2=eventById(id);if(e2)eventEditor(e2);});}
  else if(act==='ev-del'){
    requireAdmin('Removing an event needs the instructor key.',function(){
      var e3=eventById(id);if(!e3)return;
      confirmModal('Remove "'+e3.title+'"?','What readers already sent in is kept.',
        'Remove',function(){
          guard('before removing '+e3.title,function(){
            S.events=eventList().filter(function(x){return x.id!==id;});
            save();toast('"'+e3.title+'" removed.');render();
          });
        },true);
    });
  }
  else if(act==='ev-photo'){showEntryPhoto(id);}
  else if(act==='ev-save-photo'){
    getPhoto(id).then(function(data){
      if(!data){toast('Not on this device.','bad');return;}
      var f=findEntry(id);
      var name='piphub-'+slug((f?f.p.name+'-'+f.e.eventTitle:'picture'))+'.jpg';
      var a=document.createElement('a');a.href=data;a.download=name;
      document.body.appendChild(a);a.click();
      setTimeout(function(){document.body.removeChild(a);},500);

/* =========================================================
   Platform: the things that make Pip behave like an app
   rather than a page — installing, working offline, holding
   the screen awake, and answering the back button.
   ========================================================= */

var deferredInstall=null;
var swReg=null, pendingWorker=null;
var navBack=false;

function isStandalone(){
  if(window.navigator.standalone===true)return true;          /* iOS home screen */
  try{
    return window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
        || window.matchMedia('(display-mode: minimal-ui)').matches;
  }catch(e){return false;}
}
function isIOS(){
  var ua=navigator.userAgent||'';
  return /iPad|iPhone|iPod/.test(ua)
      || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
function canInstallHint(){
  /* iOS never fires beforeinstallprompt, so it needs telling by hand. */
  return isIOS()&&!isStandalone()&&!S.settings.hideInstallHint;
}

/* ---------- service worker ---------- */
function registerSW(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol==='file:')return;   /* no offline copy from a local file */
  var hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    swReg=reg;
    reg.addEventListener('updatefound',function(){
      var w=reg.installing;
      if(!w)return;
      w.addEventListener('statechange',function(){
        if(w.state==='installed'&&navigator.serviceWorker.controller){
          pendingWorker=w;
          offerUpdate();
        }
      });
    });
  }).catch(function(){});

  var reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    /* On a first visit the worker claims the page and this fires straight
       away — reloading then would bounce the reader for no reason. */
    if(!hadController||reloading)return;
    reloading=true;
    location.reload();
  });
}
function offerUpdate(){
  /* Never interrupt a test in progress — the reload would lose it. */
  if(S.run){setTimeout(offerUpdate,60000);return;}
  var d=document.createElement('div');
  d.className='toast good';
  d.innerHTML='<div class="row" style="gap:12px;justify-content:space-between">'+
    '<span>A new version of Pip is ready.</span>'+
    '<button class="btn btn-sm" data-act="apply-update">Reload</button></div>';
  $('#toasts').appendChild(d);
}
function applyUpdate(){
  if(pendingWorker)pendingWorker.postMessage('SKIP_WAITING');
  else location.reload();
}

/* ---------- immersive mode ---------- */
function fullscreenAvailable(){
  var el=document.documentElement;
  return !!(el.requestFullscreen||el.webkitRequestFullscreen);
}
function enterImmersive(){
  /* Must be called inside a user gesture. Installed apps already have no
     browser chrome, so there is nothing to hide. */
  if(!S.settings.immersive)return;
  if(isStandalone())return;
  if(!fullscreenAvailable())return;
  var el=document.documentElement;
  var fn=el.requestFullscreen||el.webkitRequestFullscreen;
  try{
    var p=fn.call(el,{navigationUI:'hide'});
    if(p&&p.catch)p.catch(function(){});
  }catch(e){}
}
function exitImmersive(){
  try{
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();
  }catch(e){}
}

/* ---------- keep the screen awake during a test ---------- */
var wakeLock=null;
function wakeOn(){
  if(!('wakeLock' in navigator)||wakeLock)return;
  navigator.wakeLock.request('screen').then(function(l){
    wakeLock=l;
    l.addEventListener('release',function(){wakeLock=null;});
  }).catch(function(){});
}
function wakeOff(){
  if(!wakeLock)return;
  try{wakeLock.release();}catch(e){}
  wakeLock=null;
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&S.view==='quiz'&&S.run)wakeOn();

function askPersistence(){
  if(!navigator.storage||!navigator.storage.persist)return;

    if(!already)navigator.storage.persist().catch(function(){});

}

function diagnose(){
  var out={
    address:location.href,
    secure:(window.isSecureContext?'yes':'NO — install needs https'),
    displayMode:(isStandalone()?'installed (standalone)':'browser tab'),
    manifestLink:(document.querySelector('link[rel=manifest]')?'present':'MISSING'),
    manifest:'checking…',
    serviceWorker:('serviceWorker' in navigator)?'checking…':'NOT SUPPORTED by this browser',
    controlling:('serviceWorker' in navigator)?'checking…':'n/a',
    installPrompt:(deferredInstall?'offered':(isStandalone()?'already installed':'not offered yet')),
    storage:'checking…'
  };
  var jobs=[];

  out.startUrl='checking…';
  out.icons='checking…';

  jobs.push(fetch('./manifest.json',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(m){
    out.manifest='ok — '+m.name+' | display '+m.display+' | scope '+m.scope;

    /* Does start_url actually serve something? A 404 here is invisible
       in the manifest itself but fails the install check. */
    var su=new URL(m.start_url||'./',location.href).href;
    var startJob=fetch(su,{cache:'no-store'}).then(function(r){
      out.startUrl=(r.ok?'ok ':'FAILED ')+r.status+' — '+su;
    }).catch(function(err){out.startUrl='FAILED — '+err.message;});

    /* The declared size is a claim. Load each icon and measure it:
       a missing file or a mismatched dimension blocks installation. */
    var list=m.icons||[];
    var iconJobs=list.map(function(ic){
      var href=new URL(ic.src,su).href;
      return fetch(href,{cache:'no-store'}).then(function(r){
        if(!r.ok)throw new Error('HTTP '+r.status);
        /* Always settles: an image that neither loads nor errors would
           otherwise leave the whole report stuck on "checking…". */
        return new Promise(function(res){
          var done=false;
          var finish=function(v){if(!done){done=true;res(v);}};
          var img=new Image();
          img.onload=function(){finish(img.naturalWidth+'x'+img.naturalHeight);};
          img.onerror=function(){finish('UNREADABLE');};
          img.src=href;
          setTimeout(function(){finish('NO RESPONSE');},5000);
        });
      }).then(function(real){
        var claimed=ic.sizes||'?';
        var bad=(real==='UNREADABLE')||(claimed.split(' ').indexOf(real)<0);
        return (bad?'MISMATCH ':'ok ')+ic.src+' — declared '+claimed+
               ', actual '+real+' ['+(ic.purpose||'any')+']';
      }).catch(function(err){
        return 'MISSING '+ic.src+' — '+err.message;
      });
    });

    return Promise.all([startJob].concat(iconJobs)).then(function(r){
      var lines=r.slice(1);
      var anyGood=lines.some(function(l){
        return l.indexOf('ok ')===0&&l.indexOf('192x192')>0;
      });
      out.icons=lines.join('\n')+(anyGood?'':'\n← no usable 192x192 icon, so Chrome will not install');
    });
  }).catch(function(err){
    out.manifest='FAILED — '+err.message;
    out.startUrl='not checked';out.icons='not checked';
  }));

  if('serviceWorker' in navigator){
    jobs.push(navigator.serviceWorker.getRegistration().then(function(reg){
      if(!reg){out.serviceWorker='NOT REGISTERED';out.controlling='no';return;}
      out.serviceWorker='registered at scope '+reg.scope;
      out.controlling=navigator.serviceWorker.controller?'yes':'no — reload once';
    }).catch(function(err){out.serviceWorker='error — '+err.message;}));
  }

  if(navigator.storage&&navigator.storage.estimate){
    jobs.push(Promise.all([
      navigator.storage.estimate(),
      navigator.storage.persisted?navigator.storage.persisted():Promise.resolve(null)
    ]).then(function(r){
      var used=Math.round((r[0].usage||0)/1024);
      out.storage=used+' KB used'+(r[1]===null?'':(r[1]?', protected from eviction':', NOT protected — data can be cleared'));
    }).catch(function(){out.storage='unknown';}));
  }else{
    out.storage='unknown';
  }

  /* Whatever happens, report something within six seconds. */
  var guard=new Promise(function(res){setTimeout(res,6000);});
  return Promise.race([Promise.all(jobs),guard]).then(function(){return out;});
}

/* iOS in standalone does not shrink the layout viewport when the keyboard
   opens, so a fixed overlay keeps covering the whole screen while touches
   arrive in the smaller visual viewport. Pinning overlays to the visual
   viewport keeps taps and carets lined up. */
function bindViewport(){
  var vv=window.visualViewport;
  if(!vv)return;
  var root=document.documentElement;
  function sync(){
    root.style.setProperty('--vv-top',Math.max(0,vv.offsetTop)+'px');
    root.style.setProperty('--vv-left',Math.max(0,vv.offsetLeft)+'px');
    root.style.setProperty('--vv-w',vv.width+'px');
    root.style.setProperty('--vv-h',vv.height+'px');
  }
  vv.addEventListener('resize',function(){sync();reassertLock();});
  vv.addEventListener('scroll',sync);
  /* The blur that closes the keyboard is the moment iOS leaves the page
     scrolled, so settle it once the animation has finished. */
  document.addEventListener('focusout',function(){
    setTimeout(function(){sync();reassertLock();},120);
    setTimeout(function(){sync();reassertLock();},400);
  },true);
  window.addEventListener('orientationchange',function(){setTimeout(sync,250);});
  sync();
}

/* The app being backgrounded is the last reliable moment on a phone. */
function bindSnapshotOnLeave(){
  var take=function(){snapshot('before leaving the app');};
  window.addEventListener('pagehide',take);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden')take();
  });
}

function initPlatform(){
  bindViewport();
  bindSnapshotOnLeave();
  registerSW();
  askPersistence();
  pushView();
  if(isStandalone())document.documentElement.classList.add('standalone');
}
