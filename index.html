/* =========================================================
   Abilities

   A complete look can carry a power, but only while the reader is
   actually wearing all of it. Taking one piece off turns it off,
   which is what makes the full set worth keeping on.
   ========================================================= */
var PIP_ABILITIES={
  none:    {name:'None',      unit:'',  blurb:function(v){return 'No special power.';}},
  boost:   {name:'Point boost',unit:'%', blurb:function(v){return '+'+v+'% on every point earned while worn.';}},
  discount:{name:'Store discount',unit:'%',blurb:function(v){return v+'% off everything in the store while worn.';}},
  payback: {name:'Extra wish payback',unit:'%',blurb:function(v){return v+'% more paid back on a granted wish.';}},
  foodtime:{name:'Longer food powers',unit:'%',blurb:function(v){return 'Food powers last '+v+'% longer while worn.';}},
  findluck:{name:'Companion luck',unit:'%',blurb:function(v){return '+'+v+'% chance of a companion find each day.';}},
  bonusluck:{name:'Bonus luck',unit:'%',blurb:function(v){return '+'+v+'% chance of bonus cosmetics and food on store items, activities and events.';}}
};
/* ---------- Power capabilities ----------
   Every power kind has an effect (what the engine does with it) and a scope
   (where it applies). The six shipped kinds are their own effect with scope
   'all'. Instructors can create new kinds on top of any effect, with a
   narrower scope: "+N% on quiz points", "N% off Pip cosmetics", and so on. */
var POWER_EFFECTS={
  boost:{name:'Point boost',scopes:[['all','Everything earned'],['quiz','Quizzes only'],['activity','Activities only'],
    ['event','Events and group goals only'],['streak','Streak payouts only']]},
  discount:{name:'Store discount',scopes:[['all','Store rewards and food'],['rewards','Store rewards only'],
    ['food','Pip’s food only'],['pip','Pip cosmetics (shelf and looks)']]},
  payback:{name:'Extra wish payback',scopes:[['all','Granted wishes']]},
  foodtime:{name:'Longer food powers',scopes:[['all','Every food Pip eats']]},
  findluck:{name:'Companion luck',scopes:[['all','Daily companion finds']]},
  bonusluck:{name:'Bonus luck',scopes:[['all','Store items, activities and events']]}
};
var SCOPE_WORDS={quiz:'quiz points',activity:'activity points',event:'event points',streak:'streak payouts',
  rewards:'store rewards',food:'food',pip:'Pip cosmetics'};
var PIP_ABILITIES_BUILTIN=null;
/* A look can carry one power (ability) or several (abilities). The
   instructor's override wins: {kind,value} for one, {multi:{kind:value}}
   for several. Only powers that actually do something are returned. */
function lookIsMulti(l){return Array.isArray(l.abilities);}
/* Festival powers: extra power that only works while its season is open.
   The look keeps its standard power all year; the festival tops it up. */
var PIP_POWER_SHORT={boost:function(v){return '+'+v+'% points';},
  discount:function(v){return v+'% off';},payback:function(v){return '+'+v+'% wish payback';},
  foodtime:function(v){return '+'+v+'% food time';},findluck:function(v){return '+'+v+'% find luck';},
  bonusluck:function(v){return '+'+v+'% bonus luck';}};
var PIP_POWER_SHORT_BUILTIN=null;
function powerEffect(k){var a=PIP_ABILITIES[k];return (a&&a.effect)||k;}
function powerScope(k){var a=PIP_ABILITIES[k];return (a&&a.scope)||'all';}
function customPowerBlurb(c){
  var sw=SCOPE_WORDS[c.scope];
  return function(v){
    if(c.effect==='boost')return '+'+v+'% on '+(sw||'every point earned')+' while worn.';
    if(c.effect==='discount')return v+'% off '+(sw||'store rewards and food')+' while worn.';
    return PIP_ABILITIES_BUILTIN[c.effect].blurb(v);
  };
}
function customPowerShort(c){
  var sw=SCOPE_WORDS[c.scope];
  return function(v){
    if(c.effect==='boost'&&sw)return '+'+v+'% '+sw;
    if(c.effect==='discount'&&sw)return v+'% off '+sw;
    return PIP_POWER_SHORT_BUILTIN[c.effect](v);
  };
}
/* Rebuild the power kinds from the shipped ones plus the instructor's own. */
function applyPowerKinds(){
  if(!PIP_ABILITIES_BUILTIN){
    PIP_ABILITIES_BUILTIN={};Object.keys(PIP_ABILITIES).forEach(function(k){PIP_ABILITIES_BUILTIN[k]=PIP_ABILITIES[k];});
    PIP_POWER_SHORT_BUILTIN={};Object.keys(PIP_POWER_SHORT).forEach(function(k){PIP_POWER_SHORT_BUILTIN[k]=PIP_POWER_SHORT[k];});
  }
  if(typeof S==='undefined'||!S||!S.settings)return;
  Object.keys(PIP_ABILITIES).forEach(function(k){if(!PIP_ABILITIES_BUILTIN[k])delete PIP_ABILITIES[k];});
  Object.keys(PIP_POWER_SHORT).forEach(function(k){if(!PIP_POWER_SHORT_BUILTIN[k])delete PIP_POWER_SHORT[k];});
  POWER_KINDS.length=0;
  POWER_KINDS_BUILTIN.forEach(function(k){POWER_KINDS.push(k);});
  customPowers().forEach(function(c){
    if(!c||!c.id||!POWER_EFFECTS[c.effect])return;
    PIP_ABILITIES[c.id]={name:c.name||'Power',unit:'%',effect:c.effect,scope:c.scope||'all',custom:true,blurb:customPowerBlurb(c)};
    PIP_POWER_SHORT[c.id]=customPowerShort(c);
    POWER_KINDS.push(c.id);
  });
}
function customPowers(){
  var c=S.settings.pipPowers;
  return (c&&Array.isArray(c.custom))?c.custom:[];
}
/* Everything of one effect that applies here: the shipped kind plus any
   instructor powers whose scope matches. Each kind is capped on its own. */
function powerTotal(effect,p,scope){
  var v=0;
  POWER_KINDS.forEach(function(k){
    if(powerEffect(k)!==effect)return;
    var sc=powerScope(k);
    if(sc!=='all'&&sc!==scope)return;
    v+=abilityValue(k,p);
  });
  return Math.round(v*10)/10;
}
function lookAbility(l){
  return lookPowers(l)[0]||{kind:'none',value:0};
}
function powersText(l,sep){
  return lookPowers(l).map(function(a){return PIP_ABILITIES[a.kind].blurb(a.value);}).join(sep||' ');
}
/* Worn means every single piece of the look is on. */
function wearingLook(l,p){
  p=p||me();
  if(!p)return false;
  var look=pipLook(p);
  return l.grants.every(function(g){
    var part=pipPart(g);
    return part&&look[part.slot]===part.v;
  });
}
/* Every power switched on right now, strongest per kind. */
function activePowers(p){
  p=p||me();
  var out=[];
  if(!p)return out;
  var by={};
  PIP_LOOKS.forEach(function(l){
    var ps=lookPowers(l).concat(festivalPowers(l));
    if(!ps.length||!wearingLook(l,p))return;
    ps.forEach(function(a){
      if(!by[a.kind]||a.value>by[a.kind].value)by[a.kind]={kind:a.kind,value:a.value,look:l,
        festival:!!a.festival,seasonName:a.seasonName||''};
    });
  });
  Object.keys(PIP_ABILITIES).forEach(function(k){if(by[k])out.push(by[k]);});
  return out;
}
function activeAbility(p){
  return activePowers(p)[0]||{kind:'none',value:0,look:null};
}
function abilityValue(kind,p){
  var v=0,ps=activePowers(p);
  for(var i=0;i<ps.length;i++)if(ps[i].kind===kind)v=ps[i].value;
  /* A food power adds to what the outfit gives; foods never stack with each other. */
  var f=foodPower(p);
  if(f&&!f.asleep&&f.kind===kind)v+=f.value;
  var kc=powerKindCfg(kind);
  if(!kc.on)return 0;
  if(kc.cap)v=Math.min(v,kc.cap);
  return Math.round(v*10)/10;
}
/* Applied when points are earned, not to the running total — so the record
   shows what was actually awarded and changing outfit later rewrites nothing. */
function withBoost(points,p,scope){
  var b=powerTotal('boost',p,scope);
  if(!b||!points)return{points:points,boost:0,added:0};
  var out=Math.round(points*(1+b/100)*10)/10;
  return{points:out,boost:b,added:Math.round((out-points)*10)/10};
}
function abilityLine(p){
  var ps=activePowers(p);
  var f=foodPower(p);
  var fl=(f&&!f.asleep)?'<span class="abil food">'+esc(f.name)+' &nbsp;·&nbsp; '+
    esc(PIP_ABILITIES[f.kind].blurb(f.value))+' &nbsp;·&nbsp; <span data-until="'+esc(f.until)+'">'+
    durWords(Math.ceil((new Date(f.until).getTime()-Date.now())/60000))+' left</span></span>':'';
  if(!ps.length)return fl;
  return fl+ps.map(function(a){
    return '<span class="abil'+(a.festival?' fest':'')+'">'+ico('flame')+esc(a.look.name)+' &nbsp;·&nbsp; '+
      esc(PIP_ABILITIES[a.kind].blurb(a.value))+
      (a.festival?' &nbsp;·&nbsp; '+esc(a.seasonName):'')+'</span>';
  }).join('');
}

/* ---------- photos ---------- */
function shrinkSrc(src,maxPx,quality){
  return new Promise(function(res,rej){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight;
        var k=Math.min(1,maxPx/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
        var cv=document.createElement('canvas');
        cv.width=cw;cv.height=ch;
        var cx=cv.getContext('2d');
        cx.fillStyle='#fff';cx.fillRect(0,0,cw,ch);
        cx.drawImage(img,0,0,cw,ch);
        try{res(cv.toDataURL('image/jpeg',quality));}
        catch(e){rej(new Error('that picture could not be read'));}
      };
      img.onerror=function(){rej(new Error('that file is not a picture'));};
      img.src=String(src);
  });
}
function shrink(file,maxPx,quality){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){res(String(r.result));};
    r.onerror=function(){rej(new Error('that file could not be opened'));};
    r.readAsDataURL(file);
  }).then(function(src){return shrinkSrc(src,maxPx,quality);});
}

/* =========================================================
   The event engine, second edition.

   Every event now runs in rounds. A round is worked out from
   the date (today, this week, this month, every few days, this
   year's festival window...), and an entry belongs to the round
   it was sent in. Limits count per round, so an event a reader
   finished last week is theirs to do again this week.

   On top of that: checklists that pay per step, group goals the
   whole class fills together, challenges open only for a few
   hours, day-by-day holiday calendars, and links to Pip's shop
   and pantry.
   ========================================================= */
var EVENT_REPEATS=[['none','Does not repeat'],['daily','Every day'],['weekly','Every week'],
  ['monthly','Every month'],['every','Every few days'],['yearly','Every year']];
var WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad2(n){return (n<10?'0':'')+n;}
function dkey(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function isClassicKind(k){return ['photo','text','count','checkin'].indexOf(k)>=0;}
function isStepKind(k){return k==='steps'||k==='calendar';}

/* A yearly window (month/day to month/day) that may wrap the new year. */
function yearWindow(from,to,now){
  var y=now.getFullYear();
  var wraps=(to[0]*100+to[1])<(from[0]*100+from[1]);
  var tries=wraps?[[y-1,y],[y,y+1]]:[[y,y],[y+1,y+1]];
  for(var i=0;i<tries.length;i++){
    var a=new Date(tries[i][0],from[0]-1,from[1]);
    var b=new Date(tries[i][1],to[0]-1,to[1]+1);        /* exclusive end */
    if(now<b)return{from:a,endExcl:b,open:now>=a};
  }
  return null;
}
function calendarWindow(ev,now){
  now=now||new Date();
  var c=ev.cal||{};
  var m=Math.max(1,Math.min(12,num(c.month,12))),d=Math.max(1,Math.min(31,num(c.day,1)));
  var n=Math.max(1,(ev.steps||[]).length);
  var y=now.getFullYear();
  for(var yy=y-1;yy<=y+1;yy++){
    var s=new Date(yy,m-1,d),e=addDays(s,n);
    if(now<e){
      var open=now>=s;
      return{start:s,endExcl:e,open:open,
        label:open?'':'Starts '+(dayDiff(s,now)>45?fmtDay(s):inDays(dayDiff(s,now)))};
    }
  }
  return{start:new Date(y+1,m-1,d),endExcl:addDays(new Date(y+1,m-1,d),n),open:false,label:'Next year'};
}
function nextWeekday(days,now){
  for(var i=1;i<=7;i++){
    var d=addDays(dayStart(now),i);
    if(days.indexOf(d.getDay())>=0)return d;
  }
  return null;
}
/* Which round is running now (or at a given moment). */
function eventRound(ev,now){
  now=now||new Date();
  if(ev.kind==='calendar'){
    var c=calendarWindow(ev,now);
    return{key:'y'+c.start.getFullYear(),start:c.start,end:c.endExcl,open:c.open,label:c.label};
  }
  var r=ev.repeat||{mode:'none'};
  var t=dayStart(now);
  if(r.mode==='daily')return{key:dkey(t),start:t,end:addDays(t,1),open:true,resets:true};
  if(r.mode==='weekly'){
    var ws=startOfWeek(now);
    var days=(r.days&&r.days.length)?r.days:null;
    var open=!days||days.indexOf(now.getDay())>=0;
    var nx=(!open&&days)?nextWeekday(days,now):null;
    return{key:'w'+dkey(ws),start:ws,end:addDays(ws,7),open:open,resets:true,
      label:open?'':(nx?'Opens '+(dayDiff(nx,t)===1?'tomorrow':WEEKDAYS[nx.getDay()]):'Closed today')};
  }
  if(r.mode==='monthly'){
    var ms=new Date(now.getFullYear(),now.getMonth(),1);
    return{key:'m'+now.getFullYear()+'-'+pad2(now.getMonth()+1),start:ms,
      end:new Date(now.getFullYear(),now.getMonth()+1,1),open:true,resets:true};
  }
  if(r.mode==='every'){
    var n=Math.max(1,num(r.n,3));
    var anchor=dayStart(dnum(r.anchor)||dnum(String(ev.created||'').slice(0,10))||new Date(2026,0,1));
    var idx=Math.floor(Math.round((t.getTime()-anchor.getTime())/864e5)/n);
    var st=addDays(anchor,idx*n);
    return{key:'e'+idx,start:st,end:addDays(st,n),open:true,resets:true};
  }
  if(r.mode==='yearly'){
    var yw=yearWindow(r.from||[10,1],r.to||[10,31],now);
    if(!yw)return{key:'none',open:false,label:'Not scheduled'};
    return{key:'y'+yw.from.getFullYear(),start:yw.from,end:yw.endExcl,open:yw.open,
      label:yw.open?'':'Returns '+(dayDiff(yw.from,now)>45?fmtDay(yw.from):inDays(dayDiff(yw.from,now)))};
  }
  /* no repeat: an event that returns on a cycle still gets a fresh round each time */
  if(ev.avail&&ev.avail.mode==='season'){
    var av=availability(ev,now);
    if(av.cycle!=null)return{key:'c'+av.cycle,open:true,end:av.endsExcl||null};
  }
  return{key:'all',open:true,start:null,end:null};
}
function entryRound(ev,e){
  if(e.round)return e.round;
  return eventRound(ev,new Date(e.at)).key;
}
/* Timed challenges: open only between two clock times on an open day. */
function hm(s){var m=/^(\d{1,2}):(\d{2})$/.exec(String(s||''));return m?[+m[1],+m[2]]:null;}
function hoursState(ev,now){
  now=now||new Date();
  var h=ev.hours;
  if(!h||!h.on)return{on:false,open:true};
  var a=hm(h.from),b=hm(h.to);
  if(!a||!b)return{on:false,open:true};
  var s=new Date(now.getFullYear(),now.getMonth(),now.getDate(),a[0],a[1]);
  var e=new Date(now.getFullYear(),now.getMonth(),now.getDate(),b[0],b[1]);
  if(e<=s)e=addDays(e,1);
  if(now>=s&&now<e)return{on:true,open:true,until:e};
  if(now<s)return{on:true,open:false,label:'Opens at '+h.from,opensAt:s};
  return{on:true,open:false,label:'Done for today — back at '+h.from};
}
function clockLeft(ms){
  var m=Math.max(0,Math.ceil(ms/60000));
  if(m<60)return m+'m';
  var h=Math.floor(m/60);
  if(h<48)return h+'h '+pad2(m%60)+'m';
  return Math.floor(h/24)+'d '+(h%24)+'h';
}
/* Everything that decides whether the event is running right now. */
function eventOpen(ev,now){
  now=now||new Date();
  var av=(ev.kind==='calendar')?{open:true,label:''}:availability(ev,now);
  var rd=eventRound(ev,now);
  var hs=hoursState(ev,now);
  if(!av.open)return{open:false,label:av.label||'Not open',av:av,round:rd,hours:hs};
  if(!rd.open)return{open:false,label:rd.label||'Not open',av:av,round:rd,hours:hs};
  if(!hs.open)return{open:false,label:hs.label,av:av,round:rd,hours:hs};
  var until=null;
  if(hs.on)until=hs.until;
  else if(rd.end&&(rd.resets||ev.kind==='calendar'))until=rd.end;
  if(av.endsExcl&&(!until||av.endsExcl<until))until=av.endsExcl;
  return{open:true,label:av.label||'',av:av,round:rd,hours:hs,until:until};
}

/* ---------- connected events: what a reader did elsewhere ---------- */
var TRIGGERS={
  none:{name:'Done by hand'},
  quiz:{name:'Pass quizzes',unit:'quiz',units:'quizzes'},
  book:{name:'Finish books',unit:'book',units:'books'},
  activity:{name:'Log an activity',unit:'time',units:'times'},
  points:{name:'Earn points',unit:'point',units:'points'},
  top:{name:'Top rating on an event',unit:'top rating',units:'top ratings'}
};
function roundStartOf(ev,rd){
  rd=rd||eventRound(ev);
  if(rd.start)return rd.start;
  var a=ev.avail||{};
  if(a.mode==='season'){
    var av=availability(ev);
    if(av.endsExcl)return addDays(av.endsExcl,-Math.max(1,num(a.days,7)));
  }
  if(a.mode==='window'&&dnum(a.start))return dayStart(dnum(a.start));
  var c=new Date(ev.created||0);
  return isNaN(c.getTime())?new Date(0):c;
}
function bookFinishedAt(m,p){
  var papers=(m.chapters||[]).map(function(ch){return ch.id;});
  if(hasBookTest(m))papers.push(null);
  if(!papers.length)return null;
  var last=null;
  for(var i=0;i<papers.length;i++){
    var first=null;
    (p.records||[]).forEach(function(r){
      if(r.moduleId!==m.id||!r.passed||(r.chapterId||null)!==papers[i])return;
      var d=new Date(r.date);
      if(!first||d<first)first=d;
    });
    if(!first)return null;
    if(!last||first>last)last=first;
  }
  return last;
}
function inSpan(iso,a,b){var t=new Date(iso);return t>=a&&(!b||t<b);}
function passedSince(p,a,b,mod){
  return (p.records||[]).filter(function(r){return r.passed&&inSpan(r.date,a,b)&&(!mod||r.moduleId===mod);});
}
function booksSince(p,a,b,mod,minLevel){
  return S.modules.filter(function(m){
    if(mod&&m.id!==mod)return false;
    if(minLevel&&num(m.ar&&m.ar.level,0)<minLevel)return false;
    var d=bookFinishedAt(m,p);
    return d&&d>=a&&(!b||d<b);
  });
}
function activitiesSince(p,a,b,act){
  return logOf(p).filter(function(r){return r.approved&&inSpan(r.date,a,b)&&(!act||r.activityId===act);});
}
function pointsSince(p,a,b,skipEv){
  var n=0;
  (p.records||[]).forEach(function(r){if(r.passed&&inSpan(r.date,a,b))n+=num(r.points,0);});
  activitiesSince(p,a,b).forEach(function(r){n+=num(r.points,0);});
  entriesOf(p).forEach(function(e){
    if(e.status==='rated'&&e.eventId!==skipEv&&inSpan(e.ratedAt||e.at,a,b))n+=num(e.points,0);
  });
  return Math.round(n*10)/10;
}
function topsSince(p,a,b){
  return trophyEntries(p).filter(function(e){return inSpan(e.ratedAt||e.at,a,b);});
}
/* How far a reader is with a step that fills itself in. */
function stepTrigger(ev,p,i,key){
  var s=(ev.steps||[])[i];
  var t=s&&s.trigger;
  if(!t||!t.type||t.type==='none'||!TRIGGERS[t.type])return null;
  var since=(ev.kind==='calendar')?addDays(dayStart(calendarWindow(ev).start),i):roundStartOf(ev);
  if(needsJoin(ev)){var ja=joinedAt(ev,p);if(!ja)return{have:0,need:Math.max(1,num(t.count,1)),met:false,label:'Join to start counting'};if(ja>since)since=ja;}
  var need=Math.max(1,num(t.count,1)),have=0;
  if(t.type==='quiz')have=passedSince(p,since,null,t.target).length;
  else if(t.type==='book')have=booksSince(p,since,null,t.target,num(t.level,0)).length;
  else if(t.type==='activity')have=activitiesSince(p,since,null,t.target).length;
  else if(t.type==='points')have=pointsSince(p,since,null,ev.id);
  else if(t.type==='top')have=topsSince(p,since).length;
  have=Math.min(have,need);
  var what=TRIGGERS[t.type];
  var tgt='';
  if((t.type==='quiz'||t.type==='book')&&t.target&&byId(t.target))tgt=' · '+byId(t.target).title;
  if(t.type==='activity'&&t.target&&activityById(t.target))tgt=' · '+activityById(t.target).title;
  return{have:have,need:need,met:have>=need,
    label:pts(have).replace(/\.0$/,'')+'/'+need+' '+(need===1?what.unit:what.units)+tgt};
}
function triggerWords(t){
  if(!t||!t.type||t.type==='none')return '';
  var what=TRIGGERS[t.type],n=Math.max(1,num(t.count,1));
  var s={quiz:'Pass '+n+' '+(n===1?'quiz':'quizzes'),book:'Finish '+n+' '+(n===1?'book':'books'),
    activity:'Log it '+n+' '+(n===1?'time':'times'),points:'Earn '+n+' points',
    top:'Get '+n+' top '+(n===1?'rating':'ratings')}[t.type]||what.name;
  if((t.type==='quiz'||t.type==='book')&&t.target&&byId(t.target))s+=' for '+byId(t.target).title;
  if(t.type==='book'&&num(t.level,0))s+=' at level '+num(t.level,0)+'+';
  if(t.type==='activity'&&t.target&&activityById(t.target))s=s.replace('Log it','Log '+activityById(t.target).title);
  return s;
}
function eventCompleted(ev,p,since){
  return entriesOf(p).some(function(e){
    if(e.eventId!==ev.id||e.status!=='rated')return false;
    if(since&&new Date(e.ratedAt||e.at)<since)return false;
    if(isStepKind(ev.kind))return e.stepId==='__all';
    if(ev.kind==='goal')return !!e.goalReward;
    return true;
  });
}
function gateBlock(ev,p){
  if(ev.after){
    var prev=eventById(ev.after);
    if(prev&&prev.id!==ev.id){
      var rd=eventRound(ev);
      var since=rd.resets?roundStartOf(ev,rd):null;
      if(!eventCompleted(prev,p,since))return 'Unlocks after “'+prev.title+'”';
    }
  }
  if(ev.booksGate&&ev.books&&ev.books.length){
    var ok=ev.books.some(function(id){return (p.records||[]).some(function(r){return r.moduleId===id&&r.passed;});});
    if(!ok){
      var m=byId(ev.books[0]);
      return 'Pass a quiz for '+(m?m.title:'the book')+' first';
    }
  }
  return '';
}
function eventsForBook(modId,p){
  return eventList().filter(function(ev){
    return (ev.books||[]).indexOf(modId)>=0&&!ev.hidden&&assignedTo(ev,p);
  });
}
function bookEventsHTML(modId,p,heading){
  var list=eventsForBook(modId,p);
  if(!list.length||(!eventsOn()&&!S.admin))return '';
  return '<div class="bookevents noprint"><h3 style="font-size:1.06rem;margin:18px 0 8px">'+esc(heading)+'</h3>'+
    '<div class="evlist">'+list.map(function(ev){return eventCardHTML(ev,p);}).join('')+'</div></div>';
}

/* ---------- where a reader stands this round ---------- */
function roundEntries(ev,p,key){
  return entriesOf(p).filter(function(e){
    return e.eventId===ev.id&&!e.goalReward&&entryRound(ev,e)===key;
  });
}
function stepEntry(ev,p,stepId,key){
  var hit=null;
  roundEntries(ev,p,key).forEach(function(e){
    if(e.stepId===stepId&&e.status!=='declined')hit=e;
  });
  return hit;
}
function calendarDayIndex(ev,now){
  var c=calendarWindow(ev,now);
  if(!c.open)return -1;
  return Math.round((dayStart(now||new Date()).getTime()-dayStart(c.start).getTime())/864e5);
}
function stepUnlock(ev,p,i,key,now){
  now=now||new Date();
  var steps=ev.steps||[];
  if(ev.kind==='calendar'){
    var di=calendarDayIndex(ev,now);
    var c=calendarWindow(ev,now);
    if(i>di)return{ok:false,label:fmtDay(addDays(c.start,i))};
    if(i<di&&!(ev.cal&&ev.cal.catchUp))return{ok:false,label:'Missed',missed:true};
    return{ok:true};
  }
  if(ev.stepsCfg&&ev.stepsCfg.inOrder&&i>0){
    var prev=stepEntry(ev,p,steps[i-1].id,key);
    if(!prev)return{ok:false,label:'After step '+i};
  }
  return{ok:true};
}
function eventState(ev,p){
  p=p||me();
  var op=eventOpen(ev);
  var key=op.round.key;
  var mine=roundEntries(ev,p,key);
  var pending=mine.filter(function(e){return e.status==='pending';}).length;
  var base={mine:mine,pending:pending,window:op,round:op.round,until:op.until||null};
  function out(o){for(var k in base)if(!(k in o))o[k]=base[k];return o;}
  if(!assignedTo(ev,p))return out({can:false,label:'Not for you',tone:'cold'});
  if(!op.open)return out({can:false,label:op.label,tone:'cold'});
  if(needsJoin(ev)&&!hasJoined(ev,p)){
    var tgj=ev.kind==='goal'?townGoal(ev):null;
    if(!(tgj&&tgj.on&&tgj.ended))return out({can:false,label:'Join to take part',tone:'warm',needJoin:true});
  }
  var block=linkBlock(ev,p,key,mine);
  if(isStepKind(ev.kind)){
    var steps=ev.steps||[];
    var done=steps.filter(function(s){return stepEntry(ev,p,s.id,key);}).length;
    var claim=0;
    var ready=steps.some(function(s,i){
      if(stepEntry(ev,p,s.id,key)||!stepUnlock(ev,p,i,key).ok)return false;
      var tr=stepTrigger(ev,p,i,key);
      return !tr||tr.met;
    });
    steps.forEach(function(s,i){
      if(stepEntry(ev,p,s.id,key)||!stepUnlock(ev,p,i,key).ok)return;
      var tr=stepTrigger(ev,p,i,key);
      if(tr&&tr.met)claim++;
    });
    var prog=done+'/'+steps.length+(ev.kind==='calendar'?' doors':' done');
    if(done>=steps.length&&steps.length)return out({can:false,label:'All done',tone:'good',progress:prog,done:done});
    if(block)return out({can:false,label:block,tone:'warm',progress:prog,done:done,blocked:true});
    var gate=gateBlock(ev,p);
    if(gate)return out({can:false,label:gate,tone:'cold',progress:prog,done:done,locked:true});
    return out({can:true,open:true,label:claim?(claim+' ready to claim'):(ready?prog:(prog+' · keep going')),
      tone:ready?'warm':'cold',progress:prog,done:done,ready:ready,view:true,claim:claim});
  }
  if(ev.kind==='goal'){
    var tgx=townGoal(ev);
    if(tgx.on&&tgx.ended){
      var gpx=goalProgress(ev);
      return out({can:false,label:gpx.reached?'Goal reached':'Ended — not reached',tone:gpx.reached?'good':'cold',ended:true});
    }
  }
  var gate2=gateBlock(ev,p);
  if(gate2)return out({can:false,label:gate2,tone:'cold',locked:true});
  if(ev.kind==='goal'&&goalAuto(ev)){
    var gp=goalProgress(ev);
    return out({can:true,auto:true,label:gp.reached?'Goal reached':'Counts by itself',tone:gp.reached?'good':'warm'});
  }
  var cap=(ev.entries&&ev.entries.mode==='once')?1:Math.max(1,num(ev.entries&&ev.entries.limit,3));
  if(mine.length>=cap){
    var again=op.round.resets&&op.round.end?' · again '+inDays(dayDiff(op.round.end,new Date())):'';
    return out({can:false,label:(cap===1?'Sent in':'All '+cap+' sent in')+again,tone:'good'});
  }
  if(pending&&ev.kind!=='goal')return out({can:false,label:pending+' waiting to be looked at',tone:'warm'});
  if(block)return out({can:false,label:block,tone:'warm',blocked:true});
  return out({can:true,label:op.label||'',tone:(op.av&&op.av.tone)||'cold',left:cap-mine.length});
}

/* ---------- checklists and calendars ---------- */
function stepsModal(ev){

      (ev.stepsCfg&&num(ev.stepsCfg.bonus,0)?' &nbsp;·&nbsp; finish them all for +'+pts(num(ev.stepsCfg.bonus,0))+' more':'')+
      (eventGiftText(ev)?' &nbsp;·&nbsp; gift for finishing: '+esc(eventGiftText(ev)):'')+'</p>';

      steps.forEach(function(s,i){

            (un.ok?'<span>'+(tr?(tr.met?'claim!':esc(tr.have+'/'+tr.need)):'+'+pts(num(s.points,0)))+'</span>'
              :'<span>'+esc(un.missed?'missed':un.label)+'</span>'))+

          '<span class="sl">'+esc(s.label)+
            (tr&&!e?'<small>'+esc(triggerWords(s.trigger))+'</small>'+
              '<span class="trbar"><i style="width:'+Math.round(tr.have/tr.need*100)+'%"></i></span>':'')+'</span>'+
          '<span class="sp">+'+pts(num(s.points,0))+'</span>'+
          (e?'<span class="pill '+(e.status==='pending'?'warm':'good')+'">'+(e.status==='pending'?'waiting':'done')+'</span>':
            (un.ok&&st.can&&(!tr||tr.met)?'<button class="btn btn-sm btn-primary" data-evstep="'+esc(s.id)+'">'+(tr?'Claim':'Done')+'</button>':
              '<span class="pill cold">'+esc(!un.ok?(un.label||'locked'):(tr?tr.have+'/'+tr.need:(st.label||'locked')))+'</span>'))+
          '</div>';
      });
      h+='</div>';
    }
    if(ev.stepsCfg&&ev.stepsCfg.approval)h+='<p class="tiny muted stack">Your instructor checks each one before the points land.</p>';
    return h+'<div class="foot"><button class="btn btn-primary" data-close>Close</button></div>';
  }
  function mount(scrim){
    scrim.addEventListener('click',function(e){
      var b=e.target.closest('[data-evstep]');
      if(!b)return;

      if(!s)return;
      var title=ev.kind==='calendar'?'Day '+((ev.steps||[]).indexOf(s)+1)+': '+s.label:s.label;
      var auto=s.trigger&&s.trigger.type&&s.trigger.type!=='none';
      confirmModal(title,(auto?'You did it: '+triggerWords(s.trigger)+'. ':'Did you do it? ')+
        (num(s.points,0)?'It is worth '+pts(num(s.points,0))+' points.':''),
        auto?'Claim it':'Yes, done',function(){
          if(doStep(ev.id,s.id))redrawModal(body(),mount);
        });
    });
  }
  openModal(body(),mount,{dismissable:true});
}
function doStep(evId,stepId){
  var p=me(),ev=eventById(evId);
  if(!p||!ev)return false;
  var st=eventState(ev,p);
  if(!st.can){toast(st.label,'bad');return false;}
  var key=st.round.key;
  var i=-1;
  (ev.steps||[]).forEach(function(s,k){if(s.id===stepId)i=k;});
  if(i<0)return false;
  var step=ev.steps[i];
  if(stepEntry(ev,p,stepId,key)){toast('Already done.','bad');return false;}
  var un=stepUnlock(ev,p,i,key);
  if(!un.ok){toast(un.label||'Not yet.','bad');return false;}
  var trg=stepTrigger(ev,p,i,key);
  if(trg&&!trg.met){toast('Not yet: '+trg.label+'.','bad');return false;}
  var approval=!!(ev.stepsCfg&&ev.stepsCfg.approval);
  if(approval&&totalPending(p)>=PENDING_CAP){
    toast('You have '+PENDING_CAP+' things waiting to be looked at already.','bad',6000);return false;
  }
  var ticket=takeTicket(ev,p,st.mine);
  var boosted=withBoost(num(step.points,0),p,'event');
  var e={id:uid(),eventId:ev.id,eventTitle:ev.title,kind:ev.kind,stepId:step.id,
    stepLabel:(ev.kind==='calendar'?'Day '+(i+1)+': ':'')+step.label,
    at:nowISO(),round:key,note:'',text:'',count:null,thumb:'',
    status:approval?'pending':'rated',
    points:approval?0:boosted.points,boost:approval?0:boosted.boost,
    ratingLabel:approval?'':'Done',ratedAt:approval?'':nowISO()};
  if(ticket)e.ticket=true;
  p.entries=entriesOf(p).concat([e]);
  save();
  if(!approval){
    toast(e.stepLabel+' — +'+pts(e.points)+' points.','good');
    finishSteps(ev,p,key);
  }else toast('Sent in. Your instructor will check it.','good');
  render();
  return true;
}
/* Every step done in a round: pay the finishing bonus, once. */
function finishSteps(ev,p,key){
  var steps=ev.steps||[];
  if(!steps.length)return;
  var all=steps.every(function(s){var e=stepEntry(ev,p,s.id,key);return e&&e.status==='rated';});
  if(!all)return;
  if(roundEntries(ev,p,key).some(function(e){return e.stepId==='__all';}))return;
  var bonus=num(ev.stepsCfg&&ev.stepsCfg.bonus,0);
  var boosted=withBoost(bonus,p,'event');
  p.entries=entriesOf(p).concat([{id:uid(),eventId:ev.id,eventTitle:ev.title,kind:ev.kind,
    stepId:'__all',stepLabel:ev.kind==='calendar'?'Every door opened':'Every step done',
    at:nowISO(),round:key,status:'rated',points:boosted.points,boost:boosted.boost,
    ratingLabel:'Finished',ratedAt:nowISO(),note:'',text:'',count:null,thumb:''}]);
  save();
  grantGift(ev,p);
  grantBonus(ev,p,'event');
  if(p===me())celebrate({kicker:ev.kind==='calendar'?'Calendar complete':'Checklist complete',
    title:ev.title,line:'Every one of them, done',pose:'cheer',
    prize:bonus?'+'+pts(boosted.points)+' points':''});
}
function approveEntry(id){
  var f=findEntry(id);if(!f)return;
  var ev=eventById(f.e.eventId);
  var pts0=0;
  if(f.e.stepId&&ev){
    (ev.steps||[]).forEach(function(s){if(s.id===f.e.stepId)pts0=num(s.points,0);});
  }else if(ev&&ev.kind==='goal')pts0=num(ev.goal&&ev.goal.perEntry,0);
  var boosted=withBoost(pts0,f.p,'event');
  f.e.status='rated';f.e.points=boosted.points;f.e.boost=boosted.boost;
  f.e.ratingLabel=f.e.stepId?'Done':'Counted';f.e.ratedAt=nowISO();
  save();
  if(ev&&f.e.stepId)finishSteps(ev,f.p,entryRound(ev,f.e));
  if(ev&&ev.kind==='goal')settleGoals();
  toast('Approved for '+f.p.name+'.','good');
  render();
}

/* ---------- group goals ---------- */
function goalCfg(ev){
  var g=ev.goal||{};
  return{target:Math.max(1,num(g.target,100)),reward:Math.max(0,num(g.reward,5)),
    who:g.who==='helped'?'helped':'all',approval:g.approval===true,perEntry:Math.max(0,num(g.perEntry,0))};
}
var GOAL_SOURCES={manual:'Readers type their numbers',quizzes:'Quizzes passed',books:'Books finished',
  activities:'Activities logged',points:'Points earned'};
function goalAuto(ev){var s=ev.goal&&ev.goal.source;return !!(s&&s!=='manual'&&GOAL_SOURCES[s]);}
function goalShare(ev,p,key){
  if(!goalAuto(ev)){
    var got=0;
    roundEntries(ev,p,key).forEach(function(e){if(e.status==='rated')got+=Math.max(0,num(e.count,0));});
    return got;
  }
  var rd=eventRound(ev);
  var a=roundStartOf(ev,rd),b=rd.end||null,g=ev.goal;
  if(needsJoin(ev)){
    var ja=joinedAt(ev,p);
    if(!ja)return 0;
    if(!a||ja>a)a=ja;
  }
  if(g.source==='quizzes')return passedSince(p,a,b).length;
  if(g.source==='books')return booksSince(p,a,b).length;
  if(g.source==='activities')return activitiesSince(p,a,b,g.activity||'').length;
  if(g.source==='points')return pointsSince(p,a,b,ev.id);
  return 0;
}
function goalUnit(ev){
  if(!goalAuto(ev))return ev.unit||'';
  return {quizzes:'quizzes passed',books:'books finished',activities:'activities',points:'points'}[ev.goal.source];
}
function goalProgress(ev,key){
  var total=0,helpers=0;
  key=key||eventRound(ev).key;
  S.profiles.forEach(function(p){
    if(goalAuto(ev)&&!assignedTo(ev,p))return;
    var got=goalShare(ev,p,key);
    if(got>0)helpers++;
    total+=got;
  });
  var g=goalCfg(ev);
  var real=Math.round(total*10)/10,realHelpers=helpers;
  var tg=(key===eventRound(ev).key)?townGoal(ev):{on:false,total:0,helpers:0};
  total=Math.round((total+tg.total)*10)/10;
  return{total:total,target:g.target,pct:Math.min(100,Math.round(total/g.target*100)),
    helpers:helpers+tg.helpers,reached:total>=g.target,key:key,
    real:real,realHelpers:realHelpers,town:tg.total,townHelpers:tg.helpers,townOn:tg.on,ended:!!tg.ended,
    joined:needsJoin(ev)?S.profiles.filter(function(p){return assignedTo(ev,p)&&hasJoined(ev,p);}).length:null};
}
function goalRewarded(ev,p,key){
  return entriesOf(p).some(function(e){return e.eventId===ev.id&&e.goalReward&&e.round===key;});
}
function settleGoals(){
  eventList().forEach(function(ev){
    if(ev.kind!=='goal')return;
    var pr=goalProgress(ev);
    if(!pr.reached)return;
    var g=goalCfg(ev);
    S.profiles.forEach(function(p){
      if(!assignedTo(ev,p))return;
      if(!hasJoined(ev,p))return;
      if(goalRewarded(ev,p,pr.key))return;
      if(g.who==='helped'&&!(goalShare(ev,p,pr.key)>0))return;
      var boosted=withBoost(g.reward,p,'event');
      p.entries=entriesOf(p).concat([{id:uid(),eventId:ev.id,eventTitle:ev.title,kind:'goal',
        goalReward:true,stepLabel:'Group goal reached',at:nowISO(),round:pr.key,status:'rated',
        points:boosted.points,boost:boosted.boost,ratingLabel:'Group goal reached',ratedAt:nowISO(),
        note:'',text:'',count:null,thumb:''}]);
      grantGift(ev,p);
      if(p===me())celebrate({kicker:'Group goal',title:ev.title,
        line:pts(pr.total)+' '+goalUnit(ev)+' — together',pose:'cheer',
        prize:g.reward?'+'+pts(boosted.points)+' points for everyone':''});
    });
    save();
  });
}

/* ---------- duplicate ---------- */
function duplicateEvent(id){
  var ev=eventById(id);

  var c=JSON.parse(JSON.stringify(ev));
  c.id=uid();
  c.title=(ev.title+' (copy)').slice(0,48);
  c.hidden=true;
  c.created=nowISO();
  eventEditor(c,{dup:true});
}

/* live countdowns on event cards */
setInterval(function(){
  var now=Date.now(),flip=false;
  $$('[data-evuntil]').forEach(function(el){
    var ms=new Date(el.dataset.evuntil).getTime()-now;
    if(ms<=0){flip=true;return;}
    var t=clockLeft(ms)+' left';
    el.textContent=el.closest('.btime')?t.toUpperCase():t;
  });
  if(flip&&S.view==='events'&&!document.querySelector('.scrim'))render();
},20000);

function eventKindDefaults(d){
  if(isStepKind(d.kind)&&!(d.steps&&d.steps.length)){
    d.steps=d.kind==='calendar'
      ?[1,2,3,4,5].map(function(n){return{id:'s'+uid(),label:'Day '+n+' task',points:1};})
      :[{id:'s'+uid(),label:'Read it',points:2},{id:'s'+uid(),label:'Draw it',points:2},{id:'s'+uid(),label:'Write a caption',points:2}];
  }
  if(!d.stepsCfg)d.stepsCfg={approval:false,bonus:2,inOrder:false};
  if(d.kind==='calendar'&&!d.cal)d.cal={month:12,day:1,catchUp:true};
  if(d.kind==='goal'){
    if(!d.goal)d.goal={target:500,reward:5,who:'all',approval:false,perEntry:0,source:'manual'};
    if(!d.unit||d.unit==='How many')d.unit='minutes';
    if(!d.entries||d.entries.mode==='once')d.entries={mode:'limit',limit:5};
  }
  if(!d.repeat)d.repeat={mode:'none',days:[],n:3,from:[10,1],to:[10,31]};

  if(!d.link)d.link={look:'',food:'',giftPart:'',giftFood:'',giftLook:''};

  if(d.kind==='goal'&&d.goal&&!d.goal.town)d.goal.town={on:false,finish:90,pace:'steady',step:'day',days:14};

function eventExtraClick(e,d,scrim){
  var t;
  if((t=e.target.closest('[data-evgtp]'))&&d.goal&&d.goal.town){
    d.goal.town.finish=+t.dataset.evgtp;
    return true;
  }
  if((t=e.target.closest('[data-evrep]'))){
    d.repeat.mode=t.dataset.evrep;
    if(d.repeat.mode==='every'&&!d.repeat.anchor)d.repeat.anchor=dkey(new Date());
    return true;
  }
  if((t=e.target.closest('[data-evday]'))){
    var days=d.repeat.days||[],i=+t.dataset.evday,at=days.indexOf(i);
    if(at>=0)days.splice(at,1);else days.push(i);
    d.repeat.days=days.sort();return true;
  }
  if((t=e.target.closest('[data-evsdel]'))){d.steps.splice(+t.dataset.evsdel,1);return true;}
  if((t=e.target.closest('[data-evsadd]'))){
    d.steps.push({id:'s'+uid(),label:d.kind==='calendar'?'Day '+(d.steps.length+1)+' task':'',points:1});return true;
  }
  if((t=e.target.closest('[data-evfill]'))){
    var n=Math.max(1,Math.min(31,num(scrim.querySelector('#ev-filln').value,24)));
    while(d.steps.length<n)d.steps.push({id:'s'+uid(),label:'Day '+(d.steps.length+1)+' task',points:1});
    d.steps.length=n;return true;
  }
  if((t=e.target.closest('[data-evgwho]'))){d.goal.who=t.dataset.evgwho;return true;}
  if((t=e.target.closest('[data-evbook]'))){
    var bk=d.books||[],bi=bk.indexOf(t.dataset.evbook);
    if(bi>=0)bk.splice(bi,1);else bk.push(t.dataset.evbook);
    d.books=bk;return true;
  }
  return false;
}
function eventExtraCheck(d){
  if(isStepKind(d.kind)){
    d.steps=d.steps.filter(function(s){return s.label;});
    if(!d.steps.length)return 'Add at least one '+(d.kind==='calendar'?'day':'step')+', with a name.';
  }
  if(d.kind==='calendar')d.avail={mode:'always',start:'',end:'',days:7,everyMonths:12};
  if(d.after===d.id)d.after='';
  if(d.kind!=='goal'&&false){}
  if(d.hours.on){
    if(!hm(d.hours.from)||!hm(d.hours.to))return 'Set both times for the timed challenge.';
    if(d.hours.from===d.hours.to)return 'The opening and closing times are the same.';
  }
  if(d.repeat.mode==='weekly'&&d.repeat.days&&d.repeat.days.length===7)d.repeat.days=[];
  return '';
}

/* ---------- sending something in ---------- */
function submitEntry(ev,payload){
  var p=me();if(!p)return;
  if(totalPending(p)>=PENDING_CAP){
    toast('You have '+PENDING_CAP+' things waiting to be looked at already. Hold on until some come back.','bad',7000);
    return;
  }
  var st=eventState(ev,p);
  if(!st.can){toast(st.label,'bad');return;}
  var id=uid();
  var entry={id:id,eventId:ev.id,eventTitle:ev.title,kind:ev.kind,
    at:nowISO(),status:'pending',note:payload.note||'',
    text:payload.text||'',count:payload.count||null,thumb:payload.thumb||'',
    hasPhoto:!!payload.photo,round:st.round.key};
  var auto=(ev.kind==='goal'&&!goalCfg(ev).approval);
  if(auto){
    var bo=withBoost(goalCfg(ev).perEntry,p,'event');
    entry.status='rated';entry.points=bo.points;entry.boost=bo.boost;
    entry.ratingLabel='Counted';entry.ratedAt=nowISO();
  }
  function finish(){
    if(takeTicket(ev,p,st.mine))entry.ticket=true;
    p.entries=entriesOf(p).concat([entry]);
    save();
    snapshot('after '+p.name+' sent in '+ev.title);
    closeModal();
    if(auto){
      toast('Added '+pts(num(entry.count,0))+' to the group total.','good',6000);
      settleGoals();
    }else toast('Sent in. Your instructor will take a look.','good',6000);
    render();
  }
  if(payload.photo)putPhoto(id,payload.photo).then(finish,finish);
  else finish();
}

function entryModal(ev){
  var kind=EVENT_KINDS[ev.kind]||EVENT_KINDS.checkin;
  var photo=null,thumb='';
  function body(){
    return '<h3>'+esc(ev.title)+'</h3>'+
      (ev.brief?'<p class="lede">'+esc(ev.brief)+'</p>':'')+
      (ev.kind==='photo'
        ? '<div class="shotbox stack" id="shotbox">'+
            (thumb?'<img src="'+thumb+'" alt="">':
              '<div class="shotempty">'+ico('camera')+'<span>No picture yet</span></div>')+
          '</div>'+
          '<div class="row" style="justify-content:center"><button class="btn btn-primary" id="shot">'+
          ico('camera')+(thumb?'Take another':'Take a picture')+'</button></div>'
        :'')+
      (ev.kind==='text'
        ? '<label class="field stack"><span>Your writing</span>'+
          '<textarea id="e-text" data-focus placeholder="Type it here"></textarea></label>'
        :'')+
      (ev.kind==='count'||ev.kind==='goal'
        ? '<label class="field stack"><span>'+esc(ev.unit||'How many')+'</span>'+
          '<input class="inp" id="e-count" data-focus type="number" min="0" step="1"></label>'
        :'')+
      '<label class="field"><span>Anything to say about it — optional</span>'+
      '<input class="inp" id="e-note" maxlength="140"></label>'+
      eventTownHTML(ev,4)+
      '<div class="err" id="e-err"></div>'+
      (ev.kind==='goal'
        ? '<p class="tiny muted">'+(goalCfg(ev).approval?'It joins the group total once your instructor approves it.':'It joins the group total straight away.')+'</p>'
        : '<p class="tiny muted">Your instructor decides the points once they have looked at it.</p>')+
      '<div class="foot"><button class="btn" data-close>Cancel</button>'+
      '<button class="btn btn-primary" id="e-send">Send it in</button></div>';
  }
  function mount(scrim){
    var shot=scrim.querySelector('#shot');
    if(shot)shot.addEventListener('click',function(){
      var inp=document.createElement('input');
      inp.type='file';inp.accept='image/*';inp.capture='environment';
      inp.addEventListener('change',function(){
        var f=inp.files&&inp.files[0];
        if(!f)return;
        var send=scrim.querySelector('#e-send');
        scrim.querySelector('#e-err').textContent='Shrinking the picture…';
        if(send)send.disabled=true;
        /* The thumbnail comes from the shrunk copy, not a second read of the
           original, so the two can never be half-done when Send is pressed. */
        shrink(f,PHOTO_MAX,PHOTO_Q).then(function(full){
          return shrinkSrc(full,THUMB_MAX,THUMB_Q).then(function(t){
            photo=full;thumb=t;
          });
        }).then(function(){
          redrawModal(body(),mount);
        }).catch(function(err){
          if(send)send.disabled=false;
          scrim.querySelector('#e-err').textContent='Sorry — '+err.message+'.';
        });
      });
      inp.click();
    });
    scrim.querySelector('#e-send').addEventListener('click',function(){
      var err=scrim.querySelector('#e-err');
      var note=scrim.querySelector('#e-note').value.trim();
      if(ev.kind==='photo'&&(!photo||!thumb)){err.textContent='Take a picture first.';return;}
      var text='',count=null;
      if(ev.kind==='text'){
        text=scrim.querySelector('#e-text').value.trim();
        if(text.length<4){err.textContent='Write a little more first.';return;}
      }
      if(ev.kind==='count'||ev.kind==='goal'){
        count=num(scrim.querySelector('#e-count').value,null);
        if(count===null||count<0){err.textContent='Put a number in.';return;}
      }
      submitEntry(ev,{photo:photo,thumb:thumb,text:text,count:count,note:note});
    });
  }
  openModal(body(),mount,{dismissable:false});
}

/* ---------- reader view ---------- */
function viewEvents(){
  var p=me();
  settleGoals();
  var list=eventList().filter(function(ev){
    if(S.admin)return true;
    if(ev.hidden)return false;
    if(!assignedTo(ev,p))return false;
    if(ev.hideWhenClosed&&!eventOpen(ev).open)return false;
    return true;
  });
  var h='<div class="pagehead"><div><h2>Events</h2>'+
    '<div class="sub">Make something, send it in, see what it earns</div></div>'+
    '<div class="row"><div class="stat" style="min-width:120px"><div class="k">Points to spend</div>'+
    '<div class="v" style="color:var(--gold-hi)">'+pts(balance(p))+'</div></div></div></div>';

  if(S.admin){
    var waiting=0;
    S.profiles.forEach(function(pp){waiting+=totalPending(pp);});
    h+='<div class="row stack">'+
      '<button class="btn btn-primary" data-act="ev-new">'+ico('plus')+'Add an event</button>'+
      '<button class="btn" data-go="reviews">'+ico('camera')+'Review'+(waiting?' ('+waiting+')':'')+'</button>'+
      '</div>';
  }

  var sentHTML='';
  var mine=entriesOf(p);
  if(mine.length){
    var h0=h;h='';
    var recent=mine.slice().sort(function(a,b){return a.at<b.at?1:-1;}).slice(0,4);
    h+='<div class="panel stack"><h3 style="font-size:1rem">What you have sent in</h3><div class="stack">';
    recent.forEach(function(e){
      h+='<div class="receipt">'+
        (e.thumb?'<img class="entrythumb" src="'+e.thumb+'" alt="">':
          '<span class="ic" style="background:var(--surf-2)">'+ico(EVENT_KINDS[e.kind]?'file':'file')+'</span>')+
        '<div style="flex:1;min-width:0"><div class="tiny">'+esc(e.eventTitle+(e.stepLabel?' — '+e.stepLabel:''))+'</div>'+
        '<div class="tiny muted">'+sinceWords(e.at)+
          (e.status==='rated'?' &nbsp;·&nbsp; '+esc(e.ratingLabel||'rated')+', '+pts(e.points)+' points':'')+
          (e.status==='declined'?' &nbsp;·&nbsp; sent back':'')+
        '</div></div>'+
        '<span class="pill '+(e.status==='rated'?'good':(e.status==='declined'?'cold':'warm'))+'">'+
          (e.status==='rated'?'rated':(e.status==='declined'?'sent back':'waiting'))+'</span>'+
        '</div>';
    });
    h+='</div></div>';
    sentHTML=h.replace('<div class="panel stack">','<div class="panel stack-lg evsent">');h=h0;
  }

  if(!list.length){
    return h+'<div class="empty stack">'+emptyPip('wait')+
      '<h3>'+(S.admin?'No events yet':'Nothing on just now')+'</h3>'+
      '<p class="muted">'+(S.admin
        ? 'Set something to make, write or do, and decide what each rating is worth.'
        : 'Check back — your instructor puts things here now and then.')+'</p>'+
      (S.admin?'<div class="stack"><button class="btn btn-primary" data-act="ev-new">'+
        ico('plus')+'Add an event</button></div>':'')+'</div>'+sentHTML;
  }

  var now=new Date();
  function ended(ev){
    if(ev.repeat&&ev.repeat.mode&&ev.repeat.mode!=='none')return false;
    if(ev.kind==='goal'){var tg=townGoal(ev,now);if(tg.on&&tg.ended)return true;}
    var op=eventOpen(ev,now);
    return !op.open&&!!(op.av&&(op.av.done||op.av.label==='Finished'));
  }
  function rank(ev){
    var st=eventState(ev,p);
    if(ev.pinned)return 0;
    if(isCommunityEvent(ev)&&st.window.open)return 1;
    if(st.claim||st.needJoin)return 2;
    if(st.can)return 3;
    if(st.window.open)return 4;
    return 5;
  }
  var live=[],done=[];
  list.forEach(function(ev){(ended(ev)?done:live).push(ev);});
  live.sort(function(a,b){return (rank(a)-rank(b))||String(b.created||'').localeCompare(String(a.created||''));});
  done.sort(function(a,b){return String(b.created||'').localeCompare(String(a.created||''));});
  h+='<div class="evlist stack">';
  live.forEach(function(ev){h+=eventCardHTML(ev,p);});
  if(!live.length)h+='<p class="tiny muted">Nothing open just now.</p>';
  h+='</div>';
  if(done.length){
    h+='<details class="evended stack"><summary>Ended events <span class="pill cold">'+done.length+'</span></summary><div class="evlist stack">';
    done.forEach(function(ev){h+=eventCardHTML(ev,p);});
    h+='</div></details>';
  }
  return h+sentHTML;
}

/* ---------- instructor review ---------- */
function allEntries(){
  var rows=[];
  S.profiles.forEach(function(p){
    entriesOf(p).forEach(function(e){rows.push({p:p,e:e});});
  });
  rows.sort(function(a,b){
    if((a.e.status==='pending')!==(b.e.status==='pending'))return a.e.status==='pending'?-1:1;
    return a.e.at<b.e.at?1:-1;
  });
  return rows;
}
function findEntry(id){
  for(var i=0;i<S.profiles.length;i++){

  });
  return h+'</div>';
}
function rateEntry(id,ratingId){
  var f=findEntry(id);if(!f)return;
  var ev=eventById(f.e.eventId);
  var rubric=(ev&&ev.rubric)||DEFAULT_RUBRIC;
  var rb=null;
  rubric.forEach(function(x){if(x.id===ratingId)rb=x;});
  if(!rb)return;
  var boosted=withBoost(num(rb.points,0),f.p,'event');
  f.e.status='rated';f.e.ratingId=rb.id;f.e.ratingLabel=rb.label;
  f.e.points=boosted.points;f.e.boost=boosted.boost;f.e.ratedAt=nowISO();
  save();
  if(ev){grantBonus(ev,f.p,'event');grantGift(ev,f.p);}
  toast(f.p.name+' earned '+pts(f.e.points)+' for '+f.e.eventTitle+'.','good',6000);
  render();
}
function eventPoints(p){
  return Math.round(entriesOf(p).reduce(function(s,e){
    return s+(e.status==='rated'?(num(e.points,0)):0);
  },0)*10)/10;
}

  function grab(scrim){

      if(d.avail.mode==='window'&&dnum(d.avail.end)<dnum(d.avail.start)){
        err.textContent='The end date is before the start date.';return;}
      if(d.avail.mode==='season'&&!d.avail.start){

      if(d.assign.mode==='some'&&!(d.assign.ids||[]).length){
        err.textContent='Pick at least one reader, or make it for everyone.';return;}
      var i=-1,l=eventList();
      for(var k=0;k<l.length;k++)if(l[k].id===d.id)i=k;
      if(i>=0)S.events[i]=d;else S.events.push(d);
      save();closeModal();
      toast(opts.dup?'"'+d.title+'" added, hidden for now.':(existing?'Event saved.':'"'+d.title+'" added.'),'good');
      go('events');
    });
  }
  openModal(body(),mount,{dismissable:false});
}

/* =========================================================
   Pip's room.

   Everything else in PipHub is a balance, and a balance goes
   down when it is used. This is the opposite: a place that
   only ever fills up. Nothing here is stored specially —
   the shelf, the frames and the plinth are all read back
   out of records that already exist.
   ========================================================= */

var ROOM_WALLS={
  dusk:   {name:'Dusk',   a:'#2A3560', b:'#151B2E', floor:'#3A2E4C', rail:'#4A3F66'},
  meadow: {name:'Meadow', a:'#2F5A46', b:'#16281F', floor:'#3E3326', rail:'#55452F'},
  ember:  {name:'Ember',  a:'#5A3326', b:'#231414', floor:'#442A1E', rail:'#5E3B28'},
  sea:    {name:'Sea',    a:'#1E4A66', b:'#0E2030', floor:'#27384A', rail:'#36506A'},
  plum:   {name:'Plum',   a:'#452A5E', b:'#1C1229', floor:'#3B2A48', rail:'#523A66'},
  sand:   {name:'Sand',   a:'#6A5436', b:'#2B2118', floor:'#54422C', rail:'#6E5738'}
};
function roomOf(p){
  p=p||me();
  var r=(p&&p.room)||{};
  return{wall:ROOM_WALLS[r.wall]?r.wall:'dusk'};
}

/* ---------- what the room is made of ---------- */
function finishedTitles(p){
  p=p||me();
  var out=[];
  S.modules.forEach(function(m){
    var chapters=(m.chapters||[]).length;
    var total=chapters+(hasBookTest(m)?1:0);
    if(!total)return;
    var done=0;
    (m.chapters||[]).forEach(function(ch){
      if((p.records||[]).some(function(r){return r.moduleId===m.id&&r.chapterId===ch.id&&r.passed;}))done++;
    });
    if(hasBookTest(m)&&(p.records||[]).some(function(r){
      return r.moduleId===m.id&&!r.chapterId&&r.passed;}))done++;
    if(done===total)out.push(m);
  });
  /* A title removed from the shelf is still a book they finished. */
  var seen={};
  out.forEach(function(m){seen[m.id]=1;});
  (p.records||[]).filter(function(r){return r.passed&&!r.chapterId&&!seen[r.moduleId];})
    .forEach(function(r){
      if(seen[r.moduleId])return;
      if(byId(r.moduleId))return;
      seen[r.moduleId]=1;
      out.push({id:r.moduleId,title:r.title,author:r.author||'',gone:true});
    });
  return out;
}
function lifetimeEarned(p){
  p=p||me();
  var plus=adjustmentsOf(p).reduce(function(s,a){
    return s+(num(a.points,0)>0?num(a.points,0):0);
  },0);
  return Math.round((earnedTotal(p.records)+activityPoints(p)+eventPoints(p)+
    streakTotal(p)+paybackTotal(p)+petPoints(p)+plus)*10)/10;
}
/* The longest run of days on which anything at all was earned. Works
   whether or not a streak rule has ever been set up. */
function bestRunEver(p){
  p=p||me();
  var days={};
  function mark(iso){
    var t=new Date(iso);
    if(isNaN(t.getTime()))return;
    days[t.getFullYear()+'-'+t.getMonth()+'-'+t.getDate()]=
      new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime();
  }
  (p.records||[]).forEach(function(r){if(r.passed)mark(r.date);});
  logOf(p).forEach(function(r){if(r.approved)mark(r.date);});
  entriesOf(p).forEach(function(e){if(e.status==='rated')mark(e.at);});
  var stamps=Object.keys(days).map(function(k){return days[k];}).sort(function(a,b){return a-b;});
  var best=0,run=0,prev=null;
  stamps.forEach(function(t){
    if(prev!==null&&Math.round((t-prev)/86400000)===1)run++;else run=1;
    if(run>best)best=run;
    prev=t;
  });
  return best;
}
function bestRating(p){
  p=p||me();
  var top=null;
  entriesOf(p).forEach(function(e){
    if(e.status!=='rated')return;
    if(!top||num(e.points,0)>num(top.points,0))top=e;
  });
  return top;
}
function trophyEntries(p){
  p=p||me();
  /* Anything rated at the top of its event's rubric earns a place. */
  return entriesOf(p).filter(function(e){
    if(e.status!=='rated')return false;
    if(e.stepId||e.goalReward||e.kind==='goal')return false;
    var ev=eventById(e.eventId);
    var rubric=(ev&&ev.rubric)||DEFAULT_RUBRIC;
    var best=rubric.reduce(function(m,r){return Math.max(m,num(r.points,0));},0);
    return best>0&&num(e.points,0)>=best;
  });
}
function framedEntries(p){
  p=p||me();
  return entriesOf(p).filter(function(e){return e.status==='rated'&&e.thumb;})
    .sort(function(a,b){return num(b.points,0)-num(a.points,0);}).slice(0,3);
}

/* ---------- the scene ---------- */
function spineColour(seed){
  var hues=['#C4453A','#2F7A4E','#2B5EA8','#8A5A05','#6B3FD4','#B8442F','#2E7D7D','#8E2F6B'];
  return hues[Math.abs(fingerprint(seed).charCodeAt(0)+fingerprint(seed).length)%hues.length];
}
function viewRoom(){
  var p=me();
  if(!p)return viewGate();
  var wall=roomOf(p).wall,W=ROOM_WALLS[wall];
  var books=finishedTitles(p);
  var trophies=trophyEntries(p);
  var frames=framedEntries(p);
  var run=bestRunEver(p);
  var top=bestRating(p);

  var h='<button class="btn btn-sm btn-ghost" data-go="profile">Back to your profile</button>'+
    '<div class="pagehead stack"><div><h2>Pip&rsquo;s room</h2>'+
    '<div class="sub">Everything you have finished, kept'+
    (aliveCfg().tod?' &nbsp;·&nbsp; '+TOD[roomTod()].name:'')+
    (currentWeather()?' &nbsp;·&nbsp; '+WEATHER[currentWeather()].name:'')+'</div></div></div>';

  var shelf='';
  var shown=books.slice(0,16);
  shown.forEach(function(m){
    var hgt=74+(fingerprint(m.id).charCodeAt(0)%5)*6;
    var wid=9+(fingerprint(m.title).charCodeAt(1)%4)*3;
    shelf+='<span class="spine" style="height:'+hgt+'%;width:'+wid+'px;background:'+
      spineColour(m.id)+'" title="'+esc(m.title)+(m.author?' — '+esc(m.author):'')+'">'+
      '<i></i></span>';
  });
  if(books.length>shown.length)
    shelf+='<span class="spinemore">+'+(books.length-shown.length)+'</span>';

/* =========================================================
   Pip's pantry.

   Food is bought with points in Pip's room and fed to Pip for a
   short-lived power: a point boost, a store discount or extra wish
   payback, for so many minutes or hours. Only one food works at a
   time — a second one waits until the first has worn off — and the
   instructor decides how often each can be bought and eaten.
   ========================================================= */
var FOOD_UNITS={min:'minutes',hr:'hours'};
function foodList(){return Array.isArray(S.foods)?S.foods:[];}
function foodById(id){
  var l=foodList();
  for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];
  return null;
}
function foodCfg(){
  var f=S.settings.food||{};
  return{
    on:f.on!==false,
    gap:Math.max(0,num(f.gap,30)),          /* minutes between any two feeds */
    perDay:Math.max(0,num(f.perDay,3)),     /* 0 = no daily limit */
    hold:Math.max(1,num(f.hold,5))          /* default pantry cap per food */
  };
}
function foodMinutes(f){
  var b=(f&&f.benefit)||{};
  var n=Math.max(1,num(b.dur,30));
  return b.unit==='hr'?n*60:n;
}
function durWords(min){
  min=Math.round(min);
  if(min<60)return min+' min';
  var h=Math.floor(min/60),m=min%60;
  return h+(h===1?' hour':' hours')+(m?' '+m+' min':'');
}
function foodBenefitText(f){
  var b=(f&&f.benefit)||{};
  if(!PIP_ABILITIES[b.kind]||!(num(b.value,0)>0))return 'A treat, no power';
  var s=b.season&&PIP_SEASONS[b.season];
  return PIP_POWER_SHORT[b.kind](num(b.value,0))+' for '+durWords(foodMinutes(f))+
    (s?' · '+s.name+' only':'');
}
function foodSeasonOpen(f){
  var b=(f&&f.benefit)||{};
  if(!b.season)return true;
  var w=pipSeasonWindow(b.season);
  return !!(w&&w.open);
}
function pantryOf(p){p=p||me();if(!p)return{};if(!p.pantry)p.pantry={};return p.pantry;}
function feedsOf(p){p=p||me();return (p&&Array.isArray(p.feeds))?p.feeds:[];}
function foodBuysOf(p,id){
  return purchasesOf(p).filter(function(r){return r.food&&r.foodId===id;})
    .sort(function(a,b){return a.date<b.date?1:-1;});
}
/* The one food power working right now, if any. */
function foodPower(p){
  p=p||me();
  if(!p)return null;
  var now=Date.now(),best=null;
  feedsOf(p).forEach(function(r){
    var until=new Date(r.until).getTime();
    if(until>now&&(!best||until>new Date(best.until).getTime()))best=r;
  });
  if(!best)return null;
  var out={kind:best.kind,value:num(best.value,0),until:best.until,name:best.name,
    foodId:best.foodId,season:best.season||'',asleep:false};
  if(out.season){
    var w=pipSeasonWindow(out.season);
    if(!(w&&w.open))out.asleep=true;          /* eaten, but its season has closed */
  }
  if(!PIP_ABILITIES[out.kind]||!(out.value>0))out.asleep=true;
  return out;
}
function foodPrice(f){
  var base=Math.max(0,num(f.cost,0));
  var wear=powerTotal('discount',null,'food');
  var pct=Math.min(90,wear);
  return{base:base,now:pct?Math.round(base*(100-pct)/10)/10:base,pct:pct};
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
}
function startOfWeek(d){
  var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  return x;
}
/* May this reader buy it right now. */
function foodBuyState(f,p){
  p=p||me();
  var cfg=foodCfg();
  if(!cfg.on)return{can:false,label:'The pantry is closed',tone:'cold'};
  if(f.hidden)return{can:false,label:'Hidden',tone:'cold',shut:true};
  if(f.winOnly)return{can:false,label:'Win only',tone:'warm',shut:true};
  if(f.benefit&&f.benefit.season&&!foodSeasonOpen(f)){
    var s=PIP_SEASONS[f.benefit.season];
    return{can:false,label:'Back for '+(s?s.name:'its season'),tone:'cold',shut:true};
  }
  var av=availability(f);
  if(!av.open)return{can:false,label:av.label||'Not available',tone:'cold',shut:true};
  var mine=foodBuysOf(p,f.id);
  var r=f.buy||{mode:'unlimited'};
  var now=new Date();
  var lim=Math.max(1,num(r.limit,1));
  if(r.mode==='once'&&mine.length)return{can:false,label:'Already bought',tone:'good'};
  if(r.mode==='limit'&&mine.length>=lim)return{can:false,label:'Limit of '+lim+' reached',tone:'good'};
  if(r.mode==='daily'){
    var today=mine.filter(function(x){return sameDay(new Date(x.date),now);}).length;
    if(today>=lim)return{can:false,label:'Again tomorrow',tone:'cold'};
  }
  if(r.mode==='weekly'){
    var wk=startOfWeek(now).getTime();
    var week=mine.filter(function(x){return new Date(x.date).getTime()>=wk;}).length;
    if(week>=lim)return{can:false,label:'Again next week',tone:'cold'};
  }
  if(r.mode==='cooldown'&&mine.length){
    var ready=new Date(mine[0].date).getTime()+Math.max(1,num(r.hours,24))*3600000;
    if(now.getTime()<ready)return{can:false,label:'Again in '+durWords((ready-now.getTime())/60000),tone:'cold'};
  }
  var hold=Math.max(1,num(f.hold,cfg.hold));
  if((pantryOf(p)[f.id]||0)>=hold)return{can:false,label:'Pantry full ('+hold+')',tone:'cold'};
  var price=foodPrice(f).now;
  if(balance(p)<price)return{can:false,label:pts(price-balance(p))+' more points',tone:'cold',cost:true};
  return{can:true,label:av.label||'',tone:av.tone||'cold'};
}
/* May Pip eat it right now. */
function feedState(f,p){
  p=p||me();
  var cfg=foodCfg();
  if(!cfg.on)return{can:false,label:'Feeding is switched off'};
  if(!(pantryOf(p)[f.id]>0))return{can:false,label:'None left'};
  var now=Date.now();
  var fp=foodPower(p);
  if(fp&&new Date(fp.until).getTime()>now)
    return{can:false,label:'Still enjoying '+fp.name+' — '+durWords((new Date(fp.until).getTime()-now)/60000)+' left'};
  if(f.benefit&&f.benefit.season&&!foodSeasonOpen(f)){
    var s=PIP_SEASONS[f.benefit.season];
    return{can:false,label:'Only works during '+(s?s.name:'its season')};
  }
  var feeds=feedsOf(p).slice().sort(function(a,b){return a.at<b.at?1:-1;});
  if(feeds.length&&cfg.gap){
    var next=new Date(feeds[0].at).getTime()+cfg.gap*60000;
    if(now<next)return{can:false,label:'Hungry again in '+durWords((next-now)/60000)};
  }
  if(cfg.perDay){
    var today=feeds.filter(function(r){return sameDay(new Date(r.at),new Date());}).length;
    if(today>=cfg.perDay)return{can:false,label:'Full for today'};
  }
  var gapH=Math.max(0,num(f.useGap,0));
  if(gapH){
    var last=null;
    feeds.forEach(function(r){if(!last&&r.foodId===f.id)last=r;});
    if(last){
      var ok=new Date(last.at).getTime()+gapH*3600000;
      if(now<ok)return{can:false,label:f.name+' again in '+durWords((ok-now)/60000)};
    }
  }
  return{can:true,label:'Ready'};
}
function buyFood(id){
  var p=me(),f=foodById(id);
  if(!p||!f)return;
  var st=foodBuyState(f,p);
  if(!st.can){toast(st.label,'bad');return;}
  var pr=foodPrice(f);
  confirmModal('Buy '+f.name+'?',
    'It costs '+pts(pr.now)+' points'+(pr.pct?' ('+pr.pct+'% off)':'')+' and goes in Pip’s pantry. '+
    'Feeding it gives '+foodBenefitText(f)+'. Your balance is '+pts(balance(p))+'.','Buy',function(){
      var again=foodBuyState(f,p);
      if(!again.can){toast(again.label,'bad');return;}
      var paid=foodPrice(f);
      p.purchases=purchasesOf(p).concat([{
        id:uid(),itemId:'food:'+f.id,foodId:f.id,title:f.name,cost:paid.now,full:paid.base,
        discount:paid.pct,payback:0,cosmetic:true,food:true,date:nowISO(),given:true
      }]);
      var pan=pantryOf(p);
      pan[f.id]=(pan[f.id]||0)+1;
      save();
      toast(f.name+' is in the pantry.','good');
      render();
    });
}
function feedPip(id){
  var p=me(),f=foodById(id);
  if(!p||!f)return;
  var st=feedState(f,p);
  if(!st.can){toast(st.label,'bad');return;}
  var b=f.benefit||{};
  var mins=Math.round(foodMinutes(f)*(1+powerTotal('foodtime',p)/100));
  var rec={id:uid(),foodId:f.id,name:f.name,at:nowISO(),
    until:new Date(Date.now()+mins*60000).toISOString(),
    kind:PIP_ABILITIES[b.kind]?b.kind:'none',value:Math.max(0,num(b.value,0)),season:b.season||''};
  if(!Array.isArray(p.feeds))p.feeds=[];
  p.feeds.push(rec);
  if(p.feeds.length>60)p.feeds=p.feeds.slice(-60);
  var pan=pantryOf(p);
  pan[f.id]=Math.max(0,(pan[f.id]||0)-1);
  if(!pan[f.id])delete pan[f.id];
  save();
  render();
  feedMoment(f,rec);
}
function giveFood(p,id,n){
  var pan=pantryOf(p);
  pan[id]=(pan[id]||0)+(n||1);
}

/* ---------- the feeding animation ---------- */
function feedMoment(f,rec){
  var p=me();
  var still=reducedMotion();
  var old=document.getElementById('feedfx');
  if(old&&old.parentNode)old.parentNode.removeChild(old);
  var crumbs='',hearts='';
  if(!still){
    for(var i=0;i<10;i++)crumbs+='<i style="--a:'+(i*36)+'deg;--d:'+(i*25)+'ms"></i>';
    for(var j=0;j<5;j++)hearts+='<b style="--x:'+(-44+j*22)+'px;--d:'+(1150+j*140)+'ms">♥</b>';
  }
  var food=(f.icon&&f.icon.emoji)?'<span class="femo">'+esc(f.icon.emoji)+'</span>':renderIcon(f.icon);
  var el=document.createElement('div');
  el.id='feedfx';
  el.className='feedfx'+(still?' still':'');
  var power=rec.kind!=='none'&&rec.value>0;
  el.innerHTML=
    '<div class="fstage">'+
      '<div class="fscene">'+
        '<div class="fpip fa">'+pipSVG(pipLook(p),'idle',190)+'</div>'+
        '<div class="fpip fb">'+pipSVG(pipLook(p),'cheer',190)+'</div>'+
        '<div class="ffood">'+food+'</div>'+
        '<div class="fcrumbs">'+crumbs+'</div>'+
        '<div class="fhearts">'+hearts+'</div>'+
      '</div>'+
      '<div class="fwords">'+
        '<div class="mkicker">Yum</div>'+
        '<div class="mtitle">Pip ate '+esc(f.name)+'</div>'+
        (power?'<div class="mprize">'+esc(PIP_POWER_SHORT[rec.kind](rec.value))+' for '+
          esc(durWords(foodMinutes(f)))+'</div>':'<div class="mline">A happy, full Pip.</div>')+
      '</div>'+
      '<div class="mtap"><button type="button" class="btn btn-primary mdismiss">Yum, thanks!</button></div>'+
    '</div>';
  pageLock();
  document.body.appendChild(el);
  var done=false;
  function close(){
    if(done)return;done=true;
    if(el.parentNode)el.parentNode.removeChild(el);
    pageUnlock();
  }
  momentHold(el,close,0);
}
/* Countdowns on screen tick down without redrawing the page. */
setInterval(function(){
  var now=Date.now(),expired=false;
  $$('[data-until]').forEach(function(el){
    var left=new Date(el.dataset.until).getTime()-now;
    if(left<=0){expired=true;el.textContent='worn off';}
    else el.textContent=durWords(Math.ceil(left/60000))+' left';
  });
  if(expired&&S.view==='room'&&!document.querySelector('.scrim')&&!document.getElementById('feedfx'))render();
},30000);

/* ---------- the pantry panel in Pip's room ---------- */
function roomFoodHTML(p){
  var cfg=foodCfg();
  if(!cfg.on&&!S.admin)return '';
  var h='';
  var fp=foodPower(p);
  var pan=pantryOf(p);
  var list=foodList().filter(function(f){
    if(S.admin)return true;
    if(f.hidden)return false;
    if(f.hideWhenClosed&&(!availability(f).open||!foodSeasonOpen(f)))return false;
    return true;
  });

  h+='<div class="panel stack pantry"><div class="row" style="justify-content:space-between">'+
    '<h3 style="font-size:1rem">Pip’s pantry</h3>'+
    (S.admin?'<span class="row" style="gap:6px"><button class="btn btn-sm" data-act="food-rules">Feeding rules</button>'+
      '<button class="btn btn-sm btn-primary" data-act="food-new">'+ico('plus')+'Add food</button></span>':'')+
    '</div>';
  if(!cfg.on)h+='<p class="tiny" style="color:var(--fail)">Feeding is switched off for readers.</p>';

  if(fp){
    h+='<div class="fedbar'+(fp.asleep?' asleep':'')+'"><span class="fedic">'+
      foodIconHTML(foodById(fp.foodId))+'</span><div style="flex:1;min-width:0"><b>'+esc(fp.name)+'</b> '+
      (fp.asleep?'is resting until its season comes back'
        :'&nbsp;·&nbsp; '+esc(PIP_POWER_SHORT[fp.kind]?PIP_POWER_SHORT[fp.kind](fp.value):''))+
      '</div><span class="pill warm" data-until="'+esc(fp.until)+'">'+
      durWords(Math.ceil((new Date(fp.until).getTime()-Date.now())/60000))+' left</span></div>';
  }

  var owned=Object.keys(pan).filter(function(id){return pan[id]>0&&foodById(id);});
  h+='<div class="tiny muted stack" style="margin-bottom:6px">In the pantry</div>';
  if(!owned.length)h+='<p class="tiny muted">Nothing yet. Buy something below, or win it from an activity or event.</p>';
  else{
    h+='<div class="foodgrid">';
    owned.forEach(function(id){
      var f=foodById(id),st=feedState(f,p);
      h+='<div class="foodcard have">'+foodIconHTML(f)+
        '<div class="fn">'+esc(f.name)+' <span class="cnt">&times;'+pan[id]+'</span></div>'+
        '<div class="fb">'+esc(foodBenefitText(f))+'</div>'+
        (st.can?'<button class="btn btn-sm btn-primary" data-act="food-feed" data-id="'+esc(id)+'">Feed Pip</button>'
               :'<span class="pill cold">'+esc(st.label)+'</span>')+
        '</div>';
    });
    h+='</div>';
  }

  h+='<div class="tiny muted stack" style="margin:14px 0 6px">For sale</div>';
  if(!list.length)h+='<p class="tiny muted">'+(S.admin?'No foods yet. Add one.':'Nothing on the menu just now.')+'</p>';
  else{
    h+='<div class="foodgrid">';
    list.forEach(function(f){
      var st=foodBuyState(f,p),pr=foodPrice(f);
      if(!S.admin&&st.shut&&f.winOnly)return;
      h+='<div class="foodcard'+(st.can?' buyable':'')+(st.shut?' shut':'')+'">'+foodIconHTML(f)+
        '<div class="fn">'+esc(f.name)+'</div>'+
        (f.blurb?'<div class="fd">'+esc(f.blurb)+'</div>':'')+
        '<div class="fb">'+esc(foodBenefitText(f))+'</div>'+
        '<div class="fp">'+(pr.pct?'<s>'+pts(pr.base)+'</s> ':'')+pts(pr.now)+' <small>points</small></div>'+
        (st.can?'<button class="btn btn-sm btn-primary" data-act="food-buy" data-id="'+esc(f.id)+'">Buy</button>'
               :'<span class="pill '+(st.tone||'cold')+'">'+esc(st.label)+'</span>')+
        (S.admin?'<div class="adminrow">'+
          '<button class="btn btn-sm btn-ghost" data-act="food-edit" data-id="'+esc(f.id)+'">Edit</button>'+
          '<button class="btn btn-sm btn-ghost" data-act="food-hide" data-id="'+esc(f.id)+'">'+(f.hidden?'Show':'Hide')+'</button>'+
          '<button class="btn btn-sm btn-danger" data-act="food-del" data-id="'+esc(f.id)+'">Remove</button>'+
          '</div>':'')+
        '</div>';
    });
    h+='</div>';

    (cfg.gap?'Pip needs '+durWords(cfg.gap)+' between meals'+(cfg.perDay?', and eats at most '+cfg.perDay+' a day.':'.'):
      (cfg.perDay?'Pip eats at most '+cfg.perDay+' a day.':''))+'</p>';
  return h+'</div>';
}
function foodIconHTML(f){
  if(!f)return '<span class="ic"><span class="emo">🍽️</span></span>';

  function grab(scrim){
    var g=function(s){var el=scrim.querySelector(s);return el?el.value:null;};
    var cb=function(s){var el=scrim.querySelector(s);return el?el.checked:null;};
    if(g('#f-name')!==null)d.name=g('#f-name').trim();
    if(g('#f-blurb')!==null)d.blurb=g('#f-blurb').trim();
    if(g('#f-cost')!==null)d.cost=Math.max(0,num(g('#f-cost'),0));
    if(g('#f-val')!==null)d.benefit.value=Math.max(0,Math.min(100,num(g('#f-val'),1)));
    if(g('#f-dur')!==null)d.benefit.dur=Math.max(1,num(g('#f-dur'),30));
    if(g('#f-unit')!==null)d.benefit.unit=g('#f-unit');
    if(g('#f-season')!==null)d.benefit.season=g('#f-season');
    if(g('#f-lim')!==null)d.buy.limit=Math.max(1,num(g('#f-lim'),1));
    if(g('#f-hours')!==null)d.buy.hours=Math.max(1,num(g('#f-hours'),24));
    if(g('#f-hold')!==null)d.hold=Math.max(1,num(g('#f-hold'),5));
    if(g('#f-gap')!==null)d.useGap=Math.max(0,num(g('#f-gap'),0));
    if(g('#a-start')!==null)d.avail.start=g('#a-start');
    if(g('#a-end')!==null)d.avail.end=g('#a-end');
    if(g('#a-days')!==null)d.avail.days=Math.max(1,num(g('#a-days'),7));
    if(g('#a-every')!==null)d.avail.everyMonths=Math.max(1,num(g('#a-every'),12));
    if(cb('#f-hidden')!==null)d.hidden=cb('#f-hidden');
    if(cb('#f-win')!==null)d.winOnly=cb('#f-win');
    if(cb('#f-hideclosed')!==null)d.hideWhenClosed=cb('#f-hideclosed');
    if(g('#i-scale')!==null)d.icon.scale=Math.max(50,Math.min(180,num(g('#i-scale'),100)));
    if(g('#i-emoji')!==null){
      var em=g('#i-emoji').trim();
      if(em){d.icon.emoji=em;delete d.icon.image;}else delete d.icon.emoji;
    }
  }
  function redraw(){redrawModal(body(),mount);}
  function mount(scrim){
    scrim.addEventListener('click',function(e){
      var s=e.target.closest('[data-seg]');
      var ic=e.target.closest('[data-emoji],[data-glyph],[data-icbg],[data-icfg]');
      if(!s&&!ic)return;
      grab(scrim);
      if(ic){if(iconEditorClick(e,d.icon))redraw();return;}
      if(s.dataset.seg==='kind')d.benefit.kind=s.dataset.v;
      else if(s.dataset.seg==='buy')d.buy.mode=s.dataset.v;
      else if(s.dataset.seg==='av')d.avail.mode=s.dataset.v;
      redraw();
    });
    var pic=scrim.querySelector('#i-pic');
    if(pic)pic.addEventListener('click',function(){
      grab(scrim);closeModal();
      avatarPicker(function(uri){d.icon.image=uri;openModal(body(),mount,{dismissable:false});});
    });
    var nopic=scrim.querySelector('#i-nopic');
    if(nopic)nopic.addEventListener('click',function(){
      grab(scrim);delete d.icon.image;delete d.icon.emoji;redraw();
    });
    var sc=scrim.querySelector('#i-scale');
    if(sc){
      var out=scrim.querySelector('#i-scale-v'),tile=scrim.querySelector('.ic');
      sc.addEventListener('input',function(){
        d.icon.scale=num(sc.value,100);
        if(out)out.textContent=d.icon.scale+'%';
        if(tile)tile.style.setProperty('--is',Math.max(0.5,Math.min(1.8,d.icon.scale/100)));
      });
    }
    scrim.querySelector('#f-save').addEventListener('click',function(){
      grab(scrim);
      var err=scrim.querySelector('#f-err');
      if(!d.name){err.textContent='Give it a name.';return;}
      if(PIP_ABILITIES[d.benefit.kind]&&!(d.benefit.value>0)){err.textContent='Set how strong the power is.';return;}
      if(d.avail.mode==='window'&&(!d.avail.start||!d.avail.end)){err.textContent='A date window needs both dates.';return;}
      if(d.avail.mode==='window'&&dnum(d.avail.end)<dnum(d.avail.start)){err.textContent='The end date is before the start date.';return;}
      if(d.avail.mode==='season'&&!d.avail.start){err.textContent='A cycle needs a first date.';return;}
      if(!Array.isArray(S.foods))S.foods=[];
      var i=-1;
      for(var k=0;k<S.foods.length;k++)if(S.foods[k].id===d.id)i=k;
      if(i>=0)S.foods[i]=d;else S.foods.push(d);
      save();closeModal();
      toast(existing?'Food saved.':'"'+d.name+'" is on the menu.','good');
      render();
    });
  }
  openModal(body(),mount,{dismissable:false});
}

/* =========================================================
   Pips on display.

   Complete looks a reader owns but is not wearing stand about
   the room as figurines. Tap one to put it on.
   ========================================================= */
function lookPreview(l){
  var pv={};
  l.grants.forEach(function(g){var pt=pipPart(g);if(pt)pv[pt.slot]=pt.v;});
  return pv;
}
function displayLooks(p){
  p=p||me();
  if(!p)return [];
  return PIP_LOOKS.filter(function(l){
    return l.grants.every(function(g){return ownsPip(g,p);})&&!(p.face==='pip'&&wearingLook(l,p));
  });
}
function wearLook(id){
  var p=me(),l=pipLookById(id);
  if(!p||!l)return;
  if(!l.grants.every(function(g){return ownsPip(g,p);})){toast('Not unlocked yet.','bad');return;}
  p.pipLook={body:'sun',eyes:'dot'};
  l.grants.forEach(function(g){var pt=pipPart(g);if(pt)p.pipLook[pt.slot]=pt.v;});
  p.face='pip';
  save();
  toast('Pip is wearing '+l.name+'.','good');
  render();
}

/* ---------- time of day ---------- */
var TOD={
  morning:{name:'Morning',pose:'wait'},
  day:{name:'Day',pose:'read'},
  evening:{name:'Evening',pose:'idle'},
  night:{name:'Night',pose:'sleep'}
};
function timeOfDay(now){
  now=now||new Date();
  var h=now.getHours();
  if(h>=6&&h<11)return 'morning';
  if(h>=11&&h<17)return 'day';
  if(h>=17&&h<20)return 'evening';
  return 'night';
}

var WEATHER_ORDER=['moonfest','halloween','harvestfair','winter','autumn','spring','summer'];
var SEASON_WEATHER_BUILTIN=JSON.parse(JSON.stringify(SEASON_WEATHER));
var WEATHER_ORDER_BUILTIN=WEATHER_ORDER.slice();
function currentWeather(now){
  var c=aliveCfg();
  if(c.force==='off')return '';
  if(c.force&&WEATHER[c.force])return c.force;
  if(!c.weather)return '';
  for(var i=0;i<WEATHER_ORDER.length;i++){
    var k=WEATHER_ORDER[i];
    if(!PIP_SEASONS[k])continue;
    var w=pipSeasonWindow(k,now);
    if(w&&w.open)return SEASON_WEATHER[k];
  }
  return '';
}
function weatherParticles(kind,n,big){
  if(!kind||!WEATHER[kind])return '';
  var out='';
  for(var i=0;i<n;i++){
    var x=Math.round(hashUnit(kind+'x'+i)*100);
    var d=(hashUnit(kind+'d'+i)*-9).toFixed(1);
    var t=(6+hashUnit(kind+'t'+i)*6).toFixed(1);
    var s=(0.6+hashUnit(kind+'s'+i)*0.7).toFixed(2);
    var inner=(kind==='snow'||kind==='rain')?'':WEATHER[kind].glyph;
    out+='<i class="wp" style="left:'+x+'%;animation-delay:'+d+'s;animation-duration:'+t+'s;--ws:'+s+(big?'':';font-size:.72rem')+'">'+inner+'</i>';
  }
  return out;
}
/* The faint layer across the top of the app. */
function mountSky(){
  var el=document.getElementById('skyfx');
  var kind=(S.view==='gate'||S.view==='quiz')?'':currentWeather();
  if(!kind||reducedMotion()){
    if(el)el.parentNode.removeChild(el);
    return;
  }
  if(el&&el.dataset.kind===kind)return;
  if(!el){
    el=document.createElement('div');
    el.id='skyfx';
    el.setAttribute('aria-hidden','true');
    document.body.appendChild(el);
  }
  el.dataset.kind=kind;
  el.className='skyfx wx-'+kind;
  el.innerHTML=weatherParticles(kind,14,false);
}

var PET_TRAITS={
  ghostling:{trait:'sleepy',name:'Sleepy',verb:'drifted off and floated back with'},
  jaderabbit:{trait:'curious',name:'Curious',verb:'rummaged by the shelf and found'},
  carouselpony:{trait:'proud',name:'Proud',verb:'pranced a lap of the room and came back with'},
