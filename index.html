      '<input class="inp" id="e-note" maxlength="140"></label>'+
      '<div class="err" id="e-err"></div>'+
      '<p class="tiny muted">Your instructor decides the points once they have looked at it.</p>'+
      '<div class="foot"><button class="btn" data-close>Cancel</button>'+
      '<button class="btn btn-primary" id="e-send">Send it in</button></div>';
  }
  function mount(scrim){
    var shot=scrim.querySelector('#shot');
    if(shot)shot.addEventListener('click',function(){
      var inp=document.createElement('input');
      inp.type='file';inp.accept='image/*';inp.capture='environment';
      inp.addEventListener('change',function(){
        var f=inp.files&&inp.files[0];
        if(!f)return;
        var send=scrim.querySelector('#e-send');
        scrim.querySelector('#e-err').textContent='Shrinking the picture…';
        if(send)send.disabled=true;
        /* The thumbnail comes from the shrunk copy, not a second read of the
           original, so the two can never be half-done when Send is pressed. */
        shrink(f,PHOTO_MAX,PHOTO_Q).then(function(full){
          return shrinkSrc(full,THUMB_MAX,THUMB_Q).then(function(t){
            photo=full;thumb=t;
          });
        }).then(function(){
          redrawModal(body(),mount);
        }).catch(function(err){
          if(send)send.disabled=false;
          scrim.querySelector('#e-err').textContent='Sorry — '+err.message+'.';
        });
      });
      inp.click();
    });
    scrim.querySelector('#e-send').addEventListener('click',function(){
      var err=scrim.querySelector('#e-err');
      var note=scrim.querySelector('#e-note').value.trim();
      if(ev.kind==='photo'&&(!photo||!thumb)){err.textContent='Take a picture first.';return;}
      var text='',count=null;
      if(ev.kind==='text'){
        text=scrim.querySelector('#e-text').value.trim();
        if(text.length<4){err.textContent='Write a little more first.';return;}
      }
      if(ev.kind==='count'){
        count=num(scrim.querySelector('#e-count').value,null);
        if(count===null||count<0){err.textContent='Put a number in.';return;}
      }
      submitEntry(ev,{photo:photo,thumb:thumb,text:text,count:count,note:note});
    });
  }
  openModal(body(),mount,{dismissable:false});
}

        '</span></span>':'')+

/* ---------- instructor review ---------- */
function allEntries(){
  var rows=[];
  S.profiles.forEach(function(p){
    entriesOf(p).forEach(function(e){rows.push({p:p,e:e});});
  });
  rows.sort(function(a,b){
    if((a.e.status==='pending')!==(b.e.status==='pending'))return a.e.status==='pending'?-1:1;
    return a.e.at<b.e.at?1:-1;
  });
  return rows;
}
function findEntry(id){
  for(var i=0;i<S.profiles.length;i++){
    var l=entriesOf(S.profiles[i]);
    for(var j=0;j<l.length;j++)if(l[j].id===id)return{p:S.profiles[i],e:l[j],i:j};
  }
  return null;
}
function viewReviews(){
  var rows=allEntries();
  var waiting=rows.filter(function(r){return r.e.status==='pending';});
  var h='<div class="pagehead"><div><h2>Review</h2>'+
    '<div class="sub">What readers have sent in</div></div>'+
    '<button class="btn btn-sm" data-go="events">Back to events</button></div>'+adminBar();
  if(!rows.length){
    return h+'<div class="empty"><h3>Nothing sent in yet</h3>'+
      '<p class="muted">Submissions land here for you to look at and rate.</p></div>';
  }
  h+='<div class="stats"><div class="stat gold"><div class="k">Waiting on you</div>'+
    '<div class="v">'+waiting.length+'</div></div>'+
    '<div class="stat"><div class="k">Sent in all told</div><div class="v">'+rows.length+'</div></div>'+
    '<div class="stat"><div class="k">Points awarded</div><div class="v">'+
      pts(rows.reduce(function(s,r){return s+(r.e.status==='rated'?num(r.e.points,0):0);},0))+
    '</div></div></div>';

  h+='<div class="reviews stack">';
  rows.slice(0,30).forEach(function(r){
    var ev=eventById(r.e.eventId);
    var rubric=(ev&&ev.rubric)||DEFAULT_RUBRIC;
    h+='<div class="revcard">'+
      '<div class="revtop">'+
        (r.e.thumb?'<button class="revshot" data-act="ev-photo" data-id="'+esc(r.e.id)+'">'+
          '<img src="'+r.e.thumb+'" alt=""><span>see it full size</span></button>':'')+
        '<div style="flex:1;min-width:0">'+
          '<div class="tiny muted">'+esc(r.p.name)+' &nbsp;·&nbsp; '+esc(r.e.eventTitle)+
          ' &nbsp;·&nbsp; '+sinceWords(r.e.at)+'</div>'+
          (r.e.text?'<p class="revtext">'+esc(r.e.text)+'</p>':'')+
          (r.e.count!==null&&r.e.count!==undefined&&r.e.count!==''?
            '<p class="revtext"><b>'+esc(r.e.count)+'</b></p>':'')+
          (r.e.note?'<p class="tiny muted">"'+esc(r.e.note)+'"</p>':'')+
        '</div>'+
      '</div>'+
      (r.e.status==='pending'
        ? '<div class="revrate">'+rubric.map(function(rb){
            return '<button class="btn btn-sm btn-primary" data-act="ev-rate" data-id="'+esc(r.e.id)+
              '" data-r="'+esc(rb.id)+'">'+esc(rb.label)+' &nbsp;+'+pts(num(rb.points,0))+'</button>';
          }).join('')+
          '<button class="btn btn-sm btn-ghost" data-act="ev-back" data-id="'+esc(r.e.id)+
          '">Send back</button></div>'
        : '<div class="revrate"><span class="pill '+(r.e.status==='rated'?'good':'cold')+'">'+
          (r.e.status==='rated'?esc(r.e.ratingLabel||'rated')+' · '+pts(r.e.points)+' points':'sent back')+
          '</span>'+
          '<button class="btn btn-sm btn-ghost" data-act="ev-undo" data-id="'+esc(r.e.id)+'">Undo</button>'+
          '<button class="btn btn-sm btn-danger" data-act="ev-drop" data-id="'+esc(r.e.id)+'">Delete</button>'+
          '</div>')+
      '</div>';
  });
  return h+'</div>';
}
function rateEntry(id,ratingId){
  var f=findEntry(id);if(!f)return;
  var ev=eventById(f.e.eventId);
  var rubric=(ev&&ev.rubric)||DEFAULT_RUBRIC;
  var rb=null;
  rubric.forEach(function(x){if(x.id===ratingId)rb=x;});
  if(!rb)return;
  var boosted=withBoost(num(rb.points,0),f.p);
  f.e.status='rated';f.e.ratingId=rb.id;f.e.ratingLabel=rb.label;
  f.e.points=boosted.points;f.e.boost=boosted.boost;f.e.ratedAt=nowISO();
  save();
  if(ev)grantBonus(ev,f.p,'event');
  toast(f.p.name+' earned '+pts(f.e.points)+' for '+f.e.eventTitle+'.','good',6000);
  render();
}
function eventPoints(p){
  return Math.round(entriesOf(p).reduce(function(s,e){
    return s+(e.status==='rated'?(num(e.points,0)):0);
  },0)*10)/10;
}
function showEntryPhoto(id){
  getPhoto(id).then(function(data){
    var f=findEntry(id);
    if(!data){toast('The full picture is not on this device.','bad');return;}
    openModal('<h3>'+esc(f?f.e.eventTitle:'Picture')+'</h3>'+
      '<p class="lede">'+esc(f?f.p.name:'')+' &nbsp;·&nbsp; '+(f?sinceWords(f.e.at):'')+'</p>'+
      '<div class="fullshot stack"><img src="'+data+'" alt=""></div>'+
      '<div class="foot"><button class="btn" data-act="ev-save-photo" data-id="'+esc(id)+'">'+
      ico('down')+'Save the picture</button>'+
      '<button class="btn btn-primary" data-close>Close</button></div>');
  },function(){toast('That picture could not be opened.','bad');});
}

  function seg(field,opts,cur){

          'maxlength="48" value="'+esc(d.title)+'" placeholder="Draw your favourite character"></label>'+
        '</div>'+
      '</div>'+
      '<label class="field"><span>What to do</span>'+
      '<input class="inp" id="v-brief" maxlength="160" value="'+esc(d.brief)+'" '+
      'placeholder="Draw or make the character you liked best, then photograph it"></label>'+
      (d.kind==='count'?'<label class="field"><span>What is being counted</span>'+
        '<input class="inp" id="v-unit" maxlength="30" value="'+esc(d.unit||'')+'" '+
        'placeholder="Minutes read"></label>':'')+

      '<div class="divider"></div>'+iconEditorHTML(d.icon)+

      '<div class="divider"></div>'+
      '<h4 style="font-size:.95rem;color:var(--text-hi)">What each rating is worth</h4>'+
      '<p class="tiny muted" style="margin-top:4px">You pick one of these when you look at what came in.</p>'+
      '<div class="rubric stack" id="rubric">'+d.rubric.map(function(r,i){
        return '<div class="rubrow">'+
          '<input class="inp" data-rl="'+i+'" maxlength="28" value="'+esc(r.label)+'">'+
          '<input class="inp" data-rp="'+i+'" type="number" min="0" step="0.5" value="'+esc(r.points)+'">'+
          (d.rubric.length>1?'<button class="btn btn-sm btn-danger" type="button" data-rdel="'+i+
            '">&times;</button>':'')+
        '</div>';
      }).join('')+'</div>'+
      (d.rubric.length<6?'<button class="btn btn-sm" type="button" id="v-addr">'+ico('plus')+
        'Add a rating</button>':'')+

      '<div class="divider"></div>'+
      '<h4 style="font-size:.95rem;color:var(--text-hi)">How many times</h4>'+
      '<div class="stack">'+seg('ent',[['once','Once only'],['limit','A few times']],
        (d.entries&&d.entries.mode)||'limit')+'</div>'+
      ((d.entries&&d.entries.mode)!=='once'?'<div class="subfields">'+
        '<label class="field"><span>Most entries per reader</span>'+
        '<input class="inp" id="v-limit" type="number" min="1" max="20" value="'+
        esc((d.entries&&d.entries.limit)||3)+'"></label></div>':'')+

      '<div class="divider"></div>'+
      '<h4 style="font-size:.95rem;color:var(--text-hi)">When it runs</h4>'+
      '<div class="stack">'+seg('av',[['always','Always'],['window','Between two dates'],
        ['season','Returns on a cycle']],d.avail.mode)+'</div>'+
      (d.avail.mode==='window'?'<div class="subfields"><div class="row" style="gap:10px">'+
        '<label class="field" style="flex:1"><span>From</span>'+
        '<input class="inp" id="a-start" type="date" value="'+esc(d.avail.start)+'"></label>'+
        '<label class="field" style="flex:1"><span>Until</span>'+
        '<input class="inp" id="a-end" type="date" value="'+esc(d.avail.end)+'"></label>'+
        '</div></div>':'')+
      (d.avail.mode==='season'?'<div class="subfields">'+
        '<label class="field"><span>First appears on</span>'+
        '<input class="inp" id="a-start" type="date" value="'+esc(d.avail.start)+'"></label>'+
        '<div class="row" style="gap:10px">'+
        '<label class="field" style="flex:1"><span>Stays for this many days</span>'+
        '<input class="inp" id="a-days" type="number" min="1" value="'+esc(d.avail.days)+'"></label>'+
        '<label class="field" style="flex:1"><span>Comes back every this many months</span>'+
        '<input class="inp" id="a-every" type="number" min="1" value="'+esc(d.avail.everyMonths)+'"></label>'+
        '</div><p class="tiny" id="a-preview" style="color:var(--gold-hi)"></p></div>':'')+
      (d.avail.mode!=='always'?'<label class="check"><input type="checkbox" id="v-hideclosed"'+
        (d.hideWhenClosed?' checked':'')+'><span>Hide it completely when it is not running</span></label>':'')+

      '<div class="divider"></div>'+
      '<h4 style="font-size:.95rem;color:var(--text-hi)">Who it is for</h4>'+
      '<div class="stack">'+seg('as',[['all','Every reader'],['some','Chosen readers']],d.assign.mode)+'</div>'+
      (d.assign.mode==='some'?'<div class="subfields"><div class="who-for">'+
        S.profiles.map(function(pp){
          var on=(d.assign.ids||[]).indexOf(pp.id)>=0;
          return '<button type="button" class="btn btn-sm'+(on?' btn-primary':'')+
            '" data-who="'+pp.id+'">'+esc(pp.name)+'</button>';
        }).join('')+'</div></div>':'')+
      '<label class="check"><input type="checkbox" id="v-hidden"'+(d.hidden?' checked':'')+
      '><span>Hidden from readers</span></label>'+
      bonusEditorHTML(d)+
      '<div class="err" id="v-err"></div>'+
      '<div class="foot"><button class="btn" data-close>Cancel</button>'+
      '<button class="btn btn-primary" id="v-save">'+(existing?'Save event':'Add event')+'</button></div>';
  }
  function grab(scrim){
    var g=function(s){var el=scrim.querySelector(s);return el?el.value:null;};
    if(g('#v-title')!==null)d.title=g('#v-title').trim();
    if(g('#v-brief')!==null)d.brief=g('#v-brief').trim();
    if(g('#v-unit')!==null)d.unit=g('#v-unit').trim();
    if(g('#v-limit')!==null)d.entries.limit=Math.max(1,Math.min(20,num(g('#v-limit'),3)));
    if(g('#a-start')!==null)d.avail.start=g('#a-start');
    if(g('#a-end')!==null)d.avail.end=g('#a-end');
    if(g('#a-days')!==null)d.avail.days=Math.max(1,num(g('#a-days'),7));
    if(g('#a-every')!==null)d.avail.everyMonths=Math.max(1,num(g('#a-every'),12));
    if(g('#i-scale')!==null)d.icon.scale=Math.max(50,Math.min(180,num(g('#i-scale'),100)));
    if(g('#i-emoji')!==null){
      var em=g('#i-emoji').trim();
      if(em){d.icon.emoji=em;delete d.icon.image;}else delete d.icon.emoji;
    }
    $$('[data-rl]',scrim).forEach(function(el){
      var i=+el.dataset.rl; if(d.rubric[i])d.rubric[i].label=el.value.trim();
    });
    $$('[data-rp]',scrim).forEach(function(el){
      var i=+el.dataset.rp; if(d.rubric[i])d.rubric[i].points=Math.max(0,num(el.value,0));
    });
    bonusEditorGrab(scrim,d);
    var cb=function(s){var el=scrim.querySelector(s);return el?el.checked:false;};
    d.hidden=cb('#v-hidden');
    if(scrim.querySelector('#v-hideclosed'))d.hideWhenClosed=cb('#v-hideclosed');
  }
  function redraw(){redrawModal(body(),mount);}
  function mount(scrim){
    scrim.addEventListener('click',function(e){
      grab(scrim);
      if(bonusEditorClick(e,d)){redraw();return;}
      if(iconEditorClick(e,d.icon)){redraw();return;}
      var s=e.target.closest('[data-seg]');
      if(s){
        if(s.dataset.seg==='kind'){
          d.kind=s.dataset.v;
          var gl=EVENT_KINDS[d.kind].glyph;
          if(!d.icon.image&&!d.icon.emoji)d.icon.glyph=gl;
        }
        else if(s.dataset.seg==='av')d.avail.mode=s.dataset.v;
        else if(s.dataset.seg==='ent')d.entries.mode=s.dataset.v;
        else d.assign.mode=s.dataset.v;
        redraw();return;
      }
      var w=e.target.closest('[data-who]');
      if(w){
        var ids=d.assign.ids||[];
        var at=ids.indexOf(w.dataset.who);
        if(at>=0)ids.splice(at,1);else ids.push(w.dataset.who);
        d.assign.ids=ids;redraw();return;
      }
      var rd=e.target.closest('[data-rdel]');
      if(rd){d.rubric.splice(+rd.dataset.rdel,1);redraw();return;}
    });
    bonusEditorMount(scrim,d,redraw);
    var addr=scrim.querySelector('#v-addr');
    if(addr)addr.addEventListener('click',function(){
      grab(scrim);
      d.rubric.push({id:'r'+uid(),label:'',points:0});
      redraw();
    });
    var pic=scrim.querySelector('#i-pic');
    if(pic)pic.addEventListener('click',function(){
      grab(scrim);closeModal();
      avatarPicker(function(uri){d.icon.image=uri;openModal(body(),mount,{dismissable:false});});
    });
    var nopic=scrim.querySelector('#i-nopic');
    if(nopic)nopic.addEventListener('click',function(){
      grab(scrim);delete d.icon.image;delete d.icon.emoji;redraw();
    });
    var sc=scrim.querySelector('#i-scale');
    if(sc){
      var out=scrim.querySelector('#i-scale-v'),tile=scrim.querySelector('.ic');
      sc.addEventListener('input',function(){
        d.icon.scale=num(sc.value,100);
        if(out)out.textContent=d.icon.scale+'%';
        if(tile)tile.style.setProperty('--is',Math.max(0.5,Math.min(1.8,d.icon.scale/100)));
      });
    }
    var ap=scrim.querySelector('#a-preview');
    if(ap){
      var refresh=function(){
        grab(scrim);
        var pav=availability(d);
        ap.textContent=d.avail.start
          ?(pav.open?'Running now — '+pav.label:'Not running — '+pav.label)
          :'Pick a first date to see when it comes and goes.';
      };
      refresh();
      ['#a-start','#a-days','#a-every'].forEach(function(sel){
        var el=scrim.querySelector(sel);
        if(el)el.addEventListener('input',refresh);
      });
    }
    scrim.querySelector('#v-save').addEventListener('click',function(){
      grab(scrim);
      var err=scrim.querySelector('#v-err');
      if(!d.title){err.textContent='Give it a title.';return;}
      d.rubric=d.rubric.filter(function(r){return r.label;});
      if(!d.rubric.length){err.textContent='Keep at least one rating, with a name.';return;}
      if(d.avail.mode==='window'&&(!d.avail.start||!d.avail.end)){
        err.textContent='A date window needs both dates.';return;}
      if(d.avail.mode==='window'&&dnum(d.avail.end)<dnum(d.avail.start)){
        err.textContent='The end date is before the start date.';return;}
      if(d.avail.mode==='season'&&!d.avail.start){
        err.textContent='A cycle needs a first date.';return;}
      if(d.assign.mode==='some'&&!(d.assign.ids||[]).length){
        err.textContent='Pick at least one reader, or make it for everyone.';return;}
      var i=-1,l=eventList();
      for(var k=0;k<l.length;k++)if(l[k].id===d.id)i=k;
      if(i>=0)S.events[i]=d;else S.events.push(d);
      save();closeModal();
      toast(existing?'Event saved.':'"'+d.title+'" added.','good');
      go('events');
    });
  }
  openModal(body(),mount,{dismissable:false});
}

/* =========================================================
   Pip's room.

   Everything else in PipHub is a balance, and a balance goes
   down when it is used. This is the opposite: a place that
   only ever fills up. Nothing here is stored specially —
   the shelf, the frames and the plinth are all read back
   out of records that already exist.
   ========================================================= */

var ROOM_WALLS={
  dusk:   {name:'Dusk',   a:'#2A3560', b:'#151B2E', floor:'#3A2E4C', rail:'#4A3F66'},
  meadow: {name:'Meadow', a:'#2F5A46', b:'#16281F', floor:'#3E3326', rail:'#55452F'},
  ember:  {name:'Ember',  a:'#5A3326', b:'#231414', floor:'#442A1E', rail:'#5E3B28'},
  sea:    {name:'Sea',    a:'#1E4A66', b:'#0E2030', floor:'#27384A', rail:'#36506A'},
  plum:   {name:'Plum',   a:'#452A5E', b:'#1C1229', floor:'#3B2A48', rail:'#523A66'},
  sand:   {name:'Sand',   a:'#6A5436', b:'#2B2118', floor:'#54422C', rail:'#6E5738'}
};
function roomOf(p){
  p=p||me();
  var r=(p&&p.room)||{};
  return{wall:ROOM_WALLS[r.wall]?r.wall:'dusk'};
}

/* ---------- what the room is made of ---------- */
function finishedTitles(p){
  p=p||me();
  var out=[];
  S.modules.forEach(function(m){
    var chapters=(m.chapters||[]).length;
    var total=chapters+(hasBookTest(m)?1:0);
    if(!total)return;
    var done=0;
    (m.chapters||[]).forEach(function(ch){
      if((p.records||[]).some(function(r){return r.moduleId===m.id&&r.chapterId===ch.id&&r.passed;}))done++;
    });
    if(hasBookTest(m)&&(p.records||[]).some(function(r){
      return r.moduleId===m.id&&!r.chapterId&&r.passed;}))done++;
    if(done===total)out.push(m);
  });
  /* A title removed from the shelf is still a book they finished. */
  var seen={};
  out.forEach(function(m){seen[m.id]=1;});
  (p.records||[]).filter(function(r){return r.passed&&!r.chapterId&&!seen[r.moduleId];})
    .forEach(function(r){
      if(seen[r.moduleId])return;
      if(byId(r.moduleId))return;
      seen[r.moduleId]=1;
      out.push({id:r.moduleId,title:r.title,author:r.author||'',gone:true});
    });
  return out;
}
function lifetimeEarned(p){
  p=p||me();
  var plus=adjustmentsOf(p).reduce(function(s,a){
    return s+(num(a.points,0)>0?num(a.points,0):0);
  },0);
  return Math.round((earnedTotal(p.records)+activityPoints(p)+eventPoints(p)+
    streakTotal(p)+paybackTotal(p)+plus)*10)/10;
}
/* The longest run of days on which anything at all was earned. Works
   whether or not a streak rule has ever been set up. */
function bestRunEver(p){
  p=p||me();
  var days={};
  function mark(iso){
    var t=new Date(iso);
    if(isNaN(t.getTime()))return;
    days[t.getFullYear()+'-'+t.getMonth()+'-'+t.getDate()]=
      new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime();
  }
  (p.records||[]).forEach(function(r){if(r.passed)mark(r.date);});
  logOf(p).forEach(function(r){if(r.approved)mark(r.date);});
  entriesOf(p).forEach(function(e){if(e.status==='rated')mark(e.at);});
  var stamps=Object.keys(days).map(function(k){return days[k];}).sort(function(a,b){return a-b;});
  var best=0,run=0,prev=null;
  stamps.forEach(function(t){
    if(prev!==null&&Math.round((t-prev)/86400000)===1)run++;else run=1;
    if(run>best)best=run;
    prev=t;
  });
  return best;
}
function bestRating(p){
  p=p||me();
  var top=null;
  entriesOf(p).forEach(function(e){
    if(e.status!=='rated')return;
    if(!top||num(e.points,0)>num(top.points,0))top=e;
  });
  return top;
}
function trophyEntries(p){
  p=p||me();
  /* Anything rated at the top of its event's rubric earns a place. */
  return entriesOf(p).filter(function(e){
    if(e.status!=='rated')return false;
    var ev=eventById(e.eventId);
    var rubric=(ev&&ev.rubric)||DEFAULT_RUBRIC;
    var best=rubric.reduce(function(m,r){return Math.max(m,num(r.points,0));},0);
    return best>0&&num(e.points,0)>=best;
  });
}
function framedEntries(p){
  p=p||me();
  return entriesOf(p).filter(function(e){return e.status==='rated'&&e.thumb;})
    .sort(function(a,b){return num(b.points,0)-num(a.points,0);}).slice(0,3);
}

/* ---------- the scene ---------- */
function spineColour(seed){

  return hues[Math.abs(fingerprint(seed).charCodeAt(0)+fingerprint(seed).length)%hues.length];
}

  h+='<div class="room" data-wall="'+esc(wall)+'" style="'+

    '<div class="wall"></div><div class="floor"></div>'+

    '<div class="plaque">'+
      '<span class="k">Best run</span>'+

    '<div class="bookcase">'+

    '<div class="pipstand" data-act="pip-poke" data-where="room">'+
      pipSVG(pipLook(p),'idle',150)+'</div>'+

  h+='<div class="stats stack">'+
    '<div class="stat gold"><div class="k">Earned in all</div><div class="v">'+pts(lifetimeEarned(p))+'</div></div>'+

    '<div class="stat"><div class="k">Best rating</div><div class="v" style="font-size:1.1rem">'+
      (top?esc(top.ratingLabel||'—'):'—')+'</div></div>'+

      return '<button class="wallpick'+(k===wall?' on':'')+'" data-act="room-wall" data-w="'+k+'" '+
        'title="'+esc(ROOM_WALLS[k].name)+'" style="background:linear-gradient('+
        ROOM_WALLS[k].a+','+ROOM_WALLS[k].b+')"></button>';
    }).join('')+'</div></div>';

  if(books.length){
    h+='<div class="panel stack"><h3 style="font-size:1rem">On the shelf</h3><div class="stack">';
    books.forEach(function(m){

        '<div style="flex:1;min-width:0"><div class="tiny">'+esc(m.title)+'</div>'+
        '<div class="tiny muted">'+esc(m.author||'')+(m.gone?' · no longer in the catalogue':'')+'</div></div>'+

/* =========================================================
   Bonus cosmetics.

   A store item, an activity or an event can sometimes come
   with a Pip part attached. The roll is a deterministic
   function of the thing, the reader and the day — so it
   holds still all day, cannot flicker as the page redraws,
   and gives a reason to look again tomorrow.

   The base reward is never reduced to pay for it, the prize
   is shown before anyone acts, and nothing is ever bought in
   the hope of a bonus.
   ========================================================= */

function todayKey(){
  var n=new Date();
  return n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate();
}
function bonusCfg(thing){
  var b=(thing&&thing.bonus)||{};
  return{on:b.on===true,
    chance:Math.max(0,Math.min(100,num(b.chance,20))),
    pool:Array.isArray(b.pool)?b.pool:[]};
}
/* Which part, if any, this thing carries for this reader today. */
function bonusFor(thing,p){
  p=p||me();
  if(!p||!thing)return null;
  var cfg=bonusCfg(thing);
  if(!cfg.on||!cfg.chance||!cfg.pool.length)return null;
  var eligible=cfg.pool.filter(function(id){
    return pipPart(id)&&!ownsPip(id,p);
  });
  if(!eligible.length)return null;
  var seed=thing.id+':'+p.id+':'+todayKey();
  if(hashUnit(seed)*100>=cfg.chance)return null;
  var pick=Math.floor(hashUnit(seed+'#pick')*eligible.length);
  return pipPart(eligible[Math.min(pick,eligible.length-1)]);
}
function grantBonus(thing,p,why){
  var part=bonusFor(thing,p);
  if(!part)return null;
  if(!Array.isArray(p.pipOwned))p.pipOwned=[];
  if(p.pipOwned.indexOf(part.id)<0)p.pipOwned.push(part.id);
  if(!p.pipLook)p.pipLook={};
  p.pipLook[part.slot]=part.v;
  if(p.face!=='pip')p.face='pip';
  save();
  toast('A bonus came with it — '+part.name+'. Pip is wearing it.','good',8000);
  return part;
}
/* The strip along the bottom of a card, showing what is riding along. */
function bonusStrip(thing,p){
  var part=bonusFor(thing,p);
  if(!part)return '';
  var preview={body:pipLook(p).body};
  preview[part.slot]=part.v;
  return '<div class="bonusstrip">'+
    '<span class="bpv">'+pipSVG(preview,'idle',36,{shadow:false,still:true})+'</span>'+
    '<span class="btxt"><b>Comes with '+esc(part.name)+'</b>'+
    '<span>a bonus for Pip, today only</span></span>'+
    '<span class="bspark">'+ico('star')+'</span></div>';
}

/* ---------- instructor controls, shared by all three editors ---------- */
function bonusEditorHTML(d){
  var cfg=bonusCfg(d);
  var h='<div class="divider"></div>'+
    '<h4 style="font-size:.95rem;color:var(--text-hi)">Bonus for Pip</h4>'+
    '<p class="tiny muted" style="margin-top:4px;max-width:70ch">Now and then this can carry a '+
    'cosmetic as well. The chance is rolled once a day per reader, and a part they already own is '+
    'never picked. Parts you have taken off sale in the Pip shelf can still be won here — which is '+
    'how something becomes win-only.</p>'+
    '<label class="check stack"><input type="checkbox" id="b-on"'+(cfg.on?' checked':'')+
    '><span>Sometimes comes with a Pip cosmetic</span></label>';
  if(!cfg.on)return h;
  h+='<div class="subfields">'+

    '<div class="tiny muted" style="margin-bottom:7px">Which parts it can give — tick as many as you like</div>'+
    '<div class="bonuspool">';
  PIP_PARTS.filter(function(pt){return pt.price>0;}).forEach(function(pt){

  });
  h+='</div>'+
    (cfg.pool.length?'':'<p class="tiny" style="color:var(--fail);margin-top:8px">'+
      'Pick at least one part, or the bonus can never happen.</p>')+

  return h;
}
function bonusEditorGrab(scrim,d){
  if(!d.bonus)d.bonus={on:false,chance:20,pool:[]};
  var on=scrim.querySelector('#b-on');
  if(on)d.bonus.on=on.checked;
  var ch=scrim.querySelector('#b-chance');
  if(ch)d.bonus.chance=Math.max(1,Math.min(100,num(ch.value,20)));
}
/* Ticking the switch has to reveal its fields straight away, or the
   editor looks broken. */
function bonusEditorMount(scrim,d,redraw){
  var on=scrim.querySelector('#b-on');
  if(on)on.addEventListener('change',function(){
    bonusEditorGrab(scrim,d);
    d.bonus.on=on.checked;
    redraw();
  });
}
function bonusEditorClick(e,d){
  var b=e.target.closest('[data-pool]');
  if(!b)return false;
  if(!d.bonus)d.bonus={on:true,chance:20,pool:[]};
  var pool=d.bonus.pool||[];
  var at=pool.indexOf(b.dataset.pool);
  if(at>=0)pool.splice(at,1);else pool.push(b.dataset.pool);
  d.bonus.pool=pool;
  return true;
}

/* =========================================================
   Moments.

   Everything in PipHub announces itself with the same grey
   toast, so nothing feels bigger than anything else. This is
   the one exception: a short beat for the four things worth
   stopping for. Its power is entirely in its scarcity, so
   resist adding a fifth.
   ========================================================= */

var momentQ=[], momentLive=false, momentTimer=null;

function reducedMotion(){
  try{return window.matchMedia('(prefers-reduced-motion:reduce)').matches;}
  catch(e){return false;}
}
function celebrate(m){
  if(!m)return;
  momentQ.push(m);
  if(!momentLive)runMoment();
}
function closeMoment(){
  if(momentTimer){clearTimeout(momentTimer);momentTimer=null;}
  var el=document.getElementById('moment');
  if(el&&el.parentNode)el.parentNode.removeChild(el);
  momentLive=false;
  if(momentQ.length)runMoment();
  else pageUnlock();
}
function runMoment(){
  var m=momentQ.shift();
  if(!m){momentLive=false;return;}
  if(!momentLive)pageLock();
  momentLive=true;

  var p=me();
  var still=reducedMotion();
  var sparks='';
  if(!still){
    for(var i=0;i<12;i++){
      var ang=(i/12)*360;
      sparks+='<span class="mspark s'+(i%3)+'" style="--a:'+ang+'deg;--d:'+(i*40)+'ms"></span>';
    }
  }
  var el=document.createElement('div');
  el.id='moment';
  el.className='moment'+(still?' still':'');
  el.innerHTML=
    '<div class="mstage">'+
      (still?'':'<div class="mrays" aria-hidden="true"></div>')+
      '<div class="mburst" aria-hidden="true">'+sparks+'</div>'+
      '<div class="mpip">'+pipSVG(pipLook(p),m.pose||'cheer',176)+'</div>'+
      (m.token?'<div class="mtoken">'+m.token+'</div>':'')+
      '<div class="mwords">'+
        '<div class="mkicker">'+esc(m.kicker||'')+'</div>'+
        '<div class="mtitle">'+esc(m.title||'')+'</div>'+
        (m.line?'<div class="mline">'+esc(m.line)+'</div>':'')+
        (m.prize?'<div class="mprize">'+m.prize+'</div>':'')+
      '</div>'+
      '<div class="mtap">tap to carry on</div>'+
    '</div>';
  document.body.appendChild(el);
  el.addEventListener('click',closeMoment);
  momentTimer=setTimeout(closeMoment,still?1800:3200);
}

/* ---------- the four ---------- */
function momentBookFinished(m){
  celebrate({
    kicker:'Finished',
    title:m.title,
    line:m.author?'by '+m.author:'',
    pose:'cheer',
    token:'<span class="mspine" style="background:'+spineColour(m.id)+'"><i></i></span>',
    prize:'It is on the shelf in your room now.'
  });
}
function momentStreak(rule,points){
  celebrate({
    kicker:'Streak',
    title:rule.title||'A run complete',
    line:rule.periods+' '+(rule.unit==='week'?'week':'day')+
      (rule.periods===1?'':'s')+' in a row',
    pose:'cheer',
    prize:'+'+pts(points)+' points'
  });
}
function momentWish(item,back){
  celebrate({
    kicker:'Wish granted',
    title:item.title,
    line:'Saved for, and yours',
    pose:'cheer',
    token:renderIcon(item.icon),
    prize:back?pts(back)+' points came back for saving up':''
  });
}
function momentTopLook(look){
  var preview={};
  look.grants.forEach(function(g){var pt=pipPart(g);if(pt)preview[pt.slot]=pt.v;});
  var ab=lookAbility(look);
  celebrate({
    kicker:'Top tier',
    title:look.name,
    line:'Every piece of it, unlocked',
    pose:'cheer',
    prize:(ab.kind!=='none'&&ab.value)?PIP_ABILITIES[ab.kind].blurb(ab.value):''
  });
}
/* Did this record complete the title? Counted without it, so the beat
   fires once and only on the paper that finished the job. */
function completedTitle(m,p,rec){
  if(!m)return false;
  var chapters=(m.chapters||[]).length;
  var total=chapters+(hasBookTest(m)?1:0);
  if(!total)return false;
  function passedPaper(chId,skipId){
    return (p.records||[]).some(function(r){
      return r.id!==skipId&&r.moduleId===m.id&&(r.chapterId||null)===(chId||null)&&r.passed;
    });
  }
  var before=0,after=0;
  (m.chapters||[]).forEach(function(ch){
    if(passedPaper(ch.id,rec.id))before++;
    if(passedPaper(ch.id,null))after++;
  });
  if(hasBookTest(m)){
    if(passedPaper(null,rec.id))before++;
    if(passedPaper(null,null))after++;
  }
  return after===total&&before===total-1;
}

/* =========================================================
   Reactions.

   Pip answers being tapped, fidgets between times, and says
   something now and then. Every line is drawn from what is
   actually going on — never random chatter — so he stays
   worth listening to.
   ========================================================= */

/* ---------- what he has to say ---------- */
var sayTick=0;
function pipSays(where,rotate){
  var p=me();
  if(!p)return null;
  var lines=[];

  /* the wish, if there is one and it is close */
  var wp=wishProgress(p);
  if(wp){
    if(wp.ready)lines.push('You can afford '+wp.item.title+'. Go on.');
    else if(wp.short<=5)lines.push('Only '+pts(wp.short)+' more and '+wp.item.title+' is yours.');
    else if(wp.pct>=50)lines.push('Halfway to '+wp.item.title+'.');
  }

  /* a run that is alive or about to pay */
  liveStreakRules().forEach(function(rule){
    var stt=streakState(rule,p);
    if(!stt.run)return;
    if(stt.thisPeriod<stt.need)
      lines.push(stt.run+' '+stt.word+(stt.run===1?'':'s')+' running. '+
        stt.ask+' '+stt.nowWord+' to keep it.');
    else if(stt.toGo===1)
      lines.push('One more '+stt.word+' and that run pays out.');
  });

  /* work sent in and not yet looked at */
  var waiting=totalPending(p);
  if(waiting)lines.push(waiting===1?'One thing is waiting to be looked at.'
    :waiting+' things are waiting to be looked at.');

  /* a book part-read */
  S.modules.forEach(function(m){
    if(!(m.chapters||[]).length)return;
    var pg=papersDone(m);
    if(pg.done&&pg.done<pg.total)
      lines.push(m.title+' — '+(pg.total-pg.done)+' to go.');
  });

  /* the shelf, when he is standing in front of it */
  if(where==='room'){
    var books=finishedTitles(p).length;
    if(books>=2)lines.push(books+' books on that shelf. All yours.');
    else if(books===1)lines.push('One on the shelf. Room for more.');
    else lines.push('The shelf is empty. Let us fix that.');
    var run=bestRunEver(p);
    if(run>=3)lines.push('Best run so far: '+run+' days.');
  }

  /* nothing pressing — a few warm ones, still true */
  if(!lines.length){
    var bal=balance(p);
    if(bal>=10)lines.push(pts(bal)+' points burning a hole in your pocket.');
    lines.push('Read me something.');
    lines.push('I am not doing anything. Are you?');
  }
  /* Tapping walks through what he has to say; an unprompted greeting
     holds still so it does not change under you. */
  if(rotate)return lines[(sayTick++)%lines.length];
  var seed=(where||'')+':'+todayKey()+':'+Math.floor(Date.now()/9000);
  return lines[Math.floor(hashUnit(seed)*lines.length)%lines.length];
}

/* ---------- being tapped ---------- */
function sayNear(host,text){
  if(!host||!text)return;
  var old=host.querySelector('.pipsay');
  if(old&&old.parentNode)old.parentNode.removeChild(old);
  var b=document.createElement('div');
  b.className='pipsay';
  b.textContent=text;
  host.appendChild(b);
  setTimeout(function(){
    b.classList.add('go');
    setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},420);
  },3400);
}
function pokePip(host,where){
  if(!host)return;
  var svg=host.querySelector('svg.pip');
  if(svg&&!reducedMotion()){
    svg.classList.remove('pip-hop');
    void svg.getBoundingClientRect();        /* restart the animation */
    svg.classList.add('pip-hop');
    setTimeout(function(){svg.classList.remove('pip-hop');},760);
  }
  sayNear(host,pipSays(where,true));
}

/* ---------- fidgeting between times ---------- */
var idleTimer=null;
function startPipIdle(){
  if(idleTimer)return;
  idleTimer=setInterval(function(){
    if(reducedMotion())return;
    if(document.hidden)return;
    if(document.getElementById('moment'))return;
    var list=$$('.pip-live');
    if(!list.length)return;
    var el=list[Math.floor(Math.random()*list.length)];
    if(!el||el.classList.contains('pip-hop'))return;
    el.classList.add('pip-glance');
    setTimeout(function(){el.classList.remove('pip-glance');},1500);
  },11000);
}
/* A line on arrival, but only where he is standing about with nothing
   else to do, and only once per visit. */
var greeted={};
function pipGreet(where,host){
  if(!host||greeted[where])return;
  greeted[where]=true;
  setTimeout(function(){
    if(document.body.contains(host))sayNear(host,pipSays(where));
  },900);
}
function resetGreetings(){greeted={};}

function boot(){
  load();
  applyTheme();
  var ready=S.settings.pw?Promise.resolve():hash(DEFAULT_PW).then(function(h){S.settings.pw=h;});
  ready.then(function(){
    if(!S.settings.seeded){
      var seed=[];
      try{seed=JSON.parse(document.getElementById('seed-modules').textContent)||[];}catch(e){seed=[];}
      var t=newTally();
      seed.forEach(function(s){if(!byId(slug(s.id||s.title)))ingest(s,'built-in',t);});
      S.settings.seeded=true;
    }
    save();
    if(!storageOK)toast('This browser is blocking local storage, so readers and results will not be kept.','bad',9000);
    initPlatform();
    startPipIdle();
    loadSnaps().then(function(){if(S.view==='settings')render();});
    /* Always ask who is reading. On a shared device the last reader must
       not be inherited by whoever opens it next. */
    S.active=null;
    S.admin=false;
    save();
    go('gate');
    if(S.settings.autoSync)syncFolder(S.settings.folder,true);
  });
}
boot();
