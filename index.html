/* ---------- points ---------- */
function purchasesOf(p){p=p||me();return (p&&p.purchases)?p.purchases:[];}
function spentTotal(p){
  return purchasesOf(p).reduce(function(s,r){return s+(Number(r.cost)||0);},0);
}
function adjustmentsOf(p){p=p||me();return (p&&p.adjustments)?p.adjustments:[];}
function adjustedTotal(p){
  return Math.round(adjustmentsOf(p).reduce(function(s,a){return s+(Number(a.points)||0);},0)*10)/10;
}
function balance(p){
  p=p||me();
  if(!p)return 0;
  return Math.round((earnedTotal(p.records)+activityPoints(p)+adjustedTotal(p)
    +bonusTotal(p)+eventPoints(p)-spentTotal(p))*10)/10;
}

/* ---------- dates ---------- */
function dnum(s){
  if(!s)return null;
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
  if(!m)return null;
  return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12,0,0);
}
function addMonths(d,n){
  var x=new Date(d.getTime());
  var day=x.getDate();
  x.setDate(1);
  x.setMonth(x.getMonth()+n);
  x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));
  return x;
}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function dayDiff(a,b){return Math.ceil((a.getTime()-b.getTime())/86400000);}
function fmtDay(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function inDays(n){
  if(n<=0)return 'today';
  if(n===1)return 'tomorrow';
  if(n<31)return 'in '+n+' days';
  var m=Math.round(n/30.4);
  return 'in about '+m+(m===1?' month':' months');
}


/* ---------- sales ----------
   The discount is a deterministic function of the item and which cycle
   we are in, not a coin flip at render time. Same answer on every device,
   every reload, with nothing to store and no price that changes while a
   reader is looking at it. */
function hashUnit(str){
  var h=2166136261>>>0;
  for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*16777619)>>>0;}
  /* a second pass, so neighbouring cycle numbers do not give near values */
  h^=h>>>13;h=(h*1274126177)>>>0;h^=h>>>16;
  return (h>>>0)/4294967296;
}
function discountState(item,now){
  now=now||new Date();
  var s=item.sale;
  var off={active:false,pct:0};
  if(!s||!s.on)return off;

  var lasts=Math.max(1,num(s.lasts,3));
  var cool=Math.max(0,num(s.cooldown,14));
  var every=Math.max(1,num(s.every,30));
  /* A new sale can never start before the cooldown has run out, however
     often the schedule says to repeat. */
  var period=Math.max(every,lasts+cool);
  var anchor=dnum(s.anchor)||dnum(String(item.created||'').slice(0,10))||now;

  /* Whole days only. Working in timestamps made a sale anchored to today
     start at midday, and gave a negative cycle before that. */
  function dayOf(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
  var anchorDay=dayOf(anchor), today=dayOf(now);
  var dayIdx=Math.round((today.getTime()-anchorDay.getTime())/86400000);

  function roll(cycle){
    var lo=Math.max(1,num(s.min,10)),hi=Math.max(lo,num(s.max,30));
    var happens=hashUnit(item.id+'#'+cycle)*100 < Math.max(0,Math.min(100,num(s.chance,100)));
    var steps=Math.floor((hi-lo)/5)+1;
    var pct=Math.min(hi,lo+Math.floor(hashUnit(item.id+':'+cycle)*steps)*5);
    return{happens:happens,pct:pct};
  }

  /* A sale belongs to the item, so it cannot outlive it. An item with three
     days left never carries a four-day sale; it carries a three-day one. And
     a sale is never advertised for a day the item will not be there. */
  var shelf=daysOnShelf(item,now);          /* null = no closing date */
  if(shelf===0)return off;                  /* off the shelf, so no sale */

  var k=(dayIdx<0)?-1:Math.floor(dayIdx/period);
  if(k>=0){
    var into=dayIdx-k*period;
    var cur=roll(k);
    if(cur.happens&&into<lasts){
      var left=lasts-into;
      if(shelf!==null)left=Math.min(left,shelf);
      if(left>0){
        return{active:true,pct:cur.pct,endsOn:addDays(today,left),daysLeft:left,
               clipped:(shelf!==null&&shelf<lasts-into)};
      }
    }
  }
  /* Nothing running: find the next cycle that both fires and lands on a day
     the item is actually on the shelf. */
  for(var n=Math.max(0,k+1);n<k+26;n++){
    var nx=roll(n);
    if(!nx.happens)continue;
    var awayDays=n*period-dayIdx;
    var when=addDays(today,awayDays);
    if(!availability(item,when).open)continue;
    var room=daysOnShelf(item,when);
    var runs=(room===null)?lasts:Math.min(lasts,room);
    if(runs<=0)continue;
    return{active:false,pct:nx.pct,nextOn:when,daysAway:Math.max(0,awayDays),runs:runs};
  }
  return off;
}
function priceOf(item){
  var d=discountState(item);
  var base=Math.max(0,num(item.cost,0));
  var off=d.active?d.pct:0;
  var wear=abilityValue('discount');          /* a worn look can cut prices too */
  var total=Math.min(90,off+wear);
  if(!total)return{base:base,now:base,pct:0,active:false,sale:d,wear:0};
  var now=Math.round(Math.max(0,base*(100-total))/100*10)/10;
  return{base:base,now:now,pct:total,active:true,sale:d,wear:wear};
}
function isFeatured(item){
  if(item.featured)return true;
  var s=item.sale;
  return !!(s&&s.on&&s.autoFeature&&discountState(item).active);
}

/* ---------- is it on the shelf right now ---------- */
function availability(item,now){
  now=now||new Date();
  var a=item.avail||{mode:'always'};
  if(a.mode==='window'){
    var s=dnum(a.start),e=dnum(a.end);
    if(!s||!e)return{open:true,label:'',tone:'cold'};
    if(now<s)return{open:false,label:'Opens '+fmtDay(s),tone:'cold',opensOn:s};
    if(now>addDays(e,1))return{open:false,label:'Finished',tone:'cold',done:true};
    var left=dayDiff(e,now);
    return{open:true,label:left<=0?'Last day':(left===1?'1 day left':left+' days left'),
           tone:left<=7?'warm':'cold',endsExcl:addDays(e,1)};
  }
  if(a.mode==='season'){
    var st=dnum(a.start);
    var days=Math.max(1,num(a.days,7));
    var every=Math.max(1,num(a.everyMonths,12));
    if(!st)return{open:true,label:'',tone:'cold'};
    for(var k=0;k<400;k++){
      var os=addMonths(st,k*every);
      var oe=addDays(os,days);
      if(now<os){
        var untilD=dayDiff(os,now);
        return{open:false,label:'Returns '+(untilD>45?fmtDay(os):inDays(untilD)),tone:'cold'};
      }
      if(now<oe){
        var l=dayDiff(oe,now);
        return{open:true,label:l<=1?'Last day':l+' days left',tone:l<=7?'warm':'cold',endsExcl:oe};
      }
    }
    return{open:false,label:'Finished',tone:'cold'};
  }
  return{open:true,label:'',tone:'cold',endsExcl:null};
}

/* How many whole days the item has left on the shelf, or null if it has
   no closing date at all. */
function daysOnShelf(item,now){
  var av=availability(item,now);
  if(!av.open)return 0;
  if(!av.endsExcl)return null;
  function dayOf(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
  return Math.max(0,Math.round((dayOf(av.endsExcl).getTime()-dayOf(now||new Date()).getTime())/86400000));
}

/* ---------- may this reader have it ---------- */
function eligibility(item,p){
  p=p||me();
  var mine=purchasesOf(p).filter(function(r){return r.itemId===item.id;})
    .sort(function(a,b){return a.date<b.date?1:-1;});
  var av=availability(item);
  if(!av.open)return{can:false,why:'closed',label:av.label||'Not available',tone:'cold',avail:av,owned:mine.length};
  if(item.locked)return{can:false,why:'locked',label:'Locked',tone:'cold',avail:av,owned:mine.length};

  var rp=item.repurchase||{mode:'unlimited'};
  if(rp.mode==='once'&&mine.length)
    return{can:false,why:'done',label:'Already redeemed',tone:'good',avail:av,owned:mine.length};
  if(rp.mode==='limit'){
    var lim=Math.max(1,num(rp.limit,1));
    if(mine.length>=lim)
      return{can:false,why:'done',label:'Limit of '+lim+' reached',tone:'good',avail:av,owned:mine.length};
  }
  if(rp.mode==='cooldown'&&mine.length){
    var days=Math.max(1,num(rp.days,7));
    var since=new Date(mine[0].date);
    var ready=addDays(since,days);
    if(new Date()<ready){
      var d=dayDiff(ready,new Date());
      return{can:false,why:'cooldown',label:'Again '+inDays(d),tone:'cold',avail:av,owned:mine.length};
    }
  }
  var ask=priceOf(item).now;
  if(balance(p)<ask){
    var short=Math.round((ask-balance(p))*10)/10;
    /* Not affordable yet is a goal, not a closed door — the card stays bright. */
    return{can:false,why:'cost',label:pts(short)+' more points needed',tone:'cold',avail:av,owned:mine.length};
  }
  return{can:true,label:av.label,tone:av.tone,avail:av,owned:mine.length};
}

function itemById(id){
  for(var i=0;i<S.store.length;i++)if(S.store[i].id===id)return S.store[i];
  return null;
}

/* ---------- the shelf ---------- */
function viewStore(){
  var p=me();
  var bal=balance(p);
  var h='<div class="pagehead"><div><h2>The store</h2>'+
    '<div class="sub">Spend the points your reading earned</div></div></div>';

  h+='<div class="balance"><div class="disc" aria-hidden="true"></div>'+
    '<div><div class="k">'+esc(p?p.name:'')+'&rsquo;s balance</div>'+
    '<div class="v">'+pts(bal)+' <span style="font-size:.8rem;color:var(--text-2)">points</span></div></div>'+
    '<div style="margin-left:auto;text-align:right" class="tiny muted">'+
    pts(earnedTotal(p?p.records:[]))+' from tests<br>'+
    pts(activityPoints(p))+' from activities<br>'+
    (adjustedTotal(p)?(adjustedTotal(p)>0?'+':'')+pts(adjustedTotal(p))+' from your instructor<br>':'')+
    (paybackTotal(p)?'+'+pts(paybackTotal(p))+' paid back on wishes<br>':'')+
    (streakTotal(p)?'+'+pts(streakTotal(p))+' from streaks<br>':'')+
    (eventPoints(p)?'+'+pts(eventPoints(p))+' from events<br>':'')+
    (abilityValue('boost',p)?'+'+abilityValue('boost',p)+'% while worn<br>':'')+
    pts(spentTotal(p))+' spent</div></div>';

  if(S.admin){
    h+='<div class="row stack">'+
      '<button class="btn btn-primary" data-act="item-new">'+ico('plus')+'Add an item</button>'+
      '<button class="btn" data-go="redemptions">'+ico('file')+'Redemptions</button></div>';
  }

  var visible=S.store.filter(function(it){
    if(S.admin)return true;
    if(it.hidden)return false;
    var av=availability(it);
    return av.open||!it.hideWhenClosed;
  });

  if(!visible.length){
    return h+'<div class="empty stack">'+emptyPip('wait')+'<h3>'+(S.admin?'The shelf is empty':'Nothing on the shelf yet')+'</h3>'+
      '<p class="muted">'+(S.admin?'Add something a reader would want, set what it costs, and decide when it exists.'
        :'Ask your instructor what you can spend points on.')+'</p>'+
      (S.admin?'<div class="stack"><button class="btn btn-primary" data-act="item-new">'+ico('plus')+'Add an item</button></div>':'')+
      '</div>'+pipShelf();
  }

  /* One shelf. Featured items simply sort to the front of it, so an item
     that becomes featured — or goes on sale with auto-feature on — moves
     up rather than jumping into a separate section. */
  function rank(it){
    var e=eligibility(it);
    if(e.can)return 0;
    if(e.why==='cost')return 1;      /* within reach, just not yet */
    return 2;
  }
  function order(a,b){
    var fa=isFeatured(a)?0:1, fb=isFeatured(b)?0:1;
    if(fa!==fb)return fa-fb;
    var ra=rank(a),rb=rank(b);
    if(ra!==rb)return ra-rb;
    return priceOf(a).now-priceOf(b).now;
  }
  h+=wishPanel();
  h+='<div class="shelf stack">'+
     visible.slice().sort(order).map(function(it){
       return itemCard(it,p,isFeatured(it));
     }).join('')+'</div>';
  return h+pipShelf();
}

/* One card, whether it is featured or not. */
var FX=['gold','blue','mint','rose','plum'];
function featureOf(it){
  var fx=it.feature||{};
  return{style:(FX.indexOf(fx.style)>=0?fx.style:'gold'),
         label:String(fx.label||'FEATURED').slice(0,22),
         wide:!!fx.wide,glow:fx.glow!==false};
}

function itemCard(it,p,hero){
  var el=eligibility(it,p);
  var pr=priceOf(it);
  var av=availability(it);
  var fx=featureOf(it);

  /* The rosette keeps the top-right corner. A countdown floats there too
     when it is the only thing on the card; as soon as a sale is present —
     or the card is featured — it moves into the top bar, where it cannot
     land on the title. */
  var saleBadge='',extra='',barLabel='',cd='',urgency='';
  if(pr.active){
    saleBadge='<span class="badges" aria-hidden="true">'+
      '<span class="bsale'+(pr.pct>=30?' big':'')+'">'+
      '<span><span class="n">'+pr.pct+'%</span><br><span class="u">OFF</span></span></span></span>';
    extra+=' has-sale'+(pr.pct>=30?' sale-big':'');
  }
  var hasTime=(av.open&&av.label&&/day|Last/.test(av.label));
  var timeText='';
  if(hasTime){
    var isLast=/Last/.test(av.label);
    var left=isLast?0:parseInt(av.label,10);
    urgency=(isLast||left<=1?'last':(left<=5?'soon':''));
    timeText=isLast?'LAST DAY':av.label.toUpperCase();
  }

  var wantsBar=hero||(hasTime&&pr.active);
  var floatTime='';
  if(hasTime&&!wantsBar){
    floatTime='<span class="badges" aria-hidden="true"><span class="btime '+urgency+'">'+
      '<span class="dot"></span>'+esc(timeText)+'</span></span>';
  }
  var bar='';
  if(wantsBar){
    extra+=' has-bar';
    if(hasTime)cd='<span class="cd"><span class="dot"></span>'+esc(timeText)+'</span>';
    barLabel=hero?'<span class="lab">'+esc(fx.label)+'</span>':'';
    bar='<span class="cardbar'+(hero?'':' timeonly')+(hasTime?' '+urgency:'')+
      '" aria-hidden="true">'+barLabel+cd+'</span>';
  }
  var badges=bar+saleBadge+floatTime;

  /* Not affordable yet is a goal, not a closed door — only genuinely shut
     items are dimmed. */
  var dim=(!el.can&&el.why!=='cost');
  return '<div class="item'+(el.can?' buyable':'')+(dim?' shut':'')+extra+
      (hero?' hero'+(fx.wide?' wide':'')+(fx.glow?' glow':''):'')+'"'+
      (hero?' data-fx="'+fx.style+'"':'')+'>'+
    badges+
    '<div class="row itemtop" style="align-items:flex-start">'+itemIcon(it)+
    '<div style="flex:1;min-width:0"><h4>'+esc(it.title)+'</h4>'+
    '<div class="price">'+(pr.active?'<s>'+pts(pr.base)+'</s>':'')+
      pts(pr.now)+' <small>points</small></div></div></div>'+
    (it.blurb?'<p>'+esc(it.blurb)+'</p>':'')+
    '<div class="foot">'+
      (el.can
        ? '<button class="btn btn-sm btn-primary" data-act="buy" data-id="'+esc(it.id)+'">Redeem</button>'
        : '<span class="pill '+el.tone+'">'+esc(el.label)+'</span>')+
      (isWish(it)?'<span class="pill warm">your wish</span>':'')+
      (el.owned?'<span class="pill cold">redeemed '+el.owned+'&times;</span>':'')+
      (canWish(it,p)?'<button class="btn btn-sm btn-ghost" data-act="wish-set" data-id="'+
        esc(it.id)+'" title="Save up for this">'+ico('star')+'Wish</button>':'')+
      (it.hidden?'<span class="pill cold">hidden</span>':'')+
    '</div>'+
    bonusStrip(it,p)+
    (S.admin?'<div class="adminrow">'+
      '<button class="btn btn-sm btn-ghost" data-act="item-edit" data-id="'+esc(it.id)+'">Edit</button>'+
      '<button class="btn btn-sm btn-ghost" data-act="item-feature" data-id="'+esc(it.id)+'">'+
        (it.featured?'Unfeature':'Feature')+'</button>'+
      '<button class="btn btn-sm btn-ghost" data-act="item-lock" data-id="'+esc(it.id)+'">'+
        (it.locked?'Unlock':'Lock')+'</button>'+
      '<button class="btn btn-sm btn-danger" data-act="item-del" data-id="'+esc(it.id)+'">Remove</button>'+
    '</div>':'')+
    '</div>';
}

/* ---------- redeeming ---------- */
function buyItem(id){
  var it=itemById(id),p=me();
  if(!it||!p)return;
  var el=eligibility(it,p);
  if(!el.can){toast(el.label,'bad');return;}
  var pr=priceOf(it);
  confirmModal('Redeem '+it.title+'?',
    (pr.active?'It is '+pr.pct+'% off — '+pts(pr.now)+' points instead of '+pts(pr.base)+'. '
              :'It costs '+pts(pr.now)+' points. ')+
    'Your balance is '+pts(balance(p))+', and would become '+pts(balance(p)-pr.now)+'.',
    'Redeem',function(){
      var again=eligibility(it,p);
      if(!again.can){toast(again.label,'bad');return;}
      var paid=priceOf(it);
      var w=wishOf(p);
      var back=(w&&w.itemId===it.id)?wishPayback(paid.now):0;
      p.purchases=purchasesOf(p).concat([{
        id:uid(),itemId:it.id,title:it.title,cost:paid.now,full:paid.base,
        discount:paid.active?paid.pct:0,payback:back,
        icon:it.icon,date:nowISO(),given:false
      }]);
      if(back)p.wish=null;                       /* the wish is granted; pick a new one */
      save();
      if(back)momentWish(it,back);
      grantBonus(it,p,'store');
      snapshot('after redeeming '+it.title);
      toast(back
        ? it.title+' is yours, and '+pts(back)+' points came back for saving up.'
        : it.title+' redeemed. Balance '+pts(balance(p))+'.','good',back?7000:4200);
      render();
    });
}

/* ---------- redemption log (instructor) ---------- */

  var rows=[];

    purchasesOf(p).forEach(function(r){
      if(r.cosmetic)return;            /* the app hands these over itself */
      rows.push({p:p,r:r});

    '<div class="sub">What readers have spent their points on</div></div>'+

  var owing=rows.filter(function(x){return !x.r.given;}).length;
  h+='<div class="stats"><div class="stat gold"><div class="k">Waiting to be given</div><div class="v">'+owing+'</div></div>'+
    '<div class="stat"><div class="k">Redeemed all time</div><div class="v">'+rows.length+'</div></div>'+
    '<div class="stat"><div class="k">Points spent</div><div class="v">'+

      (ic.image?'<span class="ic" style="background:'+esc(ic.bg||'#1C2340')+'"><img src="'+ic.image+'" alt=""></span>'
              :'<span class="ic" style="background:'+esc(ic.bg||'#1C2340')+'">'+glyphSVG(ic.glyph||'star',ic.fg,ic.bg)+'</span>')+
      '<div style="flex:1;min-width:0"><div>'+esc(x.r.title)+'</div>'+
      '<div class="tiny muted">'+esc(x.p.name)+' &nbsp;·&nbsp; '+dateShort(x.r.date)+' &nbsp;·&nbsp; '+pts(x.r.cost)+' points</div></div>'+
      '<div class="row" style="gap:6px">'+
      '<button class="btn btn-sm'+(x.r.given?' btn-ghost':' btn-primary')+'" data-act="redeem-given" data-id="'+esc(x.r.id)+'">'+
        (x.r.given?'Given':'Mark given')+'</button>'+
      '<button class="btn btn-sm btn-danger" data-act="redeem-refund" data-id="'+esc(x.r.id)+'">Refund</button>'+
      '</div></div>';
  });
  return h+'</div>';
}
function findPurchase(id){
  for(var i=0;i<S.profiles.length;i++){
    var list=purchasesOf(S.profiles[i]);
    for(var j=0;j<list.length;j++)if(list[j].id===id)return{p:S.profiles[i],r:list[j],i:j};
  }
  return null;
}

  function grab(scrim){
    var g=function(id){var el=scrim.querySelector(id);return el?el.value:null;};
    if(g('#i-title')!==null)d.title=g('#i-title').trim();
    if(g('#i-scale')!==null)d.icon.scale=Math.max(50,Math.min(180,num(g('#i-scale'),100)));
    if(g('#i-emoji')!==null){
      var em=g('#i-emoji').trim();
      if(em){d.icon.emoji=em;delete d.icon.image;}else delete d.icon.emoji;
    }
    if(g('#i-blurb')!==null)d.blurb=g('#i-blurb').trim();
    if(g('#i-cost')!==null)d.cost=Math.max(0,num(g('#i-cost'),0));
    if(g('#i-limit')!==null)d.repurchase.limit=Math.max(1,num(g('#i-limit'),1));
    if(g('#i-days')!==null)d.repurchase.days=Math.max(1,num(g('#i-days'),7));
    if(g('#i-start')!==null)d.avail.start=g('#i-start');
    if(g('#i-end')!==null)d.avail.end=g('#i-end');
    if(g('#i-sdays')!==null)d.avail.days=Math.max(1,num(g('#i-sdays'),7));
    if(g('#i-every')!==null)d.avail.everyMonths=Math.max(1,num(g('#i-every'),12));
    if(g('#s-min')!==null)d.sale.min=Math.max(1,Math.min(95,num(g('#s-min'),10)));
    if(g('#s-max')!==null)d.sale.max=Math.max(1,Math.min(95,num(g('#s-max'),30)));
    if(g('#s-every')!==null)d.sale.every=Math.max(1,num(g('#s-every'),30));
    if(g('#s-lasts')!==null)d.sale.lasts=Math.max(1,num(g('#s-lasts'),3));
    if(g('#s-cool')!==null)d.sale.cooldown=Math.max(0,num(g('#s-cool'),14));
    if(g('#s-chance')!==null)d.sale.chance=Math.max(1,Math.min(100,num(g('#s-chance'),100)));
    if(g('#s-anchor')!==null)d.sale.anchor=g('#s-anchor');
    if(g('#f-label')!==null)d.feature.label=g('#f-label').trim()||'FEATURED';

    d.locked=cb('#i-locked');d.hidden=cb('#i-hidden');d.hideWhenClosed=cb('#i-hideclosed');
    d.featured=cb('#i-featured');
    if(scrim.querySelector('#f-wide'))d.feature.wide=cb('#f-wide');
    if(scrim.querySelector('#f-glow'))d.feature.glow=cb('#f-glow');
    if(scrim.querySelector('#i-sale'))d.sale.on=cb('#i-sale');
    if(scrim.querySelector('#s-feature'))d.sale.autoFeature=cb('#s-feature');
  }
  function redraw(){redrawModal(body(),mount);}
  function mount(scrim){
    scrim.addEventListener('click',function(e){
      var fxb=e.target.closest('[data-fx]');
      if(fxb){grab(scrim);d.feature.style=fxb.dataset.fx;redraw();return;}
      var s=e.target.closest('[data-seg]');
      if(s){
        grab(scrim);
        if(s.dataset.seg==='rp')d.repurchase.mode=s.dataset.v;
        else d.avail.mode=s.dataset.v;
        redraw();return;
      }
      grab(scrim);
      if(bonusEditorClick(e,d)){redraw();return;}
      if(iconEditorClick(e,d.icon)){redraw();return;}
    });
    var featBox=scrim.querySelector('#i-featured');
    if(featBox)featBox.addEventListener('change',function(){grab(scrim);d.featured=featBox.checked;redraw();});

    bonusEditorMount(scrim,d,redraw);
    var saleBox=scrim.querySelector('#i-sale');
    if(saleBox)saleBox.addEventListener('change',function(){grab(scrim);d.sale.on=saleBox.checked;redraw();});

    var sp=scrim.querySelector('#s-preview');
    function refreshPreview(){
      if(!sp)return;
      grab(scrim);
      var ds=discountState(d);
      var shelfLeft=daysOnShelf(d);
      sp.textContent=ds.active
        ? 'On sale now — '+ds.pct+'% off, '+ds.daysLeft+' day'+(ds.daysLeft===1?'':'s')+' left'+
          (ds.clipped?' (cut short because the item goes first).':'.')
        : (ds.nextOn
            ? 'Next sale '+(ds.daysAway<=0?'today':(ds.daysAway===1?'tomorrow':'in '+ds.daysAway+' days'))+
              ' — '+ds.pct+'% off for '+ds.runs+' day'+(ds.runs===1?'':'s')+'.'
            : (shelfLeft===0
                ? 'No sale while the item is off the shelf.'
                : 'No sale falls inside the time this item is available.'));
    }
    if(sp){
      refreshPreview();
      ['#s-min','#s-max','#s-every','#s-lasts','#s-cool','#s-chance','#s-anchor','#i-cost'].forEach(function(sel){
        var el=scrim.querySelector(sel);
        if(el)el.addEventListener('input',refreshPreview);
      });
    }

    var scaleBox=scrim.querySelector('#i-scale');
    if(scaleBox){
      var readout=scrim.querySelector('#i-scale-v');
      var tile=scrim.querySelector('.ic');
      scaleBox.addEventListener('input',function(){
        d.icon.scale=num(scaleBox.value,100);
        if(readout)readout.textContent=d.icon.scale+'%';
        if(tile)tile.style.setProperty('--is',Math.max(0.5,Math.min(1.8,d.icon.scale/100)));
      });
    }

    var pic=scrim.querySelector('#i-pic');
    if(pic)pic.addEventListener('click',function(){
      grab(scrim);closeModal();
      avatarPicker(function(uri){d.icon.image=uri;openModal(body(),mount,{dismissable:false});});
    });
    var nopic=scrim.querySelector('#i-nopic');
    if(nopic)nopic.addEventListener('click',function(){
      grab(scrim);delete d.icon.image;delete d.icon.emoji;
      var box=scrim.querySelector('#i-emoji');if(box)box.value='';
      redraw();
    });

    var prev=scrim.querySelector('#i-preview');
    if(prev){
      var av=availability(d);
      prev.textContent=d.avail.start
        ? (av.open?'On the shelf now — '+av.label:'Off the shelf — '+av.label)
        : 'Pick a first date to see when it comes and goes.';
    }

    scrim.querySelector('#i-save').addEventListener('click',function(){
      grab(scrim);
      var err=scrim.querySelector('#i-err');
      if(!d.title){err.textContent='Give it a name.';return;}
      if(d.avail.mode==='window'&&(!d.avail.start||!d.avail.end)){
        err.textContent='A date window needs both dates.';return;}
      if(d.avail.mode==='window'&&dnum(d.avail.end)<dnum(d.avail.start)){
        err.textContent='The end date is before the start date.';return;}
      if(d.avail.mode==='season'&&!d.avail.start){
        err.textContent='A cycle needs a first date.';return;}
      if(d.sale.on&&d.sale.max<d.sale.min){
        err.textContent='The most off cannot be less than the least off.';return;}
      var i=-1;
      for(var k=0;k<S.store.length;k++)if(S.store[k].id===d.id)i=k;
      if(i>=0)S.store[i]=d;else S.store.push(d);
      save();closeModal();
      toast(existing?'Item saved.':'"'+d.title+'" added to the store.','good');
      go('store');
    });
  }
  openModal(body(),mount,{dismissable:false});
}

/* =========================================================
   Activities. Things a reader does that are worth points —
   chores, practice, anything. One-off or on a repeat, for
   everyone or for named readers, credited at once or held
   for an instructor to approve.
   ========================================================= */

var CADENCE={once:'Once',daily:'Every day',weekly:'Every week',monthly:'Every month'};
var PERIOD_WORD={daily:'today',weekly:'this week',monthly:'this month'};

function logOf(p){p=p||me();return (p&&p.activities)?p.activities:[];}
function activityPoints(p){
  p=p||me();
  return Math.round(logOf(p).reduce(function(s,r){
    return s+(r.approved?(Number(r.points)||0):0);
  },0)*10)/10;
}
function activityById(id){
  for(var i=0;i<S.activities.length;i++)if(S.activities[i].id===id)return S.activities[i];
  return null;
}
function assignedTo(a,p){
  var as=a.assign||{mode:'all'};
  if(as.mode!=='some')return true;
  return (as.ids||[]).indexOf(p.id)>=0;
}

/* ---------- when does the counter reset ---------- */
function periodStart(mode,now){
  now=now||new Date();
  var d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0);
  if(mode==='daily')return d;
  if(mode==='weekly')return addDays(d,-((d.getDay()+6)%7));   /* weeks start Monday */
  if(mode==='monthly')return new Date(now.getFullYear(),now.getMonth(),1,0,0,0);
  return null;
}
function periodEnd(mode,start){
  if(mode==='daily')return addDays(start,1);
  if(mode==='weekly')return addDays(start,7);
  if(mode==='monthly')return addMonths(start,1);
  return null;
}
function doneBetween(list,a,b){
  return list.filter(function(r){
    var t=new Date(r.date);
    return t>=a&&t<b;
  });
}

/* ---------- can this reader log it right now ---------- */
function activityState(a,p){
  p=p||me();
  var mine=logOf(p).filter(function(r){return r.activityId===a.id;});
  var pending=mine.filter(function(r){return !r.approved;}).length;
  var cad=a.cadence||{mode:'once',limit:1,perDay:0};
  var out={can:true,label:'',tone:'cold',done:mine.length,pending:pending,left:null};

  if(!assignedTo(a,p))return{can:false,label:'Not assigned to you',tone:'cold',done:0,pending:0};

  /* A limited-time activity only counts while it is actually running. */
  var av=availability(a);
  if(!av.open)return{can:false,label:av.label||'Not available',tone:'cold',
    done:mine.length,pending:pending,window:av};
  out.window=av;

  if(cad.mode==='once'){
    if(mine.length)return{can:false,label:pending?'Waiting to be approved':'Completed',
      tone:pending?'warm':'good',done:mine.length,pending:pending,window:av};
    out.label='One time';
    return out;
  }

  var limit=Math.max(1,num(cad.limit,1));
  var ps=periodStart(cad.mode),pe=periodEnd(cad.mode,ps);
  var inPeriod=doneBetween(mine,ps,pe).length;
  if(inPeriod>=limit){
    return{can:false,label:'Done for '+PERIOD_WORD[cad.mode],tone:'good',
      done:mine.length,pending:pending};
  }

  /* A weekly or monthly allowance can still be capped per day. */
  if(cad.mode!=='daily'&&num(cad.perDay,0)>0){
    var ds=periodStart('daily'),de=addDays(ds,1);
    if(doneBetween(mine,ds,de).length>=num(cad.perDay,0)){
      return{can:false,label:'Done for today',tone:'good',done:mine.length,pending:pending};
    }
  }

  out.left=limit-inPeriod;
  out.label=(limit===1)
    ? CADENCE[cad.mode]
    : out.left+' left '+PERIOD_WORD[cad.mode];
  return out;
}

function logActivity(id){
  var a=activityById(id),p=me();
  if(!a||!p)return;
  var st=activityState(a,p);
  if(!st.can){toast(st.label,'bad');return;}
  var ab=withBoost(num(a.points,0),p);
  var entry={id:uid(),activityId:a.id,title:a.title,points:ab.points,boost:ab.boost,
    icon:a.icon,date:nowISO(),approved:!a.approval};
  p.activities=logOf(p).concat([entry]);
  save();
  if(!a.approval)grantBonus(a,p,'activity');
  settleStreaks();
  checkWishReached();
  snapshot('after '+p.name+' logged '+a.title);
  toast(a.approval
    ? '"'+a.title+'" logged. It needs approving before the points land.'
    : '"'+a.title+'" done. '+pts(a.points)+' points added.', a.approval?'':'good');
  render();
}

/* ---------- reader view ---------- */
function viewActivities(){
  var p=me();
  var list=S.activities.filter(function(a){
    if(S.admin)return true;
    if(a.hidden)return false;
    if(!assignedTo(a,p))return false;
    if(a.hideWhenClosed&&!availability(a).open)return false;
    return true;
  });

  var h='<div class="pagehead"><div><h2>Activities</h2>'+
    '<div class="sub">Things worth points besides reading</div></div>'+
    '<div class="row"><div class="stat" style="min-width:120px"><div class="k">Points to spend</div>'+
    '<div class="v" style="color:var(--gold-hi)">'+pts(balance(p))+'</div></div></div></div>';

  if(S.admin){
    var waiting=0;
    S.profiles.forEach(function(pp){
      waiting+=logOf(pp).filter(function(r){return !r.approved;}).length;
    });
    h+='<div class="row stack">'+
      '<button class="btn btn-primary" data-act="act-new">'+ico('plus')+'Add an activity</button>'+
      '<button class="btn" data-go="approvals">'+ico('file')+'Approvals'+(waiting?' ('+waiting+')':'')+'</button>'+
      '</div>';
  }

  h+=streakStrip('activity');
  if(!list.length){
    return h+'<div class="empty stack"><h3>'+(S.admin?'No activities yet':'Nothing to do yet')+'</h3>'+
      '<p class="muted">'+(S.admin
        ? 'Add something a reader does regularly, say what it is worth, and how often it counts.'
        : 'Your instructor has not set any activities for you.')+'</p>'+
      (S.admin?'<div class="stack"><button class="btn btn-primary" data-act="act-new">'+ico('plus')+'Add an activity</button></div>':'')+
      '</div>';
  }

  h+='<div class="actlist stack">';
  list.sort(function(a,b){
    var sa=activityState(a,p),sb=activityState(b,p);
    if(sa.can!==sb.can)return sa.can?-1:1;
    return b.points-a.points;
  }).forEach(function(a){
    var st=activityState(a,p);
    var who=(a.assign&&a.assign.mode==='some')
      ? (a.assign.ids||[]).map(function(id){var x=profile(id);return x?x.name:null;})
          .filter(Boolean).join(', ')
      : '';
    var av=st.window||availability(a);
    var tag='';
    if(av.open&&av.label&&/day|Last/.test(av.label)){
      var isLast=/Last/.test(av.label);
      var left=isLast?0:parseInt(av.label,10);
      tag='<span class="badges" aria-hidden="true"><span class="btime '+
        (isLast||left<=1?'last':(left<=5?'soon':''))+'"><span class="dot"></span>'+
        esc(isLast?'LAST DAY':av.label.toUpperCase())+'</span></span>';
    }
    h+='<div class="actrow '+(st.can?'open':'shut')+'">'+tag+
      renderIcon(a.icon)+
      '<div class="body"><h4>'+esc(a.title)+'</h4>'+
      (a.blurb?'<div class="sub">'+esc(a.blurb)+'</div>':'')+
      '<div class="meta">'+
        '<span class="pill '+st.tone+'">'+esc(st.label)+'</span>'+
        (st.pending?'<span class="pill warm">'+st.pending+' waiting</span>':'')+
        (a.approval?'<span class="pill cold">needs approving</span>':'')+
        (who?'<span class="pill cold">for '+esc(who)+'</span>':'')+
        (a.hidden?'<span class="pill cold">hidden</span>':'')+
      '</div>'+bonusStrip(a,p)+'</div>'+
      '<div style="text-align:right;display:grid;gap:8px;justify-items:end">'+
        '<span class="worth">+'+pts(a.points)+'</span>'+
        (st.can?'<button class="btn btn-sm btn-primary" data-act="act-do" data-id="'+esc(a.id)+'">Mark done</button>':'')+
        (S.admin?'<span class="row" style="gap:5px">'+
          '<button class="btn btn-sm btn-ghost" data-act="act-edit" data-id="'+esc(a.id)+'">Edit</button>'+
          '<button class="btn btn-sm btn-danger" data-act="act-del" data-id="'+esc(a.id)+'">Remove</button></span>':'')+
      '</div></div>';
  });
  return h+'</div>';
}

/* ---------- approvals ---------- */
function viewApprovals(){

      '<div class="row" style="gap:6px">'+

  });
  return h+'</div>';
}
function findLog(id){
  for(var i=0;i<S.profiles.length;i++){
    var l=logOf(S.profiles[i]);
    for(var j=0;j<l.length;j++)if(l[j].id===id)return{p:S.profiles[i],r:l[j],i:j};
  }
  return null;
}

  }
  function grab(scrim){
    var g=function(id){var el=scrim.querySelector(id);return el?el.value:null;};
    if(g('#i-title')!==null)d.title=g('#i-title').trim();
    if(g('#i-blurb')!==null)d.blurb=g('#i-blurb').trim();
    if(g('#i-points')!==null)d.points=Math.max(0,num(g('#i-points'),0));
    if(g('#i-limit')!==null)d.cadence.limit=Math.max(1,num(g('#i-limit'),1));
    if(g('#i-perday')!==null)d.cadence.perDay=Math.max(0,num(g('#i-perday'),0));
    if(g('#v-start')!==null)d.avail.start=g('#v-start');
    if(g('#v-end')!==null)d.avail.end=g('#v-end');
    if(g('#v-days')!==null)d.avail.days=Math.max(1,num(g('#v-days'),7));
    if(g('#v-every')!==null)d.avail.everyMonths=Math.max(1,num(g('#v-every'),12));
    if(g('#i-scale')!==null)d.icon.scale=Math.max(50,Math.min(180,num(g('#i-scale'),100)));
    if(g('#i-emoji')!==null){
      var em=g('#i-emoji').trim();
      if(em){d.icon.emoji=em;delete d.icon.image;}else delete d.icon.emoji;
    }
    bonusEditorGrab(scrim,d);
    var cb=function(id){var el=scrim.querySelector(id);return el?el.checked:false;};
    d.approval=cb('#i-approval');d.hidden=cb('#i-hidden');
    if(scrim.querySelector('#i-hideclosed'))d.hideWhenClosed=cb('#i-hideclosed');
  }
  function redraw(){redrawModal(body(),mount);}
  function mount(scrim){
    scrim.addEventListener('click',function(e){
      grab(scrim);
      if(bonusEditorClick(e,d)){redraw();return;}
      if(iconEditorClick(e,d.icon)){redraw();return;}
      var s=e.target.closest('[data-seg]');
      if(s){
        grab(scrim);
        if(s.dataset.seg==='cad')d.cadence.mode=s.dataset.v;
        else if(s.dataset.seg==='av')d.avail.mode=s.dataset.v;
        else d.assign.mode=s.dataset.v;
        redraw();return;
      }
      var w=e.target.closest('[data-who]');
      if(w){
        grab(scrim);
        var ids=d.assign.ids||[];
        var at=ids.indexOf(w.dataset.who);
        if(at>=0)ids.splice(at,1);else ids.push(w.dataset.who);
        d.assign.ids=ids;redraw();return;
      }
    });
    bonusEditorMount(scrim,d,redraw);
    var vp=scrim.querySelector('#v-preview');
    if(vp){
      var refreshAvail=function(){
        grab(scrim);
        var pav=availability(d);
        vp.textContent=d.avail.start
          ? (pav.open?'Running now — '+pav.label:'Not running — '+pav.label)
          : 'Pick a first date to see when it comes and goes.';
      };
      refreshAvail();
      ['#v-start','#v-days','#v-every'].forEach(function(sel){
        var el=scrim.querySelector(sel);
        if(el)el.addEventListener('input',refreshAvail);
      });
    }

    var scaleBox=scrim.querySelector('#i-scale');
    if(scaleBox){
      var readout=scrim.querySelector('#i-scale-v');
      var tile=scrim.querySelector('.ic');
      scaleBox.addEventListener('input',function(){
        d.icon.scale=num(scaleBox.value,100);
        if(readout)readout.textContent=d.icon.scale+'%';
        if(tile)tile.style.setProperty('--is',Math.max(0.5,Math.min(1.8,d.icon.scale/100)));
      });
    }

    var pic=scrim.querySelector('#i-pic');
    if(pic)pic.addEventListener('click',function(){
      grab(scrim);closeModal();
      avatarPicker(function(uri){d.icon.image=uri;openModal(body(),mount,{dismissable:false});});
    });
    var nopic=scrim.querySelector('#i-nopic');
    if(nopic)nopic.addEventListener('click',function(){
      grab(scrim);delete d.icon.image;delete d.icon.emoji;
      var box=scrim.querySelector('#i-emoji');if(box)box.value='';
      redraw();
    });
    scrim.querySelector('#i-save').addEventListener('click',function(){
      grab(scrim);
      var err=scrim.querySelector('#i-err');
      if(!d.title){err.textContent='Give it a name.';return;}
      if(d.assign.mode==='some'&&!(d.assign.ids||[]).length){
        err.textContent='Pick at least one reader, or make it for everyone.';return;}
      if(d.avail.mode==='window'&&(!d.avail.start||!d.avail.end)){
        err.textContent='A date window needs both dates.';return;}
      if(d.avail.mode==='window'&&dnum(d.avail.end)<dnum(d.avail.start)){
        err.textContent='The end date is before the start date.';return;}
      if(d.avail.mode==='season'&&!d.avail.start){
        err.textContent='A cycle needs a first date.';return;}
      var i=-1;
      for(var k=0;k<S.activities.length;k++)if(S.activities[k].id===d.id)i=k;
      if(i>=0)S.activities[i]=d;else S.activities.push(d);
      save();closeModal();
      toast(existing?'Activity saved.':'"'+d.title+'" added.','good');
      go('activities');
    });
  }
  openModal(body(),mount,{dismissable:false});
}

/* =========================================================
   Restore points.

   Live data is a single copy in localStorage. These are the
   safety net: compressed snapshots kept in IndexedDB, taken
   automatically at safe moments and always before anything
   destructive. They protect against mistakes, not against
   losing the device — only a downloaded file does that, so
   the app also keeps track of how long it has been.
   ========================================================= */

var DBNAME='piphub', DBVER=2;
var SNAP_MIN_GAP=90*1000;        /* a floor on automatic snapshots; the content
                                    check below already stops duplicates */
var EXPORT_NAG_DAYS=14;
var snapLast=0, snapBusy=false;

function idb(){
  return new Promise(function(res,rej){
    if(!window.indexedDB)return rej(new Error('no IndexedDB'));
    var r=indexedDB.open(DBNAME,DBVER);
    r.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains('snapmeta'))db.createObjectStore('snapmeta',{keyPath:'id'});
      if(!db.objectStoreNames.contains('snapdata'))db.createObjectStore('snapdata',{keyPath:'id'});
      if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});
    };
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error||new Error('IndexedDB refused'));};
  });
}
function tx(store,mode,fn){
  return idb().then(function(db){
    return new Promise(function(res,rej){
      var t=db.transaction(store,mode);
      var out=fn(t.objectStore(store[0]||store),t);
      t.oncomplete=function(){res(out&&out.result!==undefined?out.result:out);};
      t.onerror=function(){rej(t.error);};
      t.onabort=function(){rej(t.error);};
    });
  });
}
function idbAll(store){
  return idb().then(function(db){
    return new Promise(function(res,rej){
      var t=db.transaction(store,'readonly');
      var r=t.objectStore(store).getAll();
      r.onsuccess=function(){res(r.result||[]);};
      r.onerror=function(){rej(r.error);};
    });
  });
}
function idbPut(store,value){
  return idb().then(function(db){
    return new Promise(function(res,rej){
      var t=db.transaction(store,'readwrite');
      t.objectStore(store).put(value);
      t.oncomplete=function(){res(true);};
      t.onerror=function(){rej(t.error);};
    });
  });
}
function idbGet(store,id){
  return idb().then(function(db){
    return new Promise(function(res,rej){
      var t=db.transaction(store,'readonly');
      var r=t.objectStore(store).get(id);
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){rej(r.error);};
    });
  });
}
function idbDel(store,id){
  return idb().then(function(db){
    return new Promise(function(res,rej){
      var t=db.transaction(store,'readwrite');
      t.objectStore(store)['delete'](id);
      t.oncomplete=function(){res(true);};
      t.onerror=function(){rej(t.error);};
    });
  });
}

/* ---------- compression ---------- */
function squash(str){
  if(typeof CompressionStream==='undefined')return Promise.resolve({raw:str});
  try{
    var s=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Response(s).arrayBuffer().then(function(b){return{gz:new Uint8Array(b)};},
      function(){return{raw:str};});
  }catch(e){return Promise.resolve({raw:str});}
}
function unsquash(rec){
  if(rec.raw!=null)return Promise.resolve(rec.raw);
  try{
    var s=new Blob([rec.gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(s).text();
  }catch(e){return Promise.reject(new Error('could not read this restore point'));}
}

/* ---------- what a snapshot contains ---------- */
function statePayload(scope){
  scope=scope||'all';
  var out={schema:'pip-backup/2',exported:nowISO(),scope:scope,app:'PipHub'};
  if(scope!=='content')out.profiles=S.profiles;
  if(scope!=='readers'){
    out.modules=S.modules;out.store=S.store;out.activities=S.activities;out.streaks=S.streaks;out.events=S.events;
    var st={};
    for(var k in S.settings)if(Object.prototype.hasOwnProperty.call(S.settings,k))st[k]=S.settings[k];
    out.settings=st;
  }
  out.counts=countsOf(out);
  out.check=fingerprint(JSON.stringify([out.profiles,out.modules,out.store,out.activities]));
  return out;
}
function countsOf(d){
  return{
    readers:(d.profiles||[]).length,
    titles:(d.modules||[]).length,
    items:(d.store||[]).length,
    activities:(d.activities||[]).length,
    records:(d.profiles||[]).reduce(function(s,p){return s+((p.records||[]).length);},0)
  };
}
function fingerprint(str){
  var h=2166136261>>>0;
  for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*16777619)>>>0;}
  return h.toString(16);
}
function describeCounts(c){
  if(!c)return '';
  var bits=[];
  if(c.readers)bits.push(c.readers+(c.readers===1?' reader':' readers'));
  if(c.titles)bits.push(c.titles+(c.titles===1?' title':' titles'));
  if(c.records)bits.push(c.records+(c.records===1?' result':' results'));
  if(c.items)bits.push(c.items+(c.items===1?' store item':' store items'));
  if(c.activities)bits.push(c.activities+(c.activities===1?' activity':' activities'));
  return bits.join(', ')||'nothing yet';
}
function niceBytes(n){
  if(n<1024)return n+' B';
  if(n<1024*1024)return (n/1024).toFixed(0)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}
function sinceWords(iso){
  if(!iso)return 'never';
  var mins=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(mins<1)return 'just now';
  if(mins<60)return mins+(mins===1?' minute ago':' minutes ago');
  var hrs=Math.floor(mins/60);
  if(hrs<24)return hrs+(hrs===1?' hour ago':' hours ago');
  var days=Math.floor(hrs/24);
  if(days<31)return days+(days===1?' day ago':' days ago');
  return dateShort(iso);
}

/* ---------- taking one ---------- */
function snapshot(reason,opts){
  opts=opts||{};
  if(!window.indexedDB)return Promise.resolve(null);
  if(snapBusy)return Promise.resolve(null);
  if(!opts.force&&Date.now()-snapLast<SNAP_MIN_GAP)return Promise.resolve(null);
  if(!S.profiles.length&&!S.modules.length&&!S.store.length&&!S.activities.length)
    return Promise.resolve(null);

  var payload=statePayload('all');
  /* Nothing has actually changed since the last one, so there is nothing
     worth keeping. */
  if(!opts.force&&S.lastSnapCheck===payload.check)return Promise.resolve(null);

  snapBusy=true;
  var json=JSON.stringify(payload);
  return squash(json).then(function(packed){
    var id=uid();
    var meta={id:id,at:nowISO(),reason:String(reason||'automatic'),
      kind:opts.kind||(opts.force?'marked':'auto'),
      counts:payload.counts,check:payload.check,
      bytes:(packed.gz?packed.gz.length:json.length),
      plain:json.length,zipped:!!packed.gz};
    return idbPut('snapdata',{id:id,gz:packed.gz,raw:packed.raw}).then(function(){
      return idbPut('snapmeta',meta);
    }).then(function(){
      snapLast=Date.now();
      S.lastSnapCheck=payload.check;
      return prune().then(loadSnaps).then(function(){
        /* the list is on screen right now, so show it */
        if(S.view==='settings')render();
        return meta;
      });
    });
  }).catch(function(){return null;}).then(function(r){snapBusy=false;return r;});
}

/* ---------- keeping the list sane ----------
   Recent ones in full, then thinning out: one a day for a week, one a
   week for a month. Anything taken before a destructive action is kept
   for a fortnight regardless, because that is when you want it. */
function prune(){
  return idbAll('snapmeta').then(function(all){
    all.sort(function(a,b){return a.at<b.at?1:-1;});
    var keep={},now=Date.now();
    all.slice(0,6).forEach(function(m){keep[m.id]=1;});
    all.forEach(function(m){
      var age=now-new Date(m.at).getTime();
      if(m.kind==='guard'&&age<14*864e5)keep[m.id]=1;
      if(m.kind==='marked'&&age<60*864e5)keep[m.id]=1;
    });
    var days={},weeks={};
    all.forEach(function(m){
      var t=new Date(m.at),age=now-t.getTime();
      var dayKey=t.getFullYear()+'-'+t.getMonth()+'-'+t.getDate();
      var weekKey=t.getFullYear()+'-w'+Math.floor(t.getTime()/(7*864e5));
      if(age<7*864e5&&!days[dayKey]){days[dayKey]=1;keep[m.id]=1;}
      else if(age<31*864e5&&!weeks[weekKey]){weeks[weekKey]=1;keep[m.id]=1;}
    });
    var drop=all.filter(function(m){return !keep[m.id];});
    return Promise.all(drop.map(function(m){
      return idbDel('snapdata',m.id).then(function(){return idbDel('snapmeta',m.id);});
    }));
  }).catch(function(){});
}

/* A snapshot taken deliberately because something is about to be undone. */
function guard(reason,then){
  snapshot(reason,{force:true,kind:'guard'}).then(function(){then();},function(){then();});
}

function loadSnaps(){
  return idbAll('snapmeta').then(function(all){
    all.sort(function(a,b){return a.at<b.at?1:-1;});
    S.snaps=all;
    return all;
  },function(){S.snaps=[];return [];});
}

/* ---------- putting one back ---------- */
function restoreSnapshot(id){
  var meta=(S.snaps||[]).filter(function(m){return m.id===id;})[0];
  if(!meta)return;
  confirmModal('Go back to this restore point?',
    dateShort(meta.at)+', '+sinceWords(meta.at)+' — '+describeCounts(meta.counts)+
    '. Everything in the app now is replaced. A restore point is taken first, '+
    'so this can be undone.','Restore',function(){
      guard('before going back to an earlier point',function(){
        idbGet('snapdata',id).then(unsquash).then(function(json){
          var d=JSON.parse(json);
          applyPayload(d,'replace');
          save();
          toast('Restored the point from '+dateShort(meta.at)+'.','good');
          loadSnaps().then(function(){go(me()?'settings':'gate');});
        }).catch(function(){toast('That restore point could not be read.','bad');});
      });
    },true);
}

/* ---------- shared by restore points and backup files ---------- */
function applyPayload(d,mode){
  var hasReaders=Array.isArray(d.profiles);
  var hasContent=Array.isArray(d.modules)||Array.isArray(d.store)||Array.isArray(d.activities);
  if(mode==='replace'&&hasReaders){
    S.profiles=d.profiles;
    S.active=S.profiles.length?S.profiles[0].id:null;
  }
  if(hasContent){
    if(mode==='merge'){
      (d.modules||[]).forEach(function(m){var v=validate(m);if(v.ok)put(v.module);});
      (d.store||[]).forEach(function(it){
        if(!itemById(it.id))S.store.push(it);
        else S.store=S.store.map(function(x){return x.id===it.id?it:x;});
      });
      (d.activities||[]).forEach(function(a){
        if(!activityById(a.id))S.activities.push(a);
        else S.activities=S.activities.map(function(x){return x.id===a.id?a:x;});
      });
    }else{
      if(Array.isArray(d.modules))S.modules=d.modules;
      if(Array.isArray(d.store))S.store=d.store;
      if(Array.isArray(d.activities))S.activities=d.activities;
      if(Array.isArray(d.streaks))S.streaks=d.streaks;
      if(Array.isArray(d.events))S.events=d.events;
    }
  }
  if(d.settings){
    ['folder','assets','autoSync','theme','immersive'].forEach(function(k){
      if(d.settings[k]!==undefined)S.settings[k]=d.settings[k];
    });
    if(d.settings.pw&&mode==='replace')S.settings.pw=d.settings.pw;
  }
  S.profiles.forEach(function(p){
    if(!Array.isArray(p.records))p.records=[];
    if(!Array.isArray(p.purchases))p.purchases=[];
    if(!Array.isArray(p.activities))p.activities=[];
    if(!Array.isArray(p.adjustments))p.adjustments=[];
  });
  S.settings.seeded=true;
}

  download(name,JSON.stringify(d,null,2));
  S.settings.lastExport=nowISO();

function exportOverdue(){

  return (Date.now()-new Date(S.settings.lastExport).getTime())>EXPORT_NAG_DAYS*864e5;
}

function fillSnapSize(){

/* =========================================================
   Two things that reward coming back.

   A wish is the one item a reader is saving for. It can only
   be set on something out of reach, and redeeming it pays a
   slice back — the reward is for having saved rather than
   spent as you went.

   A streak is a run of periods in which a reader did enough:
   passing quizzes week after week, or doing activities day
   after day. Runs are worked out from the records that
   already exist, so nothing drifts and nothing needs
   ticking over in the background.
   ========================================================= */

/* ---------- money in from bonuses ---------- */
function paybackTotal(p){
  return Math.round(purchasesOf(p).reduce(function(s,r){
    return s+(Number(r.payback)||0);
  },0)*10)/10;
}
function streakAwardsOf(p){p=p||me();return (p&&p.streaks)?p.streaks:[];}
function streakTotal(p){
  return Math.round(streakAwardsOf(p).reduce(function(s,a){
    return s+(Number(a.points)||0);
  },0)*10)/10;
}
function bonusTotal(p){
  return Math.round((paybackTotal(p)+streakTotal(p))*10)/10;
}

/* =========================================================
   Wishlist
   ========================================================= */
function wishCfg(){
  var w=S.settings.wish||{};
  return{
    on:w.on!==false,
    shortfall:Math.max(0,num(w.shortfall,25)),   /* % the item must exceed the balance by */
    payback:Math.max(0,Math.min(100,num(w.payback,10))),
    cap:Math.max(0,num(w.cap,0))                 /* 0 = no cap */
  };
}
function wishOf(p){p=p||me();return (p&&p.wish&&p.wish.itemId)?p.wish:null;}
function wishItem(p){
  var w=wishOf(p);
  return w?itemById(w.itemId):null;
}
/* Out of reach by enough to be worth saving for. */
function canWish(item,p){
  p=p||me();
  var cfg=wishCfg();
  if(!cfg.on||!p||!item)return false;
  if(item.hidden)return false;
  var w=wishOf(p);
  if(w&&w.itemId===item.id)return false;         /* already the wish */
  var price=priceOf(item).now;
  if(price<=0)return false;
  return price>=balance(p)*(1+cfg.shortfall/100)+0.0001;
}
function isWish(item){
  var w=wishOf();
  return !!(w&&item&&w.itemId===item.id);
}
function wishProgress(p){
  p=p||me();
  var it=wishItem(p);
  if(!it)return null;
  var price=priceOf(it).now;
  var bal=balance(p);
  var short=Math.round(Math.max(0,price-bal)*10)/10;
  return{
    item:it,price:price,balance:bal,short:short,
    pct:price>0?Math.min(100,Math.round(bal/price*100)):100,
    ready:short<=0,
    payback:wishPayback(price)
  };
}
function wishPayback(price){
  var cfg=wishCfg();
  var pct=cfg.payback+abilityValue('payback');
  var n=Math.round(price*pct/100*10)/10;
  if(cfg.cap)n=Math.min(n,cfg.cap);
  return n;
}

/* Called whenever the balance may have moved, so reaching the goal is

/* =========================================================
   Streaks
   ========================================================= */
var STREAK_LOOKBACK=80;

function streakRules(){return Array.isArray(S.streaks)?S.streaks:[];}
function liveStreakRules(){
  return streakRules().filter(function(r){return r.on!==false;});
}
function ruleById(id){
  var l=streakRules();
  for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];
  return null;
}
function periodStarts(unit,count,now){
  now=now||new Date();
  var base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(unit==='week')base.setDate(base.getDate()-((base.getDay()+6)%7));
  var out=[];
  for(var i=0;i<count;i++){
    out.push(new Date(base.getTime()));
    base=addDays(base,unit==='week'?-7:-1);
  }
  return out;                                    /* newest first */
}
function periodKey(unit,start){
  return unit+':'+start.getFullYear()+'-'+(start.getMonth()+1)+'-'+start.getDate();
}
function eventsFor(rule,p){
  p=p||me();
  if(!p)return [];
  if(rule.source==='activity'){
    return logOf(p).filter(function(r){return r.approved;})
      .map(function(r){return new Date(r.date);});
  }
  return (p.records||[]).filter(function(r){return r.passed;})
    .map(function(r){return new Date(r.date);});
}
/* Everything the UI and the awarder need about one rule, right now. */
function streakState(rule,p){
  p=p||me();
  var unit=rule.unit==='week'?'week':'day';
  var need=Math.max(1,num(rule.perPeriod,1));
  var span=Math.max(1,num(rule.periods,3));
  var starts=periodStarts(unit,STREAK_LOOKBACK);
  var len=unit==='week'?7:1;
  var evts=eventsFor(rule,p);

  var counts=starts.map(function(s){
    var end=addDays(s,len);
    var n=0;
    for(var i=0;i<evts.length;i++)if(evts[i]>=s&&evts[i]<end)n++;
    return n;
  });
  var qual=counts.map(function(n){return n>=need;});

  /* The period in progress must not break a run it has not finished. */
  var i=qual[0]?0:1;
  var run=0;
  while(i+run<qual.length&&qual[i+run])run++;
  var startIdx=i;

  var done=Math.floor(run/span);
  var into=run%span;
  var milestones=[];
  for(var k=1;k<=done;k++){
    var idx=startIdx+run-k*span;
    if(idx>=0)milestones.push(periodKey(unit,starts[idx]));
  }
  return{
    unit:unit,need:need,span:span,run:run,
    thisPeriod:counts[0],inProgress:!qual[0],
    done:done,into:into,toGo:span-into,
    milestones:milestones,
    word:unit==='week'?'week':'day',
    nowWord:unit==='week'?'this week':'today',
    /* "Pass 2 quizzes" / "Do 2 activities", with the singular right */
    ask:(rule.source==='activity')
      ? 'Do '+need+' activit'+(need===1?'y':'ies')
      : 'Pass '+need+' quiz'+(need===1?'':'zes')
  };
}
/* Awards are idempotent: each milestone is remembered by the period that
   completed it, so re-checking never pays twice. */
function settleStreaks(){
  var p=me();
  if(!p)return;
  if(!Array.isArray(p.streaks))p.streaks=[];
  var given={},paid=0,names=[];
  p.streaks.forEach(function(a){given[a.ruleId+'|'+a.key]=1;});
  liveStreakRules().forEach(function(rule){
    if(rule.repeat===false&&p.streaks.some(function(a){return a.ruleId===rule.id;}))return;
    var st=streakState(rule,p);
    st.milestones.forEach(function(key){
      if(given[rule.id+'|'+key])return;
      var sb=withBoost(Math.max(0,num(rule.points,0)),p);
      var pointsFor=sb.points;
      p.streaks.push({id:uid(),ruleId:rule.id,key:key,points:pointsFor,boost:sb.boost,
        at:nowISO(),title:rule.title||'Streak'});
      given[rule.id+'|'+key]=1;
      paid+=pointsFor;names.push(rule.title||'a streak');
      momentStreak(rule,pointsFor);
    });
  });
  if(paid>0)save();
}

/* ---------- reader-facing strip ---------- */
function streakStrip(source){
  var p=me();
  if(!p)return '';
  var rules=liveStreakRules().filter(function(r){return (r.source||'quiz')===source;});
  if(!rules.length)return '';
  var h='<div class="streaks">';
  rules.forEach(function(rule){
    var st=streakState(rule,p);
    var dots='';
    for(var k=0;k<st.span;k++){
      dots+='<i class="'+(k<st.into?'lit':'')+'"></i>';
    }
    h+='<div class="streak'+(st.run?' alive':'')+'">'+
      '<div class="flame" aria-hidden="true">'+(st.run?st.run:'')+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="t">'+esc(rule.title||'Streak')+'</div>'+
        '<div class="d">'+
          (st.run
            ? st.run+' '+st.word+(st.run===1?'':'s')+' running &nbsp;·&nbsp; '+
              st.toGo+' more for '+pts(num(rule.points,0))+' points'
            : st.ask+' '+st.nowWord+' to start it')+
        '</div>'+
        '<div class="dots">'+dots+'</div>'+
      '</div>'+
      '<div class="now">'+st.thisPeriod+' / '+st.need+
        '<span>'+st.nowWord+'</span></div>'+
      '</div>';
  });
  return h+'</div>';
}

function streakEditor(existing){
  var d=existing?JSON.parse(JSON.stringify(existing)):{

    perPeriod:1,periods:3,points:5,repeat:true,created:nowISO()

  function seg(field,opts,cur){

      '<div class="stack">'+seg('src',[['quiz','Quizzes passed'],['activity','Activities done']],d.source)+'</div>'+
      '<h4 style="font-size:.95rem;color:var(--text-hi);margin-top:16px">Over what period</h4>'+
      '<div class="stack">'+seg('unit',[['day','Each day'],['week','Each week']],d.unit)+'</div>'+

        '<div class="row" style="gap:10px">'+
          '<label class="field" style="flex:1"><span>'+esc(counting)+' needed per '+word+'</span>'+
          '<input class="inp" id="k-per" type="number" min="1" value="'+esc(d.perPeriod)+'"></label>'+
          '<label class="field" style="flex:1"><span>'+word+'s in a row</span>'+
          '<input class="inp" id="k-span" type="number" min="1" value="'+esc(d.periods)+'"></label>'+
        '</div>'+
        '<label class="field"><span>Points when the run is complete</span>'+
        '<input class="inp" id="k-points" type="number" min="0" step="0.5" value="'+esc(d.points)+'"></label>'+
        '<p class="tiny" id="k-preview" style="color:var(--gold-hi)"></p>'+
      '</div>'+

      '<label class="check"><input type="checkbox" id="k-repeat"'+(d.repeat!==false?' checked':'')+
      '><span>Pay again every time the run is completed, not just the first</span></label>'+
      '<label class="check"><input type="checkbox" id="k-on"'+(d.on!==false?' checked':'')+
      '><span>Running — readers can see it and earn from it</span></label>'+
      '<div class="err" id="k-err"></div>'+
      '<div class="foot"><button class="btn" data-close>Cancel</button>'+
      '<button class="btn btn-primary" id="k-save">'+(existing?'Save streak':'Add streak')+'</button></div>';
  }
  function grab(scrim){
    var g=function(s){var el=scrim.querySelector(s);return el?el.value:null;};
    if(g('#k-title')!==null)d.title=g('#k-title').trim();
    if(g('#k-per')!==null)d.perPeriod=Math.max(1,num(g('#k-per'),1));
    if(g('#k-span')!==null)d.periods=Math.max(1,num(g('#k-span'),3));
    if(g('#k-points')!==null)d.points=Math.max(0,num(g('#k-points'),0));
    var cb=function(s){var el=scrim.querySelector(s);return el?el.checked:false;};
    d.repeat=cb('#k-repeat');d.on=cb('#k-on');
  }
  function redraw(){redrawModal(body(),mount);}
  function mount(scrim){
    scrim.addEventListener('click',function(e){
      var s=e.target.closest('[data-seg]');
      if(!s)return;
      grab(scrim);
      if(s.dataset.seg==='src')d.source=s.dataset.v;else d.unit=s.dataset.v;
      redraw();
    });
    var prev=scrim.querySelector('#k-preview');
    function refresh(){
      grab(scrim);
      var word=d.unit==='week'?'week':'day';
      prev.textContent='Pass '+d.perPeriod+' '+
        (d.source==='activity'?'activit'+(d.perPeriod===1?'y':'ies'):'quiz'+(d.perPeriod===1?'':'zes'))+
        ' every '+word+' for '+d.periods+' '+word+(d.periods===1?'':'s')+' in a row, and earn '+
        pts(d.points)+' points'+(d.repeat?', every time.':', once.');
    }
    refresh();
    ['#k-per','#k-span','#k-points'].forEach(function(sel){
      var el=scrim.querySelector(sel);
      if(el)el.addEventListener('input',refresh);
    });
    var rep=scrim.querySelector('#k-repeat');
    if(rep)rep.addEventListener('change',refresh);
    scrim.querySelector('#k-save').addEventListener('click',function(){
      grab(scrim);
      if(!d.title){scrim.querySelector('#k-err').textContent='Give it a name readers will understand.';return;}
      var i=-1,l=streakRules();
      for(var k=0;k<l.length;k++)if(l[k].id===d.id)i=k;
      if(i>=0)S.streaks[i]=d;else S.streaks.push(d);
      save();closeModal();
      toast(existing?'Streak saved.':'"'+d.title+'" added.','good');
      settleStreaks();render();
    });
  }
  openModal(body(),mount,{dismissable:false});
}

function pipMouth(kind,ink){
  if(kind==='open') return '<path d="M54 69 q10 15 20 0 q-10 5 -20 0 z" fill="'+ink+'"/>';
  if(kind==='frown')return '<path d="M56 77 q8 -7 16 0" stroke="'+ink+'" stroke-width="3.4" fill="none" stroke-linecap="round"/>';
  if(kind==='snore')return '<ellipse cx="64" cy="74" rx="4.4" ry="5.6" fill="'+ink+'" opacity=".85"/>';
  if(kind==='soft') return '<path d="M57 70 q7 5 14 0" stroke="'+ink+'" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
  return '<path d="M56 69 q8 8 16 0" stroke="'+ink+'" stroke-width="3.4" fill="none" stroke-linecap="round"/>';
}
function pipEyes(style,pose,mouth,ink){
  var ex=52,ey=57,out='',i,x;
  if(pose==='sleep'){
    for(i=0;i<2;i++){x=ex+i*24;
      out+='<path d="M'+(x-7)+' '+ey+' q7 7 14 0" stroke="'+ink+'" stroke-width="3.6" fill="none" stroke-linecap="round"/>';}
    return out;
  }
  if(style==='star'){
    for(i=0;i<2;i++){x=ex+i*24;
      out+='<path d="M'+x+' '+(ey-9)+' l2.8 5.8 6.4.9 -4.6 4.4 1.1 6.3 -5.7-3 -5.7 3 1.1-6.3 -4.6-4.4 6.4-.9z" fill="'+ink+'"/>';}
    return out;
  }
  if(style==='happy'){
    for(i=0;i<2;i++){x=ex+i*24;
      out+='<path d="M'+(x-7)+' '+(ey+3)+' q7 -10 14 0" stroke="'+ink+'" stroke-width="4.2" fill="none" stroke-linecap="round"/>';}
    return out;
  }
  if(style==='visor'){
    return '<rect x="'+(ex-16)+'" y="'+(ey-11)+'" width="56" height="22" rx="11" fill="'+ink+'"/>'+
           '<rect x="'+(ex-11)+'" y="'+(ey-7)+'" width="18" height="7" rx="3.5" fill="#5FE3B0" opacity=".9"/>';
  }
  if(style==='button'){
    for(i=0;i<2;i++){x=ex+i*24;
      out+='<circle cx="'+x+'" cy="'+ey+'" r="8.2" fill="'+ink+'"/>'+
           '<circle cx="'+x+'" cy="'+ey+'" r="6" fill="none" stroke="#fff" stroke-width="1" opacity=".35"/>'+
           '<path d="M'+(x-2.4)+' '+(ey-2.4)+' l4.8 4.8 M'+(x+2.4)+' '+(ey-2.4)+' l-4.8 4.8" stroke="#F1CB5A" stroke-width="1.6" stroke-linecap="round"/>';}
    return out;
  }
  if(mouth==='frown'){
    for(i=0;i<2;i++){x=ex+i*24;
      out+='<ellipse cx="'+x+'" cy="'+(ey+2)+'" rx="7.4" ry="7.8" fill="'+ink+'"/>'+
           '<circle cx="'+(x+2.8)+'" cy="'+(ey-1)+'" r="2.3" fill="#fff"/>';}
    return out;
  }
  var big=(mouth==='open')?1.22:1, r=8.6*big;
  for(i=0;i<2;i++){
    x=ex+i*24;
    out+='<ellipse cx="'+x+'" cy="'+ey+'" rx="'+r.toFixed(1)+'" ry="'+(r*1.06).toFixed(1)+'" fill="'+ink+'"/>'+
         '<circle cx="'+(x+3.4).toFixed(1)+'" cy="'+(ey-3.6).toFixed(1)+'" r="'+(2.7*big).toFixed(1)+'" fill="#fff"/>'+
         '<circle cx="'+(x-2.6).toFixed(1)+'" cy="'+(ey+3.2).toFixed(1)+'" r="'+(1.2*big).toFixed(1)+'" fill="#fff" opacity=".75"/>';
  }
  return out;
}

var pipUid=0;
function pipSVG(look,pose,size,opts){
  look=look||{};opts=opts||{};
  var A=PIP_ART;
  var P=A.poses[pose]||A.poses.idle;
  var c=A.bodies[look.body]||A.bodies.sun;
  var lo=c[0],mid=c[1],hi=c[2],ink=A.ink;
  var n='p'+(++pipUid);                       /* ids must be unique per instance */
  var sq=P.squash,tilt=P.tilt;

  var defs=
    '<linearGradient id="skin'+n+'" x1=".25" y1="0" x2=".7" y2="1">'+
      '<stop offset="0" stop-color="'+lo+'"/><stop offset=".48" stop-color="'+mid+'"/>'+
      '<stop offset="1" stop-color="'+hi+'"/></linearGradient>'+
    '<radialGradient id="key'+n+'" cx=".33" cy=".26" r=".62">'+
      '<stop offset="0" stop-color="#fff" stop-opacity=".55"/>'+
      '<stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>'+
    '<radialGradient id="occ'+n+'" cx=".55" cy=".95" r=".6">'+
      '<stop offset="0" stop-color="'+hi+'" stop-opacity=".75"/>'+
      '<stop offset="1" stop-color="'+hi+'" stop-opacity="0"/></radialGradient>'+
    '<radialGradient id="aur'+n+'"><stop offset=".45" stop-color="'+mid+'" stop-opacity="0"/>'+
      '<stop offset=".8" stop-color="'+mid+'" stop-opacity=".45"/>'+
      '<stop offset="1" stop-color="'+mid+'" stop-opacity="0"/></radialGradient>'+
    '<clipPath id="clip'+n+'"><path d="'+A.bodyPath+'"/></clipPath>'+
    '<clipPath id="fth'+n+'"><rect x="-20" y="-20" width="160" height="160"/></clipPath>'+
    '<clipPath id="cap'+n+'"><path d="M30 28 C30 4 98 4 98 28 C90 33 38 33 30 28 Z"/></clipPath>'+
    '<clipPath id="msh'+n+'"><circle cx="104" cy="28" r="22"/></clipPath>'+
    '<radialGradient id="moon'+n+'"><stop offset=".5" stop-color="#FFB347" stop-opacity=".45"/>'+
      '<stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/></radialGradient>';

  function fix(s){
    return String(s||'')
      .split('url(#skinclip)').join('url(#clip'+n+')')
      .split('url(#featherclip)').join('url(#fth'+n+')')
      .split('url(#capclip)').join('url(#cap'+n+')')
      .split('url(#moonglow)').join('url(#moon'+n+')')
      .split('url(#moonshade)').join('url(#msh'+n+')')
      .split('url(#aura)').join('url(#aur'+n+')')
      .split('url(#skin)').join('url(#skin'+n+')')
      .split('__HI__').join(hi).split('__MID__').join(mid).split('__LO__').join(lo);
  }

  var aura=look.aura?fix(A.auras[look.aura]||''):'';
  var back=look.back?fix(A.backs[look.back]||''):'';
  var pat=look.pattern?fix(A.patterns[look.pattern]||''):'';
  /* Weather sits in front of everything: the one layer that can cross Pip. */
  var fx=(look.fx&&A.fxs)?fix(A.fxs[look.fx]||''):'';
  var hat='',held='';
  if(look.hat&&A.hats[look.hat]){
    hat=fix(A.hats[look.hat]).replace('translate(0,0)',
      'translate('+(P.head[0]-60)+','+(P.head[1]-20)+')');
  }
  if(look.held&&A.helds[look.held]){
    held=fix(A.helds[look.held]).replace('translate(0,0)',
      'translate('+P.hand[0]+','+P.hand[1]+')');
  }

  var g='url(#skin'+n+')';
  var body=
    '<g class="pip-breathe">'+
    '<g transform="rotate('+tilt+' 60 62) translate(0,'+(sq*14).toFixed(1)+') '+
      'scale('+(1+sq).toFixed(3)+','+(1-sq).toFixed(3)+') '+
      'translate('+(-60*sq).toFixed(1)+','+(62*sq).toFixed(1)+')">'+
      '<ellipse cx="46" cy="101" rx="11.5" ry="8.5" fill="'+g+'"/>'+
      '<ellipse cx="73" cy="101" rx="11.5" ry="8.5" fill="'+g+'"/>'+
      '<ellipse cx="19" cy="68" rx="10.5" ry="8.5" fill="'+g+'"/>'+
      '<path d="M42 23 C36 6 46 1 52 10 C55 15 54 20 52 25 Z" fill="'+g+'"/>'+
      '<path d="'+A.bodyPath+'" fill="'+g+'"/>'+
      '<g clip-path="url(#clip'+n+')">'+
        '<ellipse cx="60" cy="104" rx="52" ry="30" fill="url(#occ'+n+')"/>'+
        '<ellipse cx="46" cy="40" rx="40" ry="34" fill="url(#key'+n+')"/>'+
      '</g>'+pat+
      '<ellipse cx="38" cy="70" rx="6.5" ry="4" fill="#FF6E93" opacity=".33"/>'+
      '<ellipse cx="88" cy="70" rx="6.5" ry="4" fill="#FF6E93" opacity=".33"/>'+
      '<g class="pip-eyes">'+pipEyes(look.eyes||'dot',pose,P.mouth,ink)+'</g>'+
      pipMouth(P.mouth,ink)+
    '</g></g>';

  var shade=(opts.shadow===false)?'':'<ellipse cx="62" cy="110" rx="34" ry="7" fill="#000" opacity=".18"/>';
  /* Small previews stay still: a grid of thirty animating Pips is a lot of
     work for no benefit. */
  var live=(opts.still===true)?false:(size>=64);
  return '<svg class="pip'+(live?' pip-live':'')+'" xmlns="http://www.w3.org/2000/svg" viewBox="-10 -14 140 140" '+
    'width="'+size+'" height="'+size+'" aria-hidden="true">'+
    '<defs>'+defs+'</defs>'+aura+shade+back+body+held+hat+fx+'</svg>';
}

/* Seasons. A seasonal part or look is only on the shelf inside its window
   (month, day — the year wraps, so winter can run Dec to Feb). Anything
   already unlocked stays the reader's for good, in or out of season. */
var PIP_SEASONS={
  autumn:{name:'Autumn',from:[9,1],to:[11,30]}
};
function pipSeasonWindow(key,now){
  var s=PIP_SEASONS[key];
  if(!s)return null;
  now=now||new Date();
  var y=now.getFullYear();
  var mk=function(yr,md,end){return end?new Date(yr,md[0]-1,md[1],23,59,59):new Date(yr,md[0]-1,md[1]);};
  var wraps=(s.to[0]*100+s.to[1])<(s.from[0]*100+s.from[1]);
  var tries=wraps?[[y-1,y],[y,y+1]]:[[y,y],[y+1,y+1]];
  for(var i=0;i<tries.length;i++){
    var a=mk(tries[i][0],s.from),b=mk(tries[i][1],s.to,true);
    if(now<=b)return{name:s.name,from:a,to:b,open:now>=a};
  }
  return null;
}
function pipInSeason(thing,now){
  if(!thing||!thing.season)return true;
  var w=pipSeasonWindow(thing.season,now);
  return !!(w&&w.open);
}
function pipPart(id){
  for(var i=0;i<PIP_PARTS.length;i++)if(PIP_PARTS[i].id===id)return PIP_PARTS[i];
  return null;
}
function pipLookById(id){
  for(var i=0;i<PIP_LOOKS.length;i++)if(PIP_LOOKS[i].id===id)return PIP_LOOKS[i];
  return null;
}
function pipShopCfg(){
  var s=S.settings.pipshop||{};
  return{on:s.on!==false,prices:s.prices||{},off:s.off||{}};
}
function pipPrice(thing){
  var cfg=pipShopCfg();
  var p=cfg.prices[thing.id];
  return (p===undefined||p===null||p==='')?num(thing.price,0):Math.max(0,num(p,0));
}
function pipOffered(thing){return !pipShopCfg().off[thing.id]&&pipInSeason(thing);}

function ownedPip(p){
  p=p||me();
  var o=(p&&p.pipOwned)?p.pipOwned:[];
  return o.concat(['body-sun','eyes-dot']).filter(function(v,i,a){return a.indexOf(v)===i;});
}
function ownsPip(id,p){return ownedPip(p).indexOf(id)>=0;}
function pipLook(p){
  p=p||me();
  var l=(p&&p.pipLook)?p.pipLook:{};
  return{body:l.body||'sun',pattern:l.pattern||null,eyes:l.eyes||'dot',
         hat:l.hat||null,back:l.back||null,held:l.held||null,aura:l.aura||null,
         fx:l.fx||null};
}
function pipHTML(p,size,pose,opts){
  return pipSVG(pipLook(p),pose||'idle',size||64,opts);
}
/* Pip answers to how the test went. */
function pipMood(rec){
  if(!rec)return 'idle';
  if(!rec.passed)return 'sad';
  return rec.pct>=90?'cheer':'idle';
}

function equipPip(id){
  var p=me(),part=pipPart(id);
  if(!p||!part)return;
  if(!ownsPip(id,p)){toast('Not unlocked yet.','bad');return;}
  if(!p.pipLook)p.pipLook={};
  p.pipLook[part.slot]=(p.pipLook[part.slot]===part.v&&part.price>0)?null:part.v;
  if(p.face!=='pip'){p.face='pip';toast('Showing your Pip instead of your picture.');}
  if(part.slot==='body'&&!p.pipLook.body)p.pipLook.body='sun';
  if(part.slot==='eyes'&&!p.pipLook.eyes)p.pipLook.eyes='dot';
  save();render();
}
function buyPip(id){
  var p=me();if(!p)return;
  var thing=pipPart(id)||pipLookById(id);
  if(!thing)return;
  var price=pipPrice(thing);
  if(ownsPip(id,p)||(thing.grants&&thing.grants.every(function(g){return ownsPip(g,p);}))){
    toast('Already unlocked.','bad');return;
  }
  if(balance(p)<price){
    toast(pts(Math.round((price-balance(p))*10)/10)+' more points needed.','bad');return;
  }
  confirmModal('Unlock '+thing.name+'?',
    'It costs '+pts(price)+' points, and it is yours for good. Your balance is '+
    pts(balance(p))+'.','Unlock',function(){
      if(balance(p)<price){toast('Not enough points.','bad');return;}
      if(!Array.isArray(p.pipOwned))p.pipOwned=[];
      var gained=thing.grants?thing.grants.slice():[id];
      gained.forEach(function(g){if(p.pipOwned.indexOf(g)<0)p.pipOwned.push(g);});
      /* A cosmetic is handed over by the app, not by an instructor, so it
         never joins the redemptions waiting to be given. */
      p.purchases=purchasesOf(p).concat([{
        id:uid(),itemId:thing.id,title:thing.name,cost:price,full:price,
        discount:0,payback:0,cosmetic:true,date:nowISO(),given:true
      }]);
      if(!p.pipLook)p.pipLook={};
      gained.forEach(function(g){
        var part=pipPart(g);
        if(part)p.pipLook[part.slot]=part.v;
      });
      if(p.face!=='pip')p.face='pip';
      save();
      snapshot('after unlocking '+thing.name);
      if(thing.tier==='top')momentTopLook(thing);
      else toast(thing.name+' unlocked, and Pip is wearing it.','good',6000);
      render();
    });
}

/* =========================================================
   Abilities

   A complete look can carry a power, but only while the reader is
   actually wearing all of it. Taking one piece off turns it off,
   which is what makes the full set worth keeping on.
   ========================================================= */
var PIP_ABILITIES={
  none:    {name:'None',      unit:'',  blurb:function(v){return 'No special power.';}},
  boost:   {name:'Point boost',unit:'%', blurb:function(v){return '+'+v+'% on every point earned while worn.';}},
  discount:{name:'Store discount',unit:'%',blurb:function(v){return v+'% off everything in the store while worn.';}},
  payback: {name:'Extra wish payback',unit:'%',blurb:function(v){return v+'% more paid back on a granted wish.';}}
};
function lookAbility(l){
  var over=(S.settings.pipshop&&S.settings.pipshop.abilities)||{};
  var a=over[l.id]||l.ability||{kind:'none',value:0};
  var kind=PIP_ABILITIES[a.kind]?a.kind:'none';
  return{kind:kind,value:Math.max(0,num(a.value,0))};
}
/* Worn means every single piece of the look is on. */
function wearingLook(l,p){
  p=p||me();
  if(!p)return false;
  var look=pipLook(p);
  return l.grants.every(function(g){
    var part=pipPart(g);
    return part&&look[part.slot]===part.v;
  });
}
function activeAbility(p){
  p=p||me();
  var best={kind:'none',value:0,look:null};
  if(!p)return best;
  PIP_LOOKS.forEach(function(l){
    var a=lookAbility(l);
    if(a.kind==='none'||!a.value)return;
    if(!wearingLook(l,p))return;
    if(a.value>best.value)best={kind:a.kind,value:a.value,look:l};
  });
  return best;
}
function abilityValue(kind,p){
  var a=activeAbility(p);
  return a.kind===kind?a.value:0;
}
/* Applied when points are earned, not to the running total — so the record
   shows what was actually awarded and changing outfit later rewrites nothing. */
function withBoost(points,p){
  var b=abilityValue('boost',p);
  if(!b||!points)return{points:points,boost:0,added:0};
  var out=Math.round(points*(1+b/100)*10)/10;
  return{points:out,boost:b,added:Math.round((out-points)*10)/10};
}
function abilityLine(p){
  var a=activeAbility(p);
  if(a.kind==='none'||!a.value)return '';
  return '<span class="abil">'+ico('flame')+esc(a.look.name)+' &nbsp;·&nbsp; '+
    esc(PIP_ABILITIES[a.kind].blurb(a.value))+'</span>';
}

/* =========================================================
   Events.

   A reader is asked to do something and show it: make a
   picture, write a paragraph, report a number, or simply
   say they did it. The instructor looks at what came back
   and rates it against a rubric, and the rating decides
   the points.

   Photos are shrunk on the way in and the full image is
   kept in IndexedDB, not localStorage — a phone photo is
   megabytes and browser storage is not.
   ========================================================= */

var EVENT_KINDS={
  photo:{name:'Arts and crafts',verb:'Take a picture',
    blurb:'Make or draw something and photograph it.',glyph:'paint'},
  text:{name:'Writing',verb:'Write it',
    blurb:'Write something and send it in.',glyph:'book'},

    blurb:'Say you did it, with a note if you like.',glyph:'star'}

var DEFAULT_RUBRIC=[
  {id:'r1',label:'Gave it a go',points:2},
  {id:'r2',label:'Nicely done',points:4},
  {id:'r3',label:'Outstanding',points:8}
];
var PHOTO_MAX=1200, PHOTO_Q=0.72, THUMB_MAX=240, THUMB_Q=0.6;
var PENDING_CAP=5;

function eventsCfg(){
  var e=S.settings.events||{};
  return{on:e.on===true};
}
function eventsOn(){return eventsCfg().on;}

  for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];
  return null;
}
function entriesOf(p){p=p||me();return (p&&p.entries)?p.entries:[];}

/* ---------- photos ---------- */
function shrinkSrc(src,maxPx,quality){
  return new Promise(function(res,rej){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight;
        var k=Math.min(1,maxPx/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
        var cv=document.createElement('canvas');
        cv.width=cw;cv.height=ch;
        var cx=cv.getContext('2d');
        cx.fillStyle='#fff';cx.fillRect(0,0,cw,ch);
        cx.drawImage(img,0,0,cw,ch);
        try{res(cv.toDataURL('image/jpeg',quality));}
        catch(e){rej(new Error('that picture could not be read'));}
      };
      img.onerror=function(){rej(new Error('that file is not a picture'));};
      img.src=String(src);
  });
}
function shrink(file,maxPx,quality){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){res(String(r.result));};
    r.onerror=function(){rej(new Error('that file could not be opened'));};
    r.readAsDataURL(file);
  }).then(function(src){return shrinkSrc(src,maxPx,quality);});
}
function putPhoto(id,data){return idbPut('photos',{id:id,data:data});}
function getPhoto(id){return idbGet('photos',id).then(function(r){return r?r.data:null;});}
function dropPhoto(id){return idbDel('photos',id);}

/* ---------- may this reader enter ---------- */
function eventState(ev,p){
  p=p||me();
  var mine=entriesOf(p).filter(function(e){return e.eventId===ev.id;});
  var pending=mine.filter(function(e){return e.status==='pending';}).length;
  var av=availability(ev);
  if(!assignedTo(ev,p))return{can:false,label:'Not for you',tone:'cold',mine:mine,pending:pending};
  if(!av.open)return{can:false,label:av.label||'Not open',tone:'cold',mine:mine,pending:pending,window:av};
  var cap=(ev.entries&&ev.entries.mode==='once')?1:Math.max(1,num(ev.entries&&ev.entries.limit,3));
  if(mine.length>=cap)
    return{can:false,label:cap===1?'Sent in':'All '+cap+' sent in',tone:'good',mine:mine,pending:pending,window:av};
  if(pending)
    return{can:false,label:pending+' waiting to be looked at',tone:'warm',mine:mine,pending:pending,window:av};
  return{can:true,label:av.label||'',tone:av.tone||'cold',mine:mine,pending:pending,window:av,left:cap-mine.length};
}
function totalPending(p){
  return entriesOf(p).filter(function(e){return e.status==='pending';}).length;
}

/* ---------- sending something in ---------- */
function submitEntry(ev,payload){
  var p=me();if(!p)return;
  if(totalPending(p)>=PENDING_CAP){
    toast('You have '+PENDING_CAP+' things waiting to be looked at already. Hold on until some come back.','bad',7000);
    return;
  }
  var id=uid();
  var entry={id:id,eventId:ev.id,eventTitle:ev.title,kind:ev.kind,
    at:nowISO(),status:'pending',note:payload.note||'',
    text:payload.text||'',count:payload.count||null,thumb:payload.thumb||'',
    hasPhoto:!!payload.photo};
  function finish(){
    p.entries=entriesOf(p).concat([entry]);
    save();
    snapshot('after '+p.name+' sent in '+ev.title);
    closeModal();
    toast('Sent in. Your instructor will take a look.','good',6000);
    render();
  }
  if(payload.photo)putPhoto(id,payload.photo).then(finish,finish);
  else finish();
}

function entryModal(ev){
  var kind=EVENT_KINDS[ev.kind]||EVENT_KINDS.checkin;
  var photo=null,thumb='';
  function body(){
    return '<h3>'+esc(ev.title)+'</h3>'+
      (ev.brief?'<p class="lede">'+esc(ev.brief)+'</p>':'')+
      (ev.kind==='photo'
        ? '<div class="shotbox stack" id="shotbox">'+
            (thumb?'<img src="'+thumb+'" alt="">':

          '<div class="row" style="justify-content:center"><button class="btn btn-primary" id="shot">'+
          ico('camera')+(thumb?'Take another':'Take a picture')+'</button></div>'
        :'')+
      (ev.kind==='text'
        ? '<label class="field stack"><span>Your writing</span>'+
          '<textarea id="e-text" data-focus placeholder="Type it here"></textarea></label>'
        :'')+
      (ev.kind==='count'
        ? '<label class="field stack"><span>'+esc(ev.unit||'How many')+'</span>'+
          '<input class="inp" id="e-count" data-focus type="number" min="0" step="1"></label>'
        :'')+
