/* ============ store ============ */
.balance{
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;
  border:1px solid var(--gold-soft);background:var(--gold-faint);
}
.balance .disc{
  width:44px;height:44px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 36% 30%,var(--gold-hi),var(--gold) 58%,var(--gold-lo));
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 6px rgba(0,0,0,.2);
}
.balance .disc::after{
  content:"";position:absolute;inset:14px;border-radius:50%;
  background:var(--bg);opacity:.85;
}
.balance .k{font-size:.74rem;color:var(--text-2)}
.balance .v{font-family:var(--serif);font-size:1.5rem;line-height:1.1;color:var(--text-hi);font-variant-numeric:tabular-nums}

.shelf{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));align-items:stretch}
.item{
  position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;
  padding:16px;border-radius:14px;
  background:linear-gradient(var(--surface),var(--sunk));
  border:1px solid var(--edge-soft);box-shadow:var(--sh-1);
  transition:transform .16s var(--ease),border-color .16s;
}
.item.shut{opacity:.62}
/* an item you cannot afford yet is still worth looking at */
.item:not(.shut):not(.buyable){opacity:1}
.ic{
  --ib:36px;                 /* how big the mark is in this context */
  --is:1;                    /* the item's own scale on top of that */
  width:58px;height:58px;border-radius:15px;display:grid;place-items:center;flex:none;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,var(--sh-1);overflow:hidden;
}
.ic svg{width:calc(var(--ib)*var(--is));height:calc(var(--ib)*var(--is));display:block}
.ic img{width:100%;height:100%;object-fit:cover;transform:scale(var(--is))}
.ic .emo{
  font-size:calc(var(--ib)*.84*var(--is));line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.emogrid button{
  aspect-ratio:1;border-radius:10px;border:1px solid var(--edge-soft);background:var(--sunk);
  font-size:22px;line-height:1;display:grid;place-items:center;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.emogrid button[aria-pressed="true"]{border-color:var(--brand-hi);background:var(--brand-faint);box-shadow:0 0 0 1px var(--brand-hi)}
.item h4{font-family:var(--serif);font-size:1.08rem;color:var(--text-hi);margin:0;font-weight:600}
.item p{font-size:.84rem;color:var(--text-2);line-height:1.5}
.item .price{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--serif);
  font-size:1.18rem;color:var(--gold-hi);font-variant-numeric:tabular-nums;
}
.item .price small{font-family:var(--sans);font-size:.68rem;color:var(--text-2)}
.item .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.pill{
  display:inline-block;font-size:.7rem;padding:3px 9px;border-radius:999px;
  border:1px solid var(--edge);color:var(--text-2);white-space:nowrap;
}
.pill.warm{border-color:var(--gold-soft);color:var(--gold-hi);background:var(--gold-faint)}
.pill.cold{border-color:var(--edge-soft);color:var(--text-3)}
.pill.good{border-color:var(--pass);color:var(--pass);background:var(--pass-faint)}
.item .adminrow{
  display:flex;flex-wrap:wrap;gap:6px;
  border-top:1px solid var(--edge-soft);padding-top:10px;margin-top:2px;
  min-width:0;
}
.item .adminrow .btn{flex:0 1 auto;min-width:0}
.item .adminrow .btn:last-child{margin-left:auto}
@media(max-width:400px){.item .adminrow .btn:last-child{margin-left:0}}

.glyphgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.glyphgrid button{
  aspect-ratio:1;border-radius:11px;border:1px solid var(--edge-soft);display:grid;place-items:center;
  background:var(--sunk);transition:.14s;
}
.glyphgrid button svg{width:26px;height:26px}
.glyphgrid button[aria-pressed="true"]{border-color:var(--brand-hi);background:var(--brand-faint);box-shadow:0 0 0 1px var(--brand-hi)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{
  padding:7px 12px;border-radius:9px;border:1px solid var(--edge);
  font-size:.83rem;color:var(--text-2);background:var(--sunk);
}
.seg button[aria-pressed="true"]{border-color:var(--brand-hi);background:var(--brand-faint);color:var(--brand-hi)}
.subfields{
  border-left:2px solid var(--gold-soft);padding-left:14px;margin:12px 0 4px;
}
.receipt{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--edge-soft)}
.receipt .ic{--ib:22px;width:36px;height:36px;border-radius:10px}


/* ============ activities ============ */
.actrow{
  display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:13px;
  background:linear-gradient(var(--surface),var(--sunk));
  border:1px solid var(--edge-soft);box-shadow:var(--sh-1);
  transition:border-color .16s,transform .16s var(--ease);
}
.actrow.shut{opacity:.6}
.actrow .ic{--ib:28px;width:48px;height:48px;border-radius:13px}
.actrow .body{flex:1;min-width:0}
.actrow h4{font-family:var(--serif);font-size:1.04rem;color:var(--text-hi);margin:0;font-weight:600}
.actrow .sub{font-size:.8rem;color:var(--text-2);margin-top:2px}
.actrow .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.actrow .worth{
  font-family:var(--serif);font-size:1.15rem;color:var(--gold-hi);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.actlist{display:grid;gap:9px}
.who-for{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ============ countdown badge, featured shelf, sales ============ */
.item{overflow:visible}
.timer{
  position:absolute;top:-9px;right:-7px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 11px;border-radius:999px;
  background:linear-gradient(var(--gold-hi),var(--gold));
  color:var(--on-gold);font-size:.68rem;font-weight:600;letter-spacing:.01em;
  box-shadow:0 3px 10px rgba(0,0,0,.30),0 1px 0 rgba(255,255,255,.45) inset;
  transform-origin:82% 120%;
  animation:tilt 3.2s var(--ease) infinite;
}
@keyframes tilt{
  0%,70%,100%{transform:rotate(0deg)}
  76%{transform:rotate(-8deg)}
  82%{transform:rotate(6deg)}
  88%{transform:rotate(-3deg)}
  94%{transform:rotate(1deg)}
}
.timer .dot{
  width:6px;height:6px;border-radius:50%;background:var(--on-gold);
  animation:blip 1.4s ease-in-out infinite;
}
@keyframes blip{50%{opacity:.25;transform:scale(.65)}}
.timer.soon{animation-duration:2s}
.timer.last{
  background:linear-gradient(#FF9E86,var(--fail));color:#fff;
  animation-duration:1.25s;
}
.timer.last .dot{background:#fff}

.sale{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:999px;font-size:.68rem;font-weight:600;
  background:linear-gradient(100deg,var(--pass) 0%,#8FE3AC 45%,var(--pass) 90%);
  background-size:220% 100%;color:#0C2415;
  animation:shimmer 3.4s linear infinite;
}
@keyframes shimmer{to{background-position:-220% 0}}

.price s{color:var(--text-3);font-size:.74em;margin-right:7px;text-decoration-thickness:1px}

.item.hero{
  border-color:var(--gold-soft);
  background:linear-gradient(var(--raise),var(--surface));
  box-shadow:0 0 0 1px var(--gold-faint),var(--sh-2);
}
.item.hero .ic{--ib:42px;width:68px;height:68px;border-radius:17px}
.item.hero h4{font-size:1.2rem}
.crest{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.65rem;letter-spacing:.08em;color:var(--gold-hi);
}
.crest::before,.crest::after{
  content:"";height:1px;width:14px;background:var(--gold-soft);
}

/* ============ corner badges ============ */
.badges{
  position:absolute;top:-12px;right:-10px;z-index:3;
  display:flex;flex-direction:column;align-items:flex-end;gap:7px;
  pointer-events:none;
}
.item{padding-top:20px}

/* the sale rosette */
.bsale{
  position:relative;width:60px;height:60px;border-radius:50%;
  display:grid;place-items:center;text-align:center;line-height:1;
  background:radial-gradient(circle at 36% 30%,#8FE3AC,var(--pass) 62%,#2C7A4E);
  color:#06230F;
  box-shadow:0 5px 16px -4px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.5) inset;
  animation:bob 2.8s var(--ease) infinite;
  transform-origin:50% 50%;
}
.bsale .n{font-family:var(--serif);font-size:1.32rem;font-weight:700;letter-spacing:-.02em}
.bsale .u{font-size:.52rem;letter-spacing:.14em;margin-top:1px;opacity:.85}
.bsale::before{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.55);
  animation:spin 11s linear infinite;
}
.bsale::after{
  content:"";position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.75) 48%,transparent 58%);
  background-size:260% 100%;
  animation:sweep 3.6s ease-in-out infinite;
}
.bsale.big{width:70px;height:70px}
.bsale.big .n{font-size:1.55rem}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%{background-position:160% 0}55%,100%{background-position:-160% 0}}

/* the countdown tag */
.btime{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 13px;border-radius:999px;
  background:linear-gradient(var(--gold-hi),var(--gold));
  color:var(--on-gold);font-size:.74rem;font-weight:700;letter-spacing:.01em;
  box-shadow:0 4px 14px -3px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.5) inset;
  transform-origin:88% 130%;
  animation:swing 3s var(--ease) infinite;
  white-space:nowrap;
}
.btime .dot{
  width:7px;height:7px;border-radius:50%;background:var(--on-gold);
  animation:blip 1.3s ease-in-out infinite;
}
@keyframes swing{
  0%,68%,100%{transform:rotate(0deg)}
  74%{transform:rotate(-9deg)}
  80%{transform:rotate(7deg)}
  86%{transform:rotate(-4deg)}
  92%{transform:rotate(2deg)}
}
.btime.soon{animation-duration:1.9s}
.btime.last{
  background:linear-gradient(#FFB49F,var(--fail));color:#fff;
  animation-duration:1.15s;
  box-shadow:0 4px 16px -2px rgba(240,112,92,.55),0 1px 0 rgba(255,255,255,.4) inset;
}
.btime.last .dot{background:#fff}

/* ============ featured, configurable ============ */
.item.hero{
  --fx:var(--gold);--fx-hi:var(--gold-hi);--fx-ink:var(--on-gold);
  border-color:var(--fx);
  background:linear-gradient(var(--raise),var(--surface));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--fx) 30%,transparent),var(--sh-2);
  padding-top:26px;
}
.item.hero[data-fx="blue"]{--fx:var(--brand-hi);--fx-hi:#9CC8FF;--fx-ink:#06224F}
.item.hero[data-fx="mint"]{--fx:#3FBE92;--fx-hi:#7FEFC6;--fx-ink:#05261B}
.item.hero[data-fx="rose"]{--fx:#E4658A;--fx-hi:#FFA0BA;--fx-ink:#2C0A14}
.item.hero[data-fx="plum"]{--fx:#9270E2;--fx-hi:#C3AAFF;--fx-ink:#180B31}
.item.hero.glow{
  box-shadow:0 0 0 1px color-mix(in srgb,var(--fx) 34%,transparent),
             0 0 34px -8px var(--fx),var(--sh-2);
}
@keyframes drift{to{background-position:-220% 0}}
.item.hero .ic{--ib:42px;width:68px;height:68px;border-radius:17px}
.item.hero h4{font-size:1.2rem}
.item.wide{grid-column:1/-1}
.item.wide .row:first-of-type{align-items:center}
@media(max-width:560px){.item.wide{grid-column:auto}}
.fxpick{display:flex;gap:7px;flex-wrap:wrap}
.fxpick button{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--edge);
}
.fxpick button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--brand-hi);border-color:transparent}

/* ============ store card rhythm ============ */
.item{gap:12px;padding:18px 17px 16px}
.item{padding-top:22px}
.item.hero{padding-top:50px}          /* 26px ribbon + room to breathe */
.item.hero.wide{padding-top:46px}
.item .row:first-of-type{gap:15px}
.item h4{line-height:1.3;margin:0 0 7px}
.item .price{margin-top:2px;line-height:1.2}
.item p{margin-top:-2px}
.item .foot{padding-top:8px;gap:9px}
.item .adminrow{padding-top:12px;margin-top:4px}
.item .ic{margin-top:2px}
.scaler{display:flex;align-items:center;gap:11px}
.scaler input[type=range]{flex:1;accent-color:var(--brand)}
.scaler .v{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--text-2);min-width:44px;text-align:right}
.badges{top:-14px;right:-12px}
.item.hero .badges{top:-16px}
.item .itemtop{gap:15px}

}

/* ============ chapters ============ */
.progline{display:flex;align-items:center;gap:12px;margin-top:20px}
.progline .bar{
  flex:1;height:7px;border-radius:4px;background:var(--paper-rule);overflow:hidden;
}
.progline .bar span{
  display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--gold),var(--gold-hi));
  transition:width .5s var(--ease);
}
.papers{display:grid;gap:7px}
.paper-row{
  display:flex;align-items:center;gap:13px;
  padding:12px 14px;border-radius:10px;
  background:rgba(255,255,255,.42);
  border:1px solid var(--paper-rule);
}
.paper-row[data-st="passed"]{background:var(--pass-faint);border-color:rgba(44,122,78,.35)}
.paper-row[data-st="failed"]{border-color:rgba(172,58,43,.3)}
.paper-row .mark-passed,.paper-row .mark-failed,.paper-row .mark-new{
  width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:.8rem;border:1px solid var(--paper-rule);color:var(--paper-text-2);
}
.paper-row .mark-passed{background:var(--pass-ink);border-color:var(--pass-ink);color:#fff}
.paper-row .mark-failed{color:var(--fail-ink);border-color:rgba(172,58,43,.4)}
.pr-main{flex:1;min-width:0}
.pr-title{display:block;font-family:var(--serif);font-size:1.04rem;line-height:1.3}
.pr-meta{display:block;font-size:.78rem;color:var(--paper-text-2);margin-top:2px}
.pr-key{flex:none;color:var(--paper-text-2)}
.pr-key svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}
@media(max-width:480px){
  .paper-row{flex-wrap:wrap}
  .paper-row .btn{margin-left:37px}
}

/* ============ hover, only where a pointer actually hovers ============
   On a touch screen :hover sticks to whatever was last tapped. In the
   quiz that made the option at the same position on the NEXT question
   look already chosen. */
@media (hover:hover) and (pointer:fine){

.nav button:hover{color:var(--text);background:rgba(255,255,255,.045)}

.iconbtn:hover{border-color:var(--text-3);color:var(--text);background:rgba(255,255,255,.04)}

.chip:hover{border-color:var(--text-3);background:rgba(255,255,255,.04)}

.mecard:hover{border-color:var(--brand-hi);transform:translateY(-1px)}

.btn:hover{border-color:var(--text-3);color:var(--text-hi);transform:translateY(-1px)}

.btn-primary:hover{border-color:var(--brand-hi);color:var(--on-brand)}

.btn-danger:hover{border-color:var(--fail);background:rgba(176,74,62,.14);color:var(--fail)}

.bookcard:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,var(--sh-2)}

.opt:hover{background:var(--paper-hi);border-color:var(--paper-edge-hi);transform:translateX(3px)}

.opt:hover .key{background:var(--gold);border-color:var(--gold-lo);color:var(--on-gold)}

tbody tr:hover{background:rgba(255,255,255,.022)}

.person:hover{transform:translateY(-3px);border-color:var(--brand-hi);box-shadow:var(--sh-2)}

.pick:hover{border-color:var(--brand-hi);background:var(--brand-faint)}

.item.buyable:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:var(--sh-2)}

.item:not(.shut):not(.buyable):hover{border-color:var(--edge);transform:none}

.emogrid button:hover{border-color:var(--brand-hi)}

.glyphgrid button:hover{border-color:var(--brand-hi)}

.actrow.open:hover{border-color:var(--gold);transform:translateY(-1px)}
}

/* ============ the card's top bar ============
   Both the sale rosette and the countdown want the space above the card,
   and stacking them put the second one on the title. So the rosette keeps
   the top-right corner to itself, and when a card also has something to
   say — that it is featured, or how long it has left — that goes in a bar
   across the top instead of floating. */
.cardbar{
  position:absolute;top:0;left:0;right:0;height:26px;
  border-radius:13px 13px 0 0;
  display:flex;align-items:center;gap:8px;
  padding:0 14px;box-sizing:border-box;
  font-size:.62rem;font-weight:700;letter-spacing:.15em;
  color:var(--fx-ink);
  background:linear-gradient(90deg,var(--fx),var(--fx-hi),var(--fx));
  background-size:220% 100%;
  animation:drift 7s linear infinite;
  box-shadow:0 1px 0 rgba(0,0,0,.18);
}
.item.has-sale .cardbar{padding-right:58px}
.item.has-sale.sale-big .cardbar{padding-right:68px}
.cardbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cardbar .cd{
  margin-left:auto;flex:none;
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:999px;white-space:nowrap;
  background:rgba(0,0,0,.26);color:#fff;letter-spacing:.09em;
}
.cardbar .cd .dot{
  width:6px;height:6px;border-radius:50%;background:#fff;
  animation:blip 1.3s ease-in-out infinite;
}
/* no feature banner, so the bar belongs to the countdown */
.cardbar.timeonly{--fx:var(--gold-lo);--fx-hi:var(--gold);--fx-ink:var(--on-gold)}
.cardbar.timeonly .cd{margin-left:0;background:rgba(0,0,0,.22)}
.cardbar.soon{animation-duration:3.4s}
.cardbar.last{--fx:#B8402F;--fx-hi:var(--fail);--fx-ink:#fff;animation-duration:2.2s}
.cardbar.last .cd{background:rgba(0,0,0,.3)}

/* any card wearing a bar needs the same clearance a featured one has */
.item.has-bar{padding-top:50px}
.item.has-bar.wide{padding-top:46px}
.item.has-sale .itemtop{padding-right:58px}
.item.has-sale.sale-big .itemtop{padding-right:68px}
@media(max-width:360px){
  .item.has-sale .itemtop,.item.has-sale.sale-big .itemtop{padding-right:52px}
  .cardbar{letter-spacing:.08em}
}

/* ============ wishlist ============ */
.wishbox{
  display:flex;align-items:center;gap:14px;position:relative;
  padding:16px 18px;border-radius:15px;margin:16px 0 4px;
  background:linear-gradient(120deg,rgba(244,181,63,.14),rgba(46,140,255,.10));
  border:1px solid var(--gold-soft);box-shadow:var(--sh-1);
}
.wishbox.ready{
  border-color:var(--pass);
  background:linear-gradient(120deg,rgba(79,192,126,.20),rgba(244,181,63,.12));
}
.wishbox.empty-wish{background:none;border-style:dashed;border-color:var(--edge)}
.wishbox .wishmark{
  width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 36% 30%,var(--gold-hi),var(--gold) 60%,var(--gold-lo));
}
.wishbox.ready .wishmark{background:radial-gradient(circle at 36% 30%,#9FEFC0,var(--pass) 60%,#2C7A4E)}
.wishbox .wishmark svg{width:19px;height:19px;fill:var(--on-gold);stroke:none}
.wishbox.ready .wishmark svg{fill:#06230F}
.wishbox .t{font-family:var(--serif);font-size:1.1rem;color:var(--text-hi);line-height:1.25}
.wishbox .d{font-size:.8rem;color:var(--text-2);margin-top:5px}
.wbar{
  display:block;height:7px;border-radius:4px;margin-top:8px;overflow:hidden;
  background:var(--sunk);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
}
.wbar span{
  display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--gold),var(--gold-hi));
  transition:width .6s var(--ease);
}
.wishbox.ready .wbar span{background:linear-gradient(90deg,var(--pass),#9FEFC0)}
.wishline{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 14px;border-radius:11px;margin-bottom:14px;
  border:1px solid var(--gold-soft);background:var(--gold-faint);
  font-size:.85rem;color:var(--gold-hi);
}
.wishline.ready{border-color:var(--pass);background:var(--pass-faint);color:var(--pass)}
.wishline svg{width:15px;height:15px;fill:currentColor;stroke:none;flex:none}
.wishline .wbar{margin-top:0;height:6px}

/* ============ streaks ============ */
.streaks{display:grid;gap:9px;margin-bottom:16px}
.streak{
  display:flex;align-items:center;gap:14px;
  padding:13px 16px;border-radius:13px;
  background:linear-gradient(var(--surface),var(--sunk));
  border:1px solid var(--edge-soft);box-shadow:var(--sh-1);
}
.streak.alive{border-color:var(--gold-soft)}
.streak .flame{
  width:42px;height:42px;border-radius:12px;flex:none;
  display:grid;place-items:center;
  font-family:var(--serif);font-size:1.15rem;color:var(--text-3);
  background:var(--sunk);border:1px solid var(--edge-soft);
}
.streak.alive .flame{
  color:var(--on-gold);border-color:transparent;
  background:radial-gradient(circle at 38% 28%,var(--gold-hi),var(--gold) 62%,var(--gold-lo));
  box-shadow:0 0 18px -6px var(--gold);
}
.streak .t{font-size:.97rem;color:var(--text-hi)}
.streak .d{font-size:.79rem;color:var(--text-2);margin-top:2px}
.streak .dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.streak .dots i{
  width:18px;height:6px;border-radius:3px;background:var(--edge);
  transition:background .3s var(--ease);
}
.streak .dots i.lit{background:linear-gradient(90deg,var(--gold),var(--gold-hi))}
.streak .now{
  flex:none;text-align:right;font-family:var(--serif);
  font-size:1.15rem;color:var(--gold-hi);font-variant-numeric:tabular-nums;line-height:1.1;
}
.streak .now span{display:block;font-family:var(--sans);font-size:.68rem;color:var(--text-3)}
@media(max-width:420px){
  .streak{flex-wrap:wrap}
  .streak .now{margin-left:56px;text-align:left}
}

/* ============ Pip ============ */
.av-pip{
  display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(160deg,var(--surf-2),var(--sunk));
}
.av-pip .pip{display:block;width:104%;height:104%}
.emptypip{display:flex;justify-content:center;margin-bottom:4px}
.emptypip .pip{opacity:.95}
.pipreact{flex:none;display:flex;align-items:flex-end}
@media(max-width:560px){.pipreact{display:none}}

.dressstage{
  display:flex;justify-content:center;padding:14px 0 18px;margin-bottom:6px;
  border-radius:16px;background:radial-gradient(circle at 50% 38%,var(--surf-2),var(--sunk) 70%);
  border:1px solid var(--edge-soft);
}
.dressrow{margin-top:14px}
.dressgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px;margin-top:6px}
.dresspick{
  aspect-ratio:1;border-radius:12px;border:1px solid var(--edge-soft);
  background:var(--sunk);display:grid;place-items:center;overflow:hidden;transition:.14s;
}
.dresspick.on{border-color:var(--brand-hi);background:var(--brand-faint);box-shadow:0 0 0 1px var(--brand-hi)}

.piprow{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(152px,1fr))}
.pipcard{
  display:grid;justify-items:center;gap:6px;padding:14px 12px 13px;border-radius:14px;
  background:linear-gradient(var(--surface),var(--sunk));
  border:1px solid var(--edge-soft);box-shadow:var(--sh-1);transition:.16s var(--ease);
}
.pipcard.buyable{border-color:var(--gold-soft)}
.pipcard .pv{
  width:100%;display:flex;justify-content:center;padding:4px 0 2px;border-radius:11px;
  background:radial-gradient(circle at 50% 40%,var(--surf-2),transparent 70%);
}
.pipcard .nm{font-family:var(--serif);font-size:1.02rem;color:var(--text-hi)}
.pipcard .pc{font-family:var(--serif);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.pipcard .pc small{font-family:var(--sans);font-size:.66rem;color:var(--text-2)}

.pipparts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;margin-top:14px}
.pippart{
  display:grid;justify-items:center;gap:3px;padding:9px 6px 8px;border-radius:12px;
  background:var(--sunk);border:1px solid var(--edge-soft);transition:.14s;
}
.pippart.buyable{border-color:var(--gold-soft)}
.pippart .n{font-size:.72rem;color:var(--text-2);text-align:center;line-height:1.2}
.pippart .p{font-family:var(--serif);font-size:.92rem;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.shelfhead{display:flex;align-items:center;gap:10px;margin:22px 0 6px;
  font-family:var(--serif);font-size:1.05rem;color:var(--text-hi)}
.shelfhead .line{flex:1;height:1px;background:var(--edge-soft)}
@media (hover:hover) and (pointer:fine){
  .dresspick:hover{border-color:var(--brand-hi)}
  .pipcard.buyable:hover,.pippart.buyable:hover{transform:translateY(-2px);border-color:var(--gold)}
}

/* ============ Pip, alive ============
   Only instances marked live animate; a grid of small previews stays still. */
.pip-live .pip-breathe{
  transform-box:fill-box;transform-origin:50% 100%;
  animation:pipBreathe 4.4s ease-in-out infinite;
}
@keyframes pipBreathe{
  0%,100%{transform:scale(1,1)}
  50%{transform:scale(1.015,.985)}
}
.pip-live .pip-eyes{
  transform-box:fill-box;transform-origin:50% 55%;
  animation:pipBlink 7s infinite;
}
@keyframes pipBlink{
  0%,95.5%,100%{transform:scaleY(1)}
  97%{transform:scaleY(.08)}
  98.5%{transform:scaleY(1)}
}
/* cosmetics that move */
.pip-live .pw-wing{transform-box:fill-box;animation:pipFlap 2.6s ease-in-out infinite}
.pip-live .pw-l{transform-origin:100% 50%}
.pip-live .pw-r{transform-origin:0% 50%;animation-delay:-.08s}
@keyframes pipFlap{
  0%,100%{transform:rotate(0deg) translateY(0)}
  50%{transform:rotate(-7deg) translateY(-2px)}
}
.pip-live .pw-cape{
  transform-box:fill-box;transform-origin:50% 0%;
  animation:pipSway 3.8s ease-in-out infinite;
}
@keyframes pipSway{
  0%,100%{transform:skewX(0deg)}
  50%{transform:skewX(3.2deg)}
}
.pip-live .pw-flame{
  transform-box:fill-box;transform-origin:50% 0%;
  animation:pipFlame .28s steps(2,end) infinite;
}
@keyframes pipFlame{
  0%{transform:scaleY(1) translateY(0);opacity:1}
  100%{transform:scaleY(1.35) translateY(1px);opacity:.82}
}
.pip-live .pw-glow{animation:pipPulse 3.2s ease-in-out infinite}
@keyframes pipPulse{0%,100%{opacity:.75}50%{opacity:1}}
.pip-live .pw-spark{transform-box:fill-box;transform-origin:50% 50%;animation:pipTwinkle 1.9s ease-in-out infinite}
.pip-live .pw-spark.s1{animation-delay:-.45s}
.pip-live .pw-spark.s2{animation-delay:-.95s}
@keyframes pipTwinkle{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.78)}
}
.pip-live .pw-twinkle{animation:pipShimmer 2.8s ease-in-out infinite}
@keyframes pipShimmer{0%,100%{opacity:.7}50%{opacity:1}}
.pip-live .pw-wandstar{transform-box:fill-box;transform-origin:50% 50%;animation:pipSpin 6s linear infinite}
@keyframes pipSpin{to{transform:rotate(360deg)}}
.pip-live .pw-balloon{transform-box:fill-box;transform-origin:50% 100%;animation:pipBob 3.4s ease-in-out infinite}
@keyframes pipBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
.pip-live .pw-gem{animation:pipPulse 2.2s ease-in-out infinite}

/* ============ choosing a face ============ */
.facepick{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.faceopt{
  display:grid;justify-items:center;gap:7px;padding:10px 14px;border-radius:14px;
  border:1px solid var(--edge-soft);background:var(--sunk);transition:.15s var(--ease);
}
.faceopt.on{border-color:var(--brand-hi);background:var(--brand-faint);box-shadow:0 0 0 1px var(--brand-hi)}
.faceopt .l{font-size:.8rem;color:var(--text-2)}
.faceopt.on .l{color:var(--text-hi)}
@media (hover:hover) and (pointer:fine){.faceopt:hover{border-color:var(--brand-hi)}}

/* ============ top tier and abilities ============ */
.pipcard.top{
  border-color:var(--gold);
  background:linear-gradient(var(--raise),var(--surface));
  box-shadow:0 0 0 1px var(--gold-faint),0 0 26px -10px var(--gold),var(--sh-2);
  position:relative;
}
.tierflag{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  font-size:.58rem;font-weight:700;letter-spacing:.16em;
  padding:3px 10px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi),var(--gold-lo));
  background-size:220% 100%;color:var(--on-gold);
  animation:drift 5s linear infinite;
}
.abilnote{
  font-size:.7rem;color:var(--gold-hi);text-align:center;line-height:1.35;
  padding:0 4px;
}
.abilbar{
  display:flex;justify-content:center;margin:10px 0 2px;
}
.abil{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:999px;font-size:.8rem;
  border:1px solid var(--gold-soft);background:var(--gold-faint);color:var(--gold-hi);
}
.abil svg{width:15px;height:15px;fill:currentColor;stroke:none}

/* seasonal */
.seasonflag{
  font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold-hi);text-align:center;margin:-2px 0 2px;
}
.seasonflag.closing{color:var(--fail)}
.pip-live .pw-leaf{transform-box:fill-box;transform-origin:50% 50%;animation:pipLeaf 5.6s linear infinite}
.pip-live .pw-leaf.f1{animation-delay:-1.4s;animation-duration:6.4s}
.pip-live .pw-leaf.f2{animation-delay:-2.8s}
.pip-live .pw-leaf.f3{animation-delay:-4.2s;animation-duration:6.9s}
@keyframes pipLeaf{
  0%{transform:translate(0,-14px) rotate(0deg);opacity:0}
  12%{opacity:1}
  50%{transform:translate(7px,10px) rotate(160deg)}
  85%{opacity:1}
  100%{transform:translate(-3px,34px) rotate(330deg);opacity:0}
}
.pip-live .pw-sway{transform-box:fill-box;transform-origin:50% 100%;animation:pipBob 3s ease-in-out infinite}
.pip-live .pw-swing{transform-box:fill-box;transform-origin:50% 0%;animation:pipSwing 2.8s ease-in-out infinite}
@keyframes pipSwing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.pip-live .pw-lampglow{animation:pipLamp 1.3s ease-in-out infinite}
.pip-live .pw-lampface{animation:pipLamp .9s steps(2,end) infinite}
@keyframes pipLamp{0%,100%{opacity:.3}50%{opacity:.75}}
.pip-live .pw-bird{animation:pipBob 4.2s ease-in-out infinite;transform-box:fill-box}
/* halloween */
.pip-live .pw-pet{transform-box:fill-box;transform-origin:50% 50%;animation:pipPet 6s ease-in-out infinite}
@keyframes pipPet{
  0%,100%{transform:translate(0,0) rotate(-4deg)}
  25%{transform:translate(-7px,-5px) rotate(3deg)}
  50%{transform:translate(-2px,-10px) rotate(-2deg)}
  75%{transform:translate(4px,-4px) rotate(5deg)}
}
.pip-live .pw-peteyes{transform-box:fill-box;transform-origin:50% 50%;animation:pipBlink 5.2s infinite}
.pip-live .pw-eyeglow{animation:pipLamp 2.4s ease-in-out infinite}
.pip-live .pw-fog{animation:pipFog 7s ease-in-out infinite}
@keyframes pipFog{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.pip-live .pw-batfly{transform-box:fill-box;transform-origin:50% 50%;animation:pipBatFly 5s ease-in-out infinite}
.pip-live .pw-batfly.b1{animation-delay:-1.7s;animation-duration:5.8s}
.pip-live .pw-batfly.b2{animation-delay:-3.3s;animation-duration:4.6s}
@keyframes pipBatFly{
  0%,100%{transform:translate(0,0)}
  30%{transform:translate(6px,-6px)}
  60%{transform:translate(-4px,-10px)}
  80%{transform:translate(-6px,-3px)}
}
.pip-live .pw-batflap{transform-box:fill-box;transform-origin:50% 60%;animation:pipBatFlap .36s ease-in-out infinite alternate}
@keyframes pipBatFlap{from{transform:scaleY(1)}to{transform:scaleY(-.45)}}
.abilbar{flex-wrap:wrap;gap:6px}
/* moon festival */
.abilnote.fest{color:var(--pass)}
.abil.fest{border-style:dashed}
.pip-live .pw-rise{animation:pipRise 7s ease-in-out infinite}
.pip-live .pw-rise.r1{animation-delay:-2.3s;animation-duration:8s}
.pip-live .pw-rise.r2{animation-delay:-4.6s}
.pip-live .pw-rise.r3{animation-delay:-1.1s;animation-duration:9s}
@keyframes pipRise{0%{transform:translateY(8px);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.pip-live .pw-ribbon{transform-box:fill-box;transform-origin:100% 0%;animation:pipRibbon 3.6s ease-in-out infinite}
.pip-live .pw-ribbon.rr{animation-delay:-1.8s}
@keyframes pipRibbon{0%,100%{transform:rotate(0deg) skewY(0deg)}50%{transform:rotate(5deg) skewY(-4deg)}}
.pip-live .pw-glint{animation:pipGlint 3.8s ease-in-out infinite}
@keyframes pipGlint{0%,55%{transform:translateX(0)}85%,100%{transform:translateX(40px)}}
.pip-live .pw-ripple{transform-box:fill-box;transform-origin:50% 50%;animation:pipRipple 4s ease-out infinite}
.pip-live .pw-ripple.d2{animation-delay:-2s}
@keyframes pipRipple{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.pip-live .pw-shimmer{animation:pipShimmer 2.2s ease-in-out infinite}
.pip-live .pw-shimmer.s2{animation-delay:-1.1s}
.pip-live .pw-mote{animation:pipMote 6s ease-in-out infinite}
.pip-live .pw-mote.m1{animation-delay:-1.5s;animation-duration:7s}
.pip-live .pw-mote.m2{animation-delay:-3s}
.pip-live .pw-mote.m3{animation-delay:-4.5s;animation-duration:6.6s}
@keyframes pipMote{0%{transform:translateY(6px);opacity:0}25%{opacity:1}75%{opacity:.9}100%{transform:translateY(-26px);opacity:0}}
/* companions that react to the pose */
.pe-shut,.pe-zz,.pe-tear{display:none}
.petpose-sleep .pe-open{display:none}
.petpose-sleep .pe-shut,.petpose-sleep .pe-zz,.petpose-sad .pe-tear{display:inline}
.petpose-sad .pe-ear2{transform:rotate(70deg) translate(4px,-2px);transform-box:fill-box;transform-origin:50% 100%}
.pip-live .petpose-cheer .pw-hop{transform-box:fill-box;transform-origin:50% 100%;animation:pipHop .9s ease-in-out infinite}
@keyframes pipHop{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-6px) scaleY(1.05)}70%{transform:translateY(0) scaleY(.92)}}
.pip-live .petpose-sleep .pw-pet{animation-duration:12s}
.pip-live .petpose-sleep .pe-zz{animation:pipShimmer 2.4s ease-in-out infinite}
/* harvest fair */
.pip-live .pw-chase{animation:pipChase 1.2s steps(1,end) infinite}
.pip-live .pw-chase.c1{animation-delay:-.4s}
.pip-live .pw-chase.c2{animation-delay:-.8s}
@keyframes pipChase{0%{opacity:1}33%{opacity:.35}66%{opacity:.6}}
.pip-live .pw-pinspin{transform-box:fill-box;transform-origin:50% 50%;animation:pipSpin 2.4s linear infinite}
.pip-live .pw-pinspin.pr{animation-duration:3.1s;animation-direction:reverse}
.pip-live .pw-wheel{transform-box:fill-box;transform-origin:50% 50%;animation:pipSpin 40s linear infinite}
.pip-live .pw-wheelc{transform-box:fill-box;transform-origin:50% 0%;animation:pipSpin 40s linear infinite reverse}
.pip-live .pw-deck{animation:pipDeck 3s linear infinite}
@keyframes pipDeck{to{stroke-dashoffset:-40}}
.pip-live .pw-carousel{animation:pipCarousel 2.6s ease-in-out infinite}
@keyframes pipCarousel{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
.pip-live .petpose-sleep .pw-carousel{animation-duration:8s}
.pip-live .pw-pop{animation:pipPop 2.8s ease-out infinite}
.pip-live .pw-pop.k1{animation-delay:-.7s}
.pip-live .pw-pop.k2{animation-delay:-1.4s;animation-duration:3.3s}
.pip-live .pw-pop.k3{animation-delay:-2.1s;animation-duration:2.5s}
@keyframes pipPop{0%{transform:translateY(0);opacity:0}10%{opacity:1}45%{transform:translateY(-22px)}85%{opacity:1}100%{transform:translateY(-4px);opacity:0}}
.pip-live .pw-steam{animation:pipMote 3.4s ease-in-out infinite}
.pip-live .pw-steam.s1{animation-delay:-1.7s}
.pip-live .pw-kite{transform-box:fill-box;transform-origin:50% 100%;animation:pipKite 4.4s ease-in-out infinite}
@keyframes pipKite{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-4px)}}
.pip-live .pw-bunt{animation:pipFog 6s ease-in-out infinite}
.pip-live .pw-bunt.bb{animation-delay:-3s}
.pip-live .pw-drop{animation:pipDrop 5s ease-in infinite}
@keyframes pipDrop{0%,60%{transform:translateY(0);opacity:1}90%{transform:translateY(40px);opacity:1}100%{transform:translateY(40px);opacity:0}}

/* premium animations */
.pip-live .pw-orbit{
  transform-box:fill-box;transform-origin:50% 50%;
  animation:pipSpin 14s linear infinite;
}
.pip-live .pw-crownstar{
  transform-box:fill-box;transform-origin:50% 50%;
  animation:pipTwinkle 2.4s ease-in-out infinite;
}
.pip-live .pw-star{
  transform-box:fill-box;transform-origin:50% 50%;
  animation:pipTwinkle 2.6s ease-in-out infinite;
}
.pip-live .pw-star.s1{animation-delay:-.6s}
.pip-live .pw-star.s2{animation-delay:-1.2s}
.pip-live .pw-star.s3{animation-delay:-1.8s}
.pip-live .pw-field{animation:pipDrift 22s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pipDrift{to{transform:rotate(360deg)}}
.pip-live .pw-ember{
  transform-box:fill-box;transform-origin:50% 100%;
  animation:pipRise 2.4s ease-out infinite;
}
.pip-live .pw-ember.e1{animation-delay:-.8s}
.pip-live .pw-ember.e2{animation-delay:-1.6s}
@keyframes pipRise{
  0%{transform:translateY(6px) scale(.6);opacity:0}
  25%{opacity:.95}
  100%{transform:translateY(-26px) scale(.35);opacity:0}
}
.pip-live .pw-fire{
  transform-box:fill-box;transform-origin:50% 100%;
  animation:pipFire .34s steps(2,end) infinite;
}
@keyframes pipFire{
  0%{transform:scale(1,1)}
  100%{transform:scale(.92,1.14)}
}
.pip-live .pw-galaxy{animation:pipShimmer 5s ease-in-out infinite}

/* ============ events ============ */
.evlist{display:grid;gap:10px}
.evcard{
  position:relative;display:flex;gap:15px;align-items:flex-start;
  padding:18px 17px 16px;border-radius:14px;overflow:visible;
  background:linear-gradient(var(--surface),var(--sunk));
  border:1px solid var(--edge-soft);box-shadow:var(--sh-1);
}
.evcard.shut{opacity:.62}
.evmain{flex:1;min-width:0}
.evmain h4{font-family:var(--serif);font-size:1.1rem;color:var(--text-hi);margin:0 0 5px}
.evmain p{font-size:.85rem;color:var(--text-2);line-height:1.5}
.evmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.evside{display:grid;gap:8px;justify-items:end;flex:none;text-align:right}
.evside .upto{font-family:var(--serif);font-size:1.05rem;color:var(--gold-hi);white-space:nowrap}
@media(max-width:480px){
  .evcard{flex-wrap:wrap}
  .evside{justify-items:flex-start;text-align:left;width:100%}
}

.shotbox{
  display:flex;justify-content:center;align-items:center;min-height:170px;
  border-radius:14px;border:1px dashed var(--edge);background:var(--sunk);overflow:hidden;
}
.shotbox img{max-width:100%;max-height:260px;border-radius:12px;display:block}
.shotempty{display:grid;justify-items:center;gap:8px;color:var(--text-3);font-size:.84rem}
.shotempty svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6}
.entrythumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}

.reviews{display:grid;gap:11px}
.revcard{
  padding:15px 16px;border-radius:14px;
  background:linear-gradient(var(--surface),var(--sunk));
  border:1px solid var(--edge-soft);box-shadow:var(--sh-1);
}
.revtop{display:flex;gap:14px;align-items:flex-start}
.revshot{
  flex:none;display:grid;gap:4px;justify-items:center;padding:0;border:0;background:none;
}
.revshot img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--edge)}
.revshot span{font-size:.66rem;color:var(--text-3)}
.revtext{font-size:.9rem;color:var(--text);margin-top:4px;white-space:pre-wrap}
.revrate{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:13px;
  border-top:1px solid var(--edge-soft);padding-top:12px}
.fullshot{display:flex;justify-content:center}
.fullshot img{max-width:100%;max-height:62vh;border-radius:12px}

.rubric{display:grid;gap:7px}
.rubrow{display:flex;gap:7px;align-items:center}
.rubrow input[data-rl]{flex:1}
.rubrow input[data-rp]{width:84px;text-align:right;flex:none}

/* ============ Pip's room ============ */
.room{
  position:relative;width:100%;border-radius:18px;overflow:hidden;
  aspect-ratio:3/2;min-height:300px;max-height:430px;
  border:1px solid var(--edge);box-shadow:var(--sh-2);
  margin-top:4px;
}
.room .wall{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.10),transparent 60%),
    linear-gradient(var(--wall-a),var(--wall-b));
}
.room .floor{
  position:absolute;left:0;right:0;bottom:0;height:27%;
  background:linear-gradient(var(--floor),color-mix(in srgb,var(--floor) 55%,#000));
  box-shadow:0 -14px 30px -18px #000 inset;
}
.room .rug{
  position:absolute;left:50%;bottom:5%;transform:translateX(-50%);
  width:46%;height:9%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.34),transparent);
}

/* the bookcase */
.room .bookcase{position:absolute;left:4%;bottom:27%;width:44%}
.room .books{
  display:flex;align-items:flex-end;gap:3px;height:84px;padding:0 8px;
}
.room .spine{
  display:block;border-radius:2px 2px 0 0;position:relative;flex:none;
  box-shadow:inset -2px 0 0 rgba(0,0,0,.28),inset 2px 0 0 rgba(255,255,255,.16);
}
.room .spine i{
  position:absolute;left:2px;right:2px;top:18%;height:2px;
  background:rgba(255,255,255,.4);box-shadow:0 5px 0 rgba(255,255,255,.28);
}
.room .spinemore{
  align-self:flex-end;font-size:.66rem;color:rgba(255,255,255,.62);padding-bottom:4px;
}
.room .emptyshelf{
  align-self:flex-end;font-size:.72rem;color:rgba(255,255,255,.38);padding-bottom:6px;font-style:italic;
}
.room .board{
  height:9px;border-radius:3px;background:var(--rail);
  box-shadow:0 3px 8px -2px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.22);
}

/* framed work */
.room .frames{position:absolute;left:6%;top:15%;display:flex;gap:10px}
.room .frame{
  padding:4px;border-radius:4px;background:var(--rail);border:0;
  box-shadow:0 6px 14px -6px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.18);
  transform:rotate(-1.5deg);transition:transform .16s var(--ease);
}
.room .frame:nth-child(2){transform:rotate(1.8deg)}
.room .frame:nth-child(3){transform:rotate(-.8deg)}
.room .frame img{display:block;width:52px;height:52px;object-fit:cover;border-radius:2px}

/* streak plaque */
.room .plaque{
  position:absolute;right:5%;top:16%;text-align:center;
  padding:9px 15px;border-radius:7px;
  background:linear-gradient(var(--rail),color-mix(in srgb,var(--rail) 60%,#000));
  box-shadow:0 6px 16px -8px #000,inset 0 1px 0 rgba(255,255,255,.22);
}
.room .plaque .k{display:block;font-size:.58rem;letter-spacing:.14em;color:rgba(255,255,255,.6)}
.room .plaque .v{
  display:block;font-family:var(--serif);font-size:1.5rem;color:#FFD583;line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.room .plaque .v small{font-family:var(--sans);font-size:.58rem;color:rgba(255,255,255,.65)}

/* trophy plinth */
.room .plinth{position:absolute;right:6%;bottom:27%;width:26%;max-width:190px}
.room .trophies{display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:3px}
.room .trophy{width:26px;height:26px;display:block}
.room .trophy svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.room .trophymore{font-size:.66rem;color:rgba(255,255,255,.6);align-self:flex-end;padding-bottom:3px}
.room .plinth .top{
  height:8px;border-radius:3px;background:var(--rail);
  box-shadow:0 3px 8px -2px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2);
}

.room .pipstand{
  position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.45));
}
@media(max-width:620px){
  .room{aspect-ratio:4/3;min-height:320px}
  .room .bookcase{left:3%;width:56%;bottom:30%}
  .room .books{height:62px}
  .room .plinth{right:4%;bottom:30%;width:32%}
  .room .frames{top:6%;left:4%}
  .room .frame img{width:40px;height:40px}
  .room .pipstand{bottom:6%}
  .room .pipstand .pip{width:118px;height:118px}
}

.wallpick{
  width:44px;height:30px;border-radius:8px;border:1px solid var(--edge);
}
.wallpick.on{box-shadow:0 0 0 2px var(--brand-hi);border-color:transparent}
.spinechip{width:10px;height:26px;border-radius:2px;flex:none}
@media (hover:hover) and (pointer:fine){
  .room .frame:hover{transform:rotate(0deg) scale(1.06)}
  .wallpick:hover{border-color:var(--brand-hi)}
}

/* ============ Pip's pantry ============ */
.pantry .foodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.foodcard{
  display:grid;justify-items:center;text-align:center;gap:5px;padding:12px 10px;border-radius:14px;
  background:linear-gradient(var(--surface),var(--sunk));border:1px solid var(--edge-soft);
}
.foodcard .ic{--ib:34px;width:54px;height:54px}
.foodcard .ic .emo{font-size:calc(34px*var(--is))}
.foodcard.have{border-color:var(--gold-soft)}
.foodcard.buyable{border-color:var(--brand-hi)}
.foodcard.shut{opacity:.6}
.foodcard .fn{font-family:var(--serif);font-size:1rem;color:var(--text-hi);line-height:1.2}
.foodcard .cnt{font-family:var(--sans);font-size:.78rem;color:var(--gold-hi)}
.foodcard .fd{font-size:.72rem;color:var(--text-3);line-height:1.35}
.foodcard .fb{font-size:.74rem;color:var(--pass);line-height:1.3}
.foodcard .fp{font-family:var(--serif);color:var(--gold-hi)}
.foodcard .fp small{font-family:var(--sans);font-size:.66rem;color:var(--text-3)}
.foodcard .fp s{color:var(--text-3);font-size:.8rem}
.foodcard .adminrow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.fedbar{
  display:flex;align-items:center;gap:10px;margin:10px 0 12px;padding:8px 12px;border-radius:12px;
  border:1px solid var(--pass);background:var(--pass-faint);font-size:.84rem;color:var(--text-hi);flex-wrap:wrap;
}
.fedbar.asleep{border-color:var(--edge);background:none;color:var(--text-3)}
.fedbar .ic{--ib:20px;width:32px;height:32px;border-radius:9px}
.abil.food{border-color:var(--pass);background:var(--pass-faint);color:var(--pass)}
.abil.food svg{display:none}

/* the bowl beside Pip while a food works */
.room .bowl{position:absolute;left:calc(50% + 62px);bottom:6%;width:46px;display:grid;justify-items:center;z-index:2}
.room .bowl .bf .ic{--ib:20px;width:30px;height:30px;border-radius:50%;background:none !important;box-shadow:none;
  animation:bowlBob 2.4s ease-in-out infinite}
.room .bowl .bb{display:block;width:44px;height:14px;margin-top:-8px;border-radius:0 0 22px 22px;
  background:linear-gradient(#E8452C,#8E1B14);box-shadow:0 4px 8px -3px #000}
.room .bowl.asleep{opacity:.5}
@keyframes bowlBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* Pips on display */
.room .figure{
  position:absolute;z-index:1;border:0;background:none;padding:0;cursor:pointer;
  display:grid;justify-items:center;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));
  transition:transform .16s var(--ease);
}
.room .figure .pip{width:72px;height:72px}
.room .figure .fl{
  font-size:.56rem;letter-spacing:.06em;color:rgba(255,255,255,.75);margin-top:-6px;
  padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.35);white-space:nowrap;
  opacity:0;transition:opacity .16s var(--ease);
}
.room .figure.top .fl{color:#FFD583}
.room .figure:hover .fl,.room .figure:focus-visible .fl{opacity:1}
.room .figmore{position:absolute;right:2%;bottom:1%;font-size:.6rem;color:rgba(255,255,255,.6)}
@media (hover:hover) and (pointer:fine){.room .figure:hover{transform:translateY(-4px) scale(1.06)}}
@media(max-width:620px){
  .room .figure .pip{width:54px;height:54px}
  .room .figure:nth-of-type(n+5){display:none}
  .room .bowl{left:calc(50% + 46px)}
}
.figlist{display:flex;flex-wrap:wrap;gap:8px}
.figchip{
  display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;cursor:pointer;
  border:1px solid var(--edge);background:var(--surface);color:var(--text-hi);font-size:.8rem;
}
.figchip:hover{border-color:var(--brand-hi)}

/* food in the bonus pool */
.tierhead.t-food .tl{color:var(--pass)}
.bpick.t-food .ic{--ib:24px;width:40px;height:40px;border-radius:11px;margin:2px auto}
.bonusstrip.food .bpv .ic{--ib:20px;width:34px;height:34px;border-radius:10px}
.poolsum .ps.t-food{color:var(--pass)}

/* the feeding moment */
.feedfx{
  position:fixed;z-index:210;
  top:var(--vv-top);left:var(--vv-left);width:var(--vv-w);height:var(--vv-h);
  display:grid;place-items:center;padding:20px;cursor:pointer;
  background:radial-gradient(circle at 50% 44%,rgba(24,40,40,.74),rgba(6,9,20,.93));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  animation:mFade .22s var(--ease);
}
.fstage{display:grid;justify-items:center;text-align:center;max-width:460px}
.fscene{position:relative;width:190px;height:190px}
.fpip{position:absolute;inset:0}
.fpip.fa{animation:fHide 4s steps(1,end) both}
.fpip.fb{opacity:0;animation:fShow 4s steps(1,end) both,fChew .32s ease-in-out .95s 4}
@keyframes fHide{0%{opacity:1}24%{opacity:0}62%{opacity:0}100%{opacity:0}}
@keyframes fShow{0%{opacity:0}24%{opacity:1}100%{opacity:1}}
@keyframes fChew{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.93) translateY(6px)}}
.ffood{
  position:absolute;left:95px;top:106px;width:0;height:0;
  animation:fDrop .95s cubic-bezier(.5,-.1,.7,1) both;
}
.ffood .femo,.ffood .ic{position:absolute;transform:translate(-50%,-50%)}
.ffood .femo{font-size:46px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.ffood .ic{--ib:30px;width:48px;height:48px}
@keyframes fDrop{
  0%{transform:translate(-120px,-170px) rotate(-30deg) scale(1.1);opacity:0}
  15%{opacity:1}
  70%{transform:translate(-8px,-26px) rotate(10deg) scale(1)}
  100%{transform:translate(0,0) rotate(0) scale(.15);opacity:0}
}
.fcrumbs{position:absolute;left:95px;top:112px;width:0;height:0}
.fcrumbs i{
  position:absolute;width:6px;height:6px;border-radius:50%;background:#FFD27A;
  transform:rotate(var(--a)) translateY(0);opacity:0;
  animation:fCrumb .8s ease-out both;animation-delay:calc(.95s + var(--d));
}
.fcrumbs i:nth-child(odd){background:#F28B2B;width:4px;height:4px}
@keyframes fCrumb{
  0%{opacity:1;transform:rotate(var(--a)) translateY(0)}
  100%{opacity:0;transform:rotate(var(--a)) translateY(-54px)}
}
.fhearts{position:absolute;left:95px;top:30px;width:0;height:0}
.fhearts b{
  position:absolute;left:var(--x);font-size:20px;color:#FF6E93;opacity:0;
  animation:fHeart 1.6s ease-out both;animation-delay:var(--d);
}
@keyframes fHeart{
  0%{opacity:0;transform:translateY(10px) scale(.5)}
  25%{opacity:1;transform:translateY(-6px) scale(1.1)}
  100%{opacity:0;transform:translateY(-60px) scale(.9)}
}
.fwords{margin-top:12px;animation:mRise .5s var(--ease) both;animation-delay:1.1s}
.feedfx.still .fpip.fa{display:none}
.feedfx.still .fpip.fb{opacity:1;animation:none}
.feedfx.still .ffood,.feedfx.still .fcrumbs,.feedfx.still .fhearts{display:none}
.feedfx.still .fwords{animation:none}

/* seasonal event banners */
.evcard.themed{
  padding-top:50px;flex-wrap:wrap;
  border-color:color-mix(in srgb,var(--tha) 55%,var(--edge-soft));
  background:
    radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--thb) 22%,transparent),transparent 60%),
    linear-gradient(var(--surface),var(--sunk));
}
.evcard.themed>.ic{margin-top:0}
.evbanner{
  position:absolute;left:0;right:0;top:0;height:34px;border-radius:13px 13px 0 0;
  display:flex;align-items:center;gap:10px;padding:0 12px;overflow:hidden;
  background:linear-gradient(110deg,var(--tha),var(--thb));color:var(--thi);
}
.evbanner::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);
  background-size:260% 100%;animation:evShine 6s linear infinite;
}
@keyframes evShine{from{background-position:130% 0}to{background-position:-130% 0}}
.evbanner .evmo{display:flex;gap:3px;font-size:1rem;line-height:1}
.evbanner .evmo i{font-style:normal;display:inline-block;animation:evBob 2.6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes evBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-3px) rotate(6deg)}}
.evbanner .evbt{font-size:.68rem;font-weight:700;letter-spacing:.18em;text-shadow:0 1px 2px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.evbanner .evcd{
  margin-left:auto;font-size:.62rem;font-weight:700;letter-spacing:.1em;white-space:nowrap;
  padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.28);color:#fff;
}
.evbanner .evcd.last{background:var(--fail)}
.themepick{display:flex;flex-wrap:wrap;gap:6px}
.themepick button{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--edge);background:var(--surface);color:var(--text-2);font-size:.78rem;font-weight:600;
}
.themepick button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--brand-hi);border-color:transparent}
.evprev{margin-top:10px}
.evprev .evbanner{position:relative;border-radius:10px}
.wishlock{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.wishlock svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.evcard{flex-wrap:wrap}
.evcard .evmain{flex:1 1 220px}
.themepick{margin-bottom:12px}
.foodcard .pill{white-space:normal;text-align:center;max-width:100%;line-height:1.3}

/* ============ event engine: checklists, calendars, goals ============ */
.steplist{display:grid;gap:8px}
.steprow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--edge-soft);background:var(--surface)}
.steprow.done{border-color:var(--pass);background:var(--pass-faint)}
.steprow .sn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:.8rem;font-weight:700;background:var(--brand-faint);color:var(--brand-hi)}
.steprow.done .sn{background:var(--pass);color:#fff}
.steprow .sl{flex:1;min-width:0;color:var(--text-hi);font-size:.9rem}
.steprow .sp{font-family:var(--serif);color:var(--gold-hi);font-size:.9rem}
.calgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.caldoor{
  position:relative;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;align-content:center;gap:2px;
  border:1px solid var(--edge);background:linear-gradient(var(--surface),var(--sunk));color:var(--text-2);
  font:inherit;cursor:default;padding:4px;
}
.caldoor b{font-family:var(--serif);font-size:1.35rem;line-height:1;color:var(--text-hi)}
.caldoor span{font-size:.58rem;line-height:1.15;text-align:center}
.caldoor.open{cursor:pointer;border-color:var(--gold-soft);
  background:linear-gradient(135deg,#C9302C,#1E7A3E);color:#fff}
.caldoor.open b{color:#fff}
.caldoor.today{box-shadow:0 0 0 2px var(--gold-hi);animation:doorGlow 1.8s ease-in-out infinite}
@keyframes doorGlow{0%,100%{box-shadow:0 0 0 2px var(--gold-hi)}50%{box-shadow:0 0 0 5px var(--gold-soft)}}
.caldoor.done{border-color:var(--pass);background:var(--pass-faint);color:var(--pass)}
.caldoor.wait{border-color:var(--gold-soft);color:var(--gold-hi)}
.caldoor.missed,.caldoor.shut{opacity:.5}
@media (hover:hover) and (pointer:fine){.caldoor.open:hover{transform:translateY(-2px)}}
.goalbar{margin-top:8px;display:grid;gap:4px;max-width:420px}
.goalbar .wbar{height:9px;border-radius:999px;background:var(--sunk);overflow:hidden;border:1px solid var(--edge-soft)}
.goalbar .wbar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--pass))}
.evcard.timed .evmain h4::before{content:"\23F1\FE0F  "}

/* ============ connected events ============ */
.steped{display:grid;gap:4px;padding:6px 0;border-bottom:1px dashed var(--edge-soft)}
.trigrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-left:52px}
.trigrow .inp{width:auto;min-width:0;flex:0 1 auto;font-size:.85rem;padding:6px 9px}
.steprow .sl small{display:block;font-size:.7rem;color:var(--text-3);margin-top:2px}
.trbar{display:block;height:5px;border-radius:999px;background:var(--sunk);margin-top:5px;overflow:hidden;max-width:220px}
.trbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pass));border-radius:999px}
.steprow.claim{border-color:var(--gold-soft);background:var(--gold-faint)}
.caldoor.track{border-color:var(--edge);color:var(--text-2)}
.evcard.claimable{box-shadow:0 0 0 2px var(--gold-soft),var(--sh-1)}
.evcard.locked .evmain h4::after{content:"  \1F512"}
.bookevents .evcard{text-align:left}

/* ============ Pip in every zone ============ */
.pagehead{position:relative}
.zonepip{flex:none;align-self:flex-end;margin:0 6px -6px auto;cursor:pointer;position:relative}
.zonepip .pip{width:72px;height:72px;display:block}
.zonepip.bouncy .pip{animation:zoneBounce 1.4s ease-in-out infinite}
@keyframes zoneBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}60%{transform:translateY(0) scale(1.04,.96)}}
@media(max-width:560px){.zonepip .pip{width:54px;height:54px}}
.coach{display:inline-block;width:40px;height:40px;flex:none;margin:-10px 0 -8px}
.coach .pip{width:40px;height:40px;display:block}
.coach.nod .pip{animation:coachNod .5s ease-out}
@keyframes coachNod{0%{transform:translateY(0)}40%{transform:translateY(3px) rotate(-4deg)}100%{transform:none}}
.coach.dozing{opacity:.75}
.pip-live .pw-burst{transform-box:fill-box;transform-origin:50% 50%;animation:pwBurst 2.4s ease-out infinite}
.pip-live .pw-burst.b1{animation-delay:-.8s}
.pip-live .pw-burst.b2{animation-delay:-1.6s}
@keyframes pwBurst{0%{transform:scale(.2);opacity:0}20%{opacity:1}70%{transform:scale(1);opacity:.9}100%{transform:scale(1.15);opacity:0}}

/* ============ the room across the day ============ */
.room .roomtint{position:absolute;inset:0;pointer-events:none;z-index:0;transition:background .6s}
.room.tod-morning .roomtint{background:linear-gradient(115deg,rgba(255,196,120,.20),transparent 55%)}
.room.tod-day .roomtint{background:radial-gradient(90% 70% at 50% 10%,rgba(255,255,255,.10),transparent 70%)}
.room.tod-evening .roomtint{background:radial-gradient(60% 60% at 50% 70%,rgba(255,170,80,.18),rgba(40,20,60,.20))}
.room.tod-night .roomtint{background:linear-gradient(rgba(6,10,30,.42),rgba(6,10,30,.30))}
.room.tod-night .pipstand::before{content:"";position:absolute;left:50%;top:40%;width:190px;height:190px;
  transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(rgba(255,210,120,.18),transparent 70%);pointer-events:none}
.roomwin{position:absolute;left:50%;top:9%;transform:translateX(-50%);width:19%;min-width:92px;max-width:150px;aspect-ratio:1/1.05;z-index:0}
.roomwin .pane{position:absolute;inset:0;border-radius:10px 10px 4px 4px;overflow:hidden;
  box-shadow:inset 0 0 0 5px var(--rail),inset 0 0 18px rgba(0,0,0,.35)}
.roomwin .mull{position:absolute;left:50%;top:5px;bottom:5px;width:4px;margin-left:-2px;background:var(--rail)}
.roomwin .mull::after{content:"";position:absolute;left:-40px;right:-40px;top:48%;height:4px;background:var(--rail)}
.roomwin .sill{position:absolute;left:-8%;right:-8%;bottom:-6px;height:8px;border-radius:3px;background:var(--rail);
  box-shadow:0 3px 6px -2px rgba(0,0,0,.6)}
.roomwin.sky-morning .pane{background:linear-gradient(#FFC27A,#FFE3B8 60%,#BFE3FF)}
.roomwin.sky-day .pane{background:linear-gradient(#5FB0F2,#BFE3FF)}
.roomwin.sky-evening .pane{background:linear-gradient(#3A2A6A,#C85A6A 60%,#FFB070)}
.roomwin.sky-night .pane{background:linear-gradient(#070B22,#1A2350)}
.roomwin .sun,.roomwin .moonw{position:absolute;border-radius:50%;display:none}
.roomwin .sun{width:26%;aspect-ratio:1;background:#FFE07A;box-shadow:0 0 18px #FFD24A}
.roomwin.sky-morning .sun{display:block;left:16%;top:52%}
.roomwin.sky-day .sun{display:block;right:14%;top:12%}
.roomwin.sky-evening .sun{display:block;left:40%;top:70%;background:#FF9A5A;box-shadow:0 0 18px #FF7A3A}
.roomwin .moonw{width:22%;aspect-ratio:1;background:#F4F8FF;box-shadow:0 0 14px rgba(244,248,255,.7)}
.roomwin.sky-night .moonw{display:block;right:16%;top:14%}
.roomwin .stars{position:absolute;inset:0;display:none}
.roomwin.sky-night .stars,.roomwin.sky-evening .stars{display:block}
.roomwin .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:pipShimmer 2.6s ease-in-out infinite}
.roomwin .stars i:nth-child(1){left:18%;top:20%}
.roomwin .stars i:nth-child(2){left:40%;top:12%;animation-delay:-.7s}
.roomwin .stars i:nth-child(3){left:28%;top:40%;animation-delay:-1.4s}
.roomwin .stars i:nth-child(4){left:62%;top:44%;animation-delay:-2s}
.roomwin .stars i:nth-child(5){left:80%;top:60%;animation-delay:-.3s}
.roomwin.sky-evening .stars i{opacity:.5}
.roomwin .cloud{position:absolute;height:12%;border-radius:999px;background:rgba(255,255,255,.85);display:none;animation:cloudDrift 18s linear infinite}

/* weather particles, shared by the window and the sky layer */
.wp{position:absolute;top:-12%;font-style:normal;line-height:1;pointer-events:none;
  animation-name:wpFall;animation-timing-function:linear;animation-iteration-count:infinite;transform:scale(var(--ws,1))}
@keyframes wpFall{0%{transform:translate(0,0) scale(var(--ws,1)) rotate(0)}100%{transform:translate(-14px,100px) scale(var(--ws,1)) rotate(200deg)}}
.roomwin .wp{animation-name:wpFallWin}
@keyframes wpFallWin{0%{transform:translate(0,0) scale(var(--ws,1)) rotate(0);top:-12%}100%{transform:translate(-8px,0) scale(var(--ws,1)) rotate(200deg);top:108%}}
.wx-snow .wp,.wx-rain .wp{width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.8)}
.wx-rain .wp{width:1.5px;height:9px;border-radius:1px;background:rgba(190,220,255,.85)}

@keyframes wpRise{0%{transform:translate(0,90px) scale(var(--ws,1));opacity:0}15%{opacity:1}100%{transform:translate(6px,0) scale(var(--ws,1));opacity:0}}
@keyframes wpRiseWin{0%{top:108%;opacity:0;transform:scale(var(--ws,1))}15%{opacity:1}100%{top:-14%;opacity:0;transform:translateX(6px) scale(var(--ws,1))}}
.wx-bats .wp{animation-name:wpFlit}
@keyframes wpFlit{0%{transform:translate(-20px,40px) scale(var(--ws,1))}50%{transform:translate(20px,20px) scale(var(--ws,1))}100%{transform:translate(-20px,40px) scale(var(--ws,1))}}
.roomwin.wx-bats .wp{animation-name:wpFlitWin;top:30%}
@keyframes wpFlitWin{0%,100%{transform:translate(-6px,10px) scale(var(--ws,1))}50%{transform:translate(8px,-6px) scale(var(--ws,1))}}
.roomwin .wp{font-size:.8rem}
.skyfx{position:fixed;left:0;right:0;top:0;height:74px;overflow:hidden;pointer-events:none;z-index:60;opacity:.45}
.skyfx .wp{top:-20px}
@media print{.skyfx{display:none}}

/* ============ companions ============ */
.room .roompet{position:absolute;bottom:9%;left:calc(50% + 70px);z-index:2;width:64px;height:64px;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}

.room .roompet.pers-curious{animation:petWander 16s ease-in-out infinite}
@keyframes petWander{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-170px) scaleX(-1)}
  35%{transform:translateX(-230px) translateY(-4px) scaleX(-1)}
  50%{transform:translateX(-230px) scaleX(1)}
  75%{transform:translateX(40px)}
}
.room .roompet.pers-sleepy{animation:petDrift 11s ease-in-out infinite;opacity:.95}
@keyframes petDrift{0%,100%{transform:translate(0,0)}30%{transform:translate(30px,-40px)}60%{transform:translate(-20px,-60px)}}
.room .roompet.pers-proud{left:auto;right:12%;animation:pipBob 3s ease-in-out infinite}
.room .petfind{position:absolute;bottom:4%;left:calc(50% + 120px);z-index:3;display:flex;align-items:center;gap:6px;
  border:0;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;color:#fff;
  box-shadow:0 0 0 2px rgba(255,213,131,.6),0 0 18px rgba(255,213,131,.55);animation:findGlow 1.8s ease-in-out infinite}
.room .petfind .pfi .ic{--ib:18px;width:28px;height:28px;border-radius:50%}
.room .petfind .pfi .pip{width:30px;height:30px;display:block}
.room .petfind .pft{font-size:.66rem;white-space:nowrap}
.coinfind{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:700;font-size:.8rem;
  background:radial-gradient(circle at 35% 30%,#FFE8A0,#F4B53F 60%,#B87A12);color:#4A2C00}
@keyframes findGlow{0%,100%{box-shadow:0 0 0 2px rgba(255,213,131,.6),0 0 10px rgba(255,213,131,.4)}50%{box-shadow:0 0 0 3px rgba(255,213,131,.9),0 0 24px rgba(255,213,131,.7)}}
@media(max-width:620px){

  .room .petfind .pft{display:none}
  .roomwin{top:6%;min-width:74px}
  @keyframes petWander{0%,100%{transform:translateX(0)}30%{transform:translateX(-110px) scaleX(-1)}60%{transform:translateX(-110px)}}
}

/* ============ countdown reminders ============ */
.remindbar{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:8px 14px 8px 6px;border-radius:16px;
  border:1px solid var(--gold-soft);background:linear-gradient(90deg,var(--gold-faint),transparent)}

.pwrows{display:grid;gap:6px;margin:8px 0}

/* ============ bonus cosmetics ============ */
.bonusstrip{
  display:flex;align-items:center;gap:11px;margin-top:11px;
  padding:8px 12px;border-radius:11px;
  border:1px solid var(--gold-soft);
  background:linear-gradient(100deg,var(--gold-faint) 0%,rgba(46,140,255,.10) 55%,var(--gold-faint) 100%);

}
.bonusstrip .bpv{
  width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;

}
.bonusstrip .btxt{display:grid;line-height:1.3;min-width:0}
.bonusstrip .btxt b{font-size:.82rem;color:var(--gold-hi)}

.bonusstrip .bspark{margin-left:auto;flex:none;color:var(--gold-hi)}
.bonusstrip .bspark svg{width:17px;height:17px;fill:currentColor;stroke:none;
  animation:pipTwinkle 2.2s ease-in-out infinite}
.evcard .bonusstrip,.actrow .bonusstrip{width:100%}
.actrow{flex-wrap:wrap}

.bonuspool{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.bpick{
  display:grid;justify-items:center;gap:3px;padding:8px 5px 7px;border-radius:11px;
  border:1px solid var(--edge-soft);background:var(--sunk);transition:.14s;position:relative;
}
.bpick.on{border-color:var(--gold);background:var(--gold-faint);box-shadow:0 0 0 1px var(--gold)}

.bpick .winonly{
  position:absolute;top:-7px;right:-4px;font-size:.54rem;letter-spacing:.06em;

}
@media (hover:hover) and (pointer:fine){.bpick:hover{border-color:var(--gold-hi)}}

/* ============ the moment ============ */
.moment{
  position:fixed;z-index:200;
  top:var(--vv-top);left:var(--vv-left);width:var(--vv-w);height:var(--vv-h);
  display:grid;place-items:center;padding:20px;
  background:radial-gradient(circle at 50% 46%,rgba(20,28,58,.72),rgba(6,9,20,.93));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  animation:mFade .22s var(--ease);
  cursor:pointer;
}
@keyframes mFade{from{opacity:0}}
.mstage{position:relative;display:grid;justify-items:center;text-align:center;max-width:460px}

.mrays{
  position:absolute;top:-56px;left:50%;width:520px;height:520px;
  transform:translateX(-50%);
  background:conic-gradient(from 0deg,
    rgba(244,181,63,.20) 0deg 9deg, transparent 9deg 30deg,
    rgba(244,181,63,.14) 30deg 39deg, transparent 39deg 60deg);
  border-radius:50%;
  -webkit-mask-image:radial-gradient(circle,#000 24%,transparent 68%);
  mask-image:radial-gradient(circle,#000 24%,transparent 68%);
  animation:mSpin 18s linear infinite, mFade .5s var(--ease);
}
@keyframes mSpin{to{transform:translateX(-50%) rotate(360deg)}}

.mburst{position:absolute;top:96px;left:50%;width:0;height:0}
.mspark{
  position:absolute;width:7px;height:19px;border-radius:4px;background:var(--gold-hi);
  transform:rotate(var(--a)) translateY(0);
  animation:mFly 1.1s var(--ease) both;
  animation-delay:var(--d);
}
.mspark.s1{background:#5FE3B0}
.mspark.s2{background:#B79BFF}
@keyframes mFly{
  0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.4)}
  30%{opacity:1}
  100%{opacity:0;transform:rotate(var(--a)) translateY(-168px) scale(1)}
}

.mpip{position:relative;animation:mPop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes mPop{
  0%{opacity:0;transform:scale(.5) translateY(26px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.mtoken{
  position:relative;margin-top:-14px;
  animation:mRise .5s var(--ease) both;animation-delay:.28s;
}
.mtoken .ic{width:54px;height:54px;--ib:34px;box-shadow:0 8px 20px -8px #000}
.mspine{
  display:block;width:26px;height:64px;border-radius:3px;position:relative;
  box-shadow:inset -3px 0 0 rgba(0,0,0,.3),inset 3px 0 0 rgba(255,255,255,.18),0 8px 18px -8px #000;
}
.mspine i{position:absolute;left:3px;right:3px;top:20%;height:3px;
  background:rgba(255,255,255,.45);box-shadow:0 8px 0 rgba(255,255,255,.3)}

.mwords{margin-top:16px;animation:mRise .5s var(--ease) both;animation-delay:.38s}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}}
.mkicker{
  font-size:.66rem;letter-spacing:.24em;color:var(--gold-hi);text-transform:uppercase;
}
.mtitle{
  font-family:var(--serif);font-size:clamp(1.7rem,5.6vw,2.5rem);
  color:#fff;line-height:1.14;margin-top:6px;letter-spacing:-.015em;
}
.mline{color:var(--text-2);font-size:.92rem;margin-top:7px}
.mprize{
  display:inline-block;margin-top:14px;padding:7px 16px;border-radius:999px;
  border:1px solid var(--gold-soft);background:var(--gold-faint);
  color:var(--gold-hi);font-size:.86rem;
}
.mtap{
  margin-top:22px;font-size:.7rem;letter-spacing:.1em;color:var(--text-3);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  animation:mFade 1s var(--ease) both;animation-delay:1.2s;
}
.moment.still .mpip,.moment.still .mwords,.moment.still .mtoken,.moment.still .mtap{animation:none}
.mdismiss{min-width:150px;font-size:.95rem;letter-spacing:0;padding:10px 22px;justify-content:center;text-align:center}
.mmore{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.feedfx .mtap{animation:mFade 1s var(--ease) both;animation-delay:1.6s}

@media(max-width:480px){

/* ============ Pip reacting ============ */
.pipstand,.emptypip,.dressstage{position:relative;cursor:pointer}
.pip-hop{animation:pipHop .72s cubic-bezier(.3,1.5,.5,1)}
@keyframes pipHop{
  0%{transform:translateY(0) scale(1,1)}

  0%,100%{transform:rotate(0)}

  72%{transform:rotate(-2deg)}

.pipsay{
  position:absolute;left:50%;bottom:calc(100% - 6px);transform:translateX(-50%);

.pipsay.go{animation:sayOut .4s var(--ease) both}
@keyframes sayIn{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.9)}}
@keyframes sayOut{to{opacity:0;transform:translateX(-50%) translateY(-6px)}}
@media(max-width:480px){.pipsay{font-size:.8rem;padding:8px 12px}}

/* ============ bonus pool, sorted by tier ============ */
.tierhead{

.bpick .pr{

.bpick.t-look{border-color:rgba(46,140,255,.30)}

.poolsum{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  margin-top:12px;font-size:.74rem;color:var(--text-2);
}
.poolsum .ps{
  padding:3px 9px;border-radius:999px;border:1px solid var(--edge);color:var(--text-2);
}

.bpick .in{

}
.bpick.t-top .in{color:var(--gold-ink)}
</style>

d to Simon Lovelace and acts as his heavy enforcer?", "options": ["Jabor", "Ramuthra", "Queezle", "Nettles"], "answer": 0, "why": "Jabor is relentless rather than clever, which is exactly why Bartimaeus has to outthink him instead of outfight him.", "tag": "character"}, {"q": "Who is the Head of Internal Security for the magicians' government?", "options": ["Amanda Cathcart", "Arthur Underwood", "Jessica Whitwell", "John Mandrake"], "answer": 2, "why": "Whitwell's position puts her at the centre of the investigation, and matters a great deal for Nathaniel's future.", "tag": "worldbuilding"}, {"q": "How does Nathaniel manage to learn advanced summoning magic at such a young age?", "options": ["By attending a secret academy", "By reading Underwood's locked books in his study", "Bartimaeus teaches him", "He inherits the knowledge"], "answer": 1, "why": "He teaches himself in secret from his master's own library, years ahead of what his lessons allow.", "tag": "plot"}, {"q": "In the spirit hierarchy, which of the following is considered the lowest and weakest form?", "options": ["Mites", "Foliots", "Afrits", "Djinn"], "answer": 0, "why": "The ranking runs upward from imps and mites through foliots and djinn to afrits and marids.", "tag": "worldbuilding"}, {"q": "How does Bartimaeus initially escape Lovelace's magical trap after stealing the amulet?", "options": ["By killing Lovelace", "By shapeshifting into a bird and flying out a window", "By tunneling through the floor", "By freezing time"], "answer": 1, "why": "Shapeshifting is his standard escape, and the bird form is small enough to take an exit a person could not.", "tag": "plot"}, {"q": "Who tragically perishes when Lovelace's spirits attack the Underwood household?", "options": ["Only Arthur Underwood", "Arthur and Martha Underwood", "Nathaniel and Martha", "Simon Lovelace"], "answer": 1, "why": "Both Underwoods die, and Nathaniel's part in bringing that on the house is the turning point of his character.", "tag function toast(msg,kind,ms){
  var d=document.createElement('div');
  d.className='toast'+(kind?' '+kind:'');
  d.textContent=msg;
  $('#toasts').appendChild(d);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},ms||4200);

/* ---------- storage ---------- */
var storageOK=true;
function readRaw(k){try{return localStorage.getItem(k);}catch(e){storageOK=false;return null;}}

function load(){
  var d=null,raw=readRaw(KEY);
  if(raw){try{d=JSON.parse(raw);}catch(e){d=null;}}
  if(!d){
    d=migrate();
  }
  S.profiles=Array.isArray(d.profiles)?d.profiles:[];
  S.modules=Array.isArray(d.modules)?d.modules:[];
  S.store=Array.isArray(d.store)?d.store:[];
  S.activities=Array.isArray(d.activities)?d.activities:[];
  S.streaks=Array.isArray(d.streaks)?d.streaks:[];
  S.events=Array.isArray(d.events)?d.events:[];
  S.foods=Array.isArray(d.foods)?d.foods:[];
  S.active=d.active||null;
  S.settings={pw:null,folder:'modules.json',assets:'avatars.json',autoSync:true,syncDefaulted:false,lastExport:'',
    wish:{on:true,shortfall:25,payback:10,cap:0,lockDays:7,lockAfterGrant:false},
    food:{on:true,gap:30,perDay:3,hold:5},
    pipshop:{on:true,prices:{},off:{}},
    events:{on:false},seeded:false,theme:'auto',immersive:true,hideInstallHint:false,lastView:''};
  if(d.settings)for(var k in d.settings){if(Object.prototype.hasOwnProperty.call(d.settings,k))S.settings[k]=d.settings[k];}
  /* Earlier builds kept these in subfolders. GitHub's uploader flattens
     folders, so the layout moved and stored paths need bringing along. */
  /* Installs made before this was the default had it off, and the manual
     "read that folder" button was easy to miss. Turn it on once. */
  if(!S.settings.syncDefaulted){S.settings.autoSync=true;S.settings.syncDefaulted=true;}
  if(S.settings.folder==='modules/manifest.json')S.settings.folder='modules.json';
  if(S.settings.assets==='assets/manifest.json')S.settings.assets='avatars.json';
  /* Profiles made before the store existed have no purchase list. */
  S.profiles.forEach(function(p){
    if(!Array.isArray(p.purchases))p.purchases=[];
    if(!Array.isArray(p.activities))p.activities=[];
    if(!Array.isArray(p.adjustments))p.adjustments=[];
    if(!Array.isArray(p.streaks))p.streaks=[];
    if(p.wish===undefined)p.wish=null;
    if(!Array.isArray(p.pipOwned))p.pipOwned=['body-sun','eyes-dot'];
    if(!p.pipLook)p.pipLook={body:'sun',eyes:'dot'};
    /* Readers who already had a picture keep it until they say otherwise. */
    if(!p.face)p.face=p.avatar?'picture':'pip';
    if(!Array.isArray(p.entries))p.entries=[];

  migratePowers();

    });
    S.settings.booksMigrated=true;
  }

  if(S.active&&!profile(S.active))S.active=null;
