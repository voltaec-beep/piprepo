/* =========================================================
   Platform: the things that make Pip behave like an app
   rather than a page — installing, working offline, holding
   the screen awake, and answering the back button.
   ========================================================= */

var deferredInstall=null;
var swReg=null, pendingWorker=null;
var navBack=false;

function isStandalone(){
  if(window.navigator.standalone===true)return true;          /* iOS home screen */
  try{
    return window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
        || window.matchMedia('(display-mode: minimal-ui)').matches;
  }catch(e){return false;}
}
function isIOS(){
  var ua=navigator.userAgent||'';
  return /iPad|iPhone|iPod/.test(ua)
      || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
function canInstallHint(){
  /* iOS never fires beforeinstallprompt, so it needs telling by hand. */
  return isIOS()&&!isStandalone()&&!S.settings.hideInstallHint;
}

/* ---------- service worker ---------- */
function registerSW(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol==='file:')return;   /* no offline copy from a local file */
  var hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    swReg=reg;
    reg.addEventListener('updatefound',function(){
      var w=reg.installing;
      if(!w)return;
      w.addEventListener('statechange',function(){
        if(w.state==='installed'&&navigator.serviceWorker.controller){
          pendingWorker=w;
          offerUpdate();
        }
      });
    });
  }).catch(function(){});

  var reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    /* On a first visit the worker claims the page and this fires straight
       away — reloading then would bounce the reader for no reason. */
    if(!hadController||reloading)return;
    reloading=true;
    location.reload();
  });
}
function offerUpdate(){
  /* Never interrupt a test in progress — the reload would lose it. */
  if(S.run){setTimeout(offerUpdate,60000);return;}
  var d=document.createElement('div');
  d.className='toast good';
  d.innerHTML='<div class="row" style="gap:12px;justify-content:space-between">'+
    '<span>A new version of Pip is ready.</span>'+
    '<button class="btn btn-sm" data-act="apply-update">Reload</button></div>';
  $('#toasts').appendChild(d);
}
function applyUpdate(){
  if(pendingWorker)pendingWorker.postMessage('SKIP_WAITING');
  else location.reload();
}

/* ---------- installing ---------- */
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredInstall=e;
  render();
});
window.addEventListener('appinstalled',function(){
  deferredInstall=null;
  toast('Pip is on your home screen.','good');
  render();
});
function installPip(){
  if(!deferredInstall)return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(function(){deferredInstall=null;render();});
}
function iosInstallSheet(){
  openModal(
    '<h3>Add Pip to your home screen</h3>'+
    '<p class="lede">It opens with its own icon and no browser bars, and works with no connection.</p>'+
    '<ol style="margin:18px 0 0;padding-left:20px;line-height:1.9;font-size:.92rem">'+
      '<li>Tap the share button at the bottom of Safari.</li>'+
      '<li>Scroll down and choose <strong>Add to Home Screen</strong>.</li>'+
      '<li>Tap <strong>Add</strong>.</li>'+
    '</ol>'+
    '<p class="tiny muted" style="margin-top:16px">Open Pip from that icon from now on. '+
    'Readers and points are kept separately for the icon and for Safari, so pick one and stay with it.</p>'+
    '<div class="foot"><button class="btn" data-act="hide-install-hint">Don\u2019t show this again</button>'+
    '<button class="btn btn-primary" data-close data-focus>Got it</button></div>'
  );
}

/* ---------- immersive mode ---------- */
function fullscreenAvailable(){
  var el=document.documentElement;
  return !!(el.requestFullscreen||el.webkitRequestFullscreen);
}
function enterImmersive(){
  /* Must be called inside a user gesture. Installed apps already have no
     browser chrome, so there is nothing to hide. */
  if(!S.settings.immersive)return;
  if(isStandalone())return;
  if(!fullscreenAvailable())return;
  var el=document.documentElement;
  var fn=el.requestFullscreen||el.webkitRequestFullscreen;
  try{
    var p=fn.call(el,{navigationUI:'hide'});
    if(p&&p.catch)p.catch(function(){});
  }catch(e){}
}
function exitImmersive(){
  try{
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();
  }catch(e){}
}

/* ---------- keep the screen awake during a test ---------- */
var wakeLock=null;
function wakeOn(){
  if(!('wakeLock' in navigator)||wakeLock)return;
  navigator.wakeLock.request('screen').then(function(l){
    wakeLock=l;
    l.addEventListener('release',function(){wakeLock=null;});
  }).catch(function(){});
}
function wakeOff(){
  if(!wakeLock)return;
  try{wakeLock.release();}catch(e){}
  wakeLock=null;
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&S.view==='quiz'&&S.run)wakeOn();
});

/* ---------- back button ---------- */
function pushView(){
  try{history.pushState({pip:1,v:S.view,arg:S.arg},'');}catch(e){}
}
window.addEventListener('popstate',function(e){
  if(S.modals.length){closeModal();pushView();return;}
  if(S.run){
    pushView();
    confirmModal('Leave this test?','Nothing is recorded and the questions are reshuffled next time.',
      'Leave',function(){S.run=null;go('catalog');},true);
    return;
  }
  var st=(e.state&&e.state.pip)?e.state:null;
  navBack=true;
  if(st)go(st.v==='quiz'?'catalog':st.v,st.arg);
  else go(me()?'catalog':'gate');
  navBack=false;
});

/* ---------- don't lose a test to a stray reload ---------- */
window.addEventListener('beforeunload',function(e){
  if(!S.run)return;
  e.preventDefault();
  e.returnValue='';
});

function askPersistence(){
  if(!navigator.storage||!navigator.storage.persist)return;
  navigator.storage.persisted().then(function(already){
    if(!already)navigator.storage.persist().catch(function(){});
  }).catch(function(){});
}

function diagnose(){
  var out={
    address:location.href,
    secure:(window.isSecureContext?'yes':'NO — install needs https'),
    displayMode:(isStandalone()?'installed (standalone)':'browser tab'),
    manifestLink:(document.querySelector('link[rel=manifest]')?'present':'MISSING'),
    manifest:'checking…',
    serviceWorker:('serviceWorker' in navigator)?'checking…':'NOT SUPPORTED by this browser',
    controlling:('serviceWorker' in navigator)?'checking…':'n/a',
    installPrompt:(deferredInstall?'offered':(isStandalone()?'already installed':'not offered yet')),
    storage:'checking…'
  };
  var jobs=[];

  out.startUrl='checking…';
  out.icons='checking…';

  jobs.push(fetch('./manifest.json',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(m){
    out.manifest='ok — '+m.name+' | display '+m.display+' | scope '+m.scope;

    /* Does start_url actually serve something? A 404 here is invisible
       in the manifest itself but fails the install check. */
    var su=new URL(m.start_url||'./',location.href).href;
    var startJob=fetch(su,{cache:'no-store'}).then(function(r){
      out.startUrl=(r.ok?'ok ':'FAILED ')+r.status+' — '+su;
    }).catch(function(err){out.startUrl='FAILED — '+err.message;});

    /* The declared size is a claim. Load each icon and measure it:
       a missing file or a mismatched dimension blocks installation. */
    var list=m.icons||[];
    var iconJobs=list.map(function(ic){
      var href=new URL(ic.src,su).href;
      return fetch(href,{cache:'no-store'}).then(function(r){
        if(!r.ok)throw new Error('HTTP '+r.status);
        /* Always settles: an image that neither loads nor errors would
           otherwise leave the whole report stuck on "checking…". */
        return new Promise(function(res){
          var done=false;
          var finish=function(v){if(!done){done=true;res(v);}};
          var img=new Image();
          img.onload=function(){finish(img.naturalWidth+'x'+img.naturalHeight);};
          img.onerror=function(){finish('UNREADABLE');};
          img.src=href;
          setTimeout(function(){finish('NO RESPONSE');},5000);
        });
      }).then(function(real){
        var claimed=ic.sizes||'?';
        var bad=(real==='UNREADABLE')||(claimed.split(' ').indexOf(real)<0);
        return (bad?'MISMATCH ':'ok ')+ic.src+' — declared '+claimed+
               ', actual '+real+' ['+(ic.purpose||'any')+']';
      }).catch(function(err){
        return 'MISSING '+ic.src+' — '+err.message;
      });
    });

    return Promise.all([startJob].concat(iconJobs)).then(function(r){
      var lines=r.slice(1);
      var anyGood=lines.some(function(l){
        return l.indexOf('ok ')===0&&l.indexOf('192x192')>0;
      });
      out.icons=lines.join('\n')+(anyGood?'':'\n← no usable 192x192 icon, so Chrome will not install');
    });
  }).catch(function(err){
    out.manifest='FAILED — '+err.message;
    out.startUrl='not checked';out.icons='not checked';
  }));

  if('serviceWorker' in navigator){
    jobs.push(navigator.serviceWorker.getRegistration().then(function(reg){
      if(!reg){out.serviceWorker='NOT REGISTERED';out.controlling='no';return;}
      out.serviceWorker='registered at scope '+reg.scope;
      out.controlling=navigator.serviceWorker.controller?'yes':'no — reload once';
    }).catch(function(err){out.serviceWorker='error — '+err.message;}));
  }

  if(navigator.storage&&navigator.storage.estimate){
    jobs.push(Promise.all([
      navigator.storage.estimate(),
      navigator.storage.persisted?navigator.storage.persisted():Promise.resolve(null)
    ]).then(function(r){
      var used=Math.round((r[0].usage||0)/1024);
      out.storage=used+' KB used'+(r[1]===null?'':(r[1]?', protected from eviction':', NOT protected — data can be cleared'));
    }).catch(function(){out.storage='unknown';}));
  }else{
    out.storage='unknown';
  }

  /* Whatever happens, report something within six seconds. */
  var guard=new Promise(function(res){setTimeout(res,6000);});
  return Promise.race([Promise.all(jobs),guard]).then(function(){return out;});
}

function statusText(o){
  return Object.keys(o).map(function(k){
    return k.replace(/([A-Z])/g,' $1').toLowerCase()+': '+o[k];
  }).join('\n');
}

function fillStatus(){
  var box=$('#appstatus');
  if(!box)return;
  diagnose().then(function(o){
    if(!$('#appstatus'))return;
    var bad=/MISSING|MISMATCH|UNREADABLE|FAILED|NOT |NO —|no —|will not install/;
    $('#appstatus').innerHTML=Object.keys(o).map(function(k){
      var label=k.replace(/([A-Z])/g,' $1').toLowerCase();
      var v=String(o[k]);
      return '<tr><td class="tiny muted" style="white-space:nowrap">'+esc(label)+'</td>'+
        '<td class="tiny"'+(bad.test(v)?' style="color:var(--fail)"':'')+'>'+esc(v)+'</td></tr>';
    }).join('');
    LAST_STATUS=o;
  });
}
var LAST_STATUS=null;

function initPlatform(){
  registerSW();
  askPersistence();
  pushView();
  if(isStandalone())document.documentElement.classList.add('standalone');
}


/* =========================================================
   The store. Readers spend the points their tests earned.
   Instructors build the shelf: what it is, what it costs,
   when it exists, and how often it can be had.
   ========================================================= */

/* Returns true when the click changed the icon and the editor should redraw. */
function iconEditorClick(e,ic){
  var em=e.target.closest('[data-emoji]');
  if(em){ic.emoji=em.dataset.emoji;delete ic.image;return true;}
  var gl=e.target.closest('[data-glyph]');
  if(gl){ic.glyph=gl.dataset.glyph;delete ic.image;delete ic.emoji;return true;}
  var bg=e.target.closest('[data-icbg]');
  if(bg){ic.bg=bg.dataset.icbg;return true;}
  var fg=e.target.closest('[data-icfg]');
  if(fg){ic.fg=fg.dataset.icfg;delete ic.image;return true;}
  return false;
}

/* ---------- points ---------- */
function purchasesOf(p){p=p||me();return (p&&p.purchases)?p.purchases:[];}
function spentTotal(p){
  return purchasesOf(p).reduce(function(s,r){return s+(Number(r.cost)||0);},0);
}
function balance(p){
  p=p||me();
  if(!p)return 0;
  return Math.round((earnedTotal(p.records)+activityPoints(p)-spentTotal(p))*10)/10;
}

/* ---------- dates ---------- */
function dnum(s){
  if(!s)return null;
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
  if(!m)return null;
  return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12,0,0);
}
function addMonths(d,n){
  var x=new Date(d.getTime());
  var day=x.getDate();
  x.setDate(1);
  x.setMonth(x.getMonth()+n);
  x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));
  return x;
}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function dayDiff(a,b){return Math.ceil((a.getTime()-b.getTime())/86400000);}
function fmtDay(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function inDays(n){
  if(n<=0)return 'today';
  if(n===1)return 'tomorrow';
  if(n<31)return 'in '+n+' days';
  var m=Math.round(n/30.4);
  return 'in about '+m+(m===1?' month':' months');
}


/* ---------- sales ----------
   The discount is a deterministic function of the item and which cycle
   we are in, not a coin flip at render time. Same answer on every device,
   every reload, with nothing to store and no price that changes while a
   reader is looking at it. */
function hashUnit(str){
  var h=2166136261>>>0;
  for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*16777619)>>>0;}
  /* a second pass, so neighbouring cycle numbers do not give near values */
  h^=h>>>13;h=(h*1274126177)>>>0;h^=h>>>16;
  return (h>>>0)/4294967296;
}
function discountState(item,now){
  now=now||new Date();
  var s=item.sale;
  var off={active:false,pct:0};
  if(!s||!s.on)return off;

  var lasts=Math.max(1,num(s.lasts,3));
  var cool=Math.max(0,num(s.cooldown,14));
  var every=Math.max(1,num(s.every,30));
  /* A new sale can never start before the cooldown has run out, however
     often the schedule says to repeat. */
  var period=Math.max(every,lasts+cool);
  var anchor=dnum(s.anchor)||dnum(String(item.created||'').slice(0,10))||now;

  /* Whole days only. Working in timestamps made a sale anchored to today
     start at midday, and gave a negative cycle before that. */
  function dayOf(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
  var anchorDay=dayOf(anchor), today=dayOf(now);
  var dayIdx=Math.round((today.getTime()-anchorDay.getTime())/86400000);

  function roll(cycle){
    var lo=Math.max(1,num(s.min,10)),hi=Math.max(lo,num(s.max,30));
    var happens=hashUnit(item.id+'#'+cycle)*100 < Math.max(0,Math.min(100,num(s.chance,100)));
    var steps=Math.floor((hi-lo)/5)+1;
    var pct=Math.min(hi,lo+Math.floor(hashUnit(item.id+':'+cycle)*steps)*5);
    return{happens:happens,pct:pct};
  }

  var k=(dayIdx<0)?-1:Math.floor(dayIdx/period);
  if(k>=0){
    var into=dayIdx-k*period;
    var cur=roll(k);
    if(cur.happens&&into<lasts){
      var left=lasts-into;
      return{active:true,pct:cur.pct,endsOn:addDays(today,left),daysLeft:left};
    }
  }
  /* Nothing running: find the next cycle that actually fires. */
  for(var n=Math.max(0,k+1);n<k+60;n++){
    var nx=roll(n);
    if(!nx.happens)continue;
    var awayDays=n*period-dayIdx;
    return{active:false,pct:nx.pct,nextOn:addDays(today,awayDays),daysAway:Math.max(0,awayDays)};
  }
  return off;
}
function priceOf(item){
  var d=discountState(item);
  var base=Math.max(0,num(item.cost,0));
  if(!d.active)return{base:base,now:base,pct:0,active:false,sale:d};
  var now=Math.max(0,Math.round(base*(100-d.pct))/100);
  now=Math.round(now*10)/10;
  return{base:base,now:now,pct:d.pct,active:true,sale:d};
}
function isFeatured(item){
  if(item.featured)return true;
  var s=item.sale;
  return !!(s&&s.on&&s.autoFeature&&discountState(item).active);
}

/* ---------- is it on the shelf right now ---------- */
function availability(item,now){
  now=now||new Date();
  var a=item.avail||{mode:'always'};
  if(a.mode==='window'){
    var s=dnum(a.start),e=dnum(a.end);
    if(!s||!e)return{open:true,label:'',tone:'cold'};
    if(now<s)return{open:false,label:'Opens '+fmtDay(s),tone:'cold'};
    if(now>addDays(e,1))return{open:false,label:'Finished',tone:'cold'};
    var left=dayDiff(e,now);
    return{open:true,label:left<=0?'Last day':(left===1?'1 day left':left+' days left'),
           tone:left<=7?'warm':'cold'};
  }
  if(a.mode==='season'){
    var st=dnum(a.start);
    var days=Math.max(1,num(a.days,7));
    var every=Math.max(1,num(a.everyMonths,12));
    if(!st)return{open:true,label:'',tone:'cold'};
    for(var k=0;k<400;k++){
      var os=addMonths(st,k*every);
      var oe=addDays(os,days);
      if(now<os){
        var untilD=dayDiff(os,now);
        return{open:false,label:'Returns '+(untilD>45?fmtDay(os):inDays(untilD)),tone:'cold'};
      }
      if(now<oe){
        var l=dayDiff(oe,now);
        return{open:true,label:l<=1?'Last day':l+' days left',tone:l<=7?'warm':'cold'};
      }
    }
    return{open:false,label:'Finished',tone:'cold'};
  }
  return{open:true,label:'',tone:'cold'};
}

/* ---------- may this reader have it ---------- */
function eligibility(item,p){
  p=p||me();
  var mine=purchasesOf(p).filter(function(r){return r.itemId===item.id;})
    .sort(function(a,b){return a.date<b.date?1:-1;});
  var av=availability(item);
  if(!av.open)return{can:false,label:av.label||'Not available',tone:'cold',avail:av,owned:mine.length};
  if(item.locked)return{can:false,label:'Locked',tone:'cold',avail:av,owned:mine.length};

  var rp=item.repurchase||{mode:'unlimited'};
  if(rp.mode==='once'&&mine.length)
    return{can:false,label:'Already redeemed',tone:'good',avail:av,owned:mine.length};
  if(rp.mode==='limit'){
    var lim=Math.max(1,num(rp.limit,1));
    if(mine.length>=lim)
      return{can:false,label:'Limit of '+lim+' reached',tone:'good',avail:av,owned:mine.length};
  }
  if(rp.mode==='cooldown'&&mine.length){
    var days=Math.max(1,num(rp.days,7));
    var since=new Date(mine[0].date);
    var ready=addDays(since,days);
    if(new Date()<ready){
      var d=dayDiff(ready,new Date());
      return{can:false,label:'Again '+inDays(d),tone:'cold',avail:av,owned:mine.length};
    }
  }
  var ask=priceOf(item).now;
  if(balance(p)<ask){
    var short=Math.round((ask-balance(p))*10)/10;
    return{can:false,label:pts(short)+' more points',tone:'cold',avail:av,owned:mine.length};
  }
  return{can:true,label:av.label,tone:av.tone,avail:av,owned:mine.length};
}

function itemById(id){
  for(var i=0;i<S.store.length;i++)if(S.store[i].id===id)return S.store[i];
  return null;
}

/* ---------- the shelf ---------- */
function viewStore(){
  var p=me();
  var bal=balance(p);
  var h='<div class="pagehead"><div><h2>The store</h2>'+
    '<div class="sub">Spend the points your reading earned</div></div></div>';

  h+='<div class="balance"><div class="disc" aria-hidden="true"></div>'+
    '<div><div class="k">'+esc(p?p.name:'')+'&rsquo;s balance</div>'+
    '<div class="v">'+pts(bal)+' <span style="font-size:.8rem;color:var(--text-2)">points</span></div></div>'+
    '<div style="margin-left:auto;text-align:right" class="tiny muted">'+
    pts(earnedTotal(p?p.records:[]))+' from tests<br>'+
    pts(activityPoints(p))+' from activities<br>'+
    pts(spentTotal(p))+' spent</div></div>';

  if(S.admin){
    h+='<div class="row stack">'+
      '<button class="btn btn-primary" data-act="item-new">'+ico('plus')+'Add an item</button>'+
      '<button class="btn" data-go="redemptions">'+ico('file')+'Redemptions</button></div>';
  }

  var visible=S.store.filter(function(it){
    if(S.admin)return true;
    if(it.hidden)return false;
    var av=availability(it);
    return av.open||!it.hideWhenClosed;
  });

  if(!visible.length){
    return h+'<div class="empty stack"><h3>'+(S.admin?'The shelf is empty':'Nothing on the shelf yet')+'</h3>'+
      '<p class="muted">'+(S.admin?'Add something a reader would want, set what it costs, and decide when it exists.'
        :'Ask your instructor what you can spend points on.')+'</p>'+
      (S.admin?'<div class="stack"><button class="btn btn-primary" data-act="item-new">'+ico('plus')+'Add an item</button></div>':'')+
      '</div>';
  }

  function order(a,b){
    var ea=eligibility(a),eb=eligibility(b);
    if(ea.can!==eb.can)return ea.can?-1:1;
    return priceOf(a).now-priceOf(b).now;
  }
  var hero=visible.filter(isFeatured).sort(order);
  var rest=visible.filter(function(it){return !isFeatured(it);}).sort(order);

  if(hero.length){
    h+='<div class="shelfhead"><span class="crest">FEATURED</span><span class="line"></span></div>'+
       '<div class="shelf">'+hero.map(function(it){return itemCard(it,p,true);}).join('')+'</div>';
    if(rest.length)h+='<div class="shelfhead">Everything else<span class="line"></span></div>';
  }
  if(rest.length){
    h+='<div class="shelf'+(hero.length?'':' stack')+'">'+
       rest.map(function(it){return itemCard(it,p,false);}).join('')+'</div>';
  }
  return h;
}

/* One card, whether it is featured or not. */
function itemCard(it,p,hero){
  var el=eligibility(it,p);
  var pr=priceOf(it);
  var av=availability(it);

  /* The countdown badge only makes sense while the item is actually there
     and actually going away. */
  var badge='';
  if(av.open&&av.label&&/day|Last/.test(av.label)){
    var left=/Last/.test(av.label)?0:parseInt(av.label,10);
    var urgency=(left<=1?'last':(left<=5?'soon':''));
    badge='<span class="timer '+urgency+'"><span class="dot"></span>'+
      esc(/Last/.test(av.label)?'Last day!':av.label)+'</span>';
  }

  return '<div class="item'+(el.can?' buyable':' shut')+(hero?' hero':'')+'">'+
    badge+
    '<div class="row" style="gap:12px;align-items:flex-start">'+itemIcon(it)+
    '<div style="flex:1;min-width:0"><h4>'+esc(it.title)+'</h4>'+
    '<div class="price">'+(pr.active?'<s>'+pts(pr.base)+'</s>':'')+
      pts(pr.now)+' <small>points</small></div></div></div>'+
    (it.blurb?'<p>'+esc(it.blurb)+'</p>':'')+
    '<div class="foot">'+
      (pr.active?'<span class="sale">'+pr.pct+'% off</span>':'')+
      (el.can
        ? '<button class="btn btn-sm btn-primary" data-act="buy" data-id="'+esc(it.id)+'">Redeem</button>'
        : '<span class="pill '+el.tone+'">'+esc(el.label)+'</span>')+
      (el.owned?'<span class="pill cold">redeemed '+el.owned+'&times;</span>':'')+
      (it.hidden?'<span class="pill cold">hidden</span>':'')+
      (S.admin&&it.featured?'<span class="pill warm">featured</span>':'')+
    '</div>'+
    (S.admin?'<div class="adminrow">'+
      '<button class="btn btn-sm btn-ghost" data-act="item-edit" data-id="'+esc(it.id)+'">Edit</button>'+
      '<button class="btn btn-sm btn-ghost" data-act="item-feature" data-id="'+esc(it.id)+'">'+
        (it.featured?'Unfeature':'Feature')+'</button>'+
      '<button class="btn btn-sm btn-ghost" data-act="item-lock" data-id="'+esc(it.id)+'">'+
        (it.locked?'Unlock':'Lock')+'</button>'+
      '<button class="btn btn-sm btn-danger" data-act="item-del" data-id="'+esc(it.id)+'" style="margin-left:auto">Remove</button>'+
    '</div>':'')+
    '</div>';
}

/* ---------- redeeming ---------- */
function buyItem(id){
  var it=itemById(id),p=me();
  if(!it||!p)return;
  var el=eligibility(it,p);
  if(!el.can){toast(el.label,'bad');return;}
  var pr=priceOf(it);
  confirmModal('Redeem '+it.title+'?',
    (pr.active?'It is '+pr.pct+'% off — '+pts(pr.now)+' points instead of '+pts(pr.base)+'. '
              :'It costs '+pts(pr.now)+' points. ')+
    'Your balance is '+pts(balance(p))+', and would become '+pts(balance(p)-pr.now)+'.',
    'Redeem',function(){
      var again=eligibility(it,p);
      if(!again.can){toast(again.label,'bad');return;}
      var paid=priceOf(it);
      p.purchases=purchasesOf(p).concat([{
        id:uid(),itemId:it.id,title:it.title,cost:paid.now,full:paid.base,
        discount:paid.active?paid.pct:0,icon:it.icon,date:nowISO(),given:false
      }]);
      save();
      toast(it.title+' redeemed. Balance '+pts(balance(p))+'.','good');
      render();
    });
}

/* ---------- redemption log (instructor) ---------- */
function viewRedemptions(){
  var rows=[];
  S.profiles.forEach(function(p){
    purchasesOf(p).forEach(function(r){rows.push({p:p,r:r});});
  });
  rows.sort(function(a,b){return a.r.date<b.r.date?1:-1;});

  var h='<div class="pagehead"><div><h2>Redemptions</h2>'+
    '<div class="sub">What readers have spent their points on</div></div>'+
    '<button class="btn btn-sm" data-go="store">Back to the store</button></div>'+adminBar();

  if(!rows.length){
    return h+'<div class="empty"><h3>Nothing redeemed yet</h3>'+
      '<p class="muted">Redemptions appear here so you know what to hand over.</p></div>';
  }
  var owing=rows.filter(function(x){return !x.r.given;}).length;
  h+='<div class="stats"><div class="stat gold"><div class="k">Waiting to be given</div><div class="v">'+owing+'</div></div>'+
    '<div class="stat"><div class="k">Redeemed all time</div><div class="v">'+rows.length+'</div></div>'+
    '<div class="stat"><div class="k">Points spent</div><div class="v">'+
      pts(rows.reduce(function(s,x){return s+x.r.cost;},0))+'</div></div></div>';

  h+='<div class="panel stack">';
  rows.forEach(function(x){
    var ic=x.r.icon||{};
    h+='<div class="receipt">'+
      (ic.image?'<span class="ic" style="background:'+esc(ic.bg||'#1C2340')+'"><img src="'+ic.image+'" alt=""></span>'
              :'<span class="ic" style="background:'+esc(ic.bg||'#1C2340')+'">'+glyphSVG(ic.glyph||'star',ic.fg,ic.bg)+'</span>')+
      '<div style="flex:1;min-width:0"><div>'+esc(x.r.title)+'</div>'+
      '<div class="tiny muted">'+esc(x.p.name)+' &nbsp;·&nbsp; '+dateShort(x.r.date)+' &nbsp;·&nbsp; '+pts(x.r.cost)+' points</div></div>'+
      '<div class="row" style="gap:6px">'+
      '<button class="btn btn-sm'+(x.r.given?' btn-ghost':' btn-primary')+'" data-act="redeem-given" data-id="'+esc(x.r.id)+'">'+
        (x.r.given?'Given':'Mark given')+'</button>'+
      '<button class="btn btn-sm btn-danger" data-act="redeem-refund" data-id="'+esc(x.r.id)+'">Refund</button>'+
      '</div></div>';
  });
  return h+'</div>';
}
function findPurchase(id){
  for(var i=0;i<S.profiles.length;i++){
    var list=purchasesOf(S.profiles[i]);
    for(var j=0;j<list.length;j++)if(list[j].id===id)return{p:S.profiles[i],r:list[j],i:j};
  }
  return null;
}

/* ---------- item editor ---------- */
function itemEditor(existing){
  var d=existing?JSON.parse(JSON.stringify(existing)):{
    id:uid(),title:'',blurb:'',cost:5,
    icon:{glyph:'star',fg:'#F4B53F',bg:'#1C2340'},
    repurchase:{mode:'unlimited',limit:1,days:7},
    avail:{mode:'always',start:'',end:'',days:7,everyMonths:12},
    locked:false,hidden:false,hideWhenClosed:false,featured:false,
    sale:{on:false,min:10,max:30,every:30,lasts:3,cooldown:14,chance:100,autoFeature:true,anchor:''},
    created:nowISO()
  };
  if(!d.icon)d.icon={glyph:'star',fg:'#F4B53F',bg:'#1C2340'};
  if(!d.sale)d.sale={on:false,min:10,max:30,every:30,lasts:3,cooldown:14,chance:100,autoFeature:true,anchor:''};

    }).join('')+'</div>';

    var rp=d.repurchase,av=d.avail;
    return '<h3>'+(existing?'Edit item':'New item')+'</h3>'+
      '<p class="lede">What it is, what it costs, and when a reader can have it.</p>'+

      '<div class="row" style="gap:16px;margin-top:18px;align-items:flex-start">'+
        renderIcon(d.icon)+
        '<div style="flex:1;min-width:190px">'+
          '<label class="field"><span>Name</span><input class="inp" id="i-title" data-focus maxlength="40" value="'+esc(d.title)+'"></label>'+
          '<label class="field"><span>Points it costs</span><input class="inp" id="i-cost" type="number" min="0" step="0.5" value="'+esc(d.cost)+'"></label>'+
        '</div>'+
      '</div>'+
      '<label class="field"><span>Description — optional</span>'+
      '<input class="inp" id="i-blurb" maxlength="120" value="'+esc(d.blurb)+'"></label>'+

      '<div class="divider"></div>'+
      iconEditorHTML(d.icon)+
      '<div class="divider"></div>'+
      '<h4 style="font-size:.95rem;color:var(--text-hi)">How often it can be redeemed</h4>'+
      '<div class="stack">'+seg('rp',[['unlimited','Any number of times'],['once','Once ever'],
        ['limit','Up to a number'],['cooldown','With a wait between']],rp.mode)+'</div>'+
      (rp.mode==='limit'?'<div class="subfields"><label class="field"><span>How many times in total</span>'+
        '<input class="inp" id="i-limit" type="number" min="1" value="'+esc(rp.limit)+'"></label></div>':'')+

      '<div class="divider"></div>'+
      '<h4 style="font-size:.95rem;color:var(--text-hi)">When it is on the shelf</h4>'+
      '<div class="stack">'+seg('av',[['always','Always'],['window','Between two dates'],
        ['season','Returns on a cycle']],av.mode)+'</div>'+
      (av.mode==='window'?'<div class="subfields"><div class="row" style="gap:10px">'+
        '<label class="field" style="flex:1"><span>From</span><input class="inp" id="i-start" type="date" value="'+esc(av.start)+'"></label>'+
        '<label class="field" style="flex:1"><span>Until</span><input class="inp" id="i-end" type="date" value="'+esc(av.end)+'"></label>'+
        '</div></div>':'')+
      (av.mode==='season'?'<div class="subfields">'+
        '<label class="field"><span>First appears on</span><input class="inp" id="i-start" type="date" value="'+esc(av.start)+'"></label>'+
        '<div class="row" style="gap:10px">'+
        '<label class="field" style="flex:1"><span>Stays for this many days</span>'+

        '<label class="field" style="flex:1"><span>Comes back every this many months</span>'+
        '<input class="inp" id="i-every" type="number" min="1" value="'+esc(av.everyMonths)+'"></label>'+
        '</div><p class="tiny muted" id="i-preview"></p></div>':'')+
      '<label class="check"><input type="checkbox" id="i-hideclosed"'+(d.hideWhenClosed?' checked':'')+
      '><span>Hide it completely while it is off the shelf, rather than showing when it returns</span></label>'+
      '<label class="check"><input type="checkbox" id="i-locked"'+(d.locked?' checked':'')+
      '><span>Locked — readers can see it but not redeem it yet</span></label>'+
      '<label class="check"><input type="checkbox" id="i-hidden"'+(d.hidden?' checked':'')+
      '><span>Hidden from readers entirely</span></label>'+
      '<label class="check"><input type="checkbox" id="i-featured"'+(d.featured?' checked':'')+
      '><span>Featured — shown at the top of the store</span></label>'+

      '<div class="divider"></div>'+
      '<h4 style="font-size:.95rem;color:var(--text-hi)">Sales</h4>'+
      '<p class="tiny muted" style="margin-top:4px;max-width:70ch">Put the item on sale now and then for a '+

        '</div>'+
        '<div class="row" style="gap:10px">'+
          '<label class="field" style="flex:1"><span>A sale may start every (days)</span>'+
          '<input class="inp" id="s-every" type="number" min="1" value="'+esc(d.sale.every)+'"></label>'+
          '<label class="field" style="flex:1"><span>Each sale lasts (days)</span>'+
          '<input class="inp" id="s-lasts" type="number" min="1" value="'+esc(d.sale.lasts)+'"></label>'+
        '</div>'+
        '<div class="row" style="gap:10px">'+
          '<label class="field" style="flex:1"><span>Quiet spell after a sale (days)</span>'+
          '<input class="inp" id="s-cool" type="number" min="0" value="'+esc(d.sale.cooldown)+'"></label>'+
          '<label class="field" style="flex:1"><span>Odds a sale happens (%)</span>'+
          '<input class="inp" id="s-chance" type="number" min="1" max="100" value="'+esc(d.sale.chance)+'"></label>'+
        '</div>'+
        '<label class="field"><span>First sale may start on — blank means today</span>'+
        '<input class="inp" id="s-anchor" type="date" value="'+esc(d.sale.anchor||'')+'"></label>'+
        '<label class="check"><input type="checkbox" id="s-feature"'+(d.sale.autoFeature?' checked':'')+
        '><span>Move it to Featured while it is on sale</span></label>'+
        '<p class="tiny" id="s-preview" style="color:var(--gold-hi)"></p>'+
      '</div>':'')+

      '<div class="err" id="i-err"></div>'+

      '<button class="btn btn-primary" id="i-save">'+(existing?'Save item':'Add to the store')+'</button></div>';

  function grab(scrim){
    var g=function(id){var el=scrim.querySelector(id);return el?el.value:null;};
    if(g('#i-title')!==null)d.title=g('#i-title').trim();
    if(g('#i-emoji')!==null){
      var em=g('#i-emoji').trim();
      if(em){d.icon.emoji=em;delete d.icon.image;}else delete d.icon.emoji;
    }
    if(g('#i-blurb')!==null)d.blurb=g('#i-blurb').trim();
    if(g('#i-cost')!==null)d.cost=Math.max(0,num(g('#i-cost'),0));
    if(g('#i-limit')!==null)d.repurchase.limit=Math.max(1,num(g('#i-limit'),1));
    if(g('#i-days')!==null)d.repurchase.days=Math.max(1,num(g('#i-days'),7));
    if(g('#i-start')!==null)d.avail.start=g('#i-start');
    if(g('#i-end')!==null)d.avail.end=g('#i-end');
    if(g('#i-sdays')!==null)d.avail.days=Math.max(1,num(g('#i-sdays'),7));
    if(g('#i-every')!==null)d.avail.everyMonths=Math.max(1,num(g('#i-every'),12));
    if(g('#s-min')!==null)d.sale.min=Math.max(1,Math.min(95,num(g('#s-min'),10)));
    if(g('#s-max')!==null)d.sale.max=Math.max(1,Math.min(95,num(g('#s-max'),30)));
    if(g('#s-every')!==null)d.sale.every=Math.max(1,num(g('#s-every'),30));
    if(g('#s-lasts')!==null)d.sale.lasts=Math.max(1,num(g('#s-lasts'),3));
    if(g('#s-cool')!==null)d.sale.cooldown=Math.max(0,num(g('#s-cool'),14));
    if(g('#s-chance')!==null)d.sale.chance=Math.max(1,Math.min(100,num(g('#s-chance'),100)));
    if(g('#s-anchor')!==null)d.sale.anchor=g('#s-anchor');
    var cb=function(id){var el=scrim.querySelector(id);return el?el.checked:false;};
    d.locked=cb('#i-locked');d.hidden=cb('#i-hidden');d.hideWhenClosed=cb('#i-hideclosed');
    d.featured=cb('#i-featured');
    if(scrim.querySelector('#i-sale'))d.sale.on=cb('#i-sale');
    if(scrim.querySelector('#s-feature'))d.sale.autoFeature=cb('#s-feature');
  }
  function redraw(){redrawModal(body(),mount);}
  function mount(scrim){
    scrim.addEventListener('click',function(e){
      var s=e.target.closest('[data-seg]');
      if(s){
        grab(scrim);
        if(s.dataset.seg==='rp')d.repurchase.mode=s.dataset.v;
        else d.avail.mode=s.dataset.v;
        redraw();return;
      }
      grab(scrim);
      if(iconEditorClick(e,d.icon)){redraw();return;}
    });
    var saleBox=scrim.querySelector('#i-sale');
    if(saleBox)saleBox.addEventListener('change',function(){grab(scrim);d.sale.on=saleBox.checked;redraw();});

    var sp=scrim.querySelector('#s-preview');
    if(sp){
      var ds=discountState(d);
      sp.textContent=ds.active
        ? 'On sale now — '+ds.pct+'% off, '+ds.daysLeft+' day'+(ds.daysLeft===1?'':'s')+' left.'
        : (ds.nextOn?'Next sale '+(ds.daysAway<=1?'tomorrow':'in '+ds.daysAway+' days')+
            ' — '+ds.pct+'% off for '+Math.max(1,num(d.sale.lasts,3))+' days.'
          :'No sale scheduled.');
    }

    var pic=scrim.querySelector('#i-pic');
    if(pic)pic.addEventListener('click',function(){
      grab(scrim);closeModal();
      avatarPicker(function(uri){d.icon.image=uri;openModal(body(),mount,{dismissable:false});});
    });
    var nopic=scrim.querySelector('#i-nopic');
    if(nopic)nopic.addEventListener('click',function(){
      grab(scrim);delete d.icon.image;delete d.icon.emoji;
      var box=scrim.querySelector('#i-emoji');if(box)box.value='';
      redraw();
    });

    var prev=scrim.querySelector('#i-preview');
    if(prev){
      var av=availability(d);
      prev.textContent=d.avail.start
        ? (av.open?'On the shelf now — '+av.label:'Off the shelf — '+av.label)
        : 'Pick a first date to see when it comes and goes.';
    }

    scrim.querySelector('#i-save').addEventListener('click',function(){
      grab(scrim);
      var err=scrim.querySelector('#i-err');
      if(!d.title){err.textContent='Give it a name.';return;}
      if(d.avail.mode==='window'&&(!d.avail.start||!d.avail.end)){
        err.textContent='A date window needs both dates.';return;}
      if(d.avail.mode==='window'&&dnum(d.avail.end)<dnum(d.avail.start)){
        err.textContent='The end date is before the start date.';return;}
      if(d.avail.mode==='season'&&!d.avail.start){
        err.textContent='A cycle needs a first date.';return;}
      if(d.sale.on&&d.sale.max<d.sale.min){
        err.textContent='The most off cannot be less than the least off.';return;}
      var i=-1;
      for(var k=0;k<S.store.length;k++)if(S.store[k].id===d.id)i=k;
      if(i>=0)S.store[i]=d;else S.store.push(d);
      save();closeModal();
      toast(existing?'Item saved.':'"'+d.title+'" added to the store.','good');
      go('store');
    });
  }
  openModal(body(),mount,{dismissable:false});
}

/* =========================================================
   Activities. Things a reader does that are worth points —
   chores, practice, anything. One-off or on a repeat, for
   everyone or for named readers, credited at once or held
   for an instructor to approve.
   ========================================================= */

var CADENCE={once:'Once',daily:'Every day',weekly:'Every week',monthly:'Every month'};
var PERIOD_WORD={daily:'today',weekly:'this week',monthly:'this month'};

function logOf(p){p=p||me();return (p&&p.activities)?p.activities:[];}
function activityPoints(p){
  p=p||me();
  return Math.round(logOf(p).reduce(function(s,r){
    return s+(r.approved?(Number(r.points)||0):0);
  },0)*10)/10;
}
function activityById(id){
  for(var i=0;i<S.activities.length;i++)if(S.activities[i].id===id)return S.activities[i];
  return null;
}
function assignedTo(a,p){
  var as=a.assign||{mode:'all'};
  if(as.mode!=='some')return true;
  return (as.ids||[]).indexOf(p.id)>=0;
}

/* ---------- when does the counter reset ---------- */
function periodStart(mode,now){
  now=now||new Date();
  var d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0);
  if(mode==='daily')return d;
  if(mode==='weekly')return addDays(d,-((d.getDay()+6)%7));   /* weeks start Monday */
  if(mode==='monthly')return new Date(now.getFullYear(),now.getMonth(),1,0,0,0);
  return null;
}
function periodEnd(mode,start){
  if(mode==='daily')return addDays(start,1);
  if(mode==='weekly')return addDays(start,7);
  if(mode==='monthly')return addMonths(start,1);
  return null;
}
function doneBetween(list,a,b){
  return list.filter(function(r){
    var t=new Date(r.date);
    return t>=a&&t<b;
  });
}

/* ---------- can this reader log it right now ---------- */
function activityState(a,p){
  p=p||me();
  var mine=logOf(p).filter(function(r){return r.activityId===a.id;});
  var pending=mine.filter(function(r){return !r.approved;}).length;
  var cad=a.cadence||{mode:'once',limit:1,perDay:0};
  var out={can:true,label:'',tone:'cold',done:mine.length,pending:pending,left:null};

  if(!assignedTo(a,p))return{can:false,label:'Not assigned to you',tone:'cold',done:0,pending:0};

  if(cad.mode==='once'){
    if(mine.length)return{can:false,label:pending?'Waiting to be approved':'Completed',
      tone:pending?'warm':'good',done:mine.length,pending:pending};
    out.label='One time';
    return out;
  }

  var limit=Math.max(1,num(cad.limit,1));
  var ps=periodStart(cad.mode),pe=periodEnd(cad.mode,ps);
  var inPeriod=doneBetween(mine,ps,pe).length;
  if(inPeriod>=limit){
    return{can:false,label:'Done for '+PERIOD_WORD[cad.mode],tone:'good',
      done:mine.length,pending:pending};
  }

  /* A weekly or monthly allowance can still be capped per day. */
  if(cad.mode!=='daily'&&num(cad.perDay,0)>0){
    var ds=periodStart('daily'),de=addDays(ds,1);
    if(doneBetween(mine,ds,de).length>=num(cad.perDay,0)){
      return{can:false,label:'Done for today',tone:'good',done:mine.length,pending:pending};
    }
  }

  out.left=limit-inPeriod;
  out.label=(limit===1)
    ? CADENCE[cad.mode]
    : out.left+' left '+PERIOD_WORD[cad.mode];
  return out;
}

function logActivity(id){
  var a=activityById(id),p=me();
  if(!a||!p)return;
  var st=activityState(a,p);
  if(!st.can){toast(st.label,'bad');return;}
  var entry={id:uid(),activityId:a.id,title:a.title,points:num(a.points,0),
    icon:a.icon,date:nowISO(),approved:!a.approval};
  p.activities=logOf(p).concat([entry]);
  save();
  toast(a.approval
    ? '"'+a.title+'" logged. It needs approving before the points land.'
    : '"'+a.title+'" done. '+pts(a.points)+' points added.', a.approval?'':'good');
  render();
}

/* ---------- reader view ---------- */
function viewActivities(){
  var p=me();
  var list=S.activities.filter(function(a){
    if(S.admin)return true;
    if(a.hidden)return false;
    return assignedTo(a,p);
  });

  var h='<div class="pagehead"><div><h2>Activities</h2>'+
    '<div class="sub">Things worth points besides reading</div></div>'+
    '<div class="row"><div class="stat" style="min-width:120px"><div class="k">Points to spend</div>'+
    '<div class="v" style="color:var(--gold-hi)">'+pts(balance(p))+'</div></div></div></div>';

  if(S.admin){
    var waiting=0;
    S.profiles.forEach(function(pp){
      waiting+=logOf(pp).filter(function(r){return !r.approved;}).length;
    });
    h+='<div class="row stack">'+
      '<button class="btn btn-primary" data-act="act-new">'+ico('plus')+'Add an activity</button>'+
      '<button class="btn" data-go="approvals">'+ico('file')+'Approvals'+(waiting?' ('+waiting+')':'')+'</button>'+
      '</div>';
  }

  if(!list.length){
    return h+'<div class="empty stack"><h3>'+(S.admin?'No activities yet':'Nothing to do yet')+'</h3>'+
      '<p class="muted">'+(S.admin
        ? 'Add something a reader does regularly, say what it is worth, and how often it counts.'
        : 'Your instructor has not set any activities for you.')+'</p>'+
      (S.admin?'<div class="stack"><button class="btn btn-primary" data-act="act-new">'+ico('plus')+'Add an activity</button></div>':'')+
      '</div>';
  }

  h+='<div class="actlist stack">';
  list.sort(function(a,b){
    var sa=activityState(a,p),sb=activityState(b,p);
    if(sa.can!==sb.can)return sa.can?-1:1;
    return b.points-a.points;
  }).forEach(function(a){
    var st=activityState(a,p);
    var who=(a.assign&&a.assign.mode==='some')
      ? (a.assign.ids||[]).map(function(id){var x=profile(id);return x?x.name:null;})
          .filter(Boolean).join(', ')
      : '';
    h+='<div class="actrow '+(st.can?'open':'shut')+'">'+
      renderIcon(a.icon)+
      '<div class="body"><h4>'+esc(a.title)+'</h4>'+
      (a.blurb?'<div class="sub">'+esc(a.blurb)+'</div>':'')+
      '<div class="meta">'+
        '<span class="pill '+st.tone+'">'+esc(st.label)+'</span>'+
        (st.pending?'<span class="pill warm">'+st.pending+' waiting</span>':'')+
        (a.approval?'<span class="pill cold">needs approving</span>':'')+
        (who?'<span class="pill cold">for '+esc(who)+'</span>':'')+
        (a.hidden?'<span class="pill cold">hidden</span>':'')+
      '</div></div>'+
      '<div style="text-align:right;display:grid;gap:8px;justify-items:end">'+
        '<span class="worth">+'+pts(a.points)+'</span>'+
        (st.can?'<button class="btn btn-sm btn-primary" data-act="act-do" data-id="'+esc(a.id)+'">Mark done</button>':'')+
        (S.admin?'<span class="row" style="gap:5px">'+
          '<button class="btn btn-sm btn-ghost" data-act="act-edit" data-id="'+esc(a.id)+'">Edit</button>'+
          '<button class="btn btn-sm btn-danger" data-act="act-del" data-id="'+esc(a.id)+'">Remove</button></span>':'')+
      '</div></div>';
  });
  return h+'</div>';
}

/* ---------- approvals ---------- */
function viewApprovals(){
  var rows=[];
  S.profiles.forEach(function(p){
    logOf(p).forEach(function(r){rows.push({p:p,r:r});});
  });
  rows.sort(function(a,b){
    if(a.r.approved!==b.r.approved)return a.r.approved?1:-1;
    return a.r.date<b.r.date?1:-1;
  });

  var h='<div class="pagehead"><div><h2>Approvals</h2>'+
    '<div class="sub">Activities readers have logged</div></div>'+
    '<button class="btn btn-sm" data-go="activities">Back to activities</button></div>'+adminBar();

  if(!rows.length){
    return h+'<div class="empty"><h3>Nothing logged yet</h3>'+
      '<p class="muted">When a reader marks an activity done it shows up here.</p></div>';
  }
  var waiting=rows.filter(function(x){return !x.r.approved;});
  h+='<div class="stats"><div class="stat gold"><div class="k">Waiting on you</div><div class="v">'+waiting.length+'</div></div>'+
    '<div class="stat"><div class="k">Logged all time</div><div class="v">'+rows.length+'</div></div>'+
    '<div class="stat"><div class="k">Points awarded</div><div class="v">'+
      pts(rows.reduce(function(s,x){return s+(x.r.approved?x.r.points:0);},0))+'</div></div></div>';

  h+='<div class="panel stack">';
  rows.forEach(function(x){
    h+='<div class="receipt">'+renderIcon(x.r.icon)+
      '<div style="flex:1;min-width:0"><div>'+esc(x.r.title)+'</div>'+
      '<div class="tiny muted">'+esc(x.p.name)+' &nbsp;·&nbsp; '+dateShort(x.r.date)+
      ' &nbsp;·&nbsp; '+pts(x.r.points)+' points</div></div>'+
      '<div class="row" style="gap:6px">'+
      (x.r.approved
        ? '<span class="pill good">approved</span>'+
          '<button class="btn btn-sm btn-ghost" data-act="act-unapprove" data-id="'+esc(x.r.id)+'">Undo</button>'
        : '<button class="btn btn-sm btn-primary" data-act="act-approve" data-id="'+esc(x.r.id)+'">Approve</button>')+
      '<button class="btn btn-sm btn-danger" data-act="act-remove-log" data-id="'+esc(x.r.id)+'">Remove</button>'+
      '</div></div>';
  });
  return h+'</div>';
}
function findLog(id){
  for(var i=0;i<S.profiles.length;i++){
    var l=logOf(S.profiles[i]);
    for(var j=0;j<l.length;j++)if(l[j].id===id)return{p:S.profiles[i],r:l[j],i:j};
  }
  return null;
}

/* ---------- editor ---------- */
function activityEditor(existing){
  var d=existing?JSON.parse(JSON.stringify(existing)):{
    id:uid(),title:'',blurb:'',points:2,
    icon:{glyph:'star',fg:'#F4B53F',bg:'#1C2340'},
    cadence:{mode:'daily',limit:1,perDay:0},
    assign:{mode:'all',ids:[]},
    approval:false,hidden:false,created:nowISO()
  };
  if(!d.icon)d.icon={glyph:'star',fg:'#F4B53F',bg:'#1C2340'};

  function seg(field,opts,cur){
    return '<div class="seg">'+opts.map(function(o){
      return '<button type="button" data-seg="'+field+'" data-v="'+o[0]+'" aria-pressed="'+
        (cur===o[0])+'">'+esc(o[1])+'</button>';
    }).join('')+'</div>';
  }
  function body(){
    var c=d.cadence,as=d.assign;
    return '<h3>'+(existing?'Edit activity':'New activity')+'</h3>'+
      '<p class="lede">Something a reader does that earns points. Practice, a chore, anything you want to encourage.</p>'+

      '<div class="row" style="gap:16px;margin-top:18px;align-items:flex-start">'+
        renderIcon(d.icon)+
        '<div style="flex:1;min-width:190px">'+
          '<label class="field"><span>Name</span><input class="inp" id="i-title" data-focus maxlength="48" value="'+esc(d.title)+'"></label>'+
          '<label class="field"><span>Points it earns</span><input class="inp" id="i-points" type="number" min="0" step="0.5" value="'+esc(d.points)+'"></label>'+
        '</div>'+
      '</div>'+
      '<label class="field"><span>Description — optional</span>'+
      '<input class="inp" id="i-blurb" maxlength="120" value="'+esc(d.blurb)+'"></label>'+

      '<div class="divider"></div>'+iconEditorHTML(d.icon)+

      '<div class="divider"></div>'+
      '<h4 style="font-size:.95rem;color:var(--text-hi)">How often it counts</h4>'+
      '<div class="stack">'+seg('cad',[['once','Once only'],['daily','Every day'],
        ['weekly','Every week'],['monthly','Every month']],c.mode)+'</div>'+
      (c.mode!=='once'?'<div class="subfields">'+
        '<label class="field"><span>Times it can be done '+PERIOD_WORD[c.mode]+'</span>'+
        '<input class="inp" id="i-limit" type="number" min="1" value="'+esc(c.limit)+'"></label>'+
        (c.mode!=='daily'
          ? '<label class="field"><span>Most times in a single day — 0 for no daily cap</span>'+
            '<input class="inp" id="i-perday" type="number" min="0" value="'+esc(c.perDay||0)+'"></label>'
          : '')+
        '<p class="tiny muted">'+(c.mode==='daily'?'The count resets at midnight.'
          :c.mode==='weekly'?'The count resets on Monday morning.'
          :'The count resets on the first of the month.')+'</p>'+
      '</div>':'')+

      '<div class="divider"></div>'+
      '<h4 style="font-size:.95rem;color:var(--text-hi)">Who it is for</h4>'+
      '<div class="stack">'+seg('as',[['all','Every reader'],['some','Chosen readers']],as.mode)+'</div>'+
      (as.mode==='some'?'<div class="subfields"><div class="who-for">'+
        S.profiles.map(function(p){
          var on=(as.ids||[]).indexOf(p.id)>=0;
          return '<button type="button" class="btn btn-sm'+(on?' btn-primary':'')+
            '" data-who="'+p.id+'">'+esc(p.name)+'</button>';
        }).join('')+'</div>'+
        ((as.ids||[]).length?'':'<p class="tiny" style="color:var(--fail);margin-top:8px">Pick at least one reader.</p>')+
        '</div>':'')+

      '<label class="check"><input type="checkbox" id="i-approval"'+(d.approval?' checked':'')+
      '><span>Hold the points until an instructor approves it</span></label>'+
      '<label class="check"><input type="checkbox" id="i-hidden"'+(d.hidden?' checked':'')+
      '><span>Hidden from readers</span></label>'+

      '<div class="err" id="i-err"></div>'+
      '<div class="foot"><button class="btn" data-close>Cancel</button>'+
      '<button class="btn btn-primary" id="i-save">'+(existing?'Save activity':'Add activity')+'</button></div>';
  }
  function grab(scrim){
    var g=function(id){var el=scrim.querySelector(id);return el?el.value:null;};
    if(g('#i-title')!==null)d.title=g('#i-title').trim();
    if(g('#i-blurb')!==null)d.blurb=g('#i-blurb').trim();
    if(g('#i-points')!==null)d.points=Math.max(0,num(g('#i-points'),0));
    if(g('#i-limit')!==null)d.cadence.limit=Math.max(1,num(g('#i-limit'),1));
    if(g('#i-perday')!==null)d.cadence.perDay=Math.max(0,num(g('#i-perday'),0));
    if(g('#i-emoji')!==null){
      var em=g('#i-emoji').trim();
      if(em){d.icon.emoji=em;delete d.icon.image;}else delete d.icon.emoji;
    }
    var cb=function(id){var el=scrim.querySelector(id);return el?el.checked:false;};
    d.approval=cb('#i-approval');d.hidden=cb('#i-hidden');
  }
  function redraw(){redrawModal(body(),mount);}
  function mount(scrim){
    scrim.addEventListener('click',function(e){
      grab(scrim);
      if(iconEditorClick(e,d.icon)){redraw();return;}
      var s=e.target.closest('[data-seg]');
      if(s){
        grab(scrim);
        if(s.dataset.seg==='cad')d.cadence.mode=s.dataset.v;
        else d.assign.mode=s.dataset.v;
        redraw();return;
      }
      var w=e.target.closest('[data-who]');
      if(w){
        grab(scrim);
        var ids=d.assign.ids||[];
        var at=ids.indexOf(w.dataset.who);
        if(at>=0)ids.splice(at,1);else ids.push(w.dataset.who);
        d.assign.ids=ids;redraw();return;
      }
    });
    var pic=scrim.querySelector('#i-pic');
    if(pic)pic.addEventListener('click',function(){
      grab(scrim);closeModal();
      avatarPicker(function(uri){d.icon.image=uri;openModal(body(),mount,{dismissable:false});});
    });
    var nopic=scrim.querySelector('#i-nopic');
    if(nopic)nopic.addEventListener('click',function(){
      grab(scrim);delete d.icon.image;delete d.icon.emoji;
      var box=scrim.querySelector('#i-emoji');if(box)box.value='';
      redraw();
    });
    scrim.querySelector('#i-save').addEventListener('click',function(){
      grab(scrim);
      var err=scrim.querySelector('#i-err');
      if(!d.title){err.textContent='Give it a name.';return;}
      if(d.assign.mode==='some'&&!(d.assign.ids||[]).length){
        err.textContent='Pick at least one reader, or make it for everyone.';return;}
      var i=-1;
      for(var k=0;k<S.activities.length;k++)if(S.activities[k].id===d.id)i=k;
      if(i>=0)S.activities[i]=d;else S.activities.push(d);
      save();closeModal();
      toast(existing?'Activity saved.':'"'+d.title+'" added.','good');
      go('activities');
    });
  }
  openModal(body(),mount,{dismissable:false});
}

    {q:'A second question.',options:['Wrong','Right','Wrong','Wrong'],answer:1,why:'',tag:'character'}
  ]
};

function boot(){
  load();
  applyTheme();
  var ready=S.settings.pw?Promise.resolve():hash(DEFAULT_PW).then(function(h){S.settings.pw=h;});
  ready.then(function(){
    if(!S.settings.seeded){
      var seed=[];
      try{seed=JSON.parse(document.getElementById('seed-modules').textContent)||[];}catch(e){seed=[];}
      var t=newTally();
      seed.forEach(function(s){if(!byId(slug(s.id||s.title)))ingest(s,'built-in',t);});
      S.settings.seeded=true;
    }
    save();
    if(!storageOK)toast('This browser is blocking local storage, so readers and results will not be kept.','bad',9000);
    initPlatform();
    var resume=S.settings.lastView;
    go(me()?((['catalog','records','profile'].indexOf(resume)>=0)?resume:'catalog'):'gate');
    if(S.settings.autoSync)syncFolder(S.settings.folder,true);
  });
}
boot();
