/* How a companion gets around Pip. New pets can set their own in PET_MOVES;
   otherwise their personality decides. */
var PET_MOVES={ghostling:'orbit',jaderabbit:'hopabout',carouselpony:'roam',lamb:'stroll'};
var PET_MOVE_NAMES={orbit:'Circles around Pip',hopabout:'Hops about',roam:'Explores all around',stroll:'Strolls along the ground',hover:'Stays beside Pip'};
function petMove(v){
  var a=(typeof S!=='undefined'&&S.settings&&S.settings.ambient)||{};
  if(a.petMoves==='still')return 'hover';
  if(PET_MOVES[v])return PET_MOVES[v];
  var t=(PET_TRAITS[v]||{}).trait;
  return t==='sleepy'?'orbit':(t==='curious'?'roam':'hopabout');
}
function petTrait(v){return PET_TRAITS[v]||{trait:'proud',name:'Proud',verb:'strutted over with'};}
function petPart(v){
  for(var i=0;i<PIP_PARTS.length;i++)if(PIP_PARTS[i].slot==='pet'&&PIP_PARTS[i].v===v)return PIP_PARTS[i];
  return null;
}
function petSVG(v,pose,size){
  var art=PIP_ART.pets&&PIP_ART.pets[v];
  if(!art)return '';
  return '<svg class="pip pip-live" viewBox="84 12 48 48" width="'+size+'" height="'+size+'" aria-hidden="true">'+
    '<g class="petpose-'+pose+'">'+art+'</g></svg>';
}
function petFinds(p){return (p&&Array.isArray(p.petFinds))?p.petFinds:[];}
function petPoints(p){
  p=p||me();
  return Math.round(petFinds(p).reduce(function(s,f){return s+(f.kind==='points'?num(f.value,0):0);},0)*10)/10;
}
/* Today's find, if the companion has one. Rolled from the reader, the pet
   and the date, so it holds still all day and cannot be farmed. */
function petFindToday(p){
  p=p||me();
  var c=aliveCfg();
  if(!p||!c.finds)return null;
  var v=pipLook(p).pet;
  if(!v||p.face!=='pip')return null;
  var day=todayKey();
  if(petFinds(p).some(function(f){return f.day===day;}))return null;
  var seed=p.id+':'+v+':'+day;
  if(hashUnit(seed)*100>=Math.min(100,c.findChance+powerTotal('findluck',p)))return null;
  var pp=petPart(v);
  var u=hashUnit(seed+'#kind');
  var name=pp?pp.name:'Your companion';
  if(u<0.05){
    var season=pp&&pp.season;
    var parts=PIP_PARTS.filter(function(pt){
      return pt.price>0&&pt.slot!=='pet'&&!ownsPip(pt.id,p)&&(season?pt.season===season:partTier(pt)==='basic');
    });
    if(!parts.length)parts=PIP_PARTS.filter(function(pt){return pt.price>0&&pt.slot!=='pet'&&partTier(pt)==='basic'&&!ownsPip(pt.id,p);});
    if(parts.length){
      var pt=parts[Math.floor(hashUnit(seed+'#part')*parts.length)%parts.length];
      return{day:day,pet:v,petName:name,kind:'part',id:pt.id,label:pt.name};
    }
  }
  if(u<0.6){
    var foods=foodList().filter(function(f){return !f.hidden&&foodSeasonOpen(f);});
    if(foods.length){
      var f=foods[Math.floor(hashUnit(seed+'#food')*foods.length)%foods.length];
      return{day:day,pet:v,petName:name,kind:'food',id:f.id,label:f.name};
    }
  }
  var n=1+Math.floor(hashUnit(seed+'#pts')*3);
  return{day:day,pet:v,petName:name,kind:'points',value:n,label:n+' point'+(n===1?'':'s')};
}
function claimPetFind(){
  var p=me();
  var f=petFindToday(p);
  if(!p||!f){toast('Nothing to pick up just now.');return;}
  if(!Array.isArray(p.petFinds))p.petFinds=[];
  var rec={day:f.day,pet:f.pet,kind:f.kind,id:f.id||'',value:f.value||0,label:f.label,at:nowISO()};
  if(f.kind==='food')giveFood(p,f.id,1);
  if(f.kind==='part'){
    if(!Array.isArray(p.pipOwned))p.pipOwned=[];
    if(p.pipOwned.indexOf(f.id)<0)p.pipOwned.push(f.id);
  }
  p.petFinds.push(rec);
  if(p.petFinds.length>200)p.petFinds=p.petFinds.slice(-200);
  save();
  var tr=petTrait(f.pet);
  celebrate({kicker:'A find',title:f.label,line:f.petName+' '+tr.verb+' this.',pose:'cheer',
    prize:f.kind==='points'?'+'+f.value+' points':(f.kind==='food'?'In Pip’s pantry now':'Yours to wear')});
  render();
}
function roomPetHTML(p){
  var v=pipLook(p).pet;
  if(!v||!PIP_ART.pets||!PIP_ART.pets[v])return '';
  var tr=petTrait(v);
  var tod=roomTod();
  var pose=(tod==='night'||(tr.trait==='sleepy'&&tod==='day'))?'sleep':(tr.trait==='proud'?'cheer':'idle');
  var find=petFindToday(p);
  var h='<div class="roompet pers-'+tr.trait+'" title="'+esc((petPart(v)||{}).name||'')+' · '+tr.name+'">'+
    petSVG(v,pose,64)+'</div>';
  if(find){
    var icon=find.kind==='food'?foodIconHTML(foodById(find.id))
      :(find.kind==='part'?(function(){var pv={body:'sun'};var pt=pipPart(find.id);pv[pt.slot]=pt.v;
          return pipSVG(pv,'idle',34,{shadow:false,still:true});})()
      :'<span class="coinfind">'+find.value+'</span>');
    h+='<button class="petfind" data-act="pet-claim" title="'+esc(find.petName)+' found something">'+
      '<span class="pfi">'+icon+'</span><span class="pft">'+esc(find.petName)+' found something!</span></button>';
  }
  return h;
}

var TOWN_INTENSITY={quiet:{name:'Quiet',f:.45},lively:{name:'Lively',f:1},bustling:{name:'Bustling',f:1.6}};
/* How busy the town is, hour by hour (local clock). */
var TOWN_CURVE_WEEK=[.03,.02,.01,.01,.01,.03,.08,.18,.12,.06,.06,.08,.14,.08,.1,.34,.52,.6,.6,.55,.45,.3,.14,.06];
var TOWN_CURVE_WEEKEND=[.05,.03,.02,.01,.01,.02,.05,.12,.25,.36,.42,.45,.44,.42,.44,.46,.48,.5,.52,.5,.44,.34,.18,.08];
var TOWN_SLOT=15*60000;

function clampN(v,a,b){return Math.max(a,Math.min(b,v));}
function townCfg(){
  var t=S.settings.town||{};
  var give=t.give||{};
  return{on:t.on!==false,label:(t.label||'Pip Town').slice(0,24),
    intensity:TOWN_INTENSITY[t.intensity]?t.intensity:'lively',
    size:clampN(Math.round(num(t.size,140)),10,5000),
    statuses:t.statuses!==false,readers:t.readers!==false,feed:t.feed!==false,
    gifts:t.gifts!==false,giftChance:clampN(num(t.giftChance,35),0,100),thanks:t.thanks!==false,
    visitors:t.visitors!==false,
    give:{town:give.town!==false,events:give.events!==false,room:give.room!==false},
    giveFood:t.giveFood!==false,giveParts:t.giveParts===true,
    giveLimit:clampN(Math.round(num(t.giveLimit,3)),1,20),
    poolFoods:t.poolFoods||null,poolBasic:t.poolBasic!==false,poolSeasonal:t.poolSeasonal===true,
    removed:t.removed||{},custom:Array.isArray(t.custom)?t.custom:[]};
}
function townOn(){return townCfg().on;}
function townFolk(){
  var c=townCfg(),now=new Date();
  var list=TOWN_FOLK.filter(function(f){return !c.removed[f.id];})
    .concat(c.custom.filter(function(f){return f&&f.id&&f.name;}));
  if(ecoCfg().on){
    list=list.concat(ecoArrivals(now)).filter(function(f){return !ecoGone(f,now);});
  }
  return list;
}
function folkById(id){
  var l=townFolk();
  for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];
  return null;
}
function folkLook(f){
  if(f.look)return f.look;
  var bodies=['sun','mint','berry','grape','ember','frost','moss','coral'];
  var hats=[null,'cap','flower','party','crown','wizard'];
  return{body:bodies[Math.floor(hashUnit(f.id+'#b')*bodies.length)],eyes:hashUnit(f.id+'#e')<.5?'happy':'dot',
    hat:hats[Math.floor(hashUnit(f.id+'#h')*hats.length)]};
}
function townBusy(now,f){
  var d=now.getDay(),h=now.getHours();
  var curve=(d===0||d===6)?TOWN_CURVE_WEEKEND:TOWN_CURVE_WEEK;
  var v=curve[h];
  if(f){
    var per=TOWN_PERSONA[f.persona]||TOWN_PERSONA.casual;
    if(h>=20||h<1)v+=per.late;
    v*=0.75+hashUnit(f.id+'#act')*0.5;
  }
  return v*TOWN_INTENSITY[townCfg().intensity].f;
}
function townSlot(now){return Math.floor(now.getTime()/TOWN_SLOT);}
function agoWords(min){
  min=Math.max(0,Math.round(min));
  if(min<1)return 'just now';
  if(min<60)return min+'m ago';
  var h=Math.floor(min/60);
  if(h<24)return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function townModules(){return (S.modules||[]).filter(function(m){return m&&m.id;});}
/* What a neighbour is doing right now. */
function folkStatus(f,now){
  now=now||new Date();
  if(ecoDormant(f,now))return{kind:'away',dot:'off',label:'Away',detail:'taking a break'};
  if(ecoQuiet(f,now))return{kind:'offline',dot:'off',label:'Offline',detail:'asleep'};
  var slot=townSlot(now);
  var a=Math.min(.95,townBusy(now,f));
  var u=hashUnit(f.id+':s:'+slot);
  var per=TOWN_PERSONA[f.persona]||TOWN_PERSONA.casual;
  var mods=townModules();
  if(u<a){
    var v=hashUnit(f.id+':k:'+slot);
    var m=mods.length?mods[Math.floor(hashUnit(f.id+':b:'+Math.floor(slot/4))*mods.length)%mods.length]:null;
    if(m&&v<per.read)return{kind:'reading',dot:'on',label:'Reading',detail:m.title,moduleId:m.id};
    if(m&&v<per.read+per.quiz)return{kind:'quiz',dot:'on',label:'Taking a quiz',detail:m.title,moduleId:m.id};
    if(v<per.read+per.quiz+per.store)return{kind:'store',dot:'on',label:'In Store',detail:''};
    return{kind:'online',dot:'on',label:'Online',detail:''};
  }
  if(u<a*2.3)return{kind:'recent',dot:'recent',label:'Recently active',detail:agoWords(4+hashUnit(f.id+':r:'+slot)*50)};
  return{kind:'offline',dot:'off',label:'Offline',detail:'last seen '+agoWords(90+hashUnit(f.id+':o:'+Math.floor(slot/8))*1300)};
}
function folkBadge(){return '<span class="townbadge" title="A '+esc(townCfg().label)+' neighbour">'+esc(townCfg().label)+'</span>';}
function statusDot(st){return '<span class="tdot '+st.dot+'"></span>';}
function folkNameHTML(f){return '<b class="folkname">'+esc(f.name)+'</b>';}

/* How many of the wider town are on a title right now. */
function townReaders(m,now){
  now=now||new Date();
  var c=townCfg();
  if(!c.on||!c.readers||!m)return{reading:0,quiz:0,named:[]};
  var mods=townModules();
  var tot=0,w={};
  mods.forEach(function(x){w[x.id]=.4+hashUnit('tw:'+x.id)*1.2;tot+=w[x.id];});
  var share=tot?(w[m.id]||0)/tot:0;
  var slot=Math.floor(now.getTime()/(10*60000));
  var ec=ecoCfg();
  var active=c.size*Math.min(.95,townBusy(now))*(ec.on?(1-ec.dormant/100):1);
  var reading=Math.round(active*.5*share*(.75+hashUnit(m.id+':n:'+slot)*.5));
  var quiz=Math.round(reading*.35*(.5+hashUnit(m.id+':q:'+slot)));
  var named=townFolk().filter(function(f){var st=folkStatus(f,now);return st.moduleId===m.id;});
  var nr=named.filter(function(f){return folkStatus(f,now).kind==='reading';}).length;
  var nq=named.length-nr;
  return{reading:Math.max(reading,nr),quiz:Math.max(quiz,nq),named:named};
}
function townReadersTag(m){
  var r=townReaders(m);
  if(!r.reading&&!r.quiz)return '';
  return '<span class="tag town">👥 '+r.reading+' reading'+(r.quiz?' · '+r.quiz+' on the quiz':'')+'</span>';
}
function townReadersPanel(m){
  var c=townCfg();
  if(!c.on||!c.readers)return '';
  var r=townReaders(m);
  if(!r.reading&&!r.quiz)return '';
  return '<div class="townnow stack"><span class="tdot on"></span><span><b>'+r.reading+'</b> reading this in '+esc(c.label)+
    (r.quiz?' &nbsp;·&nbsp; <b>'+r.quiz+'</b> taking the quiz':'')+' right now</span>'+
    (r.named.length?'<span class="townfaces">'+r.named.slice(0,5).map(function(f){
      return '<span title="'+esc(f.name)+' — '+esc(folkStatus(f).label)+'">'+pipSVG(folkLook(f),'read',30,{still:true,shadow:false})+'</span>';
    }).join('')+'</span>':'')+'</div>';
}

   seed, so every device agrees and nothing runs in the background.
   ========================================================= */

  'Santi','Sienna','Sora','Tariq','Tess','Theo','Uma','Valentina','Wren','Xavier','Yara','Yusuf','Zara','Zeke','Zoe'];
var NAME_ADJ=['Pixel','Moon','Star','Brave','Quiet','Lucky','Swift','Cosmic','Sunny','Misty','Clever','Tiny','Mighty','Jolly',

  'Muffin','Pebble','Scout','Knight','Pirate','Ninja','Bear','Whale','Bunny','Wizard','Maker','Sparrow','Tiger','Cloud','Page','Quill'];

var NAME_STYLES={
  mix:'A mix of everything',
  first:'First names (Priya)',
  digits:'Name + numbers (Leo27)',
  handle:'Handles (maya.reads, sam_draws)',
  tag:'Gamer tags (PixelFox#3812)',
  mash:'Mash-ups (QuietOtter)'
};
function rnd(seed,k){return hashUnit(seed+'#'+k);}
function pickFrom(list,seed,k){return list[Math.floor(rnd(seed,k)*list.length)%list.length];}
function genName(seed,style){
  if(style==='mix'||!NAME_STYLES[style]){
    var st=['first','digits','handle','tag','mash','digits','handle','tag'];
    style=st[Math.floor(rnd(seed,'style')*st.length)%st.length];
  }
  var f=pickFrom(NAME_FIRST,seed,'f');
  var n2=String(Math.floor(rnd(seed,'d')*99)+1);
  if(style==='first')return f;
  if(style==='digits')return f+n2;
  if(style==='handle'){
    var sep=rnd(seed,'sep')<.5?'.':'_';
    var low=rnd(seed,'low')<.7;
    return (low?f.toLowerCase():f)+sep+pickFrom(NAME_VERB,seed,'v');
  }
  if(style==='tag')return pickFrom(NAME_ADJ,seed,'a')+pickFrom(NAME_NOUN,seed,'n')+'#'+String(1000+Math.floor(rnd(seed,'t')*9000));
  var m=pickFrom(NAME_ADJ,seed,'a')+pickFrom(NAME_NOUN,seed,'n');
  return rnd(seed,'lc')<.3?m.toLowerCase():m;
}
var PERSONA_KEYS=['bookworm','collector','crafter','sporty','nightowl','casual'];
function genPersona(seed,mix){
  if(mix&&mix!=='mix'&&TOWN_PERSONA[mix])return mix;
  return pickFrom(PERSONA_KEYS,seed,'p');
}
/* A Pip look from everyday (non top-tier, non-seasonal) parts. */
function genLook(seed,fancy){
  var pool=function(slot){return PIP_PARTS.filter(function(pt){
    return pt.slot===slot&&(fancy?partTier(pt)!=='top':(!pt.season&&partTier(pt)!=='top'));});};
  var look={};
  var bodies=pool('body');look.body=bodies.length?pickFrom(bodies,seed,'body').v:'sun';
  var eyes=pool('eyes');look.eyes=(eyes.length&&rnd(seed,'ey')<.7)?pickFrom(eyes,seed,'eyes').v:'dot';
  [['hat',.6],['pattern',.35],['held',.4],['back',.2],['aura',.15]].forEach(function(x){
    var l=pool(x[0]);
    if(l.length&&rnd(seed,x[0]+'?')<x[1])look[x[0]]=pickFrom(l,seed,x[0]).v;
  });
  return look;
}
function allFolkNames(){
  var names={};
  TOWN_FOLK.concat(townCfg().custom).forEach(function(f){names[f.name.toLowerCase()]=1;});
  ecoArrivals(new Date()).forEach(function(f){names[f.name.toLowerCase()]=1;});
  return names;
}
function uniqueName(seed,style,taken){
  for(var i=0;i<40;i++){
    var n=genName(seed+':'+i,style);
    if(!taken[n.toLowerCase()]){taken[n.toLowerCase()]=1;return n;}
  }
  var x=genName(seed,style)+'_'+Math.floor(rnd(seed,'u')*999);
  taken[x.toLowerCase()]=1;
  return x;
}
function makeFolk(seed,opts,taken){
  return{id:'tf-'+seed.replace(/[^a-z0-9]/gi,'').slice(-14),name:uniqueName(seed,opts.style,taken),
    persona:genPersona(seed,opts.persona),look:genLook(seed,opts.fancy),custom:true,gen:true};
}

/* ---------- the ecosystem ---------- */
function ecoCfg(){
  var e=(S.settings.town&&S.settings.town.eco)||{};
  return{on:e.on===true,
    start:e.start||'',
    seed:e.seed||'eco',
    seeds:Array.isArray(e.seeds)&&e.seeds.length?e.seeds:[{from:'0000-00',seed:e.seed||'eco'}],
    dormant:clampN(num(e.dormant,15),0,90),
    dormantLen:clampN(Math.round(num(e.dormantLen,3)),1,26),
    quietOn:e.quietOn!==false,quietFrom:e.quietFrom||'21:30',quietTo:e.quietTo||'06:30',
    quietPct:clampN(num(e.quietPct,85),0,100),
    arrive:clampN(num(e.arrive,4),0,200),
    leave:clampN(num(e.leave,2),0,200),
    protectShipped:e.protectShipped!==false,
    protectFriends:e.protectFriends!==false,
    minPop:clampN(Math.round(num(e.minPop,8)),0,5000),
    maxPop:clampN(Math.round(num(e.maxPop,250)),1,5000),
    style:NAME_STYLES[e.style]?e.style:'mix',
    announce:e.announce!==false};
}
function monthKey(y,m){return y+'-'+pad2(m+1);}
function ecoStart(c){
  var d=dnum(c.start);
  return d?new Date(d.getFullYear(),d.getMonth(),1):null;
}
/* Poisson-ish whole number around an average, fixed per month. */
function ecoCount(avg,seed){
  if(!(avg>0))return 0;
  var base=Math.floor(avg),frac=avg-base;
  var n=base+(rnd(seed,'frac')<frac?1:0);
  var wob=Math.round((rnd(seed,'wob')-.5)*Math.max(1,avg*.5));
  return Math.max(0,n+wob);
}
var ECO_CACHE={key:'',val:null};
function seedFor(c,mk){
  var s=c.seeds[0].seed;
  c.seeds.forEach(function(x){if(x.from<=mk)s=x.seed;});
  return s;
}
/* Month by month from the start: who arrived, who left. */
function ecoHistory(now){
  now=now||new Date();
  var c=ecoCfg();
  var st=ecoStart(c);
  if(!c.on||!st)return{arrivals:[],departures:{},months:[]};
  var key=JSON.stringify(c)+'|'+JSON.stringify((S.settings.town||{}).removed||{})+'|'+((S.settings.town||{}).custom||[]).length+'|'+
    Math.floor(now.getTime()/60000)+'|'+S.profiles.length;
  if(ECO_CACHE.key===key)return ECO_CACHE.val;
  var tc=townCfg();
  var base=TOWN_FOLK.filter(function(f){return !tc.removed[f.id];}).concat(tc.custom.filter(function(f){return f&&f.id&&f.name;}));
  var taken={};base.forEach(function(f){taken[f.name.toLowerCase()]=1;});
  var arrivals=[],departures={},months=[];
  var friends={};
  S.profiles.forEach(function(p){townSentOf(p).forEach(function(s){friends[s.to]=1;});});
  var y=st.getFullYear(),m=st.getMonth(),guard=0;
  while(guard++<120){
    var ms=new Date(y,m,1),me2=new Date(y,m+1,1);
    if(ms>now)break;
    var mk=monthKey(y,m),seed=seedFor(c,mk)+':'+mk;
    var present=base.concat(arrivals).filter(function(f){return !departures[f.id]&&(!f.joined||f.joined<ms);});
    var inN=ecoCount(c.arrive,seed+':in');
    var outN=ecoCount(c.leave,seed+':out');
    inN=Math.min(inN,Math.max(0,c.maxPop-present.length));
    var came=[],went=[];
    for(var i=0;i<inN;i++){
      var fs=seed+':a'+i;
      var f=makeFolk(fs,{style:c.style,persona:'mix',fancy:rnd(fs,'fancy')<.3},taken);
      f.id='tf-eco-'+mk.replace('-','')+'-'+i;
      f.custom=false;f.gen=false;f.eco=true;
      f.joined=new Date(ms.getTime()+rnd(fs,'day')*(me2-ms-3600000));
      arrivals.push(f);came.push(f);
    }
    var canGo=present.filter(function(f){
      if(c.protectShipped&&!f.eco&&!f.gen)return false;
      if(c.protectFriends&&friends[f.id])return false;
      return true;
    });
    outN=Math.min(outN,canGo.length,Math.max(0,present.length-c.minPop));
    var order=canGo.slice().sort(function(a,b){return rnd(seed,'o'+a.id)-rnd(seed,'o'+b.id);});
    for(var j=0;j<outN;j++){
      var g=order[j];
      var when=new Date(ms.getTime()+rnd(seed,'l'+g.id)*(me2-ms-3600000));
      if(g.joined&&when<=g.joined)when=new Date(Math.min(me2-1,g.joined.getTime()+864e5));
      departures[g.id]=when;went.push(g);
    }
    months.push({key:mk,start:ms,came:came,went:went,pop:present.length+came.length-went.length});
    m++;if(m>11){m=0;y++;}
  }
  var val={arrivals:arrivals,departures:departures,months:months};
  ECO_CACHE={key:key,val:val};
  return val;
}
function ecoArrivals(now){
  now=now||new Date();
  return ecoHistory(now).arrivals.filter(function(f){return f.joined<=now;});
}
function ecoGone(f,now){
  var d=ecoHistory(now).departures[f.id];
  return !!(d&&d<=(now||new Date()));
}
/* Dormant spells: each neighbour has a chance, per stretch of weeks,
   of taking a break. Over a year that averages out to the % set. */
function ecoDormant(f,now){
  var c=ecoCfg();
  if(!c.on||!c.dormant)return false;
  now=now||new Date();
  var len=c.dormantLen*7*864e5;
  var off=rnd(c.seed+f.id,'phase')*len;
  var block=Math.floor((now.getTime()+off)/len);
  return rnd(c.seed+':d:'+f.id,block)*100<c.dormant;
}
function ecoQuiet(f,now){
  var c=ecoCfg();
  if(!c.on||!c.quietOn||!c.quietPct)return false;
  var a=hm(c.quietFrom),b=hm(c.quietTo);
  if(!a||!b)return false;
  var t=now.getHours()*60+now.getMinutes(),s=a[0]*60+a[1],e=b[0]*60+b[1];
  var inside=s<=e?(t>=s&&t<e):(t>=s||t<e);
  if(!inside)return false;
  return rnd(c.seed+':q:'+f.id,todayKey())*100<c.quietPct;
}
/* ---------- the numbers for the settings panel ---------- */
function ecoSummary(){
  var c=ecoCfg(),now=new Date();
  var h=ecoHistory(now);
  var folk=townFolk();
  var dormant=folk.filter(function(f){return ecoDormant(f,now);}).length;
  var mk=monthKey(now.getFullYear(),now.getMonth());
  var cur=h.months.filter(function(m){return m.key===mk;})[0];
  return{pop:folk.length,dormant:dormant,
    cameThisMonth:cur?cur.came.filter(function(f){return f.joined<=now;}).length:0,
    wentThisMonth:cur?cur.went.filter(function(f){return h.departures[f.id]<=now;}).length:0,
    months:h.months,arrivals:h.arrivals,departures:h.departures};
}
function ecoForecast(){
  var c=ecoCfg();
  if(!c.on||!ecoStart(c))return [];
  var now=new Date();
  var later=new Date(now.getFullYear(),now.getMonth()+12,15);
  var saved=ECO_CACHE;
  ECO_CACHE={key:'',val:null};
  var h=ecoHistory(later);
  ECO_CACHE=saved;
  var mk=monthKey(now.getFullYear(),now.getMonth());
  var from=-1;
  h.months.forEach(function(m,i){if(m.key===mk)from=i;});
  return from<0?[]:h.months.slice(from,from+12);
}
function ecoMovesFeed(now,sinceMs){
  var c=ecoCfg();
  if(!c.on||!c.announce)return [];
  now=now||new Date();
  var h=ecoHistory(now),out=[];
  h.arrivals.forEach(function(f){
    if(f.joined<=now&&now-f.joined<sinceMs)out.push({folk:f,text:'moved into '+townCfg().label,icon:'📦',at:f.joined.getTime()});
  });
  Object.keys(h.departures).forEach(function(id){
    var d=h.departures[id];
    if(d<=now&&now-d<sinceMs){
      var f=TOWN_FOLK.concat(townCfg().custom,h.arrivals).filter(function(x){return x.id===id;})[0];
      if(f)out.push({folk:f,text:'moved away — bye for now',icon:'👋',at:d.getTime()});
    }
  });
  return out;
}

/* ---------- the town feed ---------- */
function townFeed(n,now,opts){
  now=now||new Date();opts=opts||{};
  var c=townCfg();
  if(!c.on||!c.feed)return [];
  var folk=townFolk(),mods=townModules();
  var parts=PIP_PARTS.filter(function(pt){return pt.price>0&&pipInSeason(pt);});
  var foods=foodList().filter(function(f){return !f.hidden;});
  var evs=eventList().filter(function(ev){return !ev.hidden&&eventOpen(ev).open;});
  var slot=Math.floor(now.getTime()/(10*60000));
  var out=[];
  for(var j=0;j<36&&out.length<n*3;j++){
    var sl=slot-j,t0=sl*10*60000,at=new Date(t0);
    folk.forEach(function(f){
      var key=f.id+'|f|'+sl;
      if(hashUnit(key)>=Math.min(.6,townBusy(at,f)*.14))return;
      if(ecoDormant(f,at)||ecoQuiet(f,at)||(f.joined&&f.joined>at))return;
      var time=t0+hashUnit(key+'t')*10*60000;
      if(time>now.getTime())return;
      var r=hashUnit(key+'k'),txt='',icon='✨';
      if(r<.3&&mods.length){var m=mods[Math.floor(hashUnit(key+'m')*mods.length)%mods.length];
        if(hashUnit(key+'p')<.5){txt='passed the quiz for '+m.title;icon='✅';}else{txt='finished '+m.title;icon='📚';}}
      else if(r<.5&&parts.length){txt='unlocked '+parts[Math.floor(hashUnit(key+'x')*parts.length)%parts.length].name;icon='🛍️';}
      else if(r<.65&&foods.length){txt='fed their Pip '+foods[Math.floor(hashUnit(key+'y')*foods.length)%foods.length].name;icon='🍯';}
      else if(r<.85&&evs.length){var ev=evs[Math.floor(hashUnit(key+'e')*evs.length)%evs.length];txt='joined '+ev.title;icon='🎟️';}
      else{var o=folk[Math.floor(hashUnit(key+'o')*folk.length)%folk.length];
        if(o.id===f.id)return;txt='sent a gift to '+o.name;icon='🎁';}
      out.push({folk:f,text:txt,icon:icon,at:time});
    });
  }
  out=out.concat(ecoMovesFeed(now,6*3600000));
  out.sort(function(a,b){return b.at-a.at;});
  return out.slice(0,n);
}
function feedRowHTML(r,place){
  var mins=(Date.now()-r.at)/60000;
  return '<div class="tfeed">'+pipSVG(folkLook(r.folk),'idle',30,{still:true,shadow:false})+
    '<div class="tft">'+folkNameHTML(r.folk)+' '+esc(r.text)+' '+(r.icon||'')+
    '<span class="tiny muted"> · '+agoWords(mins)+'</span></div>'+
    (canGiveAt(place)?'<button class="btn btn-sm btn-ghost tgift" data-act="town-give" data-id="'+esc(r.folk.id)+'" data-place="'+esc(place)+'" title="Send '+esc(r.folk.name)+' a gift">🎁</button>':'')+
    '</div>';
}

/* ---------- gifts from neighbours (items only) ---------- */
function townPool(p){
  var c=townCfg(),out=[];
  foodList().forEach(function(f){
    if(f.hidden)return;
    if(c.poolFoods&&!c.poolFoods[f.id])return;
    if(typeof foodOnMenu==='function'&&f.season&&!foodSeasonOpen(f))return;
    out.push('food:'+f.id);
  });
  PIP_PARTS.forEach(function(pt){
    if(!(pt.price>0)||pt.slot==='pet'||ownsPip(pt.id,p))return;
    var tier=partTier(pt);
    if(c.poolBasic&&!pt.season&&tier==='basic'&&pt.price<=20)out.push(pt.id);
    else if(c.poolSeasonal&&pt.season&&pipInSeason(pt)&&tier!=='top')out.push(pt.id);
  });
  return out;
}
function itemName(item){
  if(!item)return '';
  if(item.indexOf('food:')===0){var f=foodById(item.slice(5));return f?f.name:'a treat';}
  var pt=pipPart(item);return pt?pt.name:'a Pip item';
}
function itemIconHTML(item,size){
  if(!item)return '';
  if(item.indexOf('food:')===0)return foodIconHTML(foodById(item.slice(5)));
  var pt=pipPart(item);if(!pt)return '🎁';
  var pv={body:'sun'};pv[pt.slot]=pt.v;
  return pipSVG(pv,'idle',size||34,{shadow:false,still:true});
}
function giveItem(p,item){
  if(item.indexOf('food:')===0){giveFood(p,item.slice(5),1);return true;}
  if(!pipPart(item))return false;
  if(!Array.isArray(p.pipOwned))p.pipOwned=[];
  if(p.pipOwned.indexOf(item)<0)p.pipOwned.push(item);
  return true;
}
function townSentOf(p){return (p&&Array.isArray(p.townSent))?p.townSent:[];}
function townGotOf(p){return (p&&Array.isArray(p.townGifts))?p.townGifts:[];}
/* Parcels waiting at the door today: one daily surprise, plus thank-you
   gifts from neighbours the reader gave something to on an earlier day. */
function townParcels(p,now){
  p=p||me();now=now||new Date();
  var c=townCfg(),out=[];
  if(!p||!c.on||!c.gifts)return out;
  var day=todayKey(),got={};
  townGotOf(p).forEach(function(g){got[g.key]=1;});
  var pool=townPool(p);
  if(!pool.length)return out;
  var folk=townFolk();
  var seed=p.id+':tg:'+day;
  if(hashUnit(seed)*100<c.giftChance&&!got['d:'+day]&&folk.length){
    var at=new Date(dayStart(now).getTime()+(7+hashUnit(seed+'#at')*12)*3600000);
    if(now>=at){
      var f=folk[Math.floor(hashUnit(seed+'#who')*folk.length)%folk.length];
      out.push({key:'d:'+day,from:f,item:pool[Math.floor(hashUnit(seed+'#it')*pool.length)%pool.length],at:at,why:'surprise'});
    }
  }
  if(c.thanks){
    townSentOf(p).forEach(function(s){
      if(out.length>=3||got['t:'+s.id]||s.day>=day)return;
      if(dayDiff(new Date(),new Date(s.at))>7)return;
      var f=folkById(s.to);
      if(!f)return;
      out.push({key:'t:'+s.id,from:f,item:pool[Math.floor(hashUnit(s.id+'#ty')*pool.length)%pool.length],
        at:dayStart(now),why:'thanks'});
    });
  }
  return out;
}
function claimParcel(key){
  var p=me();if(!p)return;
  var pc=townParcels(p).filter(function(x){return x.key===key;})[0];
  if(!pc){toast('That parcel has gone.');render();return;}
  giveItem(p,pc.item);
  if(!Array.isArray(p.townGifts))p.townGifts=[];
  p.townGifts.push({key:pc.key,day:todayKey(),from:pc.from.id,fromName:pc.from.name,item:pc.item,at:nowISO()});
  if(p.townGifts.length>300)p.townGifts=p.townGifts.slice(-300);
  save();
  celebrate({kicker:pc.why==='thanks'?'A thank-you gift':'A parcel at the door',title:itemName(pc.item),
    line:pc.from.name+(pc.why==='thanks'?' sent this to say thanks for your gift.':' left this for you.'),pose:'cheer',
    prize:pc.item.indexOf('food:')===0?'In Pip’s pantry now':'Yours to wear'});
  render();
}

function townVisitor(p,now){

/* =========================================================
   Community-driven group goals.

   The instructor programs how far the town alone gets by the
   end of the round, the shape of the climb, and how often it
   moves (hourly, daily, weekly, monthly). Real readers add on
   top, so the result is a real finish or a real miss.
   ========================================================= */
var TOWN_PACES={steady:'Steady',slowstart:'Slow start, strong finish',laterush:'Late rush',faststart:'Fast start, then slows',bursty:'In bursts'};
var TOWN_STEPS={hour:'Every hour',day:'Every day',week:'Every week',month:'Every month'};
function goalTownCfg(ev){
  var t=(ev.goal&&ev.goal.town)||{};
  return{on:t.on===true,finish:clampN(num(t.finish,90),0,300),
    pace:TOWN_PACES[t.pace]?t.pace:'steady',step:TOWN_STEPS[t.step]?t.step:'day',
    days:clampN(Math.round(num(t.days,14)),1,366)};
}
function townPaceCurve(pace,f,seed){
  f=clampN(f,0,1);
  if(pace==='slowstart')return f*f;
  if(pace==='laterush')return Math.pow(f,3);
  if(pace==='faststart')return 1-(1-f)*(1-f);
  if(pace==='bursty'){
    var n=20,tot=0,acc=0,i,w=[];
    for(i=0;i<n;i++){w[i]=Math.pow(hashUnit(seed+'#burst'+i),2.2)+.02;tot+=w[i];}
    var x=f*n;
    for(i=0;i<n;i++){
      if(x>=i+1)acc+=w[i];
      else if(x>i)acc+=w[i]*(x-i);
    }
    return acc/tot;
  }
  return f;
}
function quantizeTime(t,step){
  if(step==='hour')return new Date(Math.floor(t.getTime()/3600000)*3600000);
  if(step==='week')return startOfWeek(t);
  if(step==='month')return new Date(t.getFullYear(),t.getMonth(),1);
  return dayStart(t);
}
function townGoalSpan(ev,now){
  var g=goalTownCfg(ev);
  var rd=eventRound(ev,now);
  var start=roundStartOf(ev,rd);
  if(!(start instanceof Date)||isNaN(start))start=dayStart(new Date(ev.created||Date.now()));
  var end=rd.end||addDays(start,g.days);
  /* line the start up with the step, so the first update is a whole step */
  start=quantizeTime(start,g.step);
  return{start:start,end:end,key:rd.key,repeats:!!rd.resets};
}
function townGoalAt(ev,t,span){
  var g=goalTownCfg(ev),target=goalCfg(ev).target;
  var q=quantizeTime(t,g.step);
  if(q<span.start)q=span.start;
  var f=(q-span.start)/Math.max(1,(span.end-span.start));
  var v=target*g.finish/100*townPaceCurve(g.pace,f,ev.id+span.key);
  return target>=20?Math.round(v):Math.round(v*10)/10;
}
function townGoal(ev,now){
  now=now||new Date();
  var g=goalTownCfg(ev);
  if(!g.on||!townOn()||ev.kind!=='goal')return{on:false,total:0,helpers:0};
  var span=townGoalSpan(ev,now);
  var total=townGoalAt(ev,now<span.end?now:new Date(span.end.getTime()-1),span);
  var target=goalCfg(ev).target;
  var crowd=Math.max(3,Math.round(townCfg().size*.3*Math.min(1,g.finish/100)));
  var helpers=total>0?Math.max(2,Math.round(crowd*Math.sqrt(Math.min(1,total/Math.max(1,target*g.finish/100))))):0;
  return{on:true,total:total,helpers:helpers,span:span,ended:!span.repeats&&now>=span.end,
    final:townGoalAt(ev,new Date(span.end.getTime()-1),span),cfg:g};
}
/* Who in town added what, working back through the steps. */
function townGoalFeed(ev,n,now){
  now=now||new Date();
  var tg=townGoal(ev,now);
  if(!tg.on)return [];
  var g=tg.cfg,span=tg.span,folk=townFolk(),out=[];
  if(!folk.length)return out;
  var stepMs={hour:3600000,day:864e5,week:7*864e5,month:30*864e5}[g.step];
  var t=quantizeTime(now,g.step);
  for(var i=0;i<24&&out.length<n;i++){
    var prevT=new Date(t.getTime()-stepMs);
    if(t<span.start)break;
    var d=townGoalAt(ev,t,span)-townGoalAt(ev,prevT<span.start?span.start:prevT,span);
    if(d>0){
      var k=Math.min(4,1+Math.floor(hashUnit(ev.id+':'+t.getTime())*4));
      var left=d;
      for(var j=0;j<k&&out.length<n;j++){
        var part=j===k-1?left:Math.max(1,Math.round(d/k*(.6+hashUnit(ev.id+':'+t.getTime()+':'+j)*.8)));
        part=Math.min(part,left);left-=part;
        if(part<=0)break;
        var f=folk[Math.floor(hashUnit(ev.id+':w:'+t.getTime()+':'+j)*folk.length)%folk.length];
        var at=t.getTime()-hashUnit(ev.id+':at:'+t.getTime()+':'+j)*Math.min(stepMs,3*3600000);
        out.push({folk:f,text:'added '+String(Math.round(part*10)/10)+' '+(function(u){return (Math.round(part*10)/10===1&&/s$/.test(u))?u.replace(/s$/,''):u;})(goalUnit(ev)||''),icon:'➕',at:Math.min(at,now.getTime())});
      }
    }
    t=prevT;
  }
  return out.sort(function(a,b){return b.at-a.at;}).slice(0,n);
}
/* Neighbours joining any other event. */
var TOWN_VERBS={photo:'sent in a picture',text:'sent in their writing',count:'reported their number',
  checkin:'marked it done',steps:'ticked off a step',calendar:'opened today’s door',goal:'added to the goal'};
function townEventFeed(ev,n,now){
  now=now||new Date();
  if(ev.kind==='goal'&&goalTownCfg(ev).on)return townGoalFeed(ev,n,now);
  if(!(ev.town&&ev.town.join)||!townOn())return [];
  var folk=townFolk(),out=[];
  var slot=Math.floor(now.getTime()/(20*60000));
  for(var j=0;j<72&&out.length<n;j++){
    var sl=slot-j;
    folk.forEach(function(f){
      if(out.length>=n*2)return;
      var key=ev.id+'|'+f.id+'|'+sl;
      if(hashUnit(key)>=Math.min(.5,townBusy(new Date(sl*20*60000),f)*.2))return;
      var at=sl*20*60000+hashUnit(key+'t')*20*60000;
      if(at>now.getTime())return;
      out.push({folk:f,text:TOWN_VERBS[ev.kind]||'joined in',icon:'🎟️',at:at});
    });
  }
  return out.sort(function(a,b){return b.at-a.at;}).slice(0,n);
}
function townJoinCount(ev,now){
  var f=townEventFeed(ev,40,now),seen={};
  f.forEach(function(r){seen[r.folk.id]=1;});
  var named=Object.keys(seen).length;
  return named?Math.round(named*townCfg().size/Math.max(1,townFolk().length)*.25)+named:0;
}
function eventTownHTML(ev,n,place){

/* ---------- joining community events ---------- */
function plural(n,one,many){return n+' '+(n===1?one:(many||one+'s'));}
/* "12 neighbours helping · you and 2 other readers joined" */
function helpWords(gp,ev,p){
  var parts=[];
  if(gp.townOn)parts.push(plural(gp.townHelpers,'neighbour')+' helping');
  if(gp.joined!=null){
    var mine=hasJoined(ev,p);
    var others=gp.joined-(mine?1:0);
    if(mine)parts.push(others?'you and '+plural(others,'other reader')+' joined':'you joined');
    else parts.push(others?plural(others,'reader')+' joined — join them':'no readers yet — be the first to join');
  }else{
    parts.push(plural(gp.realHelpers,'reader')+' helping');
  }
  return parts.join(' · ');
}
function isCommunityEvent(ev){
  return !!ev&&((ev.kind==='goal'&&goalTownCfg(ev).on)||!!(ev.town&&ev.town.sitewide));
}
function needsJoin(ev){return isCommunityEvent(ev)&&townOn()&&!(ev.town&&ev.town.joinReq===false);}
function joinedAt(ev,p){
  p=p||me();
  var j=p&&p.joined&&p.joined[ev.id];
  return j?new Date(j):null;
}
function hasJoined(ev,p){return !needsJoin(ev)||!!joinedAt(ev,p);}
function joinEvent(id,quiet){
  var p=me(),ev=eventById(id);

/* Everything open right now that this reader could be helping. */
function connectedEvents(ctx,p){
  p=p||me();
  if(!p)return [];
  var out=[];
  eventList().forEach(function(ev){
    if(ev.hidden||!assignedTo(ev,p)||!eventOpen(ev).open)return;
    var tg=ev.kind==='goal'?townGoal(ev):null;
    if(tg&&tg.on&&tg.ended)return;
    var why='';
    var g=ev.goal||{},src=ev.kind==='goal'?g.source:'';
    var trig=(ev.steps||[]).map(function(st){return st.trigger||{};});
    if(ctx.type==='quiz'){
      if(src==='quizzes')why='every quiz passed counts toward it';
      else if(src==='books')why='finishing books counts toward it';
      else if(src==='points')why='points you earn count toward it';
      else if((ev.books||[]).indexOf(ctx.moduleId)>=0)why='this book is part of it';
      else if(trig.some(function(t){return (t.type==='quiz'||t.type==='book')&&(!t.target||t.target===ctx.moduleId);}))why='a step is done by passing quizzes';
      else if(trig.some(function(t){return t.type==='points';}))why='a step counts points you earn';
    }else if(ctx.type==='activity'){
      if(src==='activities'&&(!g.activity||g.activity===ctx.id))why='this activity counts toward it';
      else if(src==='points')why='points you earn count toward it';
      else if(trig.some(function(t){return t.type==='activity'&&(!t.target||t.target===ctx.id);}))why='a step is done by logging this activity';
      else if(trig.some(function(t){return t.type==='points';}))why='a step counts points you earn';
    }else if(ctx.type==='pip'||ctx.type==='food'){
      var key=ctx.type==='food'?'food:'+ctx.id:ctx.id;
      var L=ev.link||{},pool=(ev.bonus&&ev.bonus.on&&ev.bonus.pool)||[];
      var lk=pipLookById(ctx.id);
      if(L.giftLook===ctx.id||L.giftPart===ctx.id||(ctx.type==='food'&&L.giftFood===ctx.id))why='it’s a gift for taking part';
      else if(pool.indexOf(key)>=0||pool.indexOf('look:'+ctx.id)>=0)why='it can be won as a bonus';
      else if(lk&&(pool.some(function(x){return x.indexOf('look:')===0&&x.slice(5)===lk.id;})))why='it can be won as a bonus';
      else if(!lk&&pool.some(function(x){var l=x.indexOf('look:')===0&&pipLookById(x.slice(5));return l&&l.grants.indexOf(ctx.id)>=0;}))why='it comes with a look you can win';
      else if(!lk&&L.giftLook&&pipLookById(L.giftLook)&&pipLookById(L.giftLook).grants.indexOf(ctx.id)>=0)why='it comes with the look given for taking part';
    }
    if(!why)return;
    if(ctx.type==='quiz'||ctx.type==='activity'){if(!needsJoin(ev)||hasJoined(ev,p))return;}
    out.push({ev:ev,why:why,joined:hasJoined(ev,p),needs:needsJoin(ev)});
  });
  return out;
}

function nextTownStep(t,step){
  var q=quantizeTime(t,step);
  if(step==='hour')return new Date(q.getTime()+3600000);
  if(step==='week')return addDays(q,7);
  if(step==='month')return new Date(q.getFullYear(),q.getMonth()+1,1);
  return addDays(q,1);
}
function townPaceLine(ev){
  var tg=townGoal(ev);
  if(!tg.on||tg.ended)return '';
  var now=new Date(),g=tg.cfg;
  var prev=new Date(quantizeTime(now,g.step).getTime()-1);
  var lastGain=Math.round((tg.total-townGoalAt(ev,prev<tg.span.start?tg.span.start:prev,tg.span))*10)/10;
  var nx=nextTownStep(now,g.step);
  if(nx>tg.span.end)nx=tg.span.end;
  var mins=Math.max(1,Math.round((nx-now)/60000));
  var unit={hour:'hour',day:'day',week:'week',month:'month'}[g.step];
  return '<div class="tiny townpace">🏘️ '+esc(townCfg().label)+' '+(lastGain>0?'added +'+String(lastGain)+' in the last '+unit:'is warming up')+
    ' · next update in '+(mins<60?mins+' min':durWords(mins))+'</div>';
}

var THEME_WEAR={
  halloween:{hat:'witchhat'},christmas:{hat:'santa'},newyear:{hat:'party'},
  independence:{hat:'party',fx:'fireworks'},moonfest:{hat:'lanterncap'},harvestfair:{hat:'strawboater'},
  fall:{fx:'leaffall'},winter:{hat:'beanie'},spring:{hat:'flower'},summer:{hat:'sunhat'}

function zoneLook(where,p){
  var look=JSON.parse(JSON.stringify(pipLook(p)));
  var pose='idle',cls='';
  if(where==='catalog'){look.held='book';pose='read';}
  else if(where==='store'){
    var wp=wishProgress(p);
    if(wp&&wp.ready){pose='cheer';cls='bouncy';}
    else pose='wait';
    look.held=null;
  }else if(where==='activities'){
    var today=logOf(p).filter(function(r){return sameDay(new Date(r.date),new Date());}).length;
    if(today){pose='cheer';look.held='trophy';}
    else{pose='wait';look.held='balloon';}
  }else if(where==='events'){
    pose='cheer';
    var th=null;
    eventList().some(function(ev){
      var t=eventTheme(ev);
      if(t&&!ev.hidden&&assignedTo(ev,p)&&eventOpen(ev).open){th=ev.banner.theme;return true;}
      return false;
    });
    var wear=th&&THEME_WEAR[th];
    if(wear){
      if(wear.hat)look.hat=wear.hat;
      if(wear.fx)look.fx=wear.fx;
    }
  }
  return{look:look,pose:pose,cls:cls};
}
function mountZonePip(){
  if(!aliveCfg().zones)return;
  var where=S.view;
  if(['catalog','store','activities','events'].indexOf(where)<0)return;

/* What Pip has to say in each zone. */
function zoneLines(where,p){
  var lines=[];
  if(where==='catalog'){
    var best=null;
    S.modules.forEach(function(m){
      var pg=papersDone(m);
      if(pg.done&&pg.done<pg.total&&(!best||pg.total-pg.done<best.left))best={m:m,left:pg.total-pg.done};
    });
    if(best)lines.push(best.left===1?'One chapter left in '+best.m.title+'!':best.m.title+' — '+best.left+' to go.');
    if(!lines.length)lines.push('Pick one. I will hold it for you.');
  }
  if(where==='activities'){
    var n=logOf(p).filter(function(r){return sameDay(new Date(r.date),new Date());}).length;
    lines.push(n?n+' done today. Look at us go.':'Nothing done today yet. Shall we?');
  }
  if(where==='events'){
    var claim=0,door=null;
    eventList().forEach(function(ev){
      if(ev.hidden||!assignedTo(ev,p))return;
      var st=eventState(ev,p);
      if(st.claim)claim+=st.claim;
      if(ev.kind==='calendar'&&st.can&&!door)door=ev;
    });
    if(claim)lines.push(claim===1?'Something is ready to claim!':claim+' things are ready to claim!');
    if(door)lines.push('A new door is open in '+door.title+'.');
    if(!lines.length)lines.push('Ooh, what are we making?');
  }
  if(where==='room'){
    var f=petFindToday(p);
    if(f)lines.unshift(f.petName+' found something. Go and look!');
    var tod=roomTod();
    if(tod==='night')lines.push('It is late… five more minutes.');
    if(tod==='morning')lines.push('Morning! Big day?');
  }
  if(where==='quiz')lines.push('Take your time. I am reading along.');
  return lines;
}

/* ---------- countdown reminders ---------- */
function remindKey(r){return r.key+'|'+r.stage;}
function reminderList(p){
  p=p||me();
  var c=remindCfg(),out=[];
  if(!p||!c.on)return out;
  var now=Date.now();
  var evOn=eventsOn();
  if(evOn)eventList().forEach(function(ev){
    if(ev.hidden||!assignedTo(ev,p))return;
    var st=eventState(ev,p);
    if(c.claims&&st.claim)
      out.push({key:'claim:'+ev.id,stage:st.round.key+':'+st.claim,kind:'claims',rank:-1,icon:'🎁',
        text:(st.claim===1?'A step is':st.claim+' steps are')+' ready to claim in “'+ev.title+'”',
        act:'ev-steps',id:ev.id,btn:'Claim'});
    if(c.calendar&&ev.kind==='calendar'&&st.can){
      var di=calendarDayIndex(ev);
      var s=(ev.steps||[])[di];
      if(s&&!stepEntry(ev,p,s.id,st.round.key)){
        var tr=stepTrigger(ev,p,di,st.round.key);
        var eod=dayStart(new Date()).getTime()+864e5;
        if(!tr||tr.met)out.push({key:'door:'+ev.id,stage:dkey(new Date()),kind:'calendar',rank:(eod-now)/6e4,
          icon:'🚪',text:'Door '+(di+1)+' is open in “'+ev.title+'”',until:new Date(eod),
          act:'ev-steps',id:ev.id,btn:'Open it'});
      }
    }
    if(c.events&&st.can&&!st.auto&&st.until&&ev.kind!=='calendar'){
      var ms=st.until.getTime()-now;
      var timed=ev.hours&&ev.hours.on;
      var stage=ms<=36e5?'1h':(ms<=864e5?'24h':'');
      if(timed&&ms>36e5)stage='';
      if(stage)out.push({key:'ev:'+ev.id,stage:st.round.key+':'+stage,kind:'events',rank:ms/6e4,
        icon:timed?'⏱️':'⏳',text:'“'+ev.title+'” closes soon',until:st.until,
        act:isStepKind(ev.kind)?'ev-steps':'ev-do',id:ev.id,btn:isStepKind(ev.kind)?'Open':'Do it'});
    }
    if(c.goals&&ev.kind==='goal'){
      var gp=goalProgress(ev);
      var rd=eventRound(ev);
      if(!gp.reached&&gp.pct>=75&&rd.end){
        var gms=rd.end.getTime()-now;
        if(gms>0&&gms<=2*864e5)out.push({key:'goal:'+ev.id,stage:gp.key,kind:'goals',rank:gms/6e4,
          icon:'🏁',text:'The group is '+gp.pct+'% of the way to “'+ev.title+'”',until:rd.end,
          go:'events',btn:'Help'});
      }
    }
  });
  if(c.seasons&&pipShopCfg().on){
    Object.keys(PIP_SEASONS).forEach(function(k){
      var w=pipSeasonWindow(k);
      if(!w||!w.open)return;
      var ms=w.to.getTime()-now;
      if(ms>3*864e5)return;
      var any=PIP_LOOKS.concat(PIP_PARTS).some(function(t){
        return t.season===k&&t.price>0&&pipOffered(t)&&!(t.grants?t.grants.every(function(g){return ownsPip(g,p);}):ownsPip(t.id,p));
      });
      if(any)out.push({key:'season:'+k,stage:String(w.to.getFullYear()),kind:'seasons',rank:ms/6e4,

/* =========================================================
   Pip powers, fully configurable.

   S.settings.pipPowers = {
     kinds:   {boost:{on,cap}, ...}             switch a category off, or cap it
     looks:   {lookId:{base:[{kind,value}],      the look's all-year powers
                       seasonal:[{sid,dates}]}}  seasonal abilities it carries
     library: [{id,name,dates,powers}]           seasonal abilities
     deleted: {sid:1}                            built-in abilities removed
   }
   A look with no entry in `looks` keeps the powers it shipped with.
   ========================================================= */
var POWER_KINDS=['boost','discount','payback','foodtime','findluck','bonusluck'];
var POWER_KINDS_BUILTIN=POWER_KINDS.slice();
function ppCfg(){
  var c=S.settings.pipPowers;
  if(!c||typeof c!=='object'){c={};S.settings.pipPowers=c;}
  if(!c.kinds)c.kinds={};
  if(!c.looks)c.looks={};
  if(!Array.isArray(c.library))c.library=[];
  if(!c.deleted)c.deleted={};
  if(!Array.isArray(c.custom))c.custom=[];
  return c;
}
function powerKindCfg(k){
  var c=(S.settings.pipPowers&&S.settings.pipPowers.kinds&&S.settings.pipPowers.kinds[k])||{};
  return{on:c.on!==false,cap:Math.max(0,num(c.cap,0))};
}
function cleanPowers(list){
  var seen={},out=[];
  (list||[]).forEach(function(a){
    if(!a||!PIP_ABILITIES[a.kind]||a.kind==='none')return;
    var v=Math.max(0,Math.min(100,num(a.value,0)));
    if(!(v>0))return;
    if(seen[a.kind]){seen[a.kind].value=Math.max(seen[a.kind].value,v);return;}
    seen[a.kind]={kind:a.kind,value:v};
    out.push(seen[a.kind]);
  });
  return out;
}
function kindsOn(list){return list.filter(function(a){return powerKindCfg(a.kind).on;});}

/* ---------- the shipped defaults ---------- */
function defaultLookPowers(l){
  var over=(S.settings.pipshop&&S.settings.pipshop.abilities)||{};
  var o=over[l.id],list;
  if(o&&o.multi)list=Object.keys(o.multi).map(function(k){return{kind:k,value:o.multi[k]};});
  else if(o&&o.kind&&!lookIsMulti(l))list=[o];
  else if(lookIsMulti(l))list=l.abilities;
  else list=[l.ability||{kind:'none',value:0}];
  return cleanPowers(list);
}
function builtinLibrary(){
  var out=[];
  PIP_LOOKS.forEach(function(l){
    var f=l.festival;
    if(!f||!Array.isArray(f.abilities))return;
    var s=PIP_SEASONS[f.season];
    out.push({id:'fest-'+l.id,name:(s?s.name:'Festival')+' bonus',builtin:true,
      dates:{mode:'season',key:f.season},powers:cleanPowers(f.abilities)});
  });
  return out;
}
function defaultSeasonals(l){
  return (l.festival&&Array.isArray(l.festival.abilities))?[{sid:'fest-'+l.id,dates:null}]:[];
}

/* ---------- the library ---------- */
function powerLibrary(){
  var c=ppCfg();
  var mine={};
  c.library.forEach(function(x){mine[x.id]=x;});
  var out=[];
  builtinLibrary().forEach(function(b){
    if(c.deleted[b.id])return;
    out.push(mine[b.id]?Object.assign({builtin:true},mine[b.id]):b);
  });
  c.library.forEach(function(x){
    if(!out.some(function(o){return o.id===x.id;})&&!c.deleted[x.id])out.push(x);
  });
  return out;
}
function powerLib(id){
  var l=powerLibrary();
  for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];
  return null;
}

/* ---------- dates ---------- */
function datesWindow(dates,now){
  now=now||new Date();
  if(!dates)return null;
  if(dates.mode==='season'){
    var w=pipSeasonWindow(dates.key,now);
    if(!w)return null;
    return{open:w.open,from:w.from,to:w.to,endExcl:addDays(dayStart(w.to),1)};
  }
  if(dates.mode==='range'){
    var a=dnum(dates.start),b=dnum(dates.end);
    if(!a||!b)return null;
    a=dayStart(a);var e=addDays(dayStart(b),1);
    if(now>=e)return{open:false,from:a,to:addDays(e,-1),endExcl:e,ended:true};
    return{open:now>=a,from:a,to:addDays(e,-1),endExcl:e};
  }
  var yw=yearWindow(dates.from||[10,1],dates.to||[10,31],now);
  if(!yw)return null;
  return{open:yw.open,from:yw.from,to:addDays(yw.endExcl,-1),endExcl:yw.endExcl};
}
function fmtDM(d){return d.getDate()+' '+MONTHS[d.getMonth()];}
function datesText(dates){
  if(!dates)return '';
  if(dates.mode==='season'){
    var s=PIP_SEASONS[dates.key],w=pipSeasonWindow(dates.key);
    return 'During '+(s?s.name:dates.key)+(w?' ('+fmtDM(w.from)+' – '+fmtDM(w.to)+')':'');
  }
  if(dates.mode==='range')return (dnum(dates.start)?dateShort(dates.start):'?')+' – '+(dnum(dates.end)?dateShort(dates.end):'?');
  var f=dates.from||[10,1],t=dates.to||[10,31];
  return 'Every year, '+f[1]+' '+MONTHS[f[0]-1]+' – '+t[1]+' '+MONTHS[t[0]-1];
}
function windowWords(w){
  if(!w)return 'no dates';
  if(w.open)return 'on now, until '+fmtDM(w.to);
  if(w.ended)return 'ended';
  return 'from '+fmtDM(w.from);
}

/* ---------- what a look carries ---------- */
function lookPowers(l){
  var c=ppCfg().looks[l.id];
  return kindsOn(c?cleanPowers(c.base):defaultLookPowers(l));
}
function lookSeasonals(l){
  var c=ppCfg().looks[l.id];
  var list=c?(c.seasonal||[]):defaultSeasonals(l);
  return list.map(function(a){
    var lib=powerLib(a.sid);
    if(!lib)return null;
    return{sid:a.sid,lib:lib,dates:a.dates||lib.dates,custom:!!a.dates};
  }).filter(Boolean);
}
function festivalList(l){
  var out=[];
  lookSeasonals(l).forEach(function(s){out=out.concat(kindsOn(cleanPowers(s.lib.powers)));});
  return out;
}
function festivalPowers(l,now){
  var out=[];
  lookSeasonals(l).forEach(function(s){
    var w=datesWindow(s.dates,now);
    if(!w||!w.open)return;
    kindsOn(cleanPowers(s.lib.powers)).forEach(function(a){
      out.push({kind:a.kind,value:a.value,festival:true,seasonName:s.lib.name,until:w.to});
    });
  });
  return out;
}
function festivalText(l){
  return lookSeasonals(l).map(function(s){
    var ps=kindsOn(cleanPowers(s.lib.powers));
    if(!ps.length)return '';
    return s.lib.name+' ('+windowWords(datesWindow(s.dates))+'): '+
      ps.map(function(a){return PIP_POWER_SHORT[a.kind](a.value);}).join(' · ');
  }).filter(Boolean).join(' / ');
}
/* Old single/multi overrides move into the new store once. */
function migratePowers(){
  var over=(S.settings.pipshop&&S.settings.pipshop.abilities)||{};
  var c=ppCfg();
  if(c.migrated)return;
  Object.keys(over).forEach(function(id){
    var l=pipLookById(id);
    if(!l||c.looks[id])return;
    c.looks[id]={base:defaultLookPowers(l),seasonal:defaultSeasonals(l)};
  });
  c.migrated=true;
}

          '</div>';

    });

      '<div class="foot">'+(c?'<button class="btn btn-ghost" id="pe-reset">Back to the shipped powers</button>':'')+
      '<button class="btn" data-close>Cancel</button>'+
      '<button class="btn btn-primary" id="pe-save">Save powers</button></div>';
  }
  function grab(scrim){
    powerRowsGrab(scrim,d.base,'pb');

      if(!a.dates)return;
      var i=-1;lib.forEach(function(s,k){if(s.id===a.sid)i=k;});

    });
  }
  function redraw(){redrawModal(body(),mount);}
  function mount(scrim){
    scrim.addEventListener('click',function(e){
      var hit=e.target.closest('[data-pbdel],[data-pbadd],[data-psd],[data-psa]'+
        powerLibrary().map(function(s,i){return ',[data-pd'+i+'mode]';}).join(''));
      if(!hit)return;
      grab(scrim);
      if(powerRowsClick(e,d.base,'pb')){redraw();return;}
      var t=e.target.closest('[data-psd]');
      if(t){
        var a=assigned(t.dataset.psd);
        if(a){
          if(t.dataset.v==='lib')a.dates=null;

        }

        redraw();

        grab(scrim);redraw();

}

/* =========================================================
   Bonus cosmetics.

   A store item, an activity or an event can sometimes come
   with a Pip part attached. The roll is a deterministic
   function of the thing, the reader and the day — so it
   holds still all day, cannot flicker as the page redraws,
   and gives a reason to look again tomorrow.

   The base reward is never reduced to pay for it, the prize
   is shown before anyone acts, and nothing is ever bought in
   the hope of a bonus.
   ========================================================= */

function todayKey(){
  var n=new Date();
  return n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate();
}
function bonusCfg(thing){
  var b=(thing&&thing.bonus)||{};
  return{on:b.on===true,
    chance:Math.max(0,Math.min(100,num(b.chance,20))),
    pool:Array.isArray(b.pool)?b.pool:[]};
}
/* Which part, if any, this thing carries for this reader today. */
function bonusFor(thing,p){
  p=p||me();
  if(!p||!thing)return null;
  var cfg=bonusCfg(thing);
  if(!cfg.on||!cfg.chance||!cfg.pool.length)return null;
  var chance=Math.min(100,cfg.chance+powerTotal('bonusluck',p));
  var eligible=cfg.pool.filter(function(id){
    if(id.indexOf('food:')===0)return !!foodById(id.slice(5));
    if(id.indexOf('look:')===0){var lk=pipLookById(id.slice(5));return !!lk&&!ownsLook(lk,p);}
    return pipPart(id)&&!ownsPip(id,p);
  });
  if(!eligible.length)return null;
  var seed=thing.id+':'+p.id+':'+todayKey();
  if(hashUnit(seed)*100>=chance)return null;
  var pick=Math.floor(hashUnit(seed+'#pick')*eligible.length);
  var id=eligible[Math.min(pick,eligible.length-1)];
  if(id.indexOf('food:')===0){
    var f=foodById(id.slice(5));
    return {id:id,food:true,foodId:f.id,name:f.name,icon:f.icon};
  }
  if(id.indexOf('look:')===0){
    var l=pipLookById(id.slice(5));
    return {id:id,look:true,lookId:l.id,name:l.name,top:l.tier==='top',grants:l.grants};
  }
  return pipPart(id);
}
/* A whole complete look: every piece of it owned. */
function ownsLook(l,p){return l.grants.every(function(g){return ownsPip(g,p);});}
function lookPreview(l){
  var pv={};
  l.grants.forEach(function(g){var pt=pipPart(g);if(pt)pv[pt.slot]=pt.v;});
  return pv;
}
/* Hand over every piece of a complete look and put it on. */
function giveLook(p,l){
  if(!Array.isArray(p.pipOwned))p.pipOwned=[];
  l.grants.forEach(function(g){if(p.pipOwned.indexOf(g)<0)p.pipOwned.push(g);});
  if(!p.pipLook)p.pipLook={};
  l.grants.forEach(function(g){var pt=pipPart(g);if(pt)p.pipLook[pt.slot]=pt.v;});
  if(p.face!=='pip')p.face='pip';
}
function lookWonMoment(l,p,why){
  if(p!==me())return;
  var pw=powersText(l,' ');
  celebrate({kicker:(l.tier==='top'?'Top-tier look won':'Complete look won'),title:l.name,
    line:'Every piece of it is yours'+(why?' — '+why:'')+', and Pip is wearing it.',pose:'cheer',
    prize:pw+(festivalText(l)?' '+festivalText(l)+'.':'')});
}
function grantBonus(thing,p,why){
  var part=bonusFor(thing,p);
  if(!part)return null;
  if(part.food){
    /* food can be won again another day, but only once per thing per day */
    if(!p.foodWins)p.foodWins={};
    var key=thing.id+':'+todayKey();
    if(p.foodWins[key])return null;
    p.foodWins[key]=1;
    giveFood(p,part.foodId,1);
    save();
    toast('A bonus came with it — '+part.name+'. It is in Pip\u2019s pantry.','good',8000);
    return part;
  }
  if(part.look){
    var lk=pipLookById(part.lookId);
    giveLook(p,lk);
    save();
    lookWonMoment(lk,p,'a bonus');
    toast('A bonus came with it — the complete '+lk.name+' look!','good',9000);
    return part;
  }
  if(!Array.isArray(p.pipOwned))p.pipOwned=[];
  if(p.pipOwned.indexOf(part.id)<0)p.pipOwned.push(part.id);
  if(!p.pipLook)p.pipLook={};
  p.pipLook[part.slot]=part.v;
  if(p.face!=='pip')p.face='pip';
  save();
  toast('A bonus came with it — '+part.name+'. Pip is wearing it.','good',8000);
  return part;
}
/* The strip along the bottom of a card, showing what is riding along. */
function bonusStrip(thing,p){
  var part=bonusFor(thing,p);
  if(!part)return '';
  if(part.food){
    var won=p&&p.foodWins&&p.foodWins[thing.id+':'+todayKey()];
    if(won)return '';
    return '<div class="bonusstrip food">'+
      '<span class="bpv">'+foodIconHTML(foodById(part.foodId))+'</span>'+
      '<span class="btxt"><b>Comes with '+esc(part.name)+'</b>'+
      '<span>a treat for Pip\u2019s pantry, today only</span></span>'+
      '<span class="bspark">'+ico('star')+'</span></div>';
  }
  if(part.look){
    var lk=pipLookById(part.lookId);
    return '<div class="bonusstrip look'+(part.top?' top':'')+'">'+
      '<span class="bpv">'+pipSVG(lookPreview(lk),'cheer',44,{shadow:false,still:true})+'</span>'+
      '<span class="btxt"><b>Comes with the complete '+esc(lk.name)+' look</b>'+
      '<span>'+(part.top?'a top-tier Pip, ':'a whole new Pip, ')+'every piece — today only</span></span>'+
      '<span class="bspark">'+ico('star')+'</span></div>';
  }
  var preview={body:pipLook(p).body};
  preview[part.slot]=part.v;
  return '<div class="bonusstrip">'+
    '<span class="bpv">'+pipSVG(preview,'idle',36,{shadow:false,still:true})+'</span>'+
    '<span class="btxt"><b>Comes with '+esc(part.name)+'</b>'+
    '<span>a bonus for Pip, today only</span></span>'+
    '<span class="bspark">'+ico('star')+'</span></div>';
}

/* Where a part sits: on its own, inside an ordinary complete look, or
   inside one of the top-tier looks. Derived, so it stays right if the
   catalogue changes. */
function partTier(pt){
  var tier='basic';
  PIP_LOOKS.forEach(function(l){
    if(l.grants.indexOf(pt.id)<0)return;
    if(l.tier==='top')tier='top';
    else if(tier!=='top')tier='look';
  });
  return tier;
}
function partLookNames(pt){
  return PIP_LOOKS.filter(function(l){return l.grants.indexOf(pt.id)>=0;})
    .map(function(l){return l.name;});
}
var TIER_LABEL={basic:'On its own',look:'Part of a complete look',top:'Top tier'};
var TIER_NOTE={
  basic:'Sold on their own, in no complete look.',
  look:'Also appear inside a complete look.',
  top:'Also appear inside a top-tier look.'
};

/* ---------- instructor controls, shared by all three editors ---------- */

    'never picked. Parts you have taken off sale in the Pip shelf can still be won here — which is '+
    'how something becomes win-only.</p>'+
    '<label class="check stack"><input type="checkbox" id="b-on"'+(cfg.on?' checked':'')+

  h+='<div class="subfields">'+

  [['look','Complete looks','Every piece of the look, worn straight away.'],
   ['top','Top-tier complete looks','The whole top-tier Pip, powers and all.']].forEach(function(gr){
    var ls=PIP_LOOKS.filter(function(l){return gr[0]==='top'?l.tier==='top':l.tier!=='top';});
    if(!ls.length)return;

    h+='<div class="tierhead t-'+gr[0]+'"><span class="tl">'+gr[1]+'</span><span class="tn">'+gr[2]+'</span>'+

    });

  h+='<div class="tiny muted" style="margin:10px 0 7px">Single parts</div>';
  /* Grouped, so it is obvious whether you are handing out a cap or a piece

  ['basic','look','top'].forEach(function(tier){
    var group=PIP_PARTS.filter(function(pt){
      return pt.price>0&&partTier(pt)===tier;

    if(!group.length)return;
    var chosen=group.filter(function(pt){return cfg.pool.indexOf(pt.id)>=0;}).length;
    h+='<div class="tierhead t-'+tier+'">'+
        '<span class="tl">'+esc(TIER_LABEL[tier])+'</span>'+

    group.forEach(function(pt){
      var on=cfg.pool.indexOf(pt.id)>=0;

      var inLooks=partLookNames(pt);
      h+='<button type="button" class="bpick t-'+tier+(on?' on':'')+'" data-pool="'+esc(pt.id)+'" '+

        (inLooks.length?'<span class="in">'+esc(inLooks.join(', '))+'</span>':'')+

    if(id.indexOf('look:')===0){var l=pipLookById(id.slice(5));return l?{name:l.name+' (whole look)',look:true,top:l.tier==='top'}:null;}
    return pipPart(id);

  h+=(picked.length?'<div class="poolsum">Giving away: '+picked.map(function(pt){

  return h;
}
function bonusEditorGrab(scrim,d){
  if(!d.bonus)d.bonus={on:false,chance:20,pool:[]};
  var on=scrim.querySelector('#b-on');
  if(on)d.bonus.on=on.checked;
  var ch=scrim.querySelector('#b-chance');
  if(ch)d.bonus.chance=Math.max(1,Math.min(100,num(ch.value,20)));
}
/* Ticking the switch has to reveal its fields straight away, or the
   editor looks broken. */
function bonusEditorMount(scrim,d,redraw){
  var on=scrim.querySelector('#b-on');
  if(on)on.addEventListener('change',function(){
    bonusEditorGrab(scrim,d);
    d.bonus.on=on.checked;
    redraw();
  });
}
function bonusEditorClick(e,d){
  var b=e.target.closest('[data-pool]');
  if(!b)return false;
  if(!d.bonus)d.bonus={on:true,chance:20,pool:[]};
  var pool=d.bonus.pool||[];
  var at=pool.indexOf(b.dataset.pool);
  if(at>=0)pool.splice(at,1);else pool.push(b.dataset.pool);
  d.bonus.pool=pool;
  return true;
}

/* =========================================================
   Moments.

   Everything in PipHub announces itself with the same grey
   toast, so nothing feels bigger than anything else. This is
   the one exception: a short beat for the four things worth
   stopping for. Its power is entirely in its scarcity, so
   resist adding a fifth.
   ========================================================= */

var momentQ=[], momentLive=false, momentTimer=null;

function reducedMotion(){
  try{return window.matchMedia('(prefers-reduced-motion:reduce)').matches;}
  catch(e){return false;}
}
function celebrate(m){
  if(!m)return;
  momentQ.push(m);
  if(!momentLive)runMoment();
  else{var nb=document.querySelector('#moment .mdismiss');if(nb&&!m.button)nb.textContent='Next';}
}
function closeMoment(){
  if(momentTimer){clearTimeout(momentTimer);momentTimer=null;}
  var el=document.getElementById('moment');
  if(el&&el.parentNode)el.parentNode.removeChild(el);
  momentLive=false;
  if(momentQ.length)runMoment();
  else pageUnlock();
}
function runMoment(){
  var m=momentQ.shift();
  if(!m){momentLive=false;return;}
  if(!momentLive)pageLock();
  momentLive=true;

  var p=me();
  var still=reducedMotion();
  var sparks='';
  if(!still){
    for(var i=0;i<12;i++){
      var ang=(i/12)*360;
      sparks+='<span class="mspark s'+(i%3)+'" style="--a:'+ang+'deg;--d:'+(i*40)+'ms"></span>';
    }
  }
  var el=document.createElement('div');
  el.id='moment';
  el.className='moment'+(still?' still':'');
  el.innerHTML=
    '<div class="mstage">'+
      (still?'':'<div class="mrays" aria-hidden="true"></div>')+
      '<div class="mburst" aria-hidden="true">'+sparks+'</div>'+
      '<div class="mpip">'+pipSVG(pipLook(p),m.pose||'cheer',176)+'</div>'+
      (m.token?'<div class="mtoken">'+m.token+'</div>':'')+
      '<div class="mwords">'+
        '<div class="mkicker">'+esc(m.kicker||'')+'</div>'+
        '<div class="mtitle">'+esc(m.title||'')+'</div>'+
        (m.line?'<div class="mline">'+esc(m.line)+'</div>':'')+
        (m.prize?'<div class="mprize">'+m.prize+'</div>':'')+
      '</div>'+
      '<div class="mtap"><button type="button" class="btn btn-primary mdismiss">'+esc(m.button||(momentQ.length?'Next':'Got it'))+'</button>'+
        (momentQ.length?'<div class="mmore">'+momentQ.length+' more</div>':'')+'</div>'+
    '</div>';
  document.body.appendChild(el);
  momentHold(el,closeMoment,m.auto?(still?1800:3200):0);
}
/* A moment stays up until it is dismissed: the button, Escape, or a tap
   anywhere once it has had a moment to be read (so the tap that caused it
   can't close it). Instructors can let them close by themselves. */
function momentHold(el,close,autoMs){
  var armed=false;
  setTimeout(function(){armed=true;},700);
  var btn=el.querySelector('.mdismiss');
  if(btn){
    btn.addEventListener('click',function(e){e.stopPropagation();close();});
    setTimeout(function(){try{btn.focus({preventScroll:true});}catch(err){}},60);
  }
  el.addEventListener('click',function(){if(armed)close();});
  function key(e){
    if(!el.parentNode){document.removeEventListener('keydown',key,true);return;}
    if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();e.stopPropagation();document.removeEventListener('keydown',key,true);close();}
  }
  document.addEventListener('keydown',key,true);
  var ms=autoMs||(aliveCfg().momentAuto?aliveCfg().momentSecs*1000:0);
  if(ms)momentTimer=setTimeout(close,ms);
}

/* ---------- the four ---------- */
function momentBookFinished(m){
  celebrate({
    kicker:'Finished',
    title:m.title,
    line:m.author?'by '+m.author:'',
    pose:'cheer',
    token:'<span class="mspine" style="background:'+spineColour(m.id)+'"><i></i></span>',
    prize:'It is on the shelf in your room now.'
  });
}
function momentStreak(rule,points){
  celebrate({
    kicker:'Streak',
    title:rule.title||'A run complete',
    line:rule.periods+' '+(rule.unit==='week'?'week':'day')+
      (rule.periods===1?'':'s')+' in a row',
    pose:'cheer',
    prize:'+'+pts(points)+' points'
  });
}
function momentWish(item,back){
  celebrate({
    kicker:'Wish granted',
    title:item.title,
    line:'Saved for, and yours',
    pose:'cheer',
    token:renderIcon(item.icon),
    prize:back?pts(back)+' points came back for saving up':''
  });
}
function momentTopLook(look){
  var preview={};
  look.grants.forEach(function(g){var pt=pipPart(g);if(pt)preview[pt.slot]=pt.v;});
  celebrate({
    kicker:'Top tier',
    title:look.name,
    line:'Every piece of it, unlocked',
    pose:'cheer',
    prize:powersText(look,' ')+(festivalText(look)?' '+festivalText(look)+'.':'')
  });
}
/* Did this record complete the title? Counted without it, so the beat
   fires once and only on the paper that finished the job. */
function completedTitle(m,p,rec){
  if(!m)return false;
  var chapters=(m.chapters||[]).length;
  var total=chapters+(hasBookTest(m)?1:0);
  if(!total)return false;
  function passedPaper(chId,skipId){
    return (p.records||[]).some(function(r){
      return r.id!==skipId&&r.moduleId===m.id&&(r.chapterId||null)===(chId||null)&&r.passed;
    });
  }
  var before=0,after=0;
  (m.chapters||[]).forEach(function(ch){
    if(passedPaper(ch.id,rec.id))before++;
    if(passedPaper(ch.id,null))after++;
  });
  if(hasBookTest(m)){
    if(passedPaper(null,rec.id))before++;
    if(passedPaper(null,null))after++;
  }
  return after===total&&before===total-1;
}

/* =========================================================
   Reactions.

   Pip answers being tapped, fidgets between times, and says
   something now and then. Every line is drawn from what is
   actually going on — never random chatter — so he stays
   worth listening to.
   ========================================================= */

/* ---------- what he has to say ---------- */
var sayTick=0;
function pipSays(where,rotate){
  var p=me();
  if(!p)return null;
  var lines=zoneLines(where,p);

  /* the wish, if there is one and it is close */
  var wp=wishProgress(p);
  if(wp){
    if(wp.ready)lines.push('You can afford '+wp.item.title+'. Go on.');
    else if(wp.short<=5)lines.push('Only '+pts(wp.short)+' more and '+wp.item.title+' is yours.');
    else if(wp.pct>=50)lines.push('Halfway to '+wp.item.title+'.');
  }

  /* a run that is alive or about to pay */
  liveStreakRules().forEach(function(rule){
    var stt=streakState(rule,p);
    if(!stt.run)return;
    if(stt.thisPeriod<stt.need)
      lines.push(stt.run+' '+stt.word+(stt.run===1?'':'s')+' running. '+
        stt.ask+' '+stt.nowWord+' to keep it.');
    else if(stt.toGo===1)
      lines.push('One more '+stt.word+' and that run pays out.');
  });

  /* work sent in and not yet looked at */
  var waiting=totalPending(p);
  if(waiting)lines.push(waiting===1?'One thing is waiting to be looked at.'
    :waiting+' things are waiting to be looked at.');

  /* a book part-read */
  S.modules.forEach(function(m){
    if(!(m.chapters||[]).length)return;
    var pg=papersDone(m);
    if(pg.done&&pg.done<pg.total)
      lines.push(m.title+' — '+(pg.total-pg.done)+' to go.');
  });

  /* the shelf, when he is standing in front of it */
  if(where==='room'){
    var books=finishedTitles(p).length;
    if(books>=2)lines.push(books+' books on that shelf. All yours.');
    else if(books===1)lines.push('One on the shelf. Room for more.');
    else lines.push('The shelf is empty. Let us fix that.');
    var run=bestRunEver(p);
    if(run>=3)lines.push('Best run so far: '+run+' days.');
  }

  /* nothing pressing — a few warm ones, still true */
  if(!lines.length||(lines.length===1&&/^Pick one|^Ooh/.test(lines[0]))){
    var bal=balance(p);
    if(bal>=10)lines.push(pts(bal)+' points burning a hole in your pocket.');
    lines.push('Read me something.');
    lines.push('I am not doing anything. Are you?');
  }
  /* Tapping walks through what he has to say; an unprompted greeting
     holds still so it does not change under you. */
  if(rotate)return lines[(sayTick++)%lines.length];
  var seed=(where||'')+':'+todayKey()+':'+Math.floor(Date.now()/9000);
  return lines[Math.floor(hashUnit(seed)*lines.length)%lines.length];
}

/* ---------- being tapped ---------- */
function sayNear(host,text){
  if(!host||!text)return;
  var old=host.querySelector('.pipsay');
  if(old&&old.parentNode)old.parentNode.removeChild(old);
  var b=document.createElement('div');
  b.className='pipsay';
  b.textContent=text;
  host.appendChild(b);
  setTimeout(function(){
    b.classList.add('go');
    setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},420);
  },3400);
}
function pokePip(host,where){
  if(!host)return;
  var svg=host.querySelector('svg.pip');
  if(svg&&!reducedMotion()){
    svg.classList.remove('pip-hop');
    void svg.getBoundingClientRect();        /* restart the animation */
    svg.classList.add('pip-hop');
    setTimeout(function(){svg.classList.remove('pip-hop');},760);
  }
  sayNear(host,pipSays(where,true));
}

/* ---------- fidgeting between times ---------- */
var idleTimer=null;
function startPipIdle(){
  if(idleTimer)return;
  idleTimer=setInterval(function(){
    if(reducedMotion())return;
    if(document.hidden)return;
    if(document.getElementById('moment'))return;
    var list=$$('.pip-live');
    if(!list.length)return;
    var el=list[Math.floor(Math.random()*list.length)];
    if(!el||el.classList.contains('pip-hop'))return;
    el.classList.add('pip-glance');
    setTimeout(function(){el.classList.remove('pip-glance');},1500);
  },11000);
}
/* A line on arrival, but only where he is standing about with nothing
   else to do, and only once per visit. */
var greeted={};
function pipGreet(where,host){
  if(!host||greeted[where])return;
  greeted[where]=true;
  setTimeout(function(){
    if(document.body.contains(host))sayNear(host,pipSays(where));
  },900);
}
function resetGreetings(){greeted={};}

/* =========================================================
   Boot
   ========================================================= */
var TEMPLATE={
  schema:SCHEMA,id:'my-book-slug',title:'Book Title Goes Here',author:'Author Name',
  series:'',volume:null,
  summary:'One or two sentences shown on the title card before the reader begins.',
  ar:{level:5.0,points:8.0,wordCount:null,interest:'MG'},
  quiz:{passing:70,ask:0,shuffleQuestions:true,shuffleOptions:true,award:'proportional',reviewMisses:true,lockRetakes:true},
  verdicts:{high:'',pass:'',fail:''},
  questions:[
    {q:'Question text.',options:['Correct answer','Distractor','Distractor','Distractor'],answer:0,why:'Shown after a missed question.',tag:'plot'},
    {q:'A second question.',options:['Wrong','Right','Wrong','Wrong'],answer:1,why:'',tag:'character'}
  ]
};

function boot(){
  load();
  applyTheme();
  var ready=S.settings.pw?Promise.resolve():hash(DEFAULT_PW).then(function(h){S.settings.pw=h;});
  ready.then(function(){
    if(!S.settings.seeded){
      var seed=[];
      try{seed=JSON.parse(document.getElementById('seed-modules').textContent)||[];}catch(e){seed=[];}
      var t=newTally();
      seed.forEach(function(s){if(!byId(slug(s.id||s.title)))ingest(s,'built-in',t);});
      S.settings.seeded=true;
    }
    save();
    if(!storageOK)toast('This browser is blocking local storage, so readers and results will not be kept.','bad',9000);
    initPlatform();
    startPipIdle();
    loadSnaps().then(function(){if(S.view==='settings')render();});
    /* Always ask who is reading. On a shared device the last reader must
       not be inherited by whoever opens it next. */
    S.active=null;
    S.admin=false;
    save();
    go('gate');
    if(S.settings.autoSync)syncFolder(S.settings.folder,true);
  });
}
boot();

})();
